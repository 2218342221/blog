很大的权重。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><\/p>\n\n<p>举例取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mn>512<\/mn><\/mrow><\/math> KiB。一个 64 KiB 分配的包含概率约为 0.1175，权重倍数约为 8.51；一个 512 KiB 分配的包含概率约为 0.6321，倍数约为 1.58。不能对两种尺寸都简单乘八，也不能拿 sample 消息数量比较它们的真实对象数量。如果一条很少出现的小对象路径在一次采集中碰巧被命中，外推值可能明显跳动；应通过重复观测和更合适的采样预算评估，而不是凭一张图宣布泄漏。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><\/p>\n\n<p>Go 1.25 的具体实现是 <code>scaleHeapSample(count,size,rate)<\/code>。当 count 或 size 为零时返回零；rate 不大于一时不做外推；否则以 <code>avgSize=size/count<\/code> 计算 <code>1/(1-exp(-avgSize/rate))<\/code>，分别乘对象数和字节数，最后转换为 int64。运行时内存桶的身份包含栈和分配尺寸，不能将这里的平均尺寸规则理解为“任意混合大小的对象先聚合，再统一校正也完全等价”。将已经校正的 profile 再乘一次采样率，会重复放大数据。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>写出时的四维向量依次为 alloc_objects、alloc_space、inuse_objects、inuse_space。前两列描述累计分配，后两列描述采样可见的尚未释放部分。<code>heap<\/code> 和 <code>allocs<\/code> 主要改变默认选择的维度，底层并不是两套互不相干的分配记录。“累计已分配两吉字节”完全可能来自一直复用生命周期很短的临时对象，而“仍在使用两百兆字节”也不直接告诉我们哪个容器正在持有它们。栈是分配来源，不是完整引用保留图。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go profile种类与归因契约\">[pp-profile-kinds]<\/a><\/p>\n\n<p>内存账目还存在发布时间。分配发生在实时路径，释放则跟随 GC 的清扫；若立刻把新分配与尚未登记的释放比较，就会系统性偏向“仍然存活”。mprof 通过 active/future 周期桶协调分配与释放，mark termination 推进周期，后续 flush 和 post-sweep 发布可见状态。<code>runtime.MemProfile<\/code> 明确结果可能落后最多两个 GC 周期。因此 profile 的 inuse 既不是读取瞬间的精确活对象清单，也不是操作系统的 RSS。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p><code>MemProfileRate=1<\/code> 的含义是记录采集器覆盖的每个堆分配块，不是记录所有语言级对象：栈上对象不在此范围，tiny allocator 可把多个小对象装入一个块，分配槽还可能包含内部碎片。采样率也应在进程早期至多调整一次，分析工具假设整段记录具有恒定采样率。把一个进程先设成全量采样、再恢复默认后混出一份文件，无法靠读取端知道每个旧记录应当使用哪个历史参数。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/malloc.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆分配块、tiny allocator与内存槽覆盖\">[pp-heap-coverage]<\/a><\/p>\n\n<p>正确的泄漏分析因此需要一个更强的链条：相同稳态工作量下，GC 对齐后仍有持续增长；profile 找到增长的分配来源；代码或对象检查解释持有路径；切断该路径后，重复批次的存活集重新有界。仅有高 alloc_space 说明流量，单次高 inuse_space 说明当时可见保留，两者都没有独立完成因果证明。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go profile种类与归因契约\">[pp-profile-kinds]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n","advanced":true},{"title":"同步和 goroutine producer：相似的栈，完全不同的账","body":"block profile 的观察点嵌入特定同步原语，包括 channel、Mutex/RWMutex、WaitGroup 和 Cond 的相关路径。它将等待归到阻塞位置；网络轮询、任意系统调用、睡眠和调度队列不能全部期待在这里出现。`SetBlockProfileRate` 的单位是纳秒，其目标是按阻塞时间抽样：对短于阈值的事件按时长提高命中机会，长事件直接采集。它不是每隔一个墙钟周期扫描所有 goroutine。[[pp-mprof]](#src-pp-mprof)[[pp-profile-kinds]](#src-pp-profile-kinds)\n\n用统一时间单位写，阻塞时长为 $d$、阈值为 $r$ 时，理想包含概率为 $\\min(1,d/r)$。若一个短事件被采中，源码把计数加 $r/d$，把等待量加 $r$；若事件足够长，则计数加一、等待量加真实观测时长。二者都是逆概率校正。因而 delay/contentions 是经过抽样校正后的粗略均值，既不保留等待分布，也不能计算 p99。改变 rate 还会改变方差与开销，不能只比较文件里的消息行数。[[pp-mprof]](#src-pp-mprof)\n\nmutex profile 的抽样则按竞争事件进行，配置 rate 为十时，平均抽取约十分之一，再把计数与时间各乘十。更容易误读的是它的归因位置：相关栈通常是释放锁、结束临界区的路径，而非锁指令消耗了多少 CPU。若多个 goroutine 同时等待，同一墙钟秒可以贡献多个 goroutine 秒的竞争量。这个总量反映被阻塞的并发需求，不能作为单次持锁时长。[[pp-mprof]](#src-pp-mprof)[[pp-sema]](#src-pp-sema)\n\nGo 1.25 的 semrelease 实现还说明了“近似”的具体来源。为避免解锁时扫描所有等待者，它用队列头、尾等待时长的平均值乘其他等待者数量，再加即将被唤醒者的等待量。解除队列关系时更新有关起点，避免下一次释放重复收费。这个设计把归因成本保持在适当范围，但不是逐锁实例、逐等待者的精确积分数据库；相同解锁栈上的多个锁还会在 profile 中聚合。[[pp-sema]](#src-pp-sema)\n\n发布时间同样决定窗口含义。block 的完成路径才调用 blockevent；同步等待可能在窗口开始前已经发生，直到窗口内结束才把整段费用发布。两个累计快照相减得到的是“窗口内新增记账”，不一定是“每条等待区间与窗口交集”。设窗口长 $T$、新增等待权重 $W$，只有边界影响与抽样误差足够小时，$W/T$ 才近似平均等待并发。仍未结束的长等待则可能尚未完整计入，应该补当前栈或时序追踪。[[pp-sema]](#src-pp-sema)[[pp-mprof]](#src-pp-mprof)\n\n对于一次简单唤醒，`readyWithTime` 先记录释放时刻再将等待者设为 runnable，之后获得 CPU 才实际 running。因此图解应区分“仍不能继续的阻塞”和“已经可运行但尚未调度”。复杂锁路径可能重复睡眠、重试或执行自旋，不能反过来声称 block profile 与 trace 的每一段状态都精确一一对应。block 与 mutex 也常是同一争用的两种归因视角，不能把二者总 delay 相加算请求延迟。[[pp-sema]](#src-pp-sema)\n\ngoroutine profile 又是第三种测量。其数值主要表示采样集合中的栈数量，不是这些栈累计运行了多久。Go 1.25 采用短暂停顿确立参与集合，再让协调者与调度器协作采栈；每个 goroutine 在 Absent、InProgress、Satisfied 之间转换，被读取栈时不能同时运行；清理时再短暂停顿。新创建的 G 和系统 G 有专门规则，不能简单宣称它是“对整个进程所有线程同时拍的一张照片”，也不能说整个遍历始终停世界。[[pp-goroutine]](#src-pp-goroutine)\n\n这里还要区分输出模式：上述协作式采栈适用于 goroutine profile 的 debug=0/1 路径；debug>=2 则调用 `runtime.Stack(buf,true)`，在格式化全部 traceback 期间持有停世界，缓冲区不足还会扩大后重试。因此 `/debug/pprof/goroutine?debug=2` 不能直接套用前述短暂停顿结论。[[pp-goroutine]](#src-pp-goroutine)\n\n由此可得到一个实用判读例子：一千个 worker 停在 channel receive，可能仅仅是空闲池。一次快照给出了数量，却没有给出每个 worker 的等待时长、工作频度或泄漏原因。只有比较稳定负载下的重复快照、对象生命周期与完成条件，才能把“很多相似栈”转化为可检验的问题。工具之间应互补观察，而不是因为都出现了 channel 函数就被视为同一种数据。[[pp-goroutine]](#src-pp-goroutine)[[pp-profile-kinds]](#src-pp-profile-kinds)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-wait\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pp-wait-title pp-wait-desc\"><title id=\"pp-wait-title\">相似的等待，不同的归因<\/title><desc id=\"pp-wait-desc\">block 将特定同步阻塞归到等待位置；mutex 通常归到释放路径。二者会描述同一争用的不同视角，不能直接相加。<\/desc><defs><marker id=\"pp-wait-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">等待者<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">block：阻塞位置<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-wait-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">锁持有者<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">mutex：释放路径<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-wait-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">调度状态<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">runnable → running<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">等待权重是并发需求的累计，不是一次持锁时长<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">事件完成记账的窗口，不一定等于等待区间与窗口的交集<\/text>\n<\/svg><figcaption><strong>相似的等待，不同的归因。<\/strong> block 将特定同步阻塞归到等待位置；mutex 通常归到释放路径。二者会描述同一争用的不同视角，不能直接相加。 <a class=\"figure-open\" href=\"figures/pp-wait.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>block profile 的观察点嵌入特定同步原语，包括 channel、Mutex/RWMutex、WaitGroup 和 Cond 的相关路径。它将等待归到阻塞位置；网络轮询、任意系统调用、睡眠和调度队列不能全部期待在这里出现。<code>SetBlockProfileRate<\/code> 的单位是纳秒，其目标是按阻塞时间抽样：对短于阈值的事件按时长提高命中机会，长事件直接采集。它不是每隔一个墙钟周期扫描所有 goroutine。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go profile种类与归因契约\">[pp-profile-kinds]<\/a><\/p>\n\n<p>用统一时间单位写，阻塞时长为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math>、阈值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 时，理想包含概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>min<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>d<\/mi><mo>&#x0002F;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。若一个短事件被采中，源码把计数加 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0002F;<\/mo><mi>d<\/mi><\/mrow><\/math>，把等待量加 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>；若事件足够长，则计数加一、等待量加真实观测时长。二者都是逆概率校正。因而 delay/contentions 是经过抽样校正后的粗略均值，既不保留等待分布，也不能计算 p99。改变 rate 还会改变方差与开销，不能只比较文件里的消息行数。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>mutex profile 的抽样则按竞争事件进行，配置 rate 为十时，平均抽取约十分之一，再把计数与时间各乘十。更容易误读的是它的归因位置：相关栈通常是释放锁、结束临界区的路径，而非锁指令消耗了多少 CPU。若多个 goroutine 同时等待，同一墙钟秒可以贡献多个 goroutine 秒的竞争量。这个总量反映被阻塞的并发需求，不能作为单次持锁时长。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><\/p>\n\n<p>Go 1.25 的 semrelease 实现还说明了“近似”的具体来源。为避免解锁时扫描所有等待者，它用队列头、尾等待时长的平均值乘其他等待者数量，再加即将被唤醒者的等待量。解除队列关系时更新有关起点，避免下一次释放重复收费。这个设计把归因成本保持在适当范围，但不是逐锁实例、逐等待者的精确积分数据库；相同解锁栈上的多个锁还会在 profile 中聚合。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><\/p>\n\n<p>发布时间同样决定窗口含义。block 的完成路径才调用 blockevent；同步等待可能在窗口开始前已经发生，直到窗口内结束才把整段费用发布。两个累计快照相减得到的是“窗口内新增记账”，不一定是“每条等待区间与窗口交集”。设窗口长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><\/mrow><\/math>、新增等待权重 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>W<\/mi><\/mrow><\/math>，只有边界影响与抽样误差足够小时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>W<\/mi><mo>&#x0002F;<\/mo><mi>T<\/mi><\/mrow><\/math> 才近似平均等待并发。仍未结束的长等待则可能尚未完整计入，应该补当前栈或时序追踪。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>对于一次简单唤醒，<code>readyWithTime<\/code> 先记录释放时刻再将等待者设为 runnable，之后获得 CPU 才实际 running。因此图解应区分“仍不能继续的阻塞”和“已经可运行但尚未调度”。复杂锁路径可能重复睡眠、重试或执行自旋，不能反过来声称 block profile 与 trace 的每一段状态都精确一一对应。block 与 mutex 也常是同一争用的两种归因视角，不能把二者总 delay 相加算请求延迟。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><\/p>\n\n<p>goroutine profile 又是第三种测量。其数值主要表示采样集合中的栈数量，不是这些栈累计运行了多久。Go 1.25 采用短暂停顿确立参与集合，再让协调者与调度器协作采栈；每个 goroutine 在 Absent、InProgress、Satisfied 之间转换，被读取栈时不能同时运行；清理时再短暂停顿。新创建的 G 和系统 G 有专门规则，不能简单宣称它是“对整个进程所有线程同时拍的一张照片”，也不能说整个遍历始终停世界。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"协作式goroutine快照\">[pp-goroutine]<\/a><\/p>\n\n<p>这里还要区分输出模式：上述协作式采栈适用于 goroutine profile 的 debug=0/1 路径；debug&gt;=2 则调用 <code>runtime.Stack(buf,true)<\/code>，在格式化全部 traceback 期间持有停世界，缓冲区不足还会扩大后重试。因此 <code>/debug/pprof/goroutine?debug=2<\/code> 不能直接套用前述短暂停顿结论。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"协作式goroutine快照\">[pp-goroutine]<\/a><\/p>\n\n<p>由此可得到一个实用判读例子：一千个 worker 停在 channel receive，可能仅仅是空闲池。一次快照给出了数量，却没有给出每个 worker 的等待时长、工作频度或泄漏原因。只有比较稳定负载下的重复快照、对象生命周期与完成条件，才能把“很多相似栈”转化为可检验的问题。工具之间应互补观察，而不是因为都出现了 channel 函数就被视为同一种数据。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"协作式goroutine快照\">[pp-goroutine]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go profile种类与归因契约\">[pp-profile-kinds]<\/a><\/p>\n\n","advanced":true},{"title":"编码与符号化：从一个地址到多层逻辑函数","body":"profile.proto 将重复内容拆成几类表：Sample 保存 location_id 序列、值向量和标签；Location 保存地址、可选的 mapping 引用及若干 Line；Line 引用 Function；Function 保存名字、文件和起始行；Mapping 描述加载地址区间、文件偏移与构建身份；大量字符串通过共享 string_table 索引引用。string_table 的零号项必须为空字符串，各类非零 ID 则是文件内部的引用编号。Location 的 ID 可以来自整数序列，不能把它当成机器地址。[[pp-proto]](#src-pp-proto)\n\n一个 CPU Sample 的 value 若为 `[12,120000000]`，必须同时读取 sample_type 才能解释为十二个名义样本和一亿两千万纳秒。heap 可以有四列，其他 producer 可以定义更多类型；所有 Sample 的向量长度必须和 sample_type 相同。格式允许有符号 int64，因此差分负值是有效表达，不是文件损坏。period 描述采样间隔的类型与数值，但 value 列可能已经完成了周期换算；不应看到 period=10000000 就把 cpu/nanoseconds 再乘一次。[[pp-proto]](#src-pp-proto)[[pp-cpu-builder]](#src-pp-cpu-builder)\n\n栈的方向也必须固定：`Sample.location_id[0]` 是叶子，随后走向调用者。本章教学记录 `[5,4,2,1]` 可表示 Hash 的位置、Encode、Handle、Root。Location 5 内又有两条 Line：HashRound 在前，Hash 在后，表示 HashRound 内联到 Hash 中。因此四个物理位置可以展开为五层逻辑函数；这不表示多做了一次真实函数调用，更不要求栈上存在一个 HashRound 的独立返回地址。[[pp-proto]](#src-pp-proto)[[pp-cpu-builder]](#src-pp-cpu-builder)\n\nPC 则需要区分采样现场的指令地址、栈展开返回的 return PC、文件格式中的 Location.Address，以及对象文件里的符号地址。Go 的 CallersFrames 对符合其约定的返回地址适当减一，以回到有关调用指令的范围，并展开内联标记。减一只是定位到调用指令内，不承诺指向它的首字节。pprof 的 Go builder 再把恢复的 Frame.PC 写到 Location。对已经完成这种归一化的地址又统一减一，可能产生新的行号偏差。[[pp-pc]](#src-pp-pc)[[pp-cpu-builder]](#src-pp-cpu-builder)\n\n符号化可以发生在生产端，也可以发生在读取端。Go 文件常已包含函数、源码行及内联信息，读取这样的文件不一定还要拿一个二进制才能列出函数热点。需要反汇编、补全缺失符号或对应精确源码时，匹配构建仍然重要。pprof 本地符号化按 Mapping 归组，打开相应文件，检查双方已知 Build ID 是否相符，再用地址查询源码帧。若已经符号化且未请求强制处理，通常不会重复解析该映射。[[pp-symbolizer]](#src-pp-symbolizer)\n\n对于 ELF，进程虚拟地址到对象文件地址的转换并不总是简单的 `pc-memory_start`。程序头、映射偏移、可执行文件类型和加载基址都参与计算；pprof 的 ObjAddr 返回 `addr-base`，其中 base 由对应映射和 ELF 信息算出。`pc-memory_start` 可以用于特定映射内的相对位置比较，但不能作为适用于一切二进制的 addr2line 输入公式。快速 nm 路径又可能只有符号名而没有完整文件和行号，需要区分符号化精度。[[pp-binutils]](#src-pp-binutils)\n\n标签扩展了栈的上下文，但没有补回时序。格式支持字符串标签和带单位的数值标签；`input_bytes=64 bytes` 与 `input_bytes=64 requests` 不是相同语义，单位也参与合并身份。新协议说明不鼓励同键多值，更不应在同一键下混用字符串和数字。Go 标准库的 `pprof.Labels` 则提供字符串标签，Go 1.25 明确只有 CPU 与 goroutine profiles 使用这些 labels，不能因为协议有 label 就承诺 heap 或 mutex 自动按租户归因。[[pp-proto]](#src-pp-proto)[[pp-merge]](#src-pp-merge)[[pp-label-support]](#src-pp-label-support)\n\n`pprof.Do` 把增强后的 context 标签安装到当前 G，结束时恢复传入 context 所带标签；新建 G 继承创建者当时的标签。传入一个有标签的 context，并不会让一个早已存在的 worker 自动换标签。应在真正执行任务的 goroutine 上安装对应上下文，并正确结束请求级生命周期。无限后台 G 继承请求标签后长期运行，会把不属于该请求的后续工作归入同一类别；这属于上下文建模错误，不是查询界面能修复的问题。[[pp-labels]](#src-pp-labels)\n\n本节的关键结果是“地址、位置、函数和请求类别”具有不同身份。相同函数可以有多个指令位置、多个内联上下文、多个调用方和多类请求；同一逻辑样本也可能在不同进程中拥有不同绝对地址。下一步合并如果只依据函数名或只依据位置编号，就会制造错误的等价关系。[[pp-proto]](#src-pp-proto)[[pp-merge]](#src-pp-merge)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-proto\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 380\" role=\"img\" aria-labelledby=\"pp-proto-title pp-proto-desc\"><title id=\"pp-proto-title\">profile.proto 的共享表与引用<\/title><desc id=\"pp-proto-desc\">Sample 的栈叶在前；一个 Location 可以包含多条内联 Line。ID 是文件内引用，不是地址。<\/desc><defs><marker id=\"pp-proto-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"380\" fill=\"white\" rx=\"16\"/>\n<rect x=\"30\" y=\"80\" width=\"260\" height=\"160\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"160.0\" y=\"133.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Sample<\/text>\n<text x=\"160.0\" y=\"160.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">location_id[]<\/text>\n<text x=\"160.0\" y=\"187.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">value[] / label[]<\/text>\n<rect x=\"360\" y=\"50\" width=\"250\" height=\"105\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"485.0\" y=\"89.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Location<\/text>\n<text x=\"485.0\" y=\"116.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">address + Line[]<\/text>\n<rect x=\"360\" y=\"220\" width=\"250\" height=\"95\" rx=\"13\" fill=\"#BD6500\" fill-opacity=\".075\" stroke=\"#BD6500\" stroke-width=\"2\"/>\n<text x=\"485.0\" y=\"254.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Mapping<\/text>\n<text x=\"485.0\" y=\"281.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">构建 / 地址映射<\/text>\n<rect x=\"690\" y=\"50\" width=\"240\" height=\"105\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"810.0\" y=\"89.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Function<\/text>\n<text x=\"810.0\" y=\"116.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">名字 / 文件 / 行<\/text>\n<line x1=\"295\" y1=\"130\" x2=\"355\" y2=\"100\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-proto-arrow)\"/>\n<line x1=\"615\" y1=\"100\" x2=\"685\" y2=\"100\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-proto-arrow)\"/>\n<line x1=\"485\" y1=\"160\" x2=\"485\" y2=\"215\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-proto-arrow)\"/>\n<text x=\"800\" y=\"260\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">所有 value 列按<\/text>\n<text x=\"800\" y=\"290\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">sample_type 解释<\/text>\n<\/svg><figcaption><strong>profile.proto 的共享表与引用。<\/strong> Sample 的栈叶在前；一个 Location 可以包含多条内联 Line。ID 是文件内引用，不是地址。 <a class=\"figure-open\" href=\"figures/pp-proto.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>profile.proto 将重复内容拆成几类表：Sample 保存 location_id 序列、值向量和标签；Location 保存地址、可选的 mapping 引用及若干 Line；Line 引用 Function；Function 保存名字、文件和起始行；Mapping 描述加载地址区间、文件偏移与构建身份；大量字符串通过共享 string_table 索引引用。string_table 的零号项必须为空字符串，各类非零 ID 则是文件内部的引用编号。Location 的 ID 可以来自整数序列，不能把它当成机器地址。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>一个 CPU Sample 的 value 若为 <code>[12,120000000]<\/code>，必须同时读取 sample_type 才能解释为十二个名义样本和一亿两千万纳秒。heap 可以有四列，其他 producer 可以定义更多类型；所有 Sample 的向量长度必须和 sample_type 相同。格式允许有符号 int64，因此差分负值是有效表达，不是文件损坏。period 描述采样间隔的类型与数值，但 value 列可能已经完成了周期换算；不应看到 period=10000000 就把 cpu/nanoseconds 再乘一次。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>栈的方向也必须固定：<code>Sample.location_id[0]<\/code> 是叶子，随后走向调用者。本章教学记录 <code>[5,4,2,1]<\/code> 可表示 Hash 的位置、Encode、Handle、Root。Location 5 内又有两条 Line：HashRound 在前，Hash 在后，表示 HashRound 内联到 Hash 中。因此四个物理位置可以展开为五层逻辑函数；这不表示多做了一次真实函数调用，更不要求栈上存在一个 HashRound 的独立返回地址。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>PC 则需要区分采样现场的指令地址、栈展开返回的 return PC、文件格式中的 Location.Address，以及对象文件里的符号地址。Go 的 CallersFrames 对符合其约定的返回地址适当减一，以回到有关调用指令的范围，并展开内联标记。减一只是定位到调用指令内，不承诺指向它的首字节。pprof 的 Go builder 再把恢复的 Frame.PC 写到 Location。对已经完成这种归一化的地址又统一减一，可能产生新的行号偏差。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/symtab.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"return PC与内联帧恢复\">[pp-pc]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>符号化可以发生在生产端，也可以发生在读取端。Go 文件常已包含函数、源码行及内联信息，读取这样的文件不一定还要拿一个二进制才能列出函数热点。需要反汇编、补全缺失符号或对应精确源码时，匹配构建仍然重要。pprof 本地符号化按 Mapping 归组，打开相应文件，检查双方已知 Build ID 是否相符，再用地址查询源码帧。若已经符号化且未请求强制处理，通常不会重复解析该映射。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/symbolizer/symbolizer.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof本地符号化与Build ID核验\">[pp-symbolizer]<\/a><\/p>\n\n<p>对于 ELF，进程虚拟地址到对象文件地址的转换并不总是简单的 <code>pc-memory_start<\/code>。程序头、映射偏移、可执行文件类型和加载基址都参与计算；pprof 的 ObjAddr 返回 <code>addr-base<\/code>，其中 base 由对应映射和 ELF 信息算出。<code>pc-memory_start<\/code> 可以用于特定映射内的相对位置比较，但不能作为适用于一切二进制的 addr2line 输入公式。快速 nm 路径又可能只有符号名而没有完整文件和行号，需要区分符号化精度。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/binutils/binutils.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"进程地址到对象文件地址\">[pp-binutils]<\/a><\/p>\n\n<p>标签扩展了栈的上下文，但没有补回时序。格式支持字符串标签和带单位的数值标签；<code>input_bytes=64 bytes<\/code> 与 <code>input_bytes=64 requests<\/code> 不是相同语义，单位也参与合并身份。新协议说明不鼓励同键多值，更不应在同一键下混用字符串和数字。Go 标准库的 <code>pprof.Labels<\/code> 则提供字符串标签，Go 1.25 明确只有 CPU 与 goroutine profiles 使用这些 labels，不能因为协议有 label 就承诺 heap 或 mutex 自动按租户归因。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/label.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go标签支持范围\">[pp-label-support]<\/a><\/p>\n\n<p><code>pprof.Do<\/code> 把增强后的 context 标签安装到当前 G，结束时恢复传入 context 所带标签；新建 G 继承创建者当时的标签。传入一个有标签的 context，并不会让一个早已存在的 worker 自动换标签。应在真正执行任务的 goroutine 上安装对应上下文，并正确结束请求级生命周期。无限后台 G 继承请求标签后长期运行，会把不属于该请求的后续工作归入同一类别；这属于上下文建模错误，不是查询界面能修复的问题。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/runtime.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go标签安装和继承\">[pp-labels]<\/a><\/p>\n\n<p>本节的关键结果是“地址、位置、函数和请求类别”具有不同身份。相同函数可以有多个指令位置、多个内联上下文、多个调用方和多类请求；同一逻辑样本也可能在不同进程中拥有不同绝对地址。下一步合并如果只依据函数名或只依据位置编号，就会制造错误的等价关系。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n","advanced":true},{"title":"合并、过滤、归一化和差分是不同的数学操作","body":"Merge 首先检查基本类型兼容性，然后建立输出的 Mapping、Function、Location 与 Sample 表。每读取一个输入 profile，都重建该文件的局部 ID 到输出对象的映射。因此两个输入的 Location 7 不会因为编号相同就自动合并，两个编号不同的等价位置也可以归一。sample key 使用重新映射后的有序位置序列、字符串标签、数值标签及单位；命中同一键后才逐维累加值向量。[[pp-merge]](#src-pp-merge)\n\n处理 ASLR 时，Mapping 的键考虑对齐后的映射大小、文件偏移和 Build ID；没有 Build ID 时退到文件身份。Location 的身份结合映射、相对地址和源码行/函数信息。若相同构建在两个进程分别加载到 0x1000 和 0x2000，同一位置位于 0x1050 和 0x2050，则有机会归一为同一位置。相反，同名可执行文件发生重建、文件身份缺失或构建 ID 被错误复用，算法能执行合并并不证明物理身份正确。[[pp-merge]](#src-pp-merge)\n\n合并还会修改头部：本版本的 combineHeaders 取较早的 time_nanos，duration_nanos 求和，而不是对所有采集区间做并集。两个同时采集的实例，每个十秒，合并后 duration 可以为二十秒；这不代表现实中经过了二十秒。协议把这些字段列为信息字段，但界面会展示它们，因此分析者必须检查元数据的来源。特别是差分里出现的 duration，不应被拿来计算一个并不存在的业务吞吐。[[pp-proto]](#src-pp-proto)[[pp-merge]](#src-pp-merge)\n\nAggregate 与 Merge 也不同。按函数聚合时，分析器可以丢掉地址、行号或列号；选择不保留内联时，Location.Line 只留下最外面的实体函数。这些是投影操作：将更细的身份空间映射到更粗的空间，使后续节点聚合更适合问题，但信息已经不可逆。生成函数级报告后，不能声称那些数值仍能精确恢复到原来的某条机器指令。[[pp-scale]](#src-pp-scale)\n\n过滤至少有两类。focus 和 ignore 决定保留哪些完整样本：至少一帧匹配 focus 且没有任何帧匹配 ignore，样本才保留。hide 和 show 则主要改变保留样本里的可见帧；所有帧都被删光时，样本也会被移除。隐藏中间函数会把图上的祖先和后代拉近，因此一条可见边未必就是源码里的直接调用。标签过滤又是以样本上下文作条件，而非把该标签对应的所有函数全局删除。[[pp-filter]](#src-pp-filter)\n\n百分比分母是另一个独立选择。默认流程先创建 Report 并保存总量，再应用过滤，所以“只看 route=A”不保证百分比重新加到一百。启用 `relative_percentages` 时，顺序才变成先过滤再建 Report。本章中 HashRound 属于 A 的权重始终是 80 ms；默认除以全局 480 ms 得 16.67%，相对百分比除以 A 的 320 ms 得 25%。同一个成本出现两个正确百分比，差别来自问题的条件集合。[[pp-denominator]](#src-pp-denominator)[[pp-teaching]](#src-pp-teaching)\n\nNormalize 解决的则是体量尺度。对当前源 profile 第 $j$ 维总量 $S_j$ 和基线总量 $B_j$，它把当前每个值乘 $B_j/S_j$；当当前总量为零时，该维缩放为零。操作对象是当前 profile，不是把基线调成当前体量。ScaleN 会对结果取整再转成 int64，因此归一化后不承诺每个原始向量关系都精确保留。它适合观察相对结构，但不会自动使用成功请求数，也不控制输入类别和错误率。[[pp-merge]](#src-pp-merge)[[pp-scale]](#src-pp-scale)\n\n固定分析器还存在一个需要与理想公式区分的实现边界：`ScaleN` 只在比例不等于一的列上更新保留样本的判断。独立实验使用该固定提交未经修改的 profile 子包，将 `[2,0]` 按 `[1,0.5]` 缩放，实际样本被删除，而逐维数学结果应为 `[2,0]`。因此混合比例、部分列为零时的变化不应一概归于取整；本章 count 与 CPU 同比例缩放的教学案例不受该反例影响。此处真实执行的是固定提交的子包，不是以它构建的完整 CLI。[[pp-scale]](#src-pp-scale)[[pp-scale-repro]](#src-pp-scale-repro)\n\n差分可以写成 $D=\\alpha P_{after}-P_{before}$，其中没有归一化时 $\\alpha=1$。`-diff_base` 会先给基线样本加内部标签 `pprof::base=true`，然后可选归一化当前 profile，再把基线乘负一并合并。这个标签让两类样本在中间结构中仍可区分，用于报告分母；绘图时同一函数的正负贡献仍会相抵。因而不能只看合并消息数量猜测净差分的结构。[[pp-diff]](#src-pp-diff)[[pp-merge]](#src-pp-merge)\n\n一般情况下，Report 总量取所选样本值的绝对值之和；若存在非零的 diff-base 总量，则改用基线绝对总量。这解释了一个常见误区：`-base` 不是在任何输入下都以“源总量减基线总量”作分母。只有真正的累计增量等合适条件下，各项非负，绝对值之和才等于总量之差；当既有增长又有下降时，净差为零仍可能具有很大的变化总量。[[pp-total]](#src-pp-total)\n\n本章变体的六组净变化为 −40、−40、−20、+40、+40、+20 ms，绝对值合计 200 ms。`-base` 报告的分母就是 200 ms；`-diff_base` 保留基线 480 ms 分母。同一 HashRound 在两个路由上分别减少和增加 40 ms，函数级聚合后抵消为零，不能据此断言业务结构未变。Parse 的净值为 −40 ms，但 flat% 显示正的幅度，因为 Percentage 使用绝对比例；增减方向必须阅读带符号的数值。[[pp-total]](#src-pp-total)[[pp-percent]](#src-pp-percent)[[pp-teaching]](#src-pp-teaching)\n\n由此可区分三个问题：合并问“这些可比观察总共发生了多少”，条件过滤问“所关心的子集合是什么”，归一化和差分问“在某个尺度下前后结构怎样变化”。把这三步顺序写清，比只保存最后一张差分火焰图更能支持复核。操作可执行只证明数据结构满足要求，不证明两个程序阶段、负载分布或运行时版本具有研究上的可比性。[[pp-merge]](#src-pp-merge)[[pp-filter]](#src-pp-filter)[[pp-diff]](#src-pp-diff)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-denominator\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pp-denominator-title pp-denominator-desc\"><title id=\"pp-denominator-title\">同一成本，两种正确的百分比<\/title><desc id=\"pp-denominator-desc\">合成教学基线：全局480ms、route=A共320ms、A中的HashRound为80ms。默认分母和relative_percentages回答不同条件集合。<\/desc><defs><marker id=\"pp-denominator-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"50\" y=\"70\" width=\"390\" height=\"150\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"245.0\" y=\"131.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">默认总量：480 ms<\/text>\n<text x=\"245.0\" y=\"158.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">80 / 480 = 16.67%<\/text>\n<rect x=\"520\" y=\"70\" width=\"390\" height=\"150\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"715.0\" y=\"131.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">条件总量：320 ms<\/text>\n<text x=\"715.0\" y=\"158.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">80 / 320 = 25%<\/text>\n<text x=\"480\" y=\"280\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">变化的是分母，80 ms 的绝对成本没有变化<\/text>\n<\/svg><figcaption><strong>同一成本，两种正确的百分比。<\/strong> 合成教学基线：全局480ms、route=A共320ms、A中的HashRound为80ms。默认分母和relative_percentages回答不同条件集合。 <a class=\"figure-open\" href=\"figures/pp-denominator.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>Merge 首先检查基本类型兼容性，然后建立输出的 Mapping、Function、Location 与 Sample 表。每读取一个输入 profile，都重建该文件的局部 ID 到输出对象的映射。因此两个输入的 Location 7 不会因为编号相同就自动合并，两个编号不同的等价位置也可以归一。sample key 使用重新映射后的有序位置序列、字符串标签、数值标签及单位；命中同一键后才逐维累加值向量。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n<p>处理 ASLR 时，Mapping 的键考虑对齐后的映射大小、文件偏移和 Build ID；没有 Build ID 时退到文件身份。Location 的身份结合映射、相对地址和源码行/函数信息。若相同构建在两个进程分别加载到 0x1000 和 0x2000，同一位置位于 0x1050 和 0x2050，则有机会归一为同一位置。相反，同名可执行文件发生重建、文件身份缺失或构建 ID 被错误复用，算法能执行合并并不证明物理身份正确。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n<p>合并还会修改头部：本版本的 combineHeaders 取较早的 time_nanos，duration_nanos 求和，而不是对所有采集区间做并集。两个同时采集的实例，每个十秒，合并后 duration 可以为二十秒；这不代表现实中经过了二十秒。协议把这些字段列为信息字段，但界面会展示它们，因此分析者必须检查元数据的来源。特别是差分里出现的 duration，不应被拿来计算一个并不存在的业务吞吐。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n<p>Aggregate 与 Merge 也不同。按函数聚合时，分析器可以丢掉地址、行号或列号；选择不保留内联时，Location.Line 只留下最外面的实体函数。这些是投影操作：将更细的身份空间映射到更粗的空间，使后续节点聚合更适合问题，但信息已经不可逆。生成函数级报告后，不能声称那些数值仍能精确恢复到原来的某条机器指令。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/profile.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"粒度聚合与整数量化\">[pp-scale]<\/a><\/p>\n\n<p>过滤至少有两类。focus 和 ignore 决定保留哪些完整样本：至少一帧匹配 focus 且没有任何帧匹配 ignore，样本才保留。hide 和 show 则主要改变保留样本里的可见帧；所有帧都被删光时，样本也会被移除。隐藏中间函数会把图上的祖先和后代拉近，因此一条可见边未必就是源码里的直接调用。标签过滤又是以样本上下文作条件，而非把该标签对应的所有函数全局删除。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/filter.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"样本筛选与帧隐藏\">[pp-filter]<\/a><\/p>\n\n<p>百分比分母是另一个独立选择。默认流程先创建 Report 并保存总量，再应用过滤，所以“只看 route=A”不保证百分比重新加到一百。启用 <code>relative_percentages<\/code> 时，顺序才变成先过滤再建 Report。本章中 HashRound 属于 A 的权重始终是 80 ms；默认除以全局 480 ms 得 16.67%，相对百分比除以 A 的 320 ms 得 25%。同一个成本出现两个正确百分比，差别来自问题的条件集合。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/driver/driver.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"报告分母与过滤顺序\">[pp-denominator]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>Normalize 解决的则是体量尺度。对当前源 profile 第 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>j<\/mi><\/mrow><\/math> 维总量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math> 和基线总量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>B<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>，它把当前每个值乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>B<\/mi><mi>j<\/mi><\/msub><mo>&#x0002F;<\/mo><msub><mi>S<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>；当当前总量为零时，该维缩放为零。操作对象是当前 profile，不是把基线调成当前体量。ScaleN 会对结果取整再转成 int64，因此归一化后不承诺每个原始向量关系都精确保留。它适合观察相对结构，但不会自动使用成功请求数，也不控制输入类别和错误率。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/profile.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"粒度聚合与整数量化\">[pp-scale]<\/a><\/p>\n\n<p>固定分析器还存在一个需要与理想公式区分的实现边界：<code>ScaleN<\/code> 只在比例不等于一的列上更新保留样本的判断。独立实验使用该固定提交未经修改的 profile 子包，将 <code>[2,0]<\/code> 按 <code>[1,0.5]<\/code> 缩放，实际样本被删除，而逐维数学结果应为 <code>[2,0]<\/code>。因此混合比例、部分列为零时的变化不应一概归于取整；本章 count 与 CPU 同比例缩放的教学案例不受该反例影响。此处真实执行的是固定提交的子包，不是以它构建的完整 CLI。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/profile.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"粒度聚合与整数量化\">[pp-scale]<\/a><a class=\"cite\" href=\"#resources\" title=\"ScaleN混合比例边界的固定源码实际复现\">[pp-scale-repro]<\/a><\/p>\n\n<p>差分可以写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mi>&#x003B1;<\/mi><msub><mi>P<\/mi><mrow><mi>a<\/mi><mi>f<\/mi><mi>t<\/mi><mi>e<\/mi><mi>r<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>P<\/mi><mrow><mi>b<\/mi><mi>e<\/mi><mi>f<\/mi><mi>o<\/mi><mi>r<\/mi><mi>e<\/mi><\/mrow><\/msub><\/mrow><\/math>，其中没有归一化时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。<code>-diff_base<\/code> 会先给基线样本加内部标签 <code>pprof::base=true<\/code>，然后可选归一化当前 profile，再把基线乘负一并合并。这个标签让两类样本在中间结构中仍可区分，用于报告分母；绘图时同一函数的正负贡献仍会相抵。因而不能只看合并消息数量猜测净差分的结构。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/driver/fetch.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分的操作顺序\">[pp-diff]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n<p>一般情况下，Report 总量取所选样本值的绝对值之和；若存在非零的 diff-base 总量，则改用基线绝对总量。这解释了一个常见误区：<code>-base<\/code> 不是在任何输入下都以“源总量减基线总量”作分母。只有真正的累计增量等合适条件下，各项非负，绝对值之和才等于总量之差；当既有增长又有下降时，净差为零仍可能具有很大的变化总量。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><\/p>\n\n<p>本章变体的六组净变化为 −40、−40、−20、+40、+40、+20 ms，绝对值合计 200 ms。<code>-base<\/code> 报告的分母就是 200 ms；<code>-diff_base<\/code> 保留基线 480 ms 分母。同一 HashRound 在两个路由上分别减少和增加 40 ms，函数级聚合后抵消为零，不能据此断言业务结构未变。Parse 的净值为 −40 ms，但 flat% 显示正的幅度，因为 Percentage 使用绝对比例；增减方向必须阅读带符号的数值。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/measurement/measurement.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"百分比使用幅度\">[pp-percent]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>由此可区分三个问题：合并问“这些可比观察总共发生了多少”，条件过滤问“所关心的子集合是什么”，归一化和差分问“在某个尺度下前后结构怎样变化”。把这三步顺序写清，比只保存最后一张差分火焰图更能支持复核。操作可执行只证明数据结构满足要求，不证明两个程序阶段、负载分布或运行时版本具有研究上的可比性。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/filter.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"样本筛选与帧隐藏\">[pp-filter]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/driver/fetch.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分的操作顺序\">[pp-diff]<\/a><\/p>\n\n<div class=\"advanced-interactives\"><div class=\"ml-labs\" id=\"ml-mechanism-labs\"><section class=\"ml-card\" id=\"ml-pprof-lab\" aria-labelledby=\"ml-pprof-title\">\n      <div class=\"ml-card-heading\"><div><span class=\"ml-tool-label\">02 / pprof aggregation<\/span><h3 id=\"ml-pprof-title\">换一下记录顺序，热点会变吗？<\/h3><\/div><\/div>\n      <p class=\"ml-description\">三条已聚合 Sample 共用 <code>request=demo<\/code>，只包含 CPU 权重。下面的排列不是调用时间线。<\/p>\n      <ol class=\"ml-sample-list\" id=\"ml-pprof-samples\" aria-label=\"profile 中的 Sample 排列\">\n        <li data-ml-record=\"first\"><span class=\"ml-sample-position\">1<\/span><code>main.first_work<\/code><strong>4 <small>ms<\/small><\/strong><\/li>\n        <li data-ml-record=\"worker\"><span class=\"ml-sample-position\">2<\/span><code>worker.work<\/code><strong>15 <small>ms<\/small><\/strong><\/li>\n        <li data-ml-record=\"finish\"><span class=\"ml-sample-position\">3<\/span><code>main.finish_work<\/code><strong>4 <small>ms<\/small><\/strong><\/li>\n      <\/ol>\n      <div class=\"ml-weight-summary\"><span>总 CPU 权重<strong><output id=\"ml-pprof-total\">23<\/output> <small>ms<\/small><\/strong><\/span><span>函数 flat<small id=\"ml-pprof-flat\">first 4 / worker 15 / finish 4 ms<\/small><\/span><\/div>\n      <div class=\"ml-controls\"><button class=\"ml-button ml-button-primary\" type=\"button\" id=\"ml-pprof-shuffle\">打乱记录顺序 ⇄<\/button><button class=\"ml-button ml-button-secondary\" type=\"button\" id=\"ml-pprof-reset\">重置<\/button><\/div>\n      <p class=\"ml-feedback\" id=\"ml-pprof-note\" aria-live=\"polite\">初始排列。三条记录的权重之和为 4 + 15 + 4 = 23 ms。<\/p>\n      <p class=\"ml-boundary\">按钮仅重排文件中已聚合记录的顺序，不改变真实调用时间，也不恢复事件先后。这是聚合规则的模型，没有在浏览器中运行 pprof。<\/p>\n    <\/section><\/div><\/div>","advanced":true},{"title":"报告算法：flat、cum、调用图与火焰图为何不同","body":"先固定可见栈展开和节点粒度，再定义函数级权重。对于正权重 profile，$flat(f)=\\sum_i w_i\\,1\\{f\\text{ 是样本 }i\\text{ 的叶节点}\\}$；$cum(f)=\\sum_i w_i\\,1\\{f\\text{ 至少出现在样本 }i\\text{ 中一次}\\}$。源码的普通图构建与这个解释一致：逐样本从根向叶走，用 seenNode 防止同一节点重复累计，用 seenEdge 防止重复边，最后把 flat 加到叶节点。[[pp-graph]](#src-pp-graph)\n\n因此入口的 cum 很大而 flat 很小，说明它承载下游成本，不说明入口处某条赋值特别昂贵。所有函数 cum 之和通常远大于 profile 总量，因为同一权重归入多个祖先；这不是重复计费的 bug，而是 inclusive 统计定义。对于递归 `Root→Handle→Walk→Walk`，同一样本的 Walk cum 只加一次。它不是“每深一层就再增加同一份 CPU”，更不能用 cum 除以递归深度计算每次调用耗时。[[pp-graph]](#src-pp-graph)\n\n“函数”本身也经过粒度选择。按地址时，同一个源码函数中的不同位置可以是不同节点；按行时保留行信息；按函数时许多位置会归并。内联会让逻辑叶子和实体机器函数不同：本例 HashRound 内联到 Hash，默认 flat 180 ms 归到 HashRound，Hash 的 cum 为 180 ms；忽略内联后则把这部分 flat 归入 Hash。两种视图都来自同一批观察，不能把差异解释为优化前后发生了资源变化。[[pp-scale]](#src-pp-scale)[[pp-graph]](#src-pp-graph)[[pp-teaching]](#src-pp-teaching)\n\n普通调用图把所有样本中可见的节点和邻接关系汇总；边的权重是流经该关系的样本权重，不是函数调用次数。图构建排除节点到自身的普通边，因此递归深度还会进一步丢失。截断和剪枝可能生成跨过隐藏节点的 residual edge。若真实样本分别是 `A→F→X` 与 `B→F→Y`，合并图具有这些局部边，却不能证明 `A→F→Y` 这条完整路径曾经发生；局部连接关系不等于原始路径集合。[[pp-graph]](#src-pp-graph)\n\n调用树保留路径上下文，代价是同一函数会在多个调用路径下出现；按完整栈组织的火焰图也保留这类上下文。pprof 的栈数据把样本位置及内联链反转成根到叶的 Sources，附上所选维度的 Value，并记录来源函数供交互聚焦。递归可以在栈中重复出现；用于聚焦的 Places 索引对同一栈的重复来源只记录最外层，避免把同一权重重复计入交互集合。[[pp-flame]](#src-pp-flame)\n\n火焰图的宽度取决于权重，纵向表达栈层次，横向是布局位置。CPU 火焰图中的宽块可能表示许多短调用，也可能表示少数较长计算；heap 火焰图中的宽块可以是保留字节，block 火焰图可以是等待量。颜色和排序还取决于具体界面，不能脱离图例把颜色当成“更慢”。尤其并排的两个块不具有“先发生左边再发生右边”的时间含义。[[pp-flame]](#src-pp-flame)[[pp-proto]](#src-pp-proto)\n\n还要区别“整份 profile 的总量”和“当前展示节点所能归属的总量”。无法符号化、无可见栈、隐藏规则、负值抵消、阈值剪枝等都可能让显示和总量不同。降低 nodefraction 或增加 nodecount 只改变展示覆盖，不会改善采样覆盖；把 unknown 隐藏掉也不会解决归因。分析报告应保留总量、过滤条件和被省略范围，避免把局部画面误作完整事实。[[pp-filter]](#src-pp-filter)[[pp-total]](#src-pp-total)[[pp-graph]](#src-pp-graph)\n\n从实现复杂度看，核心工作量跟样本的总栈长度、内联展开数量及标签内容有关，而不只是文件中的函数个数。合并利用哈希表避免反复扫描全部已见结构；每个样本的节点去重集合限制递归重复累计；可视化再把这些结构投影成更易读的形状。高基数标签会使本来相同的栈分裂成更多键，增加状态规模，也降低每个类别的统计稳定性。这是为何标签设计属于测量设计，而非纯界面装饰。[[pp-merge]](#src-pp-merge)[[pp-graph]](#src-pp-graph)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-graph\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pp-graph-title pp-graph-desc\"><title id=\"pp-graph-title\">局部调用边不等于完整路径<\/title><desc id=\"pp-graph-desc\">两条原始栈 A→F→X 与 B→F→Y 的合并调用图会共享F；图上的连接不能证明 A→F→Y 曾出现。<\/desc><defs><marker id=\"pp-graph-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40\" y=\"45\" width=\"190\" height=\"85\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"135.0\" y=\"87.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">A<\/text>\n<rect x=\"40\" y=\"190\" width=\"190\" height=\"85\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"135.0\" y=\"232.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">B<\/text>\n<rect x=\"385\" y=\"110\" width=\"190\" height=\"95\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"157.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">F<\/text>\n<rect x=\"730\" y=\"45\" width=\"190\" height=\"85\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"825.0\" y=\"87.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">X<\/text>\n<rect x=\"730\" y=\"190\" width=\"190\" height=\"85\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"825.0\" y=\"232.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Y<\/text>\n<line x1=\"235\" y1=\"87\" x2=\"380\" y2=\"150\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-graph-arrow)\"/>\n<line x1=\"235\" y1=\"233\" x2=\"380\" y2=\"170\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-graph-arrow)\"/>\n<line x1=\"580\" y1=\"150\" x2=\"725\" y2=\"87\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-graph-arrow)\"/>\n<line x1=\"580\" y1=\"170\" x2=\"725\" y2=\"233\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-graph-arrow)\"/>\n<text x=\"480\" y=\"305\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">调用树 / 栈视图保留更多路径上下文<\/text>\n<\/svg><figcaption><strong>局部调用边不等于完整路径。<\/strong> 两条原始栈 A→F→X 与 B→F→Y 的合并调用图会共享F；图上的连接不能证明 A→F→Y 曾出现。 <a class=\"figure-open\" href=\"figures/pp-graph.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>先固定可见栈展开和节点粒度，再定义函数级权重。对于正权重 profile，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mi>l<\/mi><mi>a<\/mi><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x0007B;<\/mo><mi>f<\/mi><mtext>&#x000A0;是样本&#x000A0;<\/mtext><mi>i<\/mi><mtext>&#x000A0;的叶节点<\/mtext><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mi>u<\/mi><mi>m<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x0007B;<\/mo><mi>f<\/mi><mtext>&#x000A0;至少出现在样本&#x000A0;<\/mtext><mi>i<\/mi><mtext>&#x000A0;中一次<\/mtext><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。源码的普通图构建与这个解释一致：逐样本从根向叶走，用 seenNode 防止同一节点重复累计，用 seenEdge 防止重复边，最后把 flat 加到叶节点。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n<p>因此入口的 cum 很大而 flat 很小，说明它承载下游成本，不说明入口处某条赋值特别昂贵。所有函数 cum 之和通常远大于 profile 总量，因为同一权重归入多个祖先；这不是重复计费的 bug，而是 inclusive 统计定义。对于递归 <code>Root→Handle→Walk→Walk<\/code>，同一样本的 Walk cum 只加一次。它不是“每深一层就再增加同一份 CPU”，更不能用 cum 除以递归深度计算每次调用耗时。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n<p>“函数”本身也经过粒度选择。按地址时，同一个源码函数中的不同位置可以是不同节点；按行时保留行信息；按函数时许多位置会归并。内联会让逻辑叶子和实体机器函数不同：本例 HashRound 内联到 Hash，默认 flat 180 ms 归到 HashRound，Hash 的 cum 为 180 ms；忽略内联后则把这部分 flat 归入 Hash。两种视图都来自同一批观察，不能把差异解释为优化前后发生了资源变化。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/profile.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"粒度聚合与整数量化\">[pp-scale]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>普通调用图把所有样本中可见的节点和邻接关系汇总；边的权重是流经该关系的样本权重，不是函数调用次数。图构建排除节点到自身的普通边，因此递归深度还会进一步丢失。截断和剪枝可能生成跨过隐藏节点的 residual edge。若真实样本分别是 <code>A→F→X<\/code> 与 <code>B→F→Y<\/code>，合并图具有这些局部边，却不能证明 <code>A→F→Y<\/code> 这条完整路径曾经发生；局部连接关系不等于原始路径集合。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n<p>调用树保留路径上下文，代价是同一函数会在多个调用路径下出现；按完整栈组织的火焰图也保留这类上下文。pprof 的栈数据把样本位置及内联链反转成根到叶的 Sources，附上所选维度的 Value，并记录来源函数供交互聚焦。递归可以在栈中重复出现；用于聚焦的 Places 索引对同一栈的重复来源只记录最外层，避免把同一权重重复计入交互集合。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/stacks.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"火焰图栈数据与递归索引\">[pp-flame]<\/a><\/p>\n\n<p>火焰图的宽度取决于权重，纵向表达栈层次，横向是布局位置。CPU 火焰图中的宽块可能表示许多短调用，也可能表示少数较长计算；heap 火焰图中的宽块可以是保留字节，block 火焰图可以是等待量。颜色和排序还取决于具体界面，不能脱离图例把颜色当成“更慢”。尤其并排的两个块不具有“先发生左边再发生右边”的时间含义。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/stacks.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"火焰图栈数据与递归索引\">[pp-flame]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>还要区别“整份 profile 的总量”和“当前展示节点所能归属的总量”。无法符号化、无可见栈、隐藏规则、负值抵消、阈值剪枝等都可能让显示和总量不同。降低 nodefraction 或增加 nodecount 只改变展示覆盖，不会改善采样覆盖；把 unknown 隐藏掉也不会解决归因。分析报告应保留总量、过滤条件和被省略范围，避免把局部画面误作完整事实。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/filter.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"样本筛选与帧隐藏\">[pp-filter]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n<p>从实现复杂度看，核心工作量跟样本的总栈长度、内联展开数量及标签内容有关，而不只是文件中的函数个数。合并利用哈希表避免反复扫描全部已见结构；每个样本的节点去重集合限制递归重复累计；可视化再把这些结构投影成更易读的形状。高基数标签会使本来相同的栈分裂成更多键，增加状态规模，也降低每个类别的统计稳定性。这是为何标签设计属于测量设计，而非纯界面装饰。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n","advanced":true},{"title":"可复核的 48 条教学样本与配套图解","body":"为了让上述规则可以手工核算，本章构造一个只有 48 条 protobuf Sample 消息的基线。每条值向量是 `[1,10000000]`，即一份名义十毫秒 CPU 权重；文件 duration 为 400 ms。地址、构建 ID、源码路径和采集时间均为虚构，数据没有宣称来自真实 Go 程序。基线按下表生成，表中用根到叶方向方便阅读，实际编码方向相反；方括号表示同一个 Location 内的内联链。[[pp-teaching]](#src-pp-teaching)\n\n| 组 | 根到叶的逻辑路径 | route | 记录数 | CPU 权重 |\n| --- | --- | --- | ---: | ---: |\n| A/parse | Root→Handle→Parse | A | 12 | 120 ms |\n| A/hash | Root→Handle→Encode→[Hash→HashRound] | A | 8 | 80 ms |\n| A/recurse | Root→Handle→Walk→Walk | A | 6 | 60 ms |\n| B/hash | Root→Batch→[Hash→HashRound] | B | 10 | 100 ms |\n| B/alloc | Root→Batch→Alloc | B | 6 | 60 ms |\n| A/encode | Root→Handle→Encode | A | 6 | 60 ms |\n\nA 共 32 份、320 ms；B 共 16 份、160 ms；总数 48、总权重 480 ms。还有数字标签 input_bytes，A 为 64 bytes、B 为 256 bytes，用于展示单位明确的上下文，不参与 CPU 总量换算。HashRound 和 Hash 共用一个地址且具有两条 Line，Walk 的位置 ID 在递归栈里出现两次。这样一个小文件同时覆盖分支、内联、递归、标签和值向量，避免靠巨大生产数据隐藏规则。[[pp-teaching]](#src-pp-teaching)\n\n生成器为 `research/pprof/make_teaching_profile.py`，只使用 Python 标准库手工编码 protobuf，便于逐字段对照协议。`teaching/manifest.json` 保存分组、每条记录、权重和文件 SHA-256；`verify_teaching.py` 调用真实 `go tool pprof`，不是把预期结果自己画成假终端输出。执行时关闭符号化，因为这些地址没有对应的真实 ELF；因此它验证的是格式解析、聚合和报告规则，不是实际程序的符号解析能力。[[pp-proto]](#src-pp-proto)[[pp-teaching]](#src-pp-teaching)\n\n基线查询的关键结果如下，绝对权重与手算完全相符：\n\n| 节点 | flat | cum | 理由 |\n| --- | ---: | ---: | --- |\n| Root | 0 | 480 ms | 所有样本都经过根 |\n| Handle | 0 | 320 ms | A 的四组路径 |\n| Batch | 0 | 160 ms | B 的两组路径 |\n| HashRound | 180 ms | 180 ms | 两条分支的内联叶子之和 |\n| Hash | 0 | 180 ms | 包含内联叶子的逻辑外层 |\n| Parse | 120 ms | 120 ms | 十二份叶子权重 |\n| Encode | 60 ms | 140 ms | 自身六份，加下游哈希八份 |\n| Walk | 60 ms | 60 ms | 六份递归样本，每条只计一次 cum |\n| Alloc | 60 ms | 60 ms | 六份叶子权重 |\n\n可重放的最小入口如下，实际的十五条完整命令保存在 verification.json。命令默认在当前任务根目录执行；这只是验证入口，不替代前文的机制推导。\n\n```sh\npython3 research/pprof/make_teaching_profile.py\npython3 research/pprof/verify_teaching.py\ngo tool pprof -symbolize=none -top research/pprof/teaching/baseline.pprof\n```\n\n第一组反例是过滤。筛选 A 后，HashRound 为 80 ms，在全局分母下显示 16.67%；相对分母下显示 25%。focus=Handle 会删除 B 的完整样本，hide=Handle 则隐藏一个帧但保留 B 的 Batch 分支。可见“只看这个函数路径”和“把这个函数从图上拿掉”是不同操作，不能用其中一个替代另一个。对应输出为 route-a、route-a-relative、focus-handle、hide-handle 四组文本。[[pp-teaching]](#src-pp-teaching)\n\n第二组反例是位置身份。relocated 变体把 mapping 起点和所有指令地址增加 0x1000，同时给位置和函数 ID 增加 100，保持构建身份、相对位置、标签和权重不变。与基线合并后，pprof 报告总权重 960 ms，各函数权重恰好翻倍。这支持“在该合成输入条件下，重定位和局部 ID 不会错误拆分等价位置”的结论，但没有验证真实共享库搜索、Build ID 提取或缺失符号恢复。[[pp-merge]](#src-pp-merge)[[pp-teaching]](#src-pp-teaching)\n\n第三组反例是变化抵消。changed 变体六组事件权重依次改为 8、4、4、14、10、8，总体仍为 48 份。HashRound 的总量仍为 180 ms，但 A 的哈希从 80 降为 40 ms，B 的哈希从 100 升为 140 ms。Encode 的 flat 从 60 升到 80 ms，cum 却从 140 降到 120 ms，因为下游下降更多。只盯 flat、只盯 cum、只盯 HashRound 总量，都会遗漏一部分真实结构变化。[[pp-teaching]](#src-pp-teaching)\n\n该变体的 Parse 差值为 −40 ms，Alloc 为 +40 ms，Encode flat 为 +20 ms、cum 为 −20 ms，Walk 为 −20 ms；Handle cum 为 −80 ms，Batch cum 为 +80 ms。`diff.txt` 使用 480 ms 基线分母，`base.txt` 使用 200 ms 绝对变化分母。二者标题都可能写“Showing nodes accounting for 0”，但下方仍有正负节点：零是净和，不是没有变化。差分文件里 duration 变为 800 ms，也只是两个输入头部相加，不是新的真实采集窗口。[[pp-total]](#src-pp-total)[[pp-merge]](#src-pp-merge)[[pp-teaching]](#src-pp-teaching)\n\n最后，double-volume 变体把六组权重全部加倍，使用六条聚合 Sample 表示 96 份事件。未经归一化时它有 960 ms；以基线为 diff_base 并归一化后，所有函数净变化为零，但报告仍保留 480 ms 的基线分母。三个变体各六条消息，连同基线共 66 条 protobuf Sample 消息，方便完整检查。“六条消息”与“九十六份事件权重”的差别正好再次证明 Sample 不等于原始事件。[[pp-teaching]](#src-pp-teaching)\n\n读者应能完成三项检验：交换同一文件中 Sample 的排列，判断报告为何基本不变；把一条已聚合记录拆成多个相同键的小记录，判断守恒的是哪些值；增加一个新标签，使部分相同栈不再合并，再说明总量为何仍应守恒。进一步的研究问题则是：这种不变性在哪些环节失效，例如整数缩放取整、采样率变化、丢样、缺少构建身份或不同总体被错误混合。提出这些条件，比记住更多命令更接近可靠的性能研究。[[pp-proto]](#src-pp-proto)[[pp-merge]](#src-pp-merge)[[pp-scale]](#src-pp-scale)\n\n本轮验证结果是十五种查询成功、十四项语义断言通过，原始标准输出、标准错误和版本记录均保留。未运行真实 CPU 信号压力实验、heap 随机采样收敛实验或生产负载，教学 CLI 也未使用所读 google/pprof 提交构建；独立边界验证仅编译执行该提交的 profile 子包；这些方面仍属于源码解释和理想模型。由此得到的是一条可复核的解释链：知道记录如何产生、哪些转换保持权重、哪些操作损失信息，最终才能把一个热点转化为有条件、可反驳的性能结论。[[pp-teaching]](#src-pp-teaching)","html":"\n<p>为了让上述规则可以手工核算，本章构造一个只有 48 条 protobuf Sample 消息的基线。每条值向量是 <code>[1,10000000]<\/code>，即一份名义十毫秒 CPU 权重；文件 duration 为 400 ms。地址、构建 ID、源码路径和采集时间均为虚构，数据没有宣称来自真实 Go 程序。基线按下表生成，表中用根到叶方向方便阅读，实际编码方向相反；方括号表示同一个 Location 内的内联链。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<div class=\"table-wrap\"><table><thead><tr><th>组<\/th><th>根到叶的逻辑路径<\/th><th>route<\/th><th>记录数<\/th><th>CPU 权重<\/th><\/tr><\/thead><tbody><tr><td>A/parse<\/td><td>Root→Handle→Parse<\/td><td>A<\/td><td>12<\/td><td>120 ms<\/td><\/tr><tr><td>A/hash<\/td><td>Root→Handle→Encode→[Hash→HashRound]<\/td><td>A<\/td><td>8<\/td><td>80 ms<\/td><\/tr><tr><td>A/recurse<\/td><td>Root→Handle→Walk→Walk<\/td><td>A<\/td><td>6<\/td><td>60 ms<\/td><\/tr><tr><td>B/hash<\/td><td>Root→Batch→[Hash→HashRound]<\/td><td>B<\/td><td>10<\/td><td>100 ms<\/td><\/tr><tr><td>B/alloc<\/td><td>Root→Batch→Alloc<\/td><td>B<\/td><td>6<\/td><td>60 ms<\/td><\/tr><tr><td>A/encode<\/td><td>Root→Handle→Encode<\/td><td>A<\/td><td>6<\/td><td>60 ms<\/td><\/tr><\/tbody><\/table><\/div><p>A 共 32 份、320 ms；B 共 16 份、160 ms；总数 48、总权重 480 ms。还有数字标签 input_bytes，A 为 64 bytes、B 为 256 bytes，用于展示单位明确的上下文，不参与 CPU 总量换算。HashRound 和 Hash 共用一个地址且具有两条 Line，Walk 的位置 ID 在递归栈里出现两次。这样一个小文件同时覆盖分支、内联、递归、标签和值向量，避免靠巨大生产数据隐藏规则。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>生成器为 <code>research/pprof/make_teaching_profile.py<\/code>，只使用 Python 标准库手工编码 protobuf，便于逐字段对照协议。<code>teaching/manifest.json<\/code> 保存分组、每条记录、权重和文件 SHA-256；<code>verify_teaching.py<\/code> 调用真实 <code>go tool pprof<\/code>，不是把预期结果自己画成假终端输出。执行时关闭符号化，因为这些地址没有对应的真实 ELF；因此它验证的是格式解析、聚合和报告规则，不是实际程序的符号解析能力。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>基线查询的关键结果如下，绝对权重与手算完全相符：<\/p>\n\n<div class=\"table-wrap\"><table><thead><tr><th>节点<\/th><th>flat<\/th><th>cum<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>Root<\/td><td>0<\/td><td>480 ms<\/td><td>所有样本都经过根<\/td><\/tr><tr><td>Handle<\/td><td>0<\/td><td>320 ms<\/td><td>A 的四组路径<\/td><\/tr><tr><td>Batch<\/td><td>0<\/td><td>160 ms<\/td><td>B 的两组路径<\/td><\/tr><tr><td>HashRound<\/td><td>180 ms<\/td><td>180 ms<\/td><td>两条分支的内联叶子之和<\/td><\/tr><tr><td>Hash<\/td><td>0<\/td><td>180 ms<\/td><td>包含内联叶子的逻辑外层<\/td><\/tr><tr><td>Parse<\/td><td>120 ms<\/td><td>120 ms<\/td><td>十二份叶子权重<\/td><\/tr><tr><td>Encode<\/td><td>60 ms<\/td><td>140 ms<\/td><td>自身六份，加下游哈希八份<\/td><\/tr><tr><td>Walk<\/td><td>60 ms<\/td><td>60 ms<\/td><td>六份递归样本，每条只计一次 cum<\/td><\/tr><tr><td>Alloc<\/td><td>60 ms<\/td><td>60 ms<\/td><td>六份叶子权重<\/td><\/tr><\/tbody><\/table><\/div><p>可重放的最小入口如下，实际的十五条完整命令保存在 verification.json。命令默认在当前任务根目录执行；这只是验证入口，不替代前文的机制推导。<\/p>\n\n<div class=\"code-shell\"><div class=\"code-head\"><span>代码与命令<\/span><button type=\"button\" class=\"copy-btn\" data-action=\"copy-code\" aria-label=\"复制代码\">复制<\/button><\/div><pre><code>python3 research/pprof/make_teaching_profile.py\npython3 research/pprof/verify_teaching.py\ngo tool pprof -symbolize=none -top research/pprof/teaching/baseline.pprof\n<\/code><\/pre><\/div>\n\n<p>第一组反例是过滤。筛选 A 后，HashRound 为 80 ms，在全局分母下显示 16.67%；相对分母下显示 25%。focus=Handle 会删除 B 的完整样本，hide=Handle 则隐藏一个帧但保留 B 的 Batch 分支。可见“只看这个函数路径”和“把这个函数从图上拿掉”是不同操作，不能用其中一个替代另一个。对应输出为 route-a、route-a-relative、focus-handle、hide-handle 四组文本。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>第二组反例是位置身份。relocated 变体把 mapping 起点和所有指令地址增加 0x1000，同时给位置和函数 ID 增加 100，保持构建身份、相对位置、标签和权重不变。与基线合并后，pprof 报告总权重 960 ms，各函数权重恰好翻倍。这支持“在该合成输入条件下，重定位和局部 ID 不会错误拆分等价位置”的结论，但没有验证真实共享库搜索、Build ID 提取或缺失符号恢复。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>第三组反例是变化抵消。changed 变体六组事件权重依次改为 8、4、4、14、10、8，总体仍为 48 份。HashRound 的总量仍为 180 ms，但 A 的哈希从 80 降为 40 ms，B 的哈希从 100 升为 140 ms。Encode 的 flat 从 60 升到 80 ms，cum 却从 140 降到 120 ms，因为下游下降更多。只盯 flat、只盯 cum、只盯 HashRound 总量，都会遗漏一部分真实结构变化。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>该变体的 Parse 差值为 −40 ms，Alloc 为 +40 ms，Encode flat 为 +20 ms、cum 为 −20 ms，Walk 为 −20 ms；Handle cum 为 −80 ms，Batch cum 为 +80 ms。<code>diff.txt<\/code> 使用 480 ms 基线分母，<code>base.txt<\/code> 使用 200 ms 绝对变化分母。二者标题都可能写“Showing nodes accounting for 0”，但下方仍有正负节点：零是净和，不是没有变化。差分文件里 duration 变为 800 ms，也只是两个输入头部相加，不是新的真实采集窗口。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>最后，double-volume 变体把六组权重全部加倍，使用六条聚合 Sample 表示 96 份事件。未经归一化时它有 960 ms；以基线为 diff_base 并归一化后，所有函数净变化为零，但报告仍保留 480 ms 的基线分母。三个变体各六条消息，连同基线共 66 条 protobuf Sample 消息，方便完整检查。“六条消息”与“九十六份事件权重”的差别正好再次证明 Sample 不等于原始事件。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>读者应能完成三项检验：交换同一文件中 Sample 的排列，判断报告为何基本不变；把一条已聚合记录拆成多个相同键的小记录，判断守恒的是哪些值；增加一个新标签，使部分相同栈不再合并，再说明总量为何仍应守恒。进一步的研究问题则是：这种不变性在哪些环节失效，例如整数缩放取整、采样率变化、丢样、缺少构建身份或不同总体被错误混合。提出这些条件，比记住更多命令更接近可靠的性能研究。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/profile.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"粒度聚合与整数量化\">[pp-scale]<\/a><\/p>\n\n<p>本轮验证结果是十五种查询成功、十四项语义断言通过，原始标准输出、标准错误和版本记录均保留。未运行真实 CPU 信号压力实验、heap 随机采样收敛实验或生产负载，教学 CLI 也未使用所读 google/pprof 提交构建；独立边界验证仅编译执行该提交的 profile 子包；这些方面仍属于源码解释和理想模型。由此得到的是一条可复核的解释链：知道记录如何产生、哪些转换保持权重、哪些操作损失信息，最终才能把一个热点转化为有条件、可反驳的性能结论。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"pprof 中一个函数的 cum 很大、flat 很小，最稳妥的理解是什么？","options":["它承载许多下游权重，但自身作为可见叶节点的权重较小。","这个函数调用次数一定最多。","它的一次调用恰好持续 cum 显示的时间。","它一定就是应当首先优化的根因。"],"answer":0,"explanation":"flat 归于可见叶节点，cum 包含经过该节点的样本权重。它们依赖所选维度、粒度和过滤条件；不能直接推导调用次数、单次持续时间或因果根因。"}],"exercises":[],"references":["pp-scope","pp-proto","pp-cpu-api","pp-cpu-runtime","pp-cpu-linux","pp-sigprof","pp-buffer","pp-cpu-builder","pp-heap-poisson","pp-heap-coverage","pp-profile-kinds","pp-heap-scale","pp-mprof","pp-sema","pp-goroutine","pp-labels","pp-label-support","pp-pc","pp-symbolizer","pp-binutils","pp-merge","pp-filter","pp-scale","pp-diff","pp-denominator","pp-total","pp-percent","pp-graph","pp-flame","pp-teaching","pp-scale-repro"],"part":"advanced","source_path":"research/pprof.md"},{"id":"20","title":"Perfetto：从共享内存采集到可解释的时序查询","subtitle":"理解数据保留、增量状态、时钟与查询之间的关系。","objectives":["解释 producer、共享内存与中央缓冲区的所有权协议","追踪增量编码、时钟转换与 Trace Processor 的导入路径","按窗口裁剪调度区间并核对格式兼容性与丢数"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"测量契约：Perfetto 能保留什么，不能凭空得到什么","body":"本章固定研究 Perfetto **v58.2**，提交 `add693d8b338ba9599dbcbc3e300b1ab8c000897`，查证日期为 2026-10-04。源码位置均对应该提交；运行验证使用同版本官方 Linux amd64 Trace Processor。Go 格式与转换链路的源码分析固定在 Go 1.25.0，实际原生 trace 负例由本机 Go 1.22.12 生成。版本、教学构造与真实执行分别记录，避免把兼容性判断推广到所有历史或未来版本。[[pf-release]](#src-pf-release)[[pf-go-main]](#src-pf-go-main)[[pf-validation]](#src-pf-validation)\n\nPerfetto 是由采集协议、数据源、服务、文件格式、Trace Processor 和界面组成的系统。只打开界面并不意味着已经采集了调度事件；成功读取一个文件也不意味着文件里存在所需的因果证据。学习时应首先确定观察对象、事件来源、时间域、身份、完整性和归因规则，然后才选择图表。其核心价值是把多个来源的事件放到可查询的时间关系中，而不是把任何性能文件自动变成“根因”。[[pf-service]](#src-pf-service)[[pf-architecture]](#src-pf-architecture)\n\nLinux perf、pprof 与 Perfetto 所处的层次有交集。Linux perf 通常接入内核性能事件机制，处理计数、采样或跟踪；pprof 主要分析带栈、标签和类型的聚合权重；Perfetto 擅长接入多种时序数据并进行关联分析。Perfetto v58.2 的内置导入器确实包括 perf.data 和 pprof，但“支持输入格式”不等于“重新获得生产者没有记录的事实”。同一套界面可以显示聚合调用栈与线程时间线，这两者的证据强度仍不同。[[pf-importers]](#src-pf-importers)[[pf-pprof]](#src-pf-pprof)\n\n设一个请求起止为 $[a,b)$，墙钟延迟为 $W=b-a$。若已经知道各线程哪些执行区间属于该请求，则总 CPU 成本为这些区间长度的和 $C$。多核并行时可以有 $C>W$；某个请求长时间等待时也可以有 $C\\ll W$。CPU 成本回答资源消费，墙钟延迟回答完成时间，关键路径回答哪些前后依赖限制完成。这三个问题不能通过换一种可视化布局互相替代。\n\n本章贯穿案例使用合成的、符合 ftrace 文本格式的 `sched_switch`、`sched_waking` 与 `tracing_mark_write` 事件，再交给官方程序真实解析。请求从 0 到 20 ms；主线程运行 0—4 和 16—20 ms，4—6 ms 可运行但未获调度，6—16 ms 睡眠；工作线程在另一 CPU 上运行 1—16 ms。因此主线程 CPU 为 8 ms、工作线程为 15 ms、请求总 CPU 为 23 ms。这个值与 20 ms 墙钟时间没有矛盾。[[pf-request]](#src-pf-request)\n\n此例中的线程归属是教学模型显式给定的。真实线程池可同时处理多个请求，不能把“请求期间所有工作线程的 CPU”全部算给这个请求；OS 线程也可能运行多个 Go goroutine。应用阶段、请求标识与调度事实之间必须有可解释的连接。后文将通过区间相交查询计算已归属阶段的成本，而不会把时间重叠当作自动归因。\n\n把关键路径形式化，可以将已证实的阶段与依赖构成有向无环图，节点权重是该阶段持续时间，完成时间受最长依赖链约束。并行分支的资源成本相加，汇合点的完成时间则取受依赖约束的最晚完成者。若依赖边遗漏，计算出的最长路径只是已有证据下的结果，不能声称覆盖真实请求。时间先后是必要线索，仍不能单独证明因果关系。","html":"\n<p>本章固定研究 Perfetto <strong>v58.2<\/strong>，提交 <code>add693d8b338ba9599dbcbc3e300b1ab8c000897<\/code>，查证日期为 2026-10-04。源码位置均对应该提交；运行验证使用同版本官方 Linux amd64 Trace Processor。Go 格式与转换链路的源码分析固定在 Go 1.25.0，实际原生 trace 负例由本机 Go 1.22.12 生成。版本、教学构造与真实执行分别记录，避免把兼容性判断推广到所有历史或未来版本。<a class=\"cite\" href=\"https://github.com/google/perfetto/releases/tag/v58.2\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Perfetto v58.2 release 与固定提交\">[pf-release]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/cmd/trace/main.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"go tool trace命令模式\">[pf-go-main]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n\n<p>Perfetto 是由采集协议、数据源、服务、文件格式、Trace Processor 和界面组成的系统。只打开界面并不意味着已经采集了调度事件；成功读取一个文件也不意味着文件里存在所需的因果证据。学习时应首先确定观察对象、事件来源、时间域、身份、完整性和归因规则，然后才选择图表。其核心价值是把多个来源的事件放到可查询的时间关系中，而不是把任何性能文件自动变成“根因”。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/design-docs/trace-processor-architecture.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Trace Processor总体架构\">[pf-architecture]<\/a><\/p>\n\n<p>Linux perf、pprof 与 Perfetto 所处的层次有交集。Linux perf 通常接入内核性能事件机制，处理计数、采样或跟踪；pprof 主要分析带栈、标签和类型的聚合权重；Perfetto 擅长接入多种时序数据并进行关联分析。Perfetto v58.2 的内置导入器确实包括 perf.data 和 pprof，但“支持输入格式”不等于“重新获得生产者没有记录的事实”。同一套界面可以显示聚合调用栈与线程时间线，这两者的证据强度仍不同。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/builtin_trace_importers.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"内置导入器工厂清单\">[pf-importers]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><\/p>\n\n<p>设一个请求起止为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，墙钟延迟为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>W<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math>。若已经知道各线程哪些执行区间属于该请求，则总 CPU 成本为这些区间长度的和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。多核并行时可以有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003E;<\/mo><mi>W<\/mi><\/mrow><\/math>；某个请求长时间等待时也可以有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0226A;<\/mo><mi>W<\/mi><\/mrow><\/math>。CPU 成本回答资源消费，墙钟延迟回答完成时间，关键路径回答哪些前后依赖限制完成。这三个问题不能通过换一种可视化布局互相替代。<\/p>\n\n<p>本章贯穿案例使用合成的、符合 ftrace 文本格式的 <code>sched_switch<\/code>、<code>sched_waking<\/code> 与 <code>tracing_mark_write<\/code> 事件，再交给官方程序真实解析。请求从 0 到 20 ms；主线程运行 0—4 和 16—20 ms，4—6 ms 可运行但未获调度，6—16 ms 睡眠；工作线程在另一 CPU 上运行 1—16 ms。因此主线程 CPU 为 8 ms、工作线程为 15 ms、请求总 CPU 为 23 ms。这个值与 20 ms 墙钟时间没有矛盾。<a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n<p>此例中的线程归属是教学模型显式给定的。真实线程池可同时处理多个请求，不能把“请求期间所有工作线程的 CPU”全部算给这个请求；OS 线程也可能运行多个 Go goroutine。应用阶段、请求标识与调度事实之间必须有可解释的连接。后文将通过区间相交查询计算已归属阶段的成本，而不会把时间重叠当作自动归因。<\/p>\n\n<p>把关键路径形式化，可以将已证实的阶段与依赖构成有向无环图，节点权重是该阶段持续时间，完成时间受最长依赖链约束。并行分支的资源成本相加，汇合点的完成时间则取受依赖约束的最晚完成者。若依赖边遗漏，计算出的最长路径只是已有证据下的结果，不能声称覆盖真实请求。时间先后是必要线索，仍不能单独证明因果关系。<\/p>\n\n","advanced":true},{"title":"Producer、service 与 consumer：把热路径和会话控制分开","body":"Producer 注册数据源并生成事件；consumer 配置与控制采集会话、读取数据；tracing service 居中管理连接、数据源生命周期、会话与中央缓冲区。一个 producer 通常对应一个进程，但同一进程可以有多个独立 producer；每个 producer 有自己的共享内存缓冲区 SMB，由它与 service 共享，同一 producer 内的数据源共同使用它。不能画成所有进程任意访问同一块可写内存。[[pf-service]](#src-pf-service)\n\n典型 Unix 连接把控制面和数据面分开。启停、注册、配置、提交通知等走 IPC；事件序列化主要直接写入 SMB，避免每条事件都进行一次普通消息往返。service 收到 commit 后将完成的 chunk 拷入其私有中央缓冲区。这里减少的是 producer 侧的额外临时序列化与消息拷贝，**不是端到端零拷贝**。使用不支持共享内存的远程传输时，协议允许在 commit 中直接携带 chunk 字节；那是另一条数据路径。[[pf-service]](#src-pf-service)[[pf-commit]](#src-pf-commit)\n\n这种边界首先是所有权与可信度的安排。应用 producer 可能退出、迟迟不交付，甚至给出非法标识和长度；service 不能把共享内存的内容天然当作可信。`CopyChunkUntrusted` 路径检查提交者可写入的目标缓冲区，并在中央记录中保留由服务侧确定的 producer 身份。数据里的一个数值 ID 不是访问其他会话缓冲区的授权凭证。私有中央存储也使服务能在 producer 回收 SMB 后继续保存数据。[[pf-service-impl]](#src-pf-service-impl)[[pf-buffer-v1]](#src-pf-buffer-v1)\n\n一次正常会话可以理解为：consumer 给出配置；service 找到匹配 producer 的数据源并下发设置；producer 创建写入器并生成数据；服务收取 chunk；consumer 停止、等待有关完成通知并读取结果。实际实现还涉及延迟启动、并发会话、超时、断连以及退出前 scraping，不能假定所有应用在开始与结束时刻同时停下。诊断结论需要检查真正覆盖的时间边界，而非只相信请求采集的时长。[[pf-service]](#src-pf-service)[[pf-service-impl]](#src-pf-service-impl)\n\n读取中央缓冲区通常会推进读游标，不是对同一状态进行无限次幂等查询。后续 SQL 查询针对的是 Trace Processor 已导入的数据，与 consumer 对服务缓冲区的消费操作属于两层。前者可反复运行；后者会影响后续保留、读出与缺口行为。这一区别尤其影响长期流式写文件时的容量计算。[[pf-buffer-v1]](#src-pf-buffer-v1)","html":"<figure class=\"advanced-figure\" id=\"fig-pf-service\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-service-title pf-service-desc\"><title id=\"pf-service-title\">Perfetto 的生产者、服务与消费者<\/title><desc id=\"pf-service-desc\">Producer 通过共享内存提交数据；service 管理会话缓冲；consumer 配置和读取。共享内存减少传输开销，不代表全链路零拷贝。<\/desc><defs><marker id=\"pf-service-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Producer / DataSource<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">TraceWriter / 共享内存<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-service-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Tracing service<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">会话缓冲 / 提交协议<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-service-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Consumer<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">配置 / 读取 / 保存<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">写入、commit、flush、stop 是不同阶段<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">缓冲策略决定覆盖旧数据还是丢弃新数据等行为<\/text>\n<\/svg><figcaption><strong>Perfetto 的生产者、服务与消费者。<\/strong> Producer 通过共享内存提交数据；service 管理会话缓冲；consumer 配置和读取。共享内存减少传输开销，不代表全链路零拷贝。 <a class=\"figure-open\" href=\"figures/pf-service.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>Producer 注册数据源并生成事件；consumer 配置与控制采集会话、读取数据；tracing service 居中管理连接、数据源生命周期、会话与中央缓冲区。一个 producer 通常对应一个进程，但同一进程可以有多个独立 producer；每个 producer 有自己的共享内存缓冲区 SMB，由它与 service 共享，同一 producer 内的数据源共同使用它。不能画成所有进程任意访问同一块可写内存。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><\/p>\n\n<p>典型 Unix 连接把控制面和数据面分开。启停、注册、配置、提交通知等走 IPC；事件序列化主要直接写入 SMB，避免每条事件都进行一次普通消息往返。service 收到 commit 后将完成的 chunk 拷入其私有中央缓冲区。这里减少的是 producer 侧的额外临时序列化与消息拷贝，<strong>不是端到端零拷贝<\/strong>。使用不支持共享内存的远程传输时，协议允许在 commit 中直接携带 chunk 字节；那是另一条数据路径。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/common/commit_data_request.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CommitDataRequest 协议\">[pf-commit]<\/a><\/p>\n\n<p>这种边界首先是所有权与可信度的安排。应用 producer 可能退出、迟迟不交付，甚至给出非法标识和长度；service 不能把共享内存的内容天然当作可信。<code>CopyChunkUntrusted<\/code> 路径检查提交者可写入的目标缓冲区，并在中央记录中保留由服务侧确定的 producer 身份。数据里的一个数值 ID 不是访问其他会话缓冲区的授权凭证。私有中央存储也使服务能在 producer 回收 SMB 后继续保存数据。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/tracing_service_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Service 的信任边界、flush 与 scraping\">[pf-service-impl]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><\/p>\n\n<p>一次正常会话可以理解为：consumer 给出配置；service 找到匹配 producer 的数据源并下发设置；producer 创建写入器并生成数据；服务收取 chunk；consumer 停止、等待有关完成通知并读取结果。实际实现还涉及延迟启动、并发会话、超时、断连以及退出前 scraping，不能假定所有应用在开始与结束时刻同时停下。诊断结论需要检查真正覆盖的时间边界，而非只相信请求采集的时长。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/tracing_service_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Service 的信任边界、flush 与 scraping\">[pf-service-impl]<\/a><\/p>\n\n<p>读取中央缓冲区通常会推进读游标，不是对同一状态进行无限次幂等查询。后续 SQL 查询针对的是 Trace Processor 已导入的数据，与 consumer 对服务缓冲区的消费操作属于两层。前者可反复运行；后者会影响后续保留、读出与缺口行为。这一区别尤其影响长期流式写文件时的容量计算。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><\/p>\n\n","advanced":true},{"title":"共享内存协议：页、chunk、分片与延迟补丁","body":"SMB 是生产者到服务之间的**暂存区**，不是整份 trace 的保留区。其页尺寸在 producer 连接期间固定，要求为 4 KiB 的倍数并有上限；页可按有限方案分成若干 chunk，ABI 最多支持每页 14 个 chunk。页头描述布局与 chunk 状态，chunk 头携带 writer、序号、分片等信息。不能把这里的页直接等同于操作系统缺页单位，也不能任意选择每页一百个小 chunk。[[pf-shmem]](#src-pf-shmem)\n\n一个 chunk 正常由单个 writer 独占写入，常对应一条线程本地事件流。writer 在已取得的 chunk 内前移写指针，像 arena 一样追加数据；用完后申请下一个 chunk，才需要进入生产者内部的协调路径。这个设计使常见写入避免每条事件争用全局锁，但并不意味着整个 SDK、IPC 或分配路径完全无锁。[[pf-shmem]](#src-pf-shmem)[[pf-arbiter]](#src-pf-arbiter)[[pf-writer]](#src-pf-writer)\n\n完成 chunk 的典型状态转移是 `Free → BeingWritten → Complete → BeingRead → Free`。writer 取得空闲所有权后写字节，发布完成状态；service 取得可读所有权并拷贝，随后释放。状态发布与获取承载跨线程、跨进程的可见性要求，不能只把它当作几个普通布尔字段。共享内存模拟不采用完全相同的 BeingRead 路径；某些补丁优化还会延长 BeingWritten 状态，因此该图表示正常交付的主路径，不是穷尽所有内部转移。[[pf-shmem]](#src-pf-shmem)[[pf-arbiter]](#src-pf-arbiter)\n\nTracePacket 与 chunk 没有一一对应关系。一个 chunk 可以包含多个小 packet，一个大 packet 也能跨多个 chunk，甚至在服务持续搬运且策略允许时大于整个 SMB。读取端必须收齐 packet 的有关片段才可交付；“已写出一个 chunk”不等于“已经获得一个独立可解析的事件”。这也解释了为什么丢失少量字节可能让比它更大的逻辑记录失效。[[pf-buffer-v1]](#src-pf-buffer-v1)[[pf-writer]](#src-pf-writer)\n\nProtobuf 的长度字段造成一个微妙问题：开始写嵌套消息时还不知道最终长度，结束时才能回填。如果嵌套消息跨 chunk，前一个 chunk 可能已经交给 service，甚至其 SMB 位置已被复用。Perfetto 的 writer 为长度预留 varint 空间，记录补丁位置；安全时在本地直接补齐，否则通过 out-of-band patch 修改中央缓冲区中对应 chunk 的预留字节。这是序列化完整性协议，不是允许应用随意修改历史事件含义。[[pf-writer]](#src-pf-writer)[[pf-commit]](#src-pf-commit)\n\n`CommitDataRequest` 的 `chunks_to_move` 用页号、chunk 号和目标缓冲区定位待搬运数据；`chunks_to_patch` 用 writer ID、chunk ID、偏移和新字节定位补丁。服务先处理 move，再处理 patch，因此同一次消息可包含同一个 chunk 的交付与回填。`has_more_patches` 表示是否仍有补丁待到达；未满足完整条件的 chunk 不能因“看上去已有字节”就被读成最终 packet。目标缓冲区、writer 与 chunk 的身份必须同时正确。[[pf-commit]](#src-pf-commit)[[pf-service-impl]](#src-pf-service-impl)\n\n设 packet 的外层长度字段位于 chunk 41，后续内容延伸到 chunk 42。写完 41 时只能交付第一段并标记待补；写完 42 后知道总长度，把补丁发往 41，再允许组装读取。若中央 ring 已覆盖 41，补丁不能复活丢失内容；系统必须保留缺口或丢弃不完整 packet。此例说明 commit 是缓冲区交接，patch 是完成编码，二者都不是应用事务提交。[[pf-buffer-v1]](#src-pf-buffer-v1)[[pf-commit]](#src-pf-commit)\n\nSMB 满时，writer 需要在数据损失和应用扰动之间选择。v58.2 包含 `kDrop`、`kStall` 和 `kStallThenDrop`：丢弃让应用继续但留下观测缺口；等待可降低瞬时损失却把诊断系统的拥塞传递给应用；先等后丢是折中。还必须区分等待策略的失败边界：这一固定实现的 stall 计数阈值为 300；持续耗尽达到阈值时，`kStall` 进入 `PERFETTO_FATAL`，而 `kStallThenDrop` 返回无效 Chunk。因此 `kStall` 不承诺无限等待，应用扰动也不只限于延迟增加。该阈值是此版本的实现细节，不能当作稳定 API 或固定超时时间。源码特别处理等待时推进 pending commit 的问题，因为服务和 producer 的 IPC 线程若不能获得进展，简单循环等待空块并不安全。不能把“无丢失模式”当作没有代价的配置。[[pf-arbiter]](#src-pf-arbiter)","html":"<figure class=\"advanced-figure\" id=\"fig-pf-chunk\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-chunk-title pf-chunk-desc\"><title id=\"pf-chunk-title\">chunk 的正常交接状态<\/title><desc id=\"pf-chunk-desc\">典型路径是 Free → BeingWritten → Complete → BeingRead → Free。packet 可跨 chunk，长度补丁还可能延后完成；图未列出全部例外路径。<\/desc><defs><marker id=\"pf-chunk-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><pa
