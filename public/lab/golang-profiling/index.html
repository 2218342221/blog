th d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"30\" y=\"90\" width=\"204\" height=\"90\" rx=\"13\" fill=\"#637386\" fill-opacity=\".075\" stroke=\"#637386\" stroke-width=\"2\"/>\n<text x=\"132.0\" y=\"135.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Free<\/text>\n<line x1=\"238\" y1=\"135\" x2=\"258\" y2=\"135\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-chunk-arrow)\"/>\n<rect x=\"262\" y=\"90\" width=\"204\" height=\"90\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"364.0\" y=\"135.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">BeingWritten<\/text>\n<line x1=\"470\" y1=\"135\" x2=\"490\" y2=\"135\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-chunk-arrow)\"/>\n<rect x=\"494\" y=\"90\" width=\"204\" height=\"90\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"596.0\" y=\"135.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Complete<\/text>\n<line x1=\"702\" y1=\"135\" x2=\"722\" y2=\"135\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-chunk-arrow)\"/>\n<rect x=\"726\" y=\"90\" width=\"204\" height=\"90\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"828.0\" y=\"135.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">BeingRead<\/text>\n<line x1=\"828\" y1=\"186\" x2=\"828\" y2=\"230\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<line x1=\"828\" y1=\"230\" x2=\"132\" y2=\"230\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<line x1=\"132\" y1=\"230\" x2=\"132\" y2=\"186\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-chunk-arrow)\"/>\n<text x=\"480\" y=\"282\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">writer 写入与发布；service 拷贝后释放所有权<\/text>\n<\/svg><figcaption><strong>chunk 的正常交接状态。<\/strong> 典型路径是 Free → BeingWritten → Complete → BeingRead → Free。packet 可跨 chunk，长度补丁还可能延后完成；图未列出全部例外路径。 <a class=\"figure-open\" href=\"figures/pf-chunk.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>SMB 是生产者到服务之间的<strong>暂存区<\/strong>，不是整份 trace 的保留区。其页尺寸在 producer 连接期间固定，要求为 4 KiB 的倍数并有上限；页可按有限方案分成若干 chunk，ABI 最多支持每页 14 个 chunk。页头描述布局与 chunk 状态，chunk 头携带 writer、序号、分片等信息。不能把这里的页直接等同于操作系统缺页单位，也不能任意选择每页一百个小 chunk。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/include/perfetto/ext/tracing/core/shared_memory_abi.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"共享内存ABI、页面布局与chunk状态\">[pf-shmem]<\/a><\/p>\n\n<p>一个 chunk 正常由单个 writer 独占写入，常对应一条线程本地事件流。writer 在已取得的 chunk 内前移写指针，像 arena 一样追加数据；用完后申请下一个 chunk，才需要进入生产者内部的协调路径。这个设计使常见写入避免每条事件争用全局锁，但并不意味着整个 SDK、IPC 或分配路径完全无锁。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/include/perfetto/ext/tracing/core/shared_memory_abi.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"共享内存ABI、页面布局与chunk状态\">[pf-shmem]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/shared_memory_arbiter_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SMB仲裁、回压策略与commit推进\">[pf-arbiter]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/trace_writer_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceWriter 分片序列化与延迟长度回填\">[pf-writer]<\/a><\/p>\n\n<p>完成 chunk 的典型状态转移是 <code>Free → BeingWritten → Complete → BeingRead → Free<\/code>。writer 取得空闲所有权后写字节，发布完成状态；service 取得可读所有权并拷贝，随后释放。状态发布与获取承载跨线程、跨进程的可见性要求，不能只把它当作几个普通布尔字段。共享内存模拟不采用完全相同的 BeingRead 路径；某些补丁优化还会延长 BeingWritten 状态，因此该图表示正常交付的主路径，不是穷尽所有内部转移。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/include/perfetto/ext/tracing/core/shared_memory_abi.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"共享内存ABI、页面布局与chunk状态\">[pf-shmem]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/shared_memory_arbiter_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SMB仲裁、回压策略与commit推进\">[pf-arbiter]<\/a><\/p>\n\n<p>TracePacket 与 chunk 没有一一对应关系。一个 chunk 可以包含多个小 packet，一个大 packet 也能跨多个 chunk，甚至在服务持续搬运且策略允许时大于整个 SMB。读取端必须收齐 packet 的有关片段才可交付；“已写出一个 chunk”不等于“已经获得一个独立可解析的事件”。这也解释了为什么丢失少量字节可能让比它更大的逻辑记录失效。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/trace_writer_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceWriter 分片序列化与延迟长度回填\">[pf-writer]<\/a><\/p>\n\n<p>Protobuf 的长度字段造成一个微妙问题：开始写嵌套消息时还不知道最终长度，结束时才能回填。如果嵌套消息跨 chunk，前一个 chunk 可能已经交给 service，甚至其 SMB 位置已被复用。Perfetto 的 writer 为长度预留 varint 空间，记录补丁位置；安全时在本地直接补齐，否则通过 out-of-band patch 修改中央缓冲区中对应 chunk 的预留字节。这是序列化完整性协议，不是允许应用随意修改历史事件含义。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/trace_writer_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceWriter 分片序列化与延迟长度回填\">[pf-writer]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/common/commit_data_request.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CommitDataRequest 协议\">[pf-commit]<\/a><\/p>\n\n<p><code>CommitDataRequest<\/code> 的 <code>chunks_to_move<\/code> 用页号、chunk 号和目标缓冲区定位待搬运数据；<code>chunks_to_patch<\/code> 用 writer ID、chunk ID、偏移和新字节定位补丁。服务先处理 move，再处理 patch，因此同一次消息可包含同一个 chunk 的交付与回填。<code>has_more_patches<\/code> 表示是否仍有补丁待到达；未满足完整条件的 chunk 不能因“看上去已有字节”就被读成最终 packet。目标缓冲区、writer 与 chunk 的身份必须同时正确。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/common/commit_data_request.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CommitDataRequest 协议\">[pf-commit]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/tracing_service_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Service 的信任边界、flush 与 scraping\">[pf-service-impl]<\/a><\/p>\n\n<p>设 packet 的外层长度字段位于 chunk 41，后续内容延伸到 chunk 42。写完 41 时只能交付第一段并标记待补；写完 42 后知道总长度，把补丁发往 41，再允许组装读取。若中央 ring 已覆盖 41，补丁不能复活丢失内容；系统必须保留缺口或丢弃不完整 packet。此例说明 commit 是缓冲区交接，patch 是完成编码，二者都不是应用事务提交。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/common/commit_data_request.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CommitDataRequest 协议\">[pf-commit]<\/a><\/p>\n\n<p>SMB 满时，writer 需要在数据损失和应用扰动之间选择。v58.2 包含 <code>kDrop<\/code>、<code>kStall<\/code> 和 <code>kStallThenDrop<\/code>：丢弃让应用继续但留下观测缺口；等待可降低瞬时损失却把诊断系统的拥塞传递给应用；先等后丢是折中。还必须区分等待策略的失败边界：这一固定实现的 stall 计数阈值为 300；持续耗尽达到阈值时，<code>kStall<\/code> 进入 <code>PERFETTO_FATAL<\/code>，而 <code>kStallThenDrop<\/code> 返回无效 Chunk。因此 <code>kStall<\/code> 不承诺无限等待，应用扰动也不只限于延迟增加。该阈值是此版本的实现细节，不能当作稳定 API 或固定超时时间。源码特别处理等待时推进 pending commit 的问题，因为服务和 producer 的 IPC 线程若不能获得进展，简单循环等待空块并不安全。不能把“无丢失模式”当作没有代价的配置。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/core/shared_memory_arbiter_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SMB仲裁、回压策略与commit推进\">[pf-arbiter]<\/a><\/p>\n\n","advanced":true},{"title":"中央缓冲区、配置与三层数据损失","body":"v58.2 默认使用 TraceBufferV1；V2 是需显式选择的实验模式。本章依据 V1 分析中央缓冲区，不能把 V2 的新标志或恢复行为泛化到所有采集。V1 拷贝 chunk payload，重新打包带可信 producer 身份的头部，以 16 字节对齐存放，并用 `(ProducerID, WriterID, ChunkID)` 建立索引。这些额外结构会占空间，所以文件或缓冲区容量不能全部视为事件有效负载。[[pf-config]](#src-pf-config)[[pf-buffer-v1]](#src-pf-buffer-v1)\n\n`RING_BUFFER` 保留较新的数据：写指针追上未读区时按完整 chunk 覆盖旧内容。`DISCARD` 保留较早的未读数据，空间不足后拒绝新写入。V1 还有容易漏掉的细节：一旦第一次 discard 打断序列，后续写入会持续成为 no-op，即使读者后来追上也不自动恢复为普通可写状态。这不是一个“读快一点就自然恢复”的通用有界队列。[[pf-buffer-v1]](#src-pf-buffer-v1)\n\n中央存储按实际 commit 次序放置 chunk，不保证来自不同 writer 的全局时间顺序。读取时会按各 writer 的 chunk 序号重组 packet、检查碎片与缺口，保证单序列次序；跨 writer 的事件时间排序留给后续处理。某条序列有 1、2、5、6 时，缺口可阻止读者直接把后缀当作连续记录；旧前缀被读走或覆盖后，可读性也会变化。因此“缓冲区里还存在字节”和“现在能输出完整 packet”不是同一个问题。[[pf-buffer-v1]](#src-pf-buffer-v1)\n\n配置应由问题反推。研究尾部卡顿倾向 ring；必须观察启动过程时可能选择 discard；高频调度与低频应用事件可分到不同中央缓冲区，避免前者冲掉后者。下面只展示缓冲区与增量状态政策，实际数据源仍须在相应平台注册并接收配置：\n\n```text\nbuffers { size_kb: 16384 fill_policy: RING_BUFFER }\nbuffers { size_kb: 4096  fill_policy: DISCARD }\nduration_ms: 20000\nincremental_state_config { clear_period_ms: 1000 }\n```\n\n数据源通过 `target_buffer` 或受支持的名称引用选择目的地。周期性增量清理只通知声明支持该能力的数据源，不能强迫任意 producer 重新发送所有历史状态。中央缓冲区大小也不是 producer SMB 大小，调整前者不能直接修复后者的瞬时拥塞。[[pf-config]](#src-pf-config)\n\n第一层损失发生在内核各 CPU 的 ftrace buffer：探针产生事件后，用户态 `traced_probes` 来不及读取就可能覆盖。第二层发生在 producer SMB：服务调度延迟或突发写入超过暂存能力。第三层发生在中央缓冲区及其流式落盘过程：容量和读取频率不足，旧内容被覆盖或新内容被拒绝。三层处于不同位置，增大最后一层并不能追回第一层已丢失的 `sched_switch`。[[pf-buffers]](#src-pf-buffers)\n\n容量估算要同时看平均速率、峰值和最长不可服务时间。中央 16 MiB、平均 2 MiB/s 时，粗略保留窗口为 $16/2=8$ s，尚未扣除头部、填充与速率波动。若每 5 s 才排空一次，理论产生量为 10 MiB，实际预算还需余量。SMB 峰值 8 MiB/s、服务暂停 10 ms 时，需要约 $8\\times0.010=0.08$ MiB，即 81.92 KiB 的暂存余量；计算应使用峰值而不是全天平均。[[pf-buffers]](#src-pf-buffers)\n\n反例更能揭示风险：每 10 s 突发写入 2 MiB，平均仅 0.2 MiB/s，但 256 KiB SMB 只有单次突发的八分之一。若突发足够快、服务无法同步排空，仍会溢出。这里 256 KiB 是教学假设，不宣称是所有 SDK、后端或版本的默认值。不同官方文档对默认 SMB 的描述有差异，工程配置应读取实际连接参数，而不从一个文档段落猜测。[[pf-buffers]](#src-pf-buffers)[[pf-service]](#src-pf-service)\n\n导入后应查询 `stats`。先检查 `severity='data_loss' AND value!=0`，再单独关注 `ftrace_cpu_overrun_end`、`traced_buf_trace_writer_packet_loss`、`traced_buf_chunks_overwritten`、`traced_buf_chunks_discarded` 和增量状态失效统计。仅过滤 data_loss 并不充分：官方文档示例中的 chunks_discarded 为 info，而 ring 覆盖即使符合既定政策，也可能缩短所需分析窗口。统计字段还是计数、字节数或每 CPU 指标，也应分别解释，不能把不同单位相加成“总丢失率”。[[pf-buffers]](#src-pf-buffers)[[pf-reader]](#src-pf-reader)\n\nFlush 要求有关 producer 推进待提交数据并回报完成状态；它不是让所有应用在同一时刻冻结，也不是磁盘 fsync 的持久化承诺。超时、producer 退出后的 scraping 可以改善尾部可见性，却无法制造未记录的事件。最后应同时核对请求的配置、服务确认、Trace Processor 统计以及分析窗口是否闭合。[[pf-service-impl]](#src-pf-service-impl)","html":"<figure class=\"advanced-figure\" id=\"fig-pf-retention\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-retention-title pf-retention-desc\"><title id=\"pf-retention-title\">相同容量，两种保留政策<\/title><desc id=\"pf-retention-desc\">容量假设为四个等宽块，输入为1至6。示意块不是实际packet；真实可读窗口还依赖分片完整性与增量状态。<\/desc><defs><marker id=\"pf-retention-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<text x=\"160\" y=\"100\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"end\" dominant-baseline=\"middle\">RING_BUFFER<\/text>\n<text x=\"160\" y=\"215\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"end\" dominant-baseline=\"middle\">DISCARD<\/text>\n<rect x=\"205\" y=\"60\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"282.5\" y=\"100.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">3<\/text>\n<rect x=\"205\" y=\"175\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"282.5\" y=\"215.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">1<\/text>\n<rect x=\"380\" y=\"60\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"457.5\" y=\"100.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">4<\/text>\n<rect x=\"380\" y=\"175\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"457.5\" y=\"215.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">2<\/text>\n<rect x=\"555\" y=\"60\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"632.5\" y=\"100.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">5<\/text>\n<rect x=\"555\" y=\"175\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"632.5\" y=\"215.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">3<\/text>\n<rect x=\"730\" y=\"60\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"807.5\" y=\"100.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">6<\/text>\n<rect x=\"730\" y=\"175\" width=\"155\" height=\"80\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"807.5\" y=\"215.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">4<\/text>\n<text x=\"480\" y=\"302\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">保留较新数据                         保留较早的未读数据<\/text>\n<\/svg><figcaption><strong>相同容量，两种保留政策。<\/strong> 容量假设为四个等宽块，输入为1至6。示意块不是实际packet；真实可读窗口还依赖分片完整性与增量状态。 <a class=\"figure-open\" href=\"figures/pf-retention.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>v58.2 默认使用 TraceBufferV1；V2 是需显式选择的实验模式。本章依据 V1 分析中央缓冲区，不能把 V2 的新标志或恢复行为泛化到所有采集。V1 拷贝 chunk payload，重新打包带可信 producer 身份的头部，以 16 字节对齐存放，并用 <code>(ProducerID, WriterID, ChunkID)<\/code> 建立索引。这些额外结构会占空间，所以文件或缓冲区容量不能全部视为事件有效负载。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/config/trace_config.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceConfig缓冲政策、默认V1和增量清理\">[pf-config]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><\/p>\n\n<p><code>RING_BUFFER<\/code> 保留较新的数据：写指针追上未读区时按完整 chunk 覆盖旧内容。<code>DISCARD<\/code> 保留较早的未读数据，空间不足后拒绝新写入。V1 还有容易漏掉的细节：一旦第一次 discard 打断序列，后续写入会持续成为 no-op，即使读者后来追上也不自动恢复为普通可写状态。这不是一个“读快一点就自然恢复”的通用有界队列。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><\/p>\n\n<p>中央存储按实际 commit 次序放置 chunk，不保证来自不同 writer 的全局时间顺序。读取时会按各 writer 的 chunk 序号重组 packet、检查碎片与缺口，保证单序列次序；跨 writer 的事件时间排序留给后续处理。某条序列有 1、2、5、6 时，缺口可阻止读者直接把后缀当作连续记录；旧前缀被读走或覆盖后，可读性也会变化。因此“缓冲区里还存在字节”和“现在能输出完整 packet”不是同一个问题。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/trace_buffer_v1.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"默认中央TraceBufferV1的数据结构与读取契约\">[pf-buffer-v1]<\/a><\/p>\n\n<p>配置应由问题反推。研究尾部卡顿倾向 ring；必须观察启动过程时可能选择 discard；高频调度与低频应用事件可分到不同中央缓冲区，避免前者冲掉后者。下面只展示缓冲区与增量状态政策，实际数据源仍须在相应平台注册并接收配置：<\/p>\n\n<div class=\"code-shell\"><div class=\"code-head\"><span>代码与命令<\/span><button type=\"button\" class=\"copy-btn\" data-action=\"copy-code\" aria-label=\"复制代码\">复制<\/button><\/div><pre><code>buffers { size_kb: 16384 fill_policy: RING_BUFFER }\nbuffers { size_kb: 4096  fill_policy: DISCARD }\nduration_ms: 20000\nincremental_state_config { clear_period_ms: 1000 }\n<\/code><\/pre><\/div>\n\n<p>数据源通过 <code>target_buffer<\/code> 或受支持的名称引用选择目的地。周期性增量清理只通知声明支持该能力的数据源，不能强迫任意 producer 重新发送所有历史状态。中央缓冲区大小也不是 producer SMB 大小，调整前者不能直接修复后者的瞬时拥塞。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/config/trace_config.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceConfig缓冲政策、默认V1和增量清理\">[pf-config]<\/a><\/p>\n\n<p>第一层损失发生在内核各 CPU 的 ftrace buffer：探针产生事件后，用户态 <code>traced_probes<\/code> 来不及读取就可能覆盖。第二层发生在 producer SMB：服务调度延迟或突发写入超过暂存能力。第三层发生在中央缓冲区及其流式落盘过程：容量和读取频率不足，旧内容被覆盖或新内容被拒绝。三层处于不同位置，增大最后一层并不能追回第一层已丢失的 <code>sched_switch<\/code>。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/buffers.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"三层缓冲、容量计算与丢失统计\">[pf-buffers]<\/a><\/p>\n\n<p>容量估算要同时看平均速率、峰值和最长不可服务时间。中央 16 MiB、平均 2 MiB/s 时，粗略保留窗口为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> s，尚未扣除头部、填充与速率波动。若每 5 s 才排空一次，理论产生量为 10 MiB，实际预算还需余量。SMB 峰值 8 MiB/s、服务暂停 10 ms 时，需要约 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><mi>&#x000D7;<\/mi><mn>0.010<\/mn><mo>&#x0003D;<\/mo><mn>0.08<\/mn><\/mrow><\/math> MiB，即 81.92 KiB 的暂存余量；计算应使用峰值而不是全天平均。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/buffers.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"三层缓冲、容量计算与丢失统计\">[pf-buffers]<\/a><\/p>\n\n<p>反例更能揭示风险：每 10 s 突发写入 2 MiB，平均仅 0.2 MiB/s，但 256 KiB SMB 只有单次突发的八分之一。若突发足够快、服务无法同步排空，仍会溢出。这里 256 KiB 是教学假设，不宣称是所有 SDK、后端或版本的默认值。不同官方文档对默认 SMB 的描述有差异，工程配置应读取实际连接参数，而不从一个文档段落猜测。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/buffers.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"三层缓冲、容量计算与丢失统计\">[pf-buffers]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><\/p>\n\n<p>导入后应查询 <code>stats<\/code>。先检查 <code>severity=&#x27;data_loss&#x27; AND value!=0<\/code>，再单独关注 <code>ftrace_cpu_overrun_end<\/code>、<code>traced_buf_trace_writer_packet_loss<\/code>、<code>traced_buf_chunks_overwritten<\/code>、<code>traced_buf_chunks_discarded<\/code> 和增量状态失效统计。仅过滤 data_loss 并不充分：官方文档示例中的 chunks_discarded 为 info，而 ring 覆盖即使符合既定政策，也可能缩短所需分析窗口。统计字段还是计数、字节数或每 CPU 指标，也应分别解释，不能把不同单位相加成“总丢失率”。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/buffers.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"三层缓冲、容量计算与丢失统计\">[pf-buffers]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>Flush 要求有关 producer 推进待提交数据并回报完成状态；它不是让所有应用在同一时刻冻结，也不是磁盘 fsync 的持久化承诺。超时、producer 退出后的 scraping 可以改善尾部可见性，却无法制造未记录的事件。最后应同时核对请求的配置、服务确认、Trace Processor 统计以及分析窗口是否闭合。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/tracing/service/tracing_service_impl.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Service 的信任边界、flush 与 scraping\">[pf-service-impl]<\/a><\/p>\n\n<div class=\"advanced-interactives\"><div class=\"ml-labs\" id=\"ml-mechanism-labs\"><section class=\"ml-card\" id=\"ml-perfetto-lab\" aria-labelledby=\"ml-perfetto-title\">\n      <div class=\"ml-card-heading\"><div><span class=\"ml-tool-label\">03 / Perfetto retention<\/span><h3 id=\"ml-perfetto-title\">空间只够四块，保留哪一段？<\/h3><\/div><\/div>\n      <p class=\"ml-description\">按顺序输入编号 1 到 6 的抽象块，容量固定为 4。切换策略，对同一输入前缀重新演算。<\/p>\n      <fieldset class=\"ml-policy-fieldset\"><legend>缓冲保留策略<\/legend><div class=\"ml-policy-options\"><label><input type=\"radio\" name=\"ml-perfetto-policy\" value=\"ring\" checked><span>RING_BUFFER<small>满时覆盖旧块<\/small><\/span><\/label><label><input type=\"radio\" name=\"ml-perfetto-policy\" value=\"discard\"><span>DISCARD<small>满时丢弃新块<\/small><\/span><\/label><\/div><\/fieldset>\n      <div class=\"ml-input-strip\" aria-label=\"输入序列\"><span>输入<\/span><ol id=\"ml-perfetto-inputs\"><li>1<\/li><li>2<\/li><li>3<\/li><li>4<\/li><li>5<\/li><li>6<\/li><\/ol><output id=\"ml-perfetto-count\">0 / 6<\/output><\/div>\n      <div class=\"ml-retained-label\">当前保留的抽象块 <span>容量 4<\/span><\/div>\n      <ol class=\"ml-buffer-slots\" id=\"ml-perfetto-buffer\" aria-label=\"当前保留的抽象块\"><li>—<\/li><li>—<\/li><li>—<\/li><li>—<\/li><\/ol>\n      <div class=\"ml-controls\"><button class=\"ml-button ml-button-primary\" type=\"button\" id=\"ml-perfetto-next\">输入下一块 →<\/button><button class=\"ml-button ml-button-secondary\" type=\"button\" id=\"ml-perfetto-reset\">重置输入<\/button><\/div>\n      <p class=\"ml-feedback\" id=\"ml-perfetto-note\" aria-live=\"polite\">尚未输入。先选择策略，再逐块观察。<\/p>\n      <p class=\"ml-boundary\">“块”不是真实 TracePacket；本模型没有表示增量编码与序列依赖，保留编号不保证真实 trace 能独立解码。策略切换是比较两个模型，不是回滚已采集的 trace。<\/p>\n    <\/section><\/div><\/div>","advanced":true},{"title":"TrackEvent、字典状态与时钟：时间线语义从哪里来","body":"TrackEvent 的 track 表达一条逻辑事件流。线程 track 适合线程内同步嵌套；自定义 track 可以表达跨线程请求的整体生命期；counter 表达数值变化；flow 表达阶段间的关联。设计埋点时应先区分“请求存在了多久”和“线程何时执行哪个阶段”。跨线程请求可以有一条自定义请求 track，再在各线程 track 中记录执行阶段，以 flow 标记派发与交接。[[pf-trackevent]](#src-pf-trackevent)\n\n把两个并行执行流放到同一条按栈嵌套的 track，可能制造并不存在的父子包含关系；把 begin 写到线程 A、end 写到线程 B，也不能默认得到正确同步嵌套。不同并行流通常应分轨，并明确关联标识的作用域。flow 箭头记录的是生产者声明的连接，单凭相同 ID 不能证明依赖完整、工作独占或该边一定在关键路径上。埋点语义是分析证据的一部分，不是画图以后自动产生的事实。[[pf-trackevent]](#src-pf-trackevent)\n\n频繁重复的名字、类别、栈或默认字段不必每个 packet 都写全。producer 可以先 intern 字符串，后续用整数引用；也可使用增量时间和默认 track 等状态来减小编码成本。这里的 ID 作用于特定 packet sequence，不能把 writer A 的字符串 7 与 writer B 的字符串 7 当作同一个名字。同一 writer 清理增量状态后，也可能重新使用编号。[[pf-packet]](#src-pf-packet)[[pf-reader]](#src-pf-reader)\n\n`trusted_packet_sequence_id` 帮助识别序列，`SEQ_INCREMENTAL_STATE_CLEARED` 表示状态重建边界，`SEQ_NEEDS_INCREMENTAL_STATE` 表示该 packet 依赖之前状态。读者发现前序丢失后，会把相应状态标记为无效；需要该状态的后续 packet 可能被跳过，直到清理与重建恢复可解释性。`previous_packet_dropped` 在序列开始处也可能保守出现，不能把每次标记都机械计作一次已证实的物理丢包。[[pf-packet]](#src-pf-packet)[[pf-reader]](#src-pf-reader)\n\n因此，压缩比和可恢复性存在直接权衡。字典引用越多，稳态编码越紧凑，但 ring 覆盖字典后会留下不可解释的后缀。若缓冲区保留原始字节 8 s，期间最近一次有效状态重建只覆盖后 6 s，可使用窗口就不应仍宣称为完整 8 s。周期清理能够缩短某些恢复等待，却增加重发成本，且依赖数据源实现；不能保证任何丢失都在一个周期内无条件恢复。[[pf-config]](#src-pf-config)[[pf-reader]](#src-pf-reader)\n\n时间戳也需要状态。不同源可能使用 BOOTTIME、MONOTONIC、REALTIME 或自定义时钟。MONOTONIC 与 BOOTTIME 对系统休眠的处理不同，REALTIME 可能被校时改变；两个主机的同名时钟也没有天然共同零点。Perfetto 用 ClockSnapshot 建立时钟之间的对应关系，内置 ID、自定义全局 ID 和 sequence-local ID 具有不同作用域。序列局部时钟号不能脱离序列身份解释。[[pf-clocks]](#src-pf-clocks)[[pf-reader]](#src-pf-reader)\n\n假设同一快照记录时钟 A 为 1000、B 为 2100，在适用区间内只按偏移换算，则 A 上 1104 对应 B 上 2204。这个四则运算示例不证明两个时钟永远同速，也不证明不同主机间已准确同步。漂移、快照稀疏、映射不连通与时钟跳变都会影响对齐。读者应检查可用同步关系与时间范围；源码对暂缺映射的 packet 可以延后处理，最终仍无法转换的情况会记录失败，不能悄悄把它当作纳秒零点相同。[[pf-clocks]](#src-pf-clocks)[[pf-reader]](#src-pf-reader)\n\n对时钟精度还应给出误差预算。若两个已换算时刻的误差上界分别为 $\\epsilon_1$、$\\epsilon_2$，其差值的保守误差上界为二者之和。一个 5 微秒的阶段，若同步误差也在数微秒量级，就不宜据此断言跨源事件的严格先后。数据库统一使用纳秒单位只规定数值尺度，不意味着采集、同步与重建都有一纳秒精度。","html":"<figure class=\"advanced-figure\" id=\"fig-pf-sequence\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-sequence-title pf-sequence-desc\"><title id=\"pf-sequence-title\">增量状态为压缩提供上下文<\/title><desc id=\"pf-sequence-desc\">InternedData 的标识在 packet sequence 等上下文内解释。丢失依赖的状态包会使后续引用无法可靠解析，需等待有效重置。<\/desc><defs><marker id=\"pf-sequence-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">序列字典<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">iid 7 → 名字 Encode<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-sequence-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">后续 TrackEvent<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">引用 iid 7<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-sequence-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">解码器状态<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">序列有效才可解释<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">同一个 iid 在不同序列中不保证相同含义<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">文件仍可解析，不意味着每个事件都可完整恢复<\/text>\n<\/svg><figcaption><strong>增量状态为压缩提供上下文。<\/strong> InternedData 的标识在 packet sequence 等上下文内解释。丢失依赖的状态包会使后续引用无法可靠解析，需等待有效重置。 <a class=\"figure-open\" href=\"figures/pf-sequence.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure><figure class=\"advanced-figure\" id=\"fig-pf-clock\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-clock-title pf-clock-desc\"><title id=\"pf-clock-title\">时间戳相同单位，不代表相同时间域<\/title><desc id=\"pf-clock-desc\">ClockSnapshot 提供不同时间域的关联依据。转换后仍需考虑采集精度、快照覆盖和误差；纳秒存储不等于纳秒准确度。<\/desc><defs><marker id=\"pf-clock-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">时钟 A<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">timestamp + clock id<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-clock-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">同步信息<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">ClockSnapshot / 转换<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-clock-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">统一分析时间<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">排序 / 区间 / 查询<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">先说明时钟来源，再做跨来源差值<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">观测间隔小于相对不确定度时，严格先后难以确定<\/text>\n<\/svg><figcaption><strong>时间戳相同单位，不代表相同时间域。<\/strong> ClockSnapshot 提供不同时间域的关联依据。转换后仍需考虑采集精度、快照覆盖和误差；纳秒存储不等于纳秒准确度。 <a class=\"figure-open\" href=\"figures/pf-clock.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>TrackEvent 的 track 表达一条逻辑事件流。线程 track 适合线程内同步嵌套；自定义 track 可以表达跨线程请求的整体生命期；counter 表达数值变化；flow 表达阶段间的关联。设计埋点时应先区分“请求存在了多久”和“线程何时执行哪个阶段”。跨线程请求可以有一条自定义请求 track，再在各线程 track 中记录执行阶段，以 flow 标记派发与交接。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/instrumentation/track-events.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TrackEvent、自定义轨道与flow\">[pf-trackevent]<\/a><\/p>\n\n<p>把两个并行执行流放到同一条按栈嵌套的 track，可能制造并不存在的父子包含关系；把 begin 写到线程 A、end 写到线程 B，也不能默认得到正确同步嵌套。不同并行流通常应分轨，并明确关联标识的作用域。flow 箭头记录的是生产者声明的连接，单凭相同 ID 不能证明依赖完整、工作独占或该边一定在关键路径上。埋点语义是分析证据的一部分，不是画图以后自动产生的事实。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/instrumentation/track-events.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TrackEvent、自定义轨道与flow\">[pf-trackevent]<\/a><\/p>\n\n<p>频繁重复的名字、类别、栈或默认字段不必每个 packet 都写全。producer 可以先 intern 字符串，后续用整数引用；也可使用增量时间和默认 track 等状态来减小编码成本。这里的 ID 作用于特定 packet sequence，不能把 writer A 的字符串 7 与 writer B 的字符串 7 当作同一个名字。同一 writer 清理增量状态后，也可能重新使用编号。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/trace/trace_packet.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TracePacket序列身份与增量状态标志\">[pf-packet]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p><code>trusted_packet_sequence_id<\/code> 帮助识别序列，<code>SEQ_INCREMENTAL_STATE_CLEARED<\/code> 表示状态重建边界，<code>SEQ_NEEDS_INCREMENTAL_STATE<\/code> 表示该 packet 依赖之前状态。读者发现前序丢失后，会把相应状态标记为无效；需要该状态的后续 packet 可能被跳过，直到清理与重建恢复可解释性。<code>previous_packet_dropped<\/code> 在序列开始处也可能保守出现，不能把每次标记都机械计作一次已证实的物理丢包。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/trace/trace_packet.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TracePacket序列身份与增量状态标志\">[pf-packet]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>因此，压缩比和可恢复性存在直接权衡。字典引用越多，稳态编码越紧凑，但 ring 覆盖字典后会留下不可解释的后缀。若缓冲区保留原始字节 8 s，期间最近一次有效状态重建只覆盖后 6 s，可使用窗口就不应仍宣称为完整 8 s。周期清理能够缩短某些恢复等待，却增加重发成本，且依赖数据源实现；不能保证任何丢失都在一个周期内无条件恢复。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/config/trace_config.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceConfig缓冲政策、默认V1和增量清理\">[pf-config]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>时间戳也需要状态。不同源可能使用 BOOTTIME、MONOTONIC、REALTIME 或自定义时钟。MONOTONIC 与 BOOTTIME 对系统休眠的处理不同，REALTIME 可能被校时改变；两个主机的同名时钟也没有天然共同零点。Perfetto 用 ClockSnapshot 建立时钟之间的对应关系，内置 ID、自定义全局 ID 和 sequence-local ID 具有不同作用域。序列局部时钟号不能脱离序列身份解释。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/clock-sync.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"时钟域与ClockSnapshot换算\">[pf-clocks]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>假设同一快照记录时钟 A 为 1000、B 为 2100，在适用区间内只按偏移换算，则 A 上 1104 对应 B 上 2204。这个四则运算示例不证明两个时钟永远同速，也不证明不同主机间已准确同步。漂移、快照稀疏、映射不连通与时钟跳变都会影响对齐。读者应检查可用同步关系与时间范围；源码对暂缺映射的 packet 可以延后处理，最终仍无法转换的情况会记录失败，不能悄悄把它当作纳秒零点相同。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/clock-sync.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"时钟域与ClockSnapshot换算\">[pf-clocks]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>对时钟精度还应给出误差预算。若两个已换算时刻的误差上界分别为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003F5;<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003F5;<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，其差值的保守误差上界为二者之和。一个 5 微秒的阶段，若同步误差也在数微秒量级，就不宜据此断言跨源事件的严格先后。数据库统一使用纳秒单位只规定数值尺度，不意味着采集、同步与重建都有一纳秒精度。<\/p>\n\n","advanced":true},{"title":"Trace Processor：先恢复语义，再排序、建表与计算","body":"Trace Processor 的输入处理不是“拿到 JSON 就插入 SQLite”。v58.2 的格式识别由 importer registry 管理，按检测优先级调用各导入器的 Sniff；具体可用集合还受构建配置和插件注册影响。压缩、容器和内部格式可能形成多层处理。官方架构文档能解释总体分工，但部分函数位置已变化，源码分析应沿本版本实际入口追踪，而不照抄旧图中的路径。[[pf-detection]](#src-pf-detection)[[pf-importers]](#src-pf-importers)[[pf-architecture]](#src-pf-architecture)\n\n对于 Perfetto protobuf，tokenizer 处理外层字节与解压等工作，`ProtoTraceReader` 负责关键的 packet 语义：识别 sequence、处理丢失与增量清理、更新 defaults 与 interned data、处理时钟快照，再把带相应状态代际的 token 交给排序器。不能先把所有裸 packet 按 timestamp 排序，再解释字典；文件顺序中出现的清理可能导致相同 ID 在后一个代际变成另一个字符串。[[pf-reader]](#src-pf-reader)\n\n设 sequence S 第一代定义 `7=Parse`，事件 E 的 timestamp 为 20；随后清理并在第二代定义 `7=Encode`，事件 F 的 timestamp 为 10。不同时间来源或迟交付会让事件时间与输入顺序不完全一致。读者先按输入推进代际，把 E 绑定第一代、F 绑定第二代，再按时间输出 F、E。若只保存一个可变全局字典，E 可能被错误命名为 Encode。源码传递 `current_generation()` 正是维持这种解释上下文。[[pf-reader]](#src-pf-reader)[[pf-sequence]](#src-pf-sequence)\n\n排序器按输入流维护队列，对需要的未排序后缀进行排序，再合并抽取合适的最早事件交给解析器。这样可以利用流内大体有序的性质，又允许跨流到达顺序不同；超出预期的乱序还需要被记录。最终 parser 或 tracker 根据事件重建 slice、进程线程身份、调度状态等语义记录。输入分块读取不意味着总内存恒定：排序可能需要暂存很多事件，导入后的列存储也会增长，pprof 导入器还会缓存整份 profile。[[pf-sorter]](#src-pf-sorter)[[pf-pprof]](#src-pf-pprof)\n\n存储层将大量字段放入专用列式表，重复字符串通过 string pool 共享，再暴露给 SQL 分析层。这样适合按时间、身份、状态和数值进行扫描与连接，不应描述成每个原始字节都转成普通 SQLite 行，也不能据此承诺所有查询零拷贝。表名与视图随版本演进；本章实际 v58.2 查询使用 `sched_slice`，另有 `slice`、`thread_state`、`thread_track`、`thread`、`process`、`counter`、`flow`、`args`、`stats` 等语义入口。[[pf-storage]](#src-pf-storage)[[pf-request]](#src-pf-request)\n\n进程线程关联应使用 `upid`、`utid` 等生命周期身份。原始 pid、tid 可能复用，跨越较长 trace 时按裸 tid 连接会把不同线程实例合并。自定义逻辑 track 也不必然对应一个 OS 线程；必须先通过 track 类型和相应映射确认。查询字段看似都是整数，只说明数据库类型相同，不说明它们属于相同身份空间。[[pf-storage]](#src-pf-storage)[[pf-thread-state]](#src-pf-thread-state)\n\n调度状态来自事件重建：`sched_switch` 结束旧线程的 Running，按 prev_state 开始它的新状态，并为切入线程打开 Running；waking 将适用的阻塞状态转为 runnable。已经 running 或 runnable 的线程再次收到唤醒，不应简单重置成一次新的等待起点。缺失事件、首尾不闭合都可能造成未知状态，因此查询必须处理负持续时间或边界不完整，而不是无条件对全表求和。[[pf-thread-state]](#src-pf-thread-state)\n\n下面是配套已执行查询的核心。先定位请求 slice，再将主线程状态与请求窗口相交；`dur>=0` 排除未完成区间，重叠谓词确保交集为正，纳秒除以 $10^6$ 转为毫秒。在真实工作负载中，`tid=101` 这样的教学筛选应换成已验证的线程生命周期和阶段归属。[[pf-request]](#src-pf-request)\n\n```sql\nWITH request_window AS (\n  SELECT s.ts AS lo, s.ts+s.dur AS hi\n  FROM slice s JOIN thread_track tt ON s.track_id=tt.id\n  JOIN thread t ON tt.utid=t.utid\n  WHERE s.name='request' AND t.tid=101 AND s.dur>=0\n), clipped AS (\n  SELECT st.state, MIN(st.ts+st.dur,w.hi)-MAX(st.ts,w.lo) AS ns\n  FROM thread_state st JOIN thread t USING(utid)\n  CROSS JOIN request_window w\n  WHERE t.tid=101 AND st.dur>=0\n    AND st.ts<w.hi AND st.ts+st.dur>w.lo\n)\nSELECT state,SUM(ns)/1e6 AS ms FROM clipped GROUP BY state;\n```\n\n真实解析结果为 Running 8 ms、R 2 ms、S 10 ms，合计主线程窗口 20 ms。`R` 表示具备运行条件，不代表已经消耗 CPU；`S` 是本例的可中断睡眠状态，不是自动识别出的“等待哪个 Go channel”。应用的 `join_wait` slice 为 10 ms，调度状态提供其睡眠事实，两者互相补充。Go goroutine 的 runnable 则属于运行时调度层，不能与 OS 线程 R 直接画等号。[[pf-thread-state]](#src-pf-thread-state)[[pf-request]](#src-pf-request)\n\n对 `sched_slice` 使用同样相交公式，教学指定的 main 与 worker 分别为 8、15 ms，总和 23 ms。关键路径不能取它们的简单总和：worker 1—16 ms 与 main 前段存在并行，main 后段要等 worker 完成。仅靠线程状态没有完整业务依赖；本例由明确的派发、等待和完成语义补足。实际场景应为每个归属阶段定义窗口，与调度区间相交，并把无法覆盖的时间单独记为未知，而不是强行归到等待或 CPU。\n\n区间连接还要防止重复计费。若同一请求有嵌套的外层阶段和内层阶段，将二者同时与调度表相交再求和，会把相同 CPU 片段计两次。计算请求总成本时应选择互斥阶段，或者先求已归属执行窗口的并集；计算阶段 inclusive 成本则可以保留嵌套，但必须声明不能再把各行直接相加。多条同名 request slice 也应按实例分组，而不是用名字把所有窗口混成一个集合。\n\n缺失一次切换事件的影响也不局限于一行。状态机依赖相邻边界关闭区间，一个边界缺失可能让之后的区间含义不确定。把不完整行过滤掉能避免明显错误，却不会自动补齐覆盖。因此最好同时输出已知 Running、Runnable、Sleeping 的交集长度，以及分析窗口中未被有效状态覆盖的长度；只有覆盖关系成立时，才能要求它们相加恰等于墙钟。","html":"<figure class=\"advanced-figure\" id=\"fig-pf-processing\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-processing-title pf-processing-desc\"><title id=\"pf-processing-title\">Trace Processor 的处理流水线<\/title><desc id=\"pf-processing-desc\">不同输入由相应 tokenizer/importer 接受；时间排序和语义解析后落入列式存储，再通过 SQL 表查询。<\/desc><defs><marker id=\"pf-processing-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">识别 / tokenize<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">包边界 / 增量状态<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-processing-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">sort / parse<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">时间顺序 / 语义重建<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-processing-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">storage / SQL<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">slice / sched / counter<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">通用 slice 与内核 sched_slice 表达不同事实<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">dur=-1 的未闭合区间要显式处理，不能当作负耗时<\/text>\n<\/svg><figcaption><strong>Trace Processor 的处理流水线。<\/strong> 不同输入由相应 tokenizer/importer 接受；时间排序和语义解析后落入列式存储，再通过 SQL 表查询。 <a class=\"figure-open\" href=\"figures/pf-processing.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>Trace Processor 的输入处理不是“拿到 JSON 就插入 SQLite”。v58.2 的格式识别由 importer registry 管理，按检测优先级调用各导入器的 Sniff；具体可用集合还受构建配置和插件注册影响。压缩、容器和内部格式可能形成多层处理。官方架构文档能解释总体分工，但部分函数位置已变化，源码分析应沿本版本实际入口追踪，而不照抄旧图中的路径。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/util/trace_type.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 importer registry 的格式检测\">[pf-detection]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/builtin_trace_importers.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"内置导入器工厂清单\">[pf-importers]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/design-docs/trace-processor-architecture.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Trace Processor总体架构\">[pf-architecture]<\/a><\/p>\n\n<p>对于 Perfetto protobuf，tokenizer 处理外层字节与解压等工作，<code>ProtoTraceReader<\/code> 负责关键的 packet 语义：识别 sequence、处理丢失与增量清理、更新 defaults 与 interned data、处理时钟快照，再把带相应状态代际的 token 交给排序器。不能先把所有裸 packet 按 timestamp 排序，再解释字典；文件顺序中出现的清理可能导致相同 ID 在后一个代际变成另一个字符串。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><\/p>\n\n<p>设 sequence S 第一代定义 <code>7=Parse<\/code>，事件 E 的 timestamp 为 20；随后清理并在第二代定义 <code>7=Encode<\/code>，事件 F 的 timestamp 为 10。不同时间来源或迟交付会让事件时间与输入顺序不完全一致。读者先按输入推进代际，把 E 绑定第一代、F 绑定第二代，再按时间输出 F、E。若只保存一个可变全局字典，E 可能被错误命名为 Encode。源码传递 <code>current_generation()<\/code> 正是维持这种解释上下文。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/proto_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ProtoTraceReader的状态恢复、时钟处理与排序输入\">[pf-reader]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/proto/packet_sequence_state_builder.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PacketSequenceStateBuilder代际状态\">[pf-sequence]<\/a><\/p>\n\n<p>排序器按输入流维护队列，对需要的未排序后缀进行排序，再合并抽取合适的最早事件交给解析器。这样可以利用流内大体有序的性质，又允许跨流到达顺序不同；超出预期的乱序还需要被记录。最终 parser 或 tracker 根据事件重建 slice、进程线程身份、调度状态等语义记录。输入分块读取不意味着总内存恒定：排序可能需要暂存很多事件，导入后的列存储也会增长，pprof 导入器还会缓存整份 profile。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/sorter/trace_sorter.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceSorter流内后缀排序与跨流合并\">[pf-sorter]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><\/p>\n\n<p>存储层将大量字段放入专用列式表，重复字符串通过 string pool 共享，再暴露给 SQL 分析层。这样适合按时间、身份、状态和数值进行扫描与连接，不应描述成每个原始字节都转成普通 SQLite 行，也不能据此承诺所有查询零拷贝。表名与视图随版本演进；本章实际 v58.2 查询使用 <code>sched_slice<\/code>，另有 <code>slice<\/code>、<code>thread_state<\/code>、<code>thread_track<\/code>、<code>thread<\/code>、<code>process<\/code>、<code>counter<\/code>、<code>flow<\/code>、<code>args<\/code>、<code>stats<\/code> 等语义入口。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/storage/trace_storage.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceStorage列式表与字符串驻留\">[pf-storage]<\/a><a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n<p>进程线程关联应使用 <code>upid<\/code>、<code>utid<\/code> 等生命周期身份。原始 pid、tid 可能复用，跨越较长 trace 时按裸 tid 连接会把不同线程实例合并。自定义逻辑 track 也不必然对应一个 OS 线程；必须先通过 track 类型和相应映射确认。查询字段看似都是整数，只说明数据库类型相同，不说明它们属于相同身份空间。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/storage/trace_storage.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TraceStorage列式表与字符串驻留\">[pf-storage]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/thread_state_tracker.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"线程状态重建与重复唤醒处理\">[pf-thread-state]<\/a><\/p>\n\n<p>调度状态来自事件重建：<code>sched_switch<\/code> 结束旧线程的 Running，按 prev_state 开始它的新状态，并为切入线程打开 Running；waking 将适用的阻塞状态转为 runnable。已经 running 或 runnable 的线程再次收到唤醒，不应简单重置成一次新的等待起点。缺失事件、首尾不闭合都可能造成未知状态，因此查询必须处理负持续时间或边界不完整，而不是无条件对全表求和。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/thread_state_tracker.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"线程状态重建与重复唤醒处理\">[pf-thread-state]<\/a><\/p>\n\n<p>下面是配套已执行查询的核心。先定位请求 slice，再将主线程状态与请求窗口相交；<code>dur&gt;=0<\/code> 排除未完成区间，重叠谓词确保交集为正，纳秒除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10<\/mn><mn>6<\/mn><\/msup><\/mrow><\/math> 转为毫秒。在真实工作负载中，<code>tid=101<\/code> 这样的教学筛选应换成已验证的线程生命周期和阶段归属。<a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n<div class=\"code-shell\"><div class=\"code-head\"><span>代码与命令<\/span><button type=\"button\" class=\"copy-btn\" data-action=\"copy-code\" aria-label=\"复制代码\">复制<\/button><\/div><pre><code>WITH request_window AS (\n  SELECT s.ts AS lo, s.ts+s.dur AS hi\n  FROM slice s JOIN thread_track tt ON s.track_id=tt.id\n  JOIN thread t ON tt.utid=t.utid\n  WHERE s.name=&#x27;request&#x27; AND t.tid=101 AND s.dur&gt;=0\n), clipped AS (\n  SELECT st.state, MIN(st.ts+st.dur,w.hi)-MAX(st.ts,w.lo) AS ns\n  FROM thread_state st JOIN thread t USING(utid)\n  CROSS JOIN request_window w\n  WHERE t.tid=101 AND st.dur&gt;=0\n    AND st.ts&lt;w.hi AND st.ts+st.dur&gt;w.lo\n)\nSELECT state,SUM(ns)/1e6 AS ms FROM clipped GROUP BY state;\n<\/code><\/pre><\/div>\n\n<p>真实解析结果为 Running 8 ms、R 2 ms、S 10 ms，合计主线程窗口 20 ms。<code>R<\/code> 表示具备运行条件，不代表已经消耗 CPU；<code>S<\/code> 是本例的可中断睡眠状态，不是自动识别出的“等待哪个 Go channel”。应用的 <code>join_wait<\/code> slice 为 10 ms，调度状态提供其睡眠事实，两者互相补充。Go goroutine 的 runnable 则属于运行时调度层，不能与 OS 线程 R 直接画等号。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/thread_state_tracker.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"线程状态重建与重复唤醒处理\">[pf-thread-state]<\/a><a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n<p>对 <code>sched_slice<\/code> 使用同样相交公式，教学指定的 main 与 worker 分别为 8、15 ms，总和 23 ms。关键路径不能取它们的简单总和：worker 1—16 ms 与 main 前段存在并行，main 后段要等 worker 完成。仅靠线程状态没有完整业务依赖；本例由明确的派发、等待和完成语义补足。实际场景应为每个归属阶段定义窗口，与调度区间相交，并把无法覆盖的时间单独记为未知，而不是强行归到等待或 CPU。<\/p>\n\n<p>区间连接还要防止重复计费。若同一请求有嵌套的外层阶段和内层阶段，将二者同时与调度表相交再求和，会把相同 CPU 片段计两次。计算请求总成本时应选择互斥阶段，或者先求已归属执行窗口的并集；计算阶段 inclusive 成本则可以保留嵌套，但必须声明不能再把各行直接相加。多条同名 request slice 也应按实例分组，而不是用名字把所有窗口混成一个集合。<\/p>\n\n<p>缺失一次切换事件的影响也不局限于一行。状态机依赖相邻边界关闭区间，一个边界缺失可能让之后的区间含义不确定。把不完整行过滤掉能避免明显错误，却不会自动补齐覆盖。因此最好同时输出已知 Running、Runnable、Sleeping 的交集长度，以及分析窗口中未被有效状态覆盖的长度；只有覆盖关系成立时，才能要求它们相加恰等于墙钟。<\/p>\n\n","advanced":true},{"title":"Go trace、Chrome JSON、pprof 与 traceconv 的兼容边界","body":"Go runtime trace 具有自己的版本化二进制编码，Go 1.25 源码明确使用 `go 1.%d trace\\x00\\x00\\x00` 文件头。它不是 Perfetto Trace protobuf，也不是 Chrome Trace Event JSON。v58.2 的内置 importer 工厂有 protobuf、JSON、systrace、perf.data、pprof 等入口，没有相应原生 Go runtime trace 工厂。浏览器最终能显示某些相似泳道，不代表底层文件可以直接互换。[[pf-go-header]](#src-pf-go-header)[[pf-importers]](#src-pf-importers)\n\n配套负例真正运行 Go 1.22.12，生成头部为 `go 1.22 trace\\x00\\x00\\x00`、大小 1727 字节的原生文件，再交给官方 v58.2 Trace Processor。程序退出码为 1，报 `Unknown trace type provided (ERR:fmt)`。这验证了本版本和本输入的直接导入不成立；不是以扩展名或静态猜测替代运行，也不声称证明所有第三方转换方案均不可用。[[pf-validation]](#src-pf-validation)\n\n`go tool trace` 自己先解码 Go runtime 事件，再生成浏览器视图。Go 1.25 的 `/jsontrace` 处理器支持线程视图、goroutine/task 聚焦以及范围选择，输出采用 Chrome Trace Event 的 `traceEvents`、`ph`、`ts`、`dur`、`pid`、`tid` 等字段。若要走这一桥接，应记录生成所用 Go 版本、选择的视图与范围，获取实际 viewer JSON，再用目标 Perfetto 验证所保留事件，而不能把原始 `.trace` 改名 `.json`。[[pf-go-json]](#src-pf-go-json)[[pf-go-format]](#src-pf-go-format)\n\n视图转换存在语义损失。Go viewer 可把 P、goroutine 或其他逻辑实体安排为泳道，JSON 的数字 `tid` 不必等于内核 OS TID；拿它与 `sched_slice` 的原始 tid 直接连接，可能得到看似完整的错误结论。已转换的 slice/flow 也不自动保留原始 runtime trace 的全部调度约束、栈、任务关系和未展示事件。能够显示这些视图，不等于 Trace Processor 获得 Go 专用语义分析器。[[pf-go-json]](#src-pf-go-json)[[pf-go-format]](#src-pf-go-format)\n\nGo 1.25 命令行的 `-pprof=net|sync|syscall|sched` 会从 trace 派生相应 pprof 类权重；它们不是通用 CPU profile，转换后也不再保留完整事件顺序。`-d` 的 wire、parsed、footprint 是调试输出模式，不是标准 Chrome JSON 导出开关。教程应区分“调试文本”“浏览器 JSON”与“派生聚合 profile”，避免只因三者都能重定向到文件就称为同一种 trace。[[pf-go-main]](#src-pf-go-main)\n\n另一方面，**Perfetto v58.2 的确能直接导入 pprof**。读取器解析映射、函数、位置和内联符号；为每个 sample type 建立 aggregate profile，按 pprof 的叶到根 location 顺序反转构建调用位置树，再将各 value 写入 aggregate sample。该路径保留类型与单位，不会读取 Period 后再次乘周期；它也不会由聚合值恢复逐事件时间或调度区间。[[pf-pprof]](#src-pf-pprof)\n\n实际教学 `request.pprof` 中的 cpu/nanoseconds 权重 4,000,000、15,000,000、4,000,000 被真实 v58.2 导入原值；查询 `__intrinsic_aggregate_profile` 与 `__intrinsic_aggregate_sample` 成功，而 `sched_slice` 和 `slice` 行数均为零。内部表名适合本版本核验，不能作为永久稳定公共 API 的承诺。这个实验比“能不能打开”更强：它同时检查了保留的信息和没有产生的信息。[[pf-validation]](#src-pf-validation)\n\n转换仍需审计：本版本 pprof 读取路径没有处理每个 sample 的 labels；将 int64 权重转换为 double，超过 $2^{53}$ 后整数精确性可能下降。原文件中业务标签是否重要、整数是否可能很大，都影响这个分析入口能否满足任务。`traceconv json`、`traceconv profile` 是支持数据的输出转换模式，不是任意格式输入解码器，也不能把已经聚合的 pprof 逆变换成真实调用时间线。[[pf-pprof]](#src-pf-pprof)[[pf-traceconv]](#src-pf-traceconv)","html":"<figure class=\"advanced-figure\" id=\"fig-pf-import\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pf-import-title pf-import-desc\"><title id=\"pf-import-title\">导入格式不等于恢复所有语义<\/title><desc id=\"pf-import-desc\">Perfetto v58.2 可导入 pprof 聚合权重；本实验 slice 与 sched_slice 仍为空。原生 Go trace 的直接导入失败。<\/desc><defs><marker id=\"pf-import-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"35\" y=\"65\" width=\"265\" height=\"105\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"167.5\" y=\"104.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">pprof 文件<\/text>\n<text x=\"167.5\" y=\"131.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">栈 + 权重<\/text>\n<rect x=\"355\" y=\"65\" width=\"265\" height=\"105\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"487.5\" y=\"104.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">aggregate_sample<\/text>\n<text x=\"487.5\" y=\"131.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">4 / 15 / 4 ms<\/text>\n<rect x=\"675\" y=\"65\" width=\"250\" height=\"105\" rx=\"13\" fill=\"#BD6500\" fill-opacity=\".075\" stroke=\"#BD6500\" stroke-width=\"2\"/>\n<text x=\"800.0\" y=\"104.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">时间线并未出现<\/text>\n<text x=\"800.0\" y=\"131.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">slice / sched = 0<\/text>\n<line x1=\"305\" y1=\"115\" x2=\"350\" y2=\"115\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-import-arrow)\"/>\n<line x1=\"625\" y1=\"115\" x2=\"670\" y2=\"115\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pf-import-arrow)\"/>\n<text x=\"480\" y=\"245\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">原生 Go trace → 本次 TP：Unknown trace type provided<\/text>\n<\/svg><figcaption><strong>导入格式不等于恢复所有语义。<\/strong> Perfetto v58.2 可导入 pprof 聚合权重；本实验 slice 与 sched_slice 仍为空。原生 Go trace 的直接导入失败。 <a class=\"figure-open\" href=\"figures/pf-import.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>Go runtime trace 具有自己的版本化二进制编码，Go 1.25 源码明确使用 <code>go 1.%d trace\\x00\\x00\\x00<\/code> 文件头。它不是 Perfetto Trace protobuf，也不是 Chrome Trace Event JSON。v58.2 的内置 importer 工厂有 protobuf、JSON、systrace、perf.data、pprof 等入口，没有相应原生 Go runtime trace 工厂。浏览器最终能显示某些相似泳道，不代表底层文件可以直接互换。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/internal/trace/version/version.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go execution trace版本化文件头\">[pf-go-header]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/builtin_trace_importers.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"内置导入器工厂清单\">[pf-importers]<\/a><\/p>\n\n<p>配套负例真正运行 Go 1.22.12，生成头部为 <code>go 1.22 trace\\x00\\x00\\x00<\/code>、大小 1727 字节的原生文件，再交给官方 v58.2 Trace Processor。程序退出码为 1，报 <code>Unknown trace type provided (ERR:fmt)<\/code>。这验证了本版本和本输入的直接导入不成立；不是以扩展名或静态猜测替代运行，也不声称证明所有第三方转换方案均不可用。<a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p><code>go tool trace<\/code> 自己先解码 Go runtime 事件，再生成浏览器视图。Go 1.25 的 <code>/jsontrace<\/code> 处理器支持线程视图、goroutine/task 聚焦以及范围选择，输出采用 Chrome Trace Event 的 <code>traceEvents<\/code>、<code>ph<\/code>、<code>ts<\/code>、<code>dur<\/code>、<code>pid<\/code>、<code>tid<\/code> 等字段。若要走这一桥接，应记录生成所用 Go 版本、选择的视图与范围，获取实际 viewer JSON，再用目标 Perfetto 验证所保留事件，而不能把原始 <code>.trace<\/code> 改名 <code>.json<\/code>。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/cmd/trace/jsontrace.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go viewer JSON生成与视图选择\">[pf-go-json]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/internal/trace/traceviewer/format/format.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go viewer使用的Chrome Trace Event数据结构\">[pf-go-format]<\/a><\/p>\n\n<p>视图转换存在语义损失。Go viewer 可把 P、goroutine 或其他逻辑实体安排为泳道，JSON 的数字 <code>tid<\/code> 不必等于内核 OS TID；拿它与 <code>sched_slice<\/code> 的原始 tid 直接连接，可能得到看似完整的错误结论。已转换的 slice/flow 也不自动保留原始 runtime trace 的全部调度约束、栈、任务关系和未展示事件。能够显示这些视图，不等于 Trace Processor 获得 Go 专用语义分析器。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/cmd/trace/jsontrace.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go viewer JSON生成与视图选择\">[pf-go-json]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/internal/trace/traceviewer/format/format.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go viewer使用的Chrome Trace Event数据结构\">[pf-go-format]<\/a><\/p>\n\n<p>Go 1.25 命令行的 <code>-pprof=net|sync|syscall|sched<\/code> 会从 trace 派生相应 pprof 类权重；它们不是通用 CPU profile，转换后也不再保留完整事件顺序。<code>-d<\/code> 的 wire、parsed、footprint 是调试输出模式，不是标准 Chrome JSON 导出开关。教程应区分“调试文本”“浏览器 JSON”与“派生聚合 profile”，避免只因三者都能重定向到文件就称为同一种 trace。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/cmd/trace/main.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"go tool trace命令模式\">[pf-go-main]<\/a><\/p>\n\n<p>另一方面，<strong>Perfetto v58.2 的确能直接导入 pprof<\/strong>。读取器解析映射、函数、位置和内联符号；为每个 sample type 建立 aggregate profile，按 pprof 的叶到根 location 顺序反转构建调用位置树，再将各 value 写入 aggregate sample。该路径保留类型与单位，不会读取 Period 后再次乘周期；它也不会由聚合值恢复逐事件时间或调度区间。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><\/p>\n\n<p>实际教学 <code>request.pprof<\/code> 中的 cpu/nanoseconds 权重 4,000,000、15,000,000、4,000,000 被真实 v58.2 导入原值；查询 <code>__intrinsic_aggregate_profile<\/code> 与 <code>__intrinsic_aggregate_sample<\/code> 成功，而 <code>sched_slice<\/code> 和 <code>slice<\/code> 行数均为零。内部表名适合本版本核验，不能作为永久稳定公共 API 的承诺。这个实验比“能不能打开”更强：它同时检查了保留的信息和没有产生的信息。<a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p>转换仍需审计：本版本 pprof 读取路径没有处理每个 sample 的 labels；将 int64 权重转换为 double，超过 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mrow><mn>53<\/mn><\/mrow><\/msup><\/mrow><\/math> 后整数精确性可能下降。原文件中业务标签是否重要、整数是否可能很大，都影响这个分析入口能否满足任务。<code>traceconv json<\/code>、<code>traceconv profile<\/code> 是支持数据的输出转换模式，不是任意格式输入解码器，也不能把已经聚合的 pprof 逆变换成真实调用时间线。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/traceconv/traceconv.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"traceconv输出模式与分发\">[pf-traceconv]<\/a><\/p>\n\n","advanced":true},{"title":"可复现实验、误读检查与研究练习","body":"复现实验先固定源码与可执行文件身份。配套保存 v58.2 tag、完整提交、release 资料和下载校验；官方 Linux amd64 ZIP 的 SHA-256 为 `32c739f71b2d39721afd294c0b038f2499a44a71b5b6bcdd85b83faca0b240b9`。运行 `--version` 返回同一完整提交。一个值得警惕的实际发现是：此源码 tag 内的 Python `tools/trace_processor` launcher 仍引用 v57.2 下载产物，因此“脚本来自 v58.2”不能替代对最终二进制的版本检查。[[pf-release]](#src-pf-release)[[pf-launcher]](#src-pf-launcher)[[pf-validation]](#src-pf-validation)\n\n在材料包根目录执行 `python3 examples/request/verify_perfetto.py`，脚本生成合成 ftrace，通过真实 Trace Processor 运行状态、CPU、slice 和 stats 查询，检查八项断言。`verification/request-perfetto.json` 保存版本、输入摘要、原始 SQL、退出状态、标准输出与解析结果；`verification/go-trace-import.json` 保存原生 Go 负例；`verification/pprof-perfetto-import.json` 保存聚合导入。这里验证的是解析与口径，不是生产环境开销，也没有实测 SMB 压力和内核过载。[[pf-request]](#src-pf-request)[[pf-validation]](#src-pf-validation)\n\n对真实服务重复实验时，应补三类证据：启用哪些数据源和类别、采集窗口与线程身份；观察到哪些丢失和状态恢复；应用阶段如何映射到请求。只有这些条件清楚，SQL 数字才可用于比较。比如优化后 CPU 降低而延迟上升，可能来自并发度、排队或工作量改变；应检查相同工作量下的分布和请求分组，不把一次时间线当作整个服务的统计结论。\n\n常见误读可按证据边界逐项纠正：SMB 不是最终保留文件；减少 writer 拷贝不是端到端零拷贝；Flush 不是全局暂停或 fsync；已有完整字节不代表增量字典仍可解释；flow ID 不是独占归因证明；线程 R 不是 CPU 执行，也不是 Go G 的 runnable；总 CPU 大于墙钟不构成错误；Chrome JSON 的 tid 不保证是 OS TID；直接导入 pprof 不会生成调度时间线；过滤所有 error 后没有记录也不能证明完整无丢失。[[pf-service]](#src-pf-service)[[pf-packet]](#src-pf-packet)[[pf-thread-state]](#src-pf-thread-state)[[pf-pprof]](#src-pf-pprof)\n\n采集开销本身也应实验检验。在相同负载、固定构建和相近环境下，分别运行关闭采集、仅启用必要类别、加入高频数据源三组，比较吞吐与延迟分布，同时记录输出速率、CPU 和丢失。等待型 SMB 策略可能减少缺口却增加业务停顿，丢弃型策略可能维持吞吐却降低解释覆盖；两者都需要纳入结论。只报告文件很小或界面很流畅，不能证明生产者热路径开销可以忽略。\n\n练习一：把教学中央容量改为 24 MiB、速率改为 3 MiB/s，说明粗略窗口仍为 8 s；再加入每 2 s 一次 1 MiB 字典重发，计算长期平均速率变为 3.5 MiB/s，粗略窗口约 6.86 s，并指出实际瞬时拥塞仍需单独分析。练习二：给 SQL 增加一个 `dur=-1` 的尾部状态，解释为什么排除后应记录未覆盖时间，而不是把结果重新归一到 100%。练习三：令同一 OS 工作线程在请求期间执行另一个请求 3 ms，指出原来的全窗口 CPU 查询会高估归因，应改成已识别阶段窗口求交集。\n\n练习四：丢弃字典重建 packet，但保留随后三个引用事件，区分“物理丢失一条 packet”和“语义不可用多条事件”。练习五：给 pprof 加业务 label 和大于 $2^{53}$ 的整数，比较本版本 aggregate 表与原文件，验证信息保留边界。练习六：为真实 Go 服务同时保存 runtime trace 和 OS 调度数据，设计显式标识与时钟对齐方案，列出仍无法证明的 goroutine 到请求映射，而不要凭名称相似直接关联。完成这些练习，才算掌握从记录协议到诊断结论之间的推理责任。","html":"\n<p>复现实验先固定源码与可执行文件身份。配套保存 v58.2 tag、完整提交、release 资料和下载校验；官方 Linux amd64 ZIP 的 SHA-256 为 <code>32c739f71b2d39721afd294c0b038f2499a44a71b5b6bcdd85b83faca0b240b9<\/code>。运行 <code>--version<\/code> 返回同一完整提交。一个值得警惕的实际发现是：此源码 tag 内的 Python <code>tools/trace_processor<\/code> launcher 仍引用 v57.2 下载产物，因此“脚本来自 v58.2”不能替代对最终二进制的版本检查。<a class=\"cite\" href=\"https://github.com/google/perfetto/releases/tag/v58.2\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Perfetto v58.2 release 与固定提交\">[pf-release]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/tools/trace_processor\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2源码中的launcher仍引用v57.2二进制\">[pf-launcher]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p>在材料包根目录执行 <code>python3 examples/request/verify_perfetto.py<\/code>，脚本生成合成 ftrace，通过真实 Trace Processor 运行状态、CPU、slice 和 stats 查询，检查八项断言。<code>verification/request-perfetto.json<\/code> 保存版本、输入摘要、原始 SQL、退出状态、标准输出与解析结果；<code>verification/go-trace-import.json<\/code> 保存原生 Go 负例；<code>verification/pprof-perfetto-import.json<\/code> 保存聚合导入。这里验证的是解析与口径，不是生产环境开销，也没有实测 SMB 压力和内核过载。<a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p>对真实服务重复实验时，应补三类证据：启用哪些数据源和类别、采集窗口与线程身份；观察到哪些丢失和状态恢复；应用阶段如何映射到请求。只有这些条件清楚，SQL 数字才可用于比较。比如优化后 CPU 降低而延迟上升，可能来自并发度、排队或工作量改变；应检查相同工作量下的分布和请求分组，不把一次时间线当作整个服务的统计结论。<\/p>\n\n<p>常见误读可按证据边界逐项纠正：SMB 不是最终保留文件；减少 writer 拷贝不是端到端零拷贝；Flush 不是全局暂停或 fsync；已有完整字节不代表增量字典仍可解释；flow ID 不是独占归因证明；线程 R 不是 CPU 执行，也不是 Go G 的 runnable；总 CPU 大于墙钟不构成错误；Chrome JSON 的 tid 不保证是 OS TID；直接导入 pprof 不会生成调度时间线；过滤所有 error 后没有记录也不能证明完整无丢失。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/docs/concepts/service-model.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Producer、consumer、service 与传输边界\">[pf-service]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/protos/perfetto/trace/trace_packet.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TracePacket序列身份与增量状态标志\">[pf-packet]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/common/thread_state_tracker.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"线程状态重建与重复唤醒处理\">[pf-thread-state]<\/a><a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><\/p>\n\n<p>采集开销本身也应实验检验。在相同负载、固定构建和相近环境下，分别运行关闭采集、仅启用必要类别、加入高频数据源三组，比较吞吐与延迟分布，同时记录输出速率、CPU 和丢失。等待型 SMB 策略可能减少缺口却增加业务停顿，丢弃型策略可能维持吞吐却降低解释覆盖；两者都需要纳入结论。只报告文件很小或界面很流畅，不能证明生产者热路径开销可以忽略。<\/p>\n\n<p>练习一：把教学中央容量改为 24 MiB、速率改为 3 MiB/s，说明粗略窗口仍为 8 s；再加入每 2 s 一次 1 MiB 字典重发，计算长期平均速率变为 3.5 MiB/s，粗略窗口约 6.86 s，并指出实际瞬时拥塞仍需单独分析。练习二：给 SQL 增加一个 <code>dur=-1<\/code> 的尾部状态，解释为什么排除后应记录未覆盖时间，而不是把结果重新归一到 100%。练习三：令同一 OS 工作线程在请求期间执行另一个请求 3 ms，指出原来的全窗口 CPU 查询会高估归因，应改成已识别阶段窗口求交集。<\/p>\n\n<p>练习四：丢弃字典重建 packet，但保留随后三个引用事件，区分“物理丢失一条 packet”和“语义不可用多条事件”。练习五：给 pprof 加业务 label 和大于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mrow><mn>53<\/mn><\/mrow><\/msup><\/mrow><\/math> 的整数，比较本版本 aggregate 表与原文件，验证信息保留边界。练习六：为真实 Go 服务同时保存 runtime trace 和 OS 调度数据，设计显式标识与时钟对齐方案，列出仍无法证明的 goroutine 到请求映射，而不要凭名称相似直接关联。完成这些练习，才算掌握从记录协议到诊断结论之间的推理责任。<\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"在调度状态时间线中，操作系统线程处于 Runnable，意味着什么？","options":["它正在 CPU 上执行。","它已具备运行条件，但还没有获得 CPU 执行。","它一定在等待网络 I/O。","它没有属于任何请求。"],"answer":1,"explanation":"Runnable 与 Running 是不同状态。就绪后的等待调度区间需要由相应的时序状态数据识别；仅凭状态不能补出请求身份或断定等待的全部原因。本例使用内核 sched_switch 的 OS 线程语义，不是 Go G 调度状态。"}],"exercises":[],"references":["pf-release","pf-service","pf-service-impl","pf-shmem","pf-arbiter","pf-writer","pf-commit","pf-buffer-v1","pf-buffers","pf-config","pf-trackevent","pf-packet","pf-reader","pf-clocks","pf-architecture","pf-detection","pf-importers","pf-sequence","pf-sorter","pf-storage","pf-thread-state","pf-go-header","pf-go-main","pf-go-json","pf-go-format","pf-pprof","pf-traceconv","pf-launcher","pf-request","pf-validation"],"part":"advanced","source_path":"research/perfetto.md"},{"id":"21","title":"同一请求，三种视角：可复现的跨工具实验","subtitle":"让同一份请求契约贯穿采集、聚合与时序对账。","objectives":["区分显式请求归属与线程时间重叠","用真实工具复算合成请求的 20 ms 墙钟与 23 ms CPU","解释 Go trace、pprof 与 Perfetto 的格式兼容边界"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"先写清请求、线程和时间","body":"本章把原理缩小到可以手算的规模。输入是合成教学数据，数字由场景明确设定；解析和报告由真实工具执行。它验证数据格式、聚合和查询口径，不验证内核采样精度、eBPF 开销或生产环境尾延迟。配套目录同时保留生成脚本、输入文件、SQL 和原始输出。[[pp-teaching]](#src-pp-teaching)[[pf-request]](#src-pf-request)[[pf-validation]](#src-pf-validation)\n\n场景有两个已明确归属于 request=demo 的 OS 线程。请求从相对 0 ms 开始，在 20 ms 完成。main 先执行 4 ms，然后处于 runnable 2 ms，随后 sleeping 10 ms，最后执行 4 ms；worker 在另一 CPU 上从 1 ms 执行到 16 ms。模型声明 main 等待 worker 完成后继续；这些业务归属与依赖是模型输入，不能仅凭 sched_switch 自动发现。\n\n| 对象 | 时间区间 | 状态或作用 | 时长 |\n| --- | --- | --- | --- |\n| main | [0,4) ms | first_work，运行 | 4 ms |\n| main | [4,6) ms | 可运行，尚未调度 | 2 ms |\n| main | [6,16) ms | join_wait，睡眠 | 10 ms |\n| main | [16,20) ms | finish_work，运行 | 4 ms |\n| worker | [1,16) ms | worker_work，运行 | 15 ms |\n\n手算得到 main CPU 为 8 ms，worker CPU 为 15 ms，请求总 CPU 为 23 ms；墙钟为 20 ms，平均 CPU 容量尺度为 1.15 核。main 的状态分解满足 8+2+10=20 ms。worker 的 15 ms 与 main 的前段运行重叠，因此不能将全部 CPU 相加作为请求延迟。这里所有时间都是教学数值，HTML 动画与 PDF 图共享相同场景。","html":"<figure class=\"advanced-figure\" id=\"fig-request-timeline\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 380\" role=\"img\" aria-labelledby=\"request-timeline-title request-timeline-desc\"><title id=\"request-timeline-title\">同一请求的三种时间<\/title><desc id=\"request-timeline-desc\">合成模型，非内核实测。主线程运行8ms、可运行2ms、睡眠10ms；worker运行15ms。两线程已由模型明确归属于该请求。<\/desc><defs><marker id=\"request-timeline-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"380\" fill=\"white\" rx=\"16\"/>\n<text x=\"110\" y=\"90\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"end\" dominant-baseline=\"middle\">main<\/text>\n<text x=\"110\" y=\"195\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"end\" dominant-baseline=\"middle\">worker<\/text>\n<rect x=\"140\" y=\"55\" width=\"152\" height=\"75\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"216.0\" y=\"92.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">运行 4<\/text>\n<rect x=\"292\" y=\"55\" width=\"76\" height=\"75\" rx=\"13\" fill=\"#BD6500\" fill-opacity=\".075\" stroke=\"#BD6500\" stroke-width=\"2\"/>\n<text x=\"330.0\" y=\"92.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">就绪 2<\/text>\n<rect x=\"368\" y=\"55\" width=\"380\" height=\"75\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"558.0\" y=\"92.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">睡眠 10<\/text>\n<rect x=\"748\" y=\"55\" width=\"152\" height=\"75\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"824.0\" y=\"92.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">运行 4<\/text>\n<rect x=\"178\" y=\"160\" width=\"570\" height=\"75\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"463.0\" y=\"197.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">运行 15 ms<\/text>\n<line x1=\"140\" y1=\"250\" x2=\"140\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"140\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">0<\/text>\n<line x1=\"178\" y1=\"250\" x2=\"178\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"178\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">1<\/text>\n<line x1=\"292\" y1=\"250\" x2=\"292\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"292\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">4<\/text>\n<line x1=\"368\" y1=\"250\" x2=\"368\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"368\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">6<\/text>\n<line x1=\"748\" y1=\"250\" x2=\"748\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"748\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">16<\/text>\n<line x1=\"900\" y1=\"250\" x2=\"900\" y2=\"260\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"900\" y=\"285\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">20<\/text>\n<line x1=\"140\" y1=\"250\" x2=\"900\" y2=\"250\" stroke=\"#637386\" stroke-width=\"2.3\"/>\n<text x=\"480\" y=\"332\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"20\" text-anchor=\"middle\" dominant-baseline=\"middle\">墙钟 20 ms；CPU 8 + 15 = 23 ms；平均容量 1.15 核<\/text>\n<\/svg><figcaption><strong>同一请求的三种时间。<\/strong> 合成模型，非内核实测。主线程运行8ms、可运行2ms、睡眠10ms；worker运行15ms。两线程已由模型明确归属于该请求。 <a class=\"figure-open\" href=\"figures/request-timeline.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>本章把原理缩小到可以手算的规模。输入是合成教学数据，数字由场景明确设定；解析和报告由真实工具执行。它验证数据格式、聚合和查询口径，不验证内核采样精度、eBPF 开销或生产环境尾延迟。配套目录同时保留生成脚本、输入文件、SQL 和原始输出。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n\n<p>场景有两个已明确归属于 request=demo 的 OS 线程。请求从相对 0 ms 开始，在 20 ms 完成。main 先执行 4 ms，然后处于 runnable 2 ms，随后 sleeping 10 ms，最后执行 4 ms；worker 在另一 CPU 上从 1 ms 执行到 16 ms。模型声明 main 等待 worker 完成后继续；这些业务归属与依赖是模型输入，不能仅凭 sched_switch 自动发现。<\/p>\n\n<div class=\"table-wrap\"><table><thead><tr><th>对象<\/th><th>时间区间<\/th><th>状态或作用<\/th><th>时长<\/th><\/tr><\/thead><tbody><tr><td>main<\/td><td>[0,4) ms<\/td><td>first_work，运行<\/td><td>4 ms<\/td><\/tr><tr><td>main<\/td><td>[4,6) ms<\/td><td>可运行，尚未调度<\/td><td>2 ms<\/td><\/tr><tr><td>main<\/td><td>[6,16) ms<\/td><td>join_wait，睡眠<\/td><td>10 ms<\/td><\/tr><tr><td>main<\/td><td>[16,20) ms<\/td><td>finish_work，运行<\/td><td>4 ms<\/td><\/tr><tr><td>worker<\/td><td>[1,16) ms<\/td><td>worker_work，运行<\/td><td>15 ms<\/td><\/tr><\/tbody><\/table><\/div><p>手算得到 main CPU 为 8 ms，worker CPU 为 15 ms，请求总 CPU 为 23 ms；墙钟为 20 ms，平均 CPU 容量尺度为 1.15 核。main 的状态分解满足 8+2+10=20 ms。worker 的 15 ms 与 main 的前段运行重叠，因此不能将全部 CPU 相加作为请求延迟。这里所有时间都是教学数值，HTML 动画与 PDF 图共享相同场景。<\/p>\n\n","advanced":true},{"title":"eBPF 应该怎样观察这个场景","body":"若通过 eBPF 观察切出事件，只记录当前 tid 和时间戳，可以统计切出频度，却不足以重建上述完整时间表。必须增加 next/prev 身份、切出状态、切入配对及相关唤醒事件，处理任务退出、TID 复用、丢失与边界。通过 perf 采样当前用户栈得到的是正在执行的栈；main 在睡眠时并没有一条相应的 CPU 样本。[[eb-sched-trace]](#src-eb-sched-trace)[[eb-sched-core]](#src-eb-sched-core)[[eb-stack-helper]](#src-eb-stack-helper)\n\n若使用固定 CPU 时间周期，可在内核 map 中按栈累计采样数，再乘该周期生成适合 pprof 的 CPU 权重。频率反馈或可变周期采样应累计各事件实际代表的权重，不能只用栈计数乘一个全局平均周期；cycles 等硬件事件也不能未经模型换算就称为 CPU 纳秒。若选择向 ring buffer 输出带时钟与身份的逐事件记录，经过正确的协议转换可以供时序分析。两条路径保留的信息不同：前者节约数据量，后者能够支持事件配对，但要承担更高传输与恢复成本。本章没有运行特权 BPF 加载；配套 C/libbpf 示例展示切出观察和失败账本，其覆盖范围比完整调度追踪更窄。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-perf-abi]](#src-eb-perf-abi)","html":"\n<p>若通过 eBPF 观察切出事件，只记录当前 tid 和时间戳，可以统计切出频度，却不足以重建上述完整时间表。必须增加 next/prev 身份、切出状态、切入配对及相关唤醒事件，处理任务退出、TID 复用、丢失与边界。通过 perf 采样当前用户栈得到的是正在执行的栈；main 在睡眠时并没有一条相应的 CPU 样本。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><\/p>\n\n<p>若使用固定 CPU 时间周期，可在内核 map 中按栈累计采样数，再乘该周期生成适合 pprof 的 CPU 权重。频率反馈或可变周期采样应累计各事件实际代表的权重，不能只用栈计数乘一个全局平均周期；cycles 等硬件事件也不能未经模型换算就称为 CPU 纳秒。若选择向 ring buffer 输出带时钟与身份的逐事件记录，经过正确的协议转换可以供时序分析。两条路径保留的信息不同：前者节约数据量，后者能够支持事件配对，但要承担更高传输与恢复成本。本章没有运行特权 BPF 加载；配套 C/libbpf 示例展示切出观察和失败账本，其覆盖范围比完整调度追踪更窄。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><\/p>\n\n","advanced":true},{"title":"pprof 只接收它确实拥有的量","body":"生成器写出三条 Sample，唯一数值维度是 cpu/nanoseconds，值为 4,000,000、15,000,000、4,000,000。没有虚构样本次数，也没有写 period=10 ms；因为这三个精确数来自模型，并非 Go 默认 100 Hz 采样。文件级 duration 为 20 ms，三条均有 request=demo 标签。[[pp-proto]](#src-pp-proto)\n\n主线程的 `main.first_work` 和 `main.finish_work` 都位于 `main.handle_request` 栈下。工作线程的 `worker.work` 位于 `worker.loop` 栈下。工作线程不是主线程当前调用栈的一部分，所以没有人为增加共同的函数根。请求标签连接业务归属，栈仍表达各自执行上下文。\n\n```bash\npython3 examples/request/generate_pprof.py --verify\ngo tool pprof -symbolize=none -top examples/request/request.pprof\n```\n\n本次实际客户端是 Go 1.22.12。查询显示 Duration 20 ms、Total samples 23 ms（115%）；worker.work 的 flat 为 15 ms，main.first_work 和 main.finish_work 各 4 ms；main.handle_request 的 cum 为 8 ms。按 request=demo 筛选仍保留全部 23 ms。三次查询成功、八项断言通过，证据位于 verification/request-pprof.json。这里关闭符号化，是因为文件只包含构造的逻辑函数与调用栈，未写入 Location.Address 或 Mapping，也没有对应的真实 ELF。\n\n让 worker 在时间轴上平移而保持相同 CPU 权重，普通 profile 仍可能不变。因此 pprof 不能从这三条权重推回 2 ms runnable、10 ms sleeping 或 20 ms 内的执行顺序。文件级 duration 只提供窗口，不替代逐事件时间。","html":"<figure class=\"advanced-figure\" id=\"fig-request-comparison\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"request-comparison-title request-comparison-desc\"><title id=\"request-comparison-title\">同一模型经过两条数据通路<\/title><desc id=\"request-comparison-desc\">两种文件共享教学场景，并非互相无损转换。pprof验证聚合算法；ftrace输入由Perfetto重建调度与区间。<\/desc><defs><marker id=\"request-comparison-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">场景定义<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">确定归属 / 区间 / 栈<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#request-comparison-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">两份合成输入<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">request.pprof + ftrace<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#request-comparison-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fil
