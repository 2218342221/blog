l-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">真实工具验证<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">pprof + Trace Processor<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">pprof：main 8 / worker 15 ms；CPU 总量 23 ms<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">Perfetto：主线程 Running 8 / R 2 / S 10 ms<\/text>\n<\/svg><figcaption><strong>同一模型经过两条数据通路。<\/strong> 两种文件共享教学场景，并非互相无损转换。pprof验证聚合算法；ftrace输入由Perfetto重建调度与区间。 <a class=\"figure-open\" href=\"figures/request-comparison.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>生成器写出三条 Sample，唯一数值维度是 cpu/nanoseconds，值为 4,000,000、15,000,000、4,000,000。没有虚构样本次数，也没有写 period=10 ms；因为这三个精确数来自模型，并非 Go 默认 100 Hz 采样。文件级 duration 为 20 ms，三条均有 request=demo 标签。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>主线程的 <code>main.first_work<\/code> 和 <code>main.finish_work<\/code> 都位于 <code>main.handle_request<\/code> 栈下。工作线程的 <code>worker.work<\/code> 位于 <code>worker.loop<\/code> 栈下。工作线程不是主线程当前调用栈的一部分，所以没有人为增加共同的函数根。请求标签连接业务归属，栈仍表达各自执行上下文。<\/p>\n\n<div class=\"code-shell\"><div class=\"code-head\"><span>代码与命令<\/span><button type=\"button\" class=\"copy-btn\" data-action=\"copy-code\" aria-label=\"复制代码\">复制<\/button><\/div><pre><code>python3 examples/request/generate_pprof.py --verify\ngo tool pprof -symbolize=none -top examples/request/request.pprof\n<\/code><\/pre><\/div>\n\n<p>本次实际客户端是 Go 1.22.12。查询显示 Duration 20 ms、Total samples 23 ms（115%）；worker.work 的 flat 为 15 ms，main.first_work 和 main.finish_work 各 4 ms；main.handle_request 的 cum 为 8 ms。按 request=demo 筛选仍保留全部 23 ms。三次查询成功、八项断言通过，证据位于 verification/request-pprof.json。这里关闭符号化，是因为文件只包含构造的逻辑函数与调用栈，未写入 Location.Address 或 Mapping，也没有对应的真实 ELF。<\/p>\n\n<p>让 worker 在时间轴上平移而保持相同 CPU 权重，普通 profile 仍可能不变。因此 pprof 不能从这三条权重推回 2 ms runnable、10 ms sleeping 或 20 ms 内的执行顺序。文件级 duration 只提供窗口，不替代逐事件时间。<\/p>\n\n","advanced":true},{"title":"Perfetto 从调度事件重建时间区间","body":"另一生成器输出符合 ftrace 文本格式的 sched_switch、sched_waking 和 tracing_mark_write。绝对起点选择 10 秒，正文统一显示相对毫秒。main 在 4 ms 切出时状态为 R，在 6 ms 短暂切入后立即以 S 切出；16 ms 被唤醒并重新运行。应用 B/E 标记定义 request、first_work、join_wait 和 finish_work。输入属于合成调度记录，实际重建使用官方 Perfetto v58.2。[[pf-request]](#src-pf-request)\n\n下载脚本会校验官方 release ZIP 的 SHA-256 并核对最终二进制版本。材料包不内嵌大型二进制；具备网络时在材料目录执行：\n\n```bash\npython3 scripts/fetch_perfetto.py\npython3 examples/request/verify_perfetto.py\n```\n\nSQL 先确定请求窗口 $[a,b)$，再把已完成的区间 $[t,t+d)$ 裁剪为 $\\max(0,\\min(t+d,b)-\\max(t,a))$。它避免把请求前后运行算入窗口，但并不自动解决业务归属。配套查询中用 tid 101/102 是受控模型的简化；真实长期追踪应使用生命周期身份与任务阶段。\n\n八项断言全部通过：request=20 ms、join_wait=10 ms；main 的 Running=8 ms、R=2 ms、S=10 ms；sched_slice 中 main CPU=8 ms、worker CPU=15 ms、两者共23 ms。产生的零时长状态不增加总量；dur=-1 的未闭合区间被排除。排除未知区间只避免误算，不能在真实输入中自动保证剩余覆盖完整。[[pf-request]](#src-pf-request)","html":"\n<p>另一生成器输出符合 ftrace 文本格式的 sched_switch、sched_waking 和 tracing_mark_write。绝对起点选择 10 秒，正文统一显示相对毫秒。main 在 4 ms 切出时状态为 R，在 6 ms 短暂切入后立即以 S 切出；16 ms 被唤醒并重新运行。应用 B/E 标记定义 request、first_work、join_wait 和 finish_work。输入属于合成调度记录，实际重建使用官方 Perfetto v58.2。<a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n<p>下载脚本会校验官方 release ZIP 的 SHA-256 并核对最终二进制版本。材料包不内嵌大型二进制；具备网络时在材料目录执行：<\/p>\n\n<div class=\"code-shell\"><div class=\"code-head\"><span>代码与命令<\/span><button type=\"button\" class=\"copy-btn\" data-action=\"copy-code\" aria-label=\"复制代码\">复制<\/button><\/div><pre><code>python3 scripts/fetch_perfetto.py\npython3 examples/request/verify_perfetto.py\n<\/code><\/pre><\/div>\n\n<p>SQL 先确定请求窗口 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，再把已完成的区间 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x0002B;<\/mo><mi>d<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 裁剪为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mo>min<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002B;<\/mo><mi>d<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。它避免把请求前后运行算入窗口，但并不自动解决业务归属。配套查询中用 tid 101/102 是受控模型的简化；真实长期追踪应使用生命周期身份与任务阶段。<\/p>\n\n<p>八项断言全部通过：request=20 ms、join_wait=10 ms；main 的 Running=8 ms、R=2 ms、S=10 ms；sched_slice 中 main CPU=8 ms、worker CPU=15 ms、两者共23 ms。产生的零时长状态不增加总量；dur=-1 的未闭合区间被排除。排除未知区间只避免误算，不能在真实输入中自动保证剩余覆盖完整。<a class=\"cite\" href=\"#resources\" title=\"合成ftrace经官方v58.2解析的8项断言\">[pf-request]<\/a><\/p>\n\n","advanced":true},{"title":"两个兼容性对照实验","body":"第一个对照直接把 request.pprof 输入 Perfetto v58.2。实际导入成功，聚合表保留 cpu/nanoseconds 和三项权重；slice 与 sched_slice 行数都为零。这说明它支持聚合格式，并没有从 profile 中恢复事件顺序。源码还表明这条导入路径没有处理每条 Sample 的标签，int64 被转为 double；使用前要评估这些信息是否重要。[[pf-pprof]](#src-pf-pprof)[[pf-validation]](#src-pf-validation)\n\n第二个对照用实际 Go 1.22.12 程序生成原生 execution trace，再直接输入同一 Trace Processor。退出码为 1，报 Unknown trace type provided (ERR:fmt)。Go 1.25 源码的 importer/输出路径阅读与这个运行结果共同支持本章的格式边界；本实验未运行 Go viewer JSON 的完整转换，因此没有把该转换列为已验证能力。[[pf-go-header]](#src-pf-go-header)[[pf-go-json]](#src-pf-go-json)[[pf-validation]](#src-pf-validation)\n\n第19章还有一组独立的48条基线 Sample 实验，覆盖内联、递归、条件分母、差分、ASLR位置身份和归一化，共15次实际查询、14项语义断言。它与本章三条权重文件是两套独立教材输入，不能把其480 ms总量混入此处23 ms场景。[[pp-teaching]](#src-pp-teaching)","html":"\n<p>第一个对照直接把 request.pprof 输入 Perfetto v58.2。实际导入成功，聚合表保留 cpu/nanoseconds 和三项权重；slice 与 sched_slice 行数都为零。这说明它支持聚合格式，并没有从 profile 中恢复事件顺序。源码还表明这条导入路径没有处理每条 Sample 的标签，int64 被转为 double；使用前要评估这些信息是否重要。<a class=\"cite\" href=\"https://github.com/google/perfetto/blob/add693d8b338ba9599dbcbc3e300b1ab8c000897/src/trace_processor/importers/pprof/pprof_trace_reader.cc\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"v58.2 pprof导入器的信息保留与损失\">[pf-pprof]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p>第二个对照用实际 Go 1.22.12 程序生成原生 execution trace，再直接输入同一 Trace Processor。退出码为 1，报 Unknown trace type provided (ERR:fmt)。Go 1.25 源码的 importer/输出路径阅读与这个运行结果共同支持本章的格式边界；本实验未运行 Go viewer JSON 的完整转换，因此没有把该转换列为已验证能力。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/internal/trace/version/version.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go execution trace版本化文件头\">[pf-go-header]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/cmd/trace/jsontrace.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go viewer JSON生成与视图选择\">[pf-go-json]<\/a><a class=\"cite\" href=\"#resources\" title=\"实际二进制、原生Go负例与pprof导入证据\">[pf-validation]<\/a><\/p>\n\n<p>第19章还有一组独立的48条基线 Sample 实验，覆盖内联、递归、条件分母、差分、ASLR位置身份和归一化，共15次实际查询、14项语义断言。它与本章三条权重文件是两套独立教材输入，不能把其480 ms总量混入此处23 ms场景。<a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n","advanced":true},{"title":"实验完成后应能解释什么","body":"同一个请求可以具有20 ms墙钟、23 ms CPU、主线程12 ms非运行时间。这三个数来自不同的求和集合，没有矛盾。eBPF可以提供部分系统事件或栈样本；pprof解释权重分布；Perfetto解释有证据支撑的状态与时间关系。任何一个工具都不能补回从未采集的请求身份、丢失的栈或被聚合删除的顺序。\n\n复现时应首先检查 verification 中的版本与输入摘要，再看查询和输出。教学文件可以稳定复算；原生 Go trace 的大小和内容会随运行变化。若换用不同版本，先确认接口与表名，再将结果记录为新的验证，不应把本次结果改写成跨版本保证。","html":"\n<p>同一个请求可以具有20 ms墙钟、23 ms CPU、主线程12 ms非运行时间。这三个数来自不同的求和集合，没有矛盾。eBPF可以提供部分系统事件或栈样本；pprof解释权重分布；Perfetto解释有证据支撑的状态与时间关系。任何一个工具都不能补回从未采集的请求身份、丢失的栈或被聚合删除的顺序。<\/p>\n\n<p>复现时应首先检查 verification 中的版本与输入摘要，再看查询和输出。教学文件可以稳定复算；原生 Go trace 的大小和内容会随运行变化。若换用不同版本，先确认接口与表名，再将结果记录为新的验证，不应把本次结果改写成跨版本保证。<\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"贯穿案例中，main 两段工作为 4 ms 和 4 ms，worker 为 15 ms。哪一种说法正确？","options":["main.handle_request 的函数 cum 必须等于整个请求的 23 ms。","worker 的 15 ms 应当从 CPU 总量删除。","以 request=demo 聚合可得到 23 ms；各线程的物理调用栈仍应分别保留。","pprof 的三条加权记录足以恢复每一段工作的先后和重叠。"],"answer":2,"explanation":"跨线程的业务归属由明确的 request 标签提供，不能伪造成共同物理调用栈。主栈 cum 为 8 ms、worker 栈为 15 ms；时序与依赖需要另一份证据。"}],"exercises":[],"references":["eb-ring-doc","eb-perf-abi","eb-stack-helper","eb-sched-trace","eb-sched-core","pp-proto","pp-teaching","pf-go-header","pf-go-json","pf-pprof","pf-request","pf-validation"],"part":"advanced","source_path":"content/05-experiment.md"},{"id":"22","title":"组合诊断：让每一种证据回答合适的问题","subtitle":"把基础课程和机制深研组合成可复查的诊断流程。","objectives":["按问题选择采集器与证据，避免把热点当成根因","规划对采集、符号化、聚合和查询的逐层验证","设计有可反驳预测和明确测量边界的优化实验"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"从问题选择采集器，而不是从工具寻找问题","body":"若症状是总 CPU 很高，先固定请求量和输入分布，采集 CPU profile，检查总权重、未知归因、flat/cum 和热点路径。若症状是 CPU 不高而尾延迟变差，应补充请求区间、排队、线程调度或 Go execution trace，区分未获 CPU、同步阻塞、外部依赖与流控。若怀疑内核路径、系统调用、线程唤醒或跨语言栈，才把 eBPF 的观察点设计加入方案。[[pp-cpu-api]](#src-pp-cpu-api)[[pp-graph]](#src-pp-graph)\n\n| 要回答的问题 | 优先证据 | 仍需补足的语义 |\n| --- | --- | --- |\n| CPU 花在哪些执行路径 | 带匹配构建信息的 CPU profile | 稳定负载、采样覆盖、单位请求成本 |\n| 哪些分配路径推动堆增长 | GC 口径一致的 heap profile | 持有路径、RSS 与堆的区别 |\n| 为什么请求长时间未完成 | 请求区间、调度和运行时事件 | 请求身份、队列与依赖关系 |\n| 哪种系统行为频繁发生 | 明确 hook 与过滤的 eBPF 观测 | 缺失计数、开销、对象生命周期 |\n| 前后变化是否真由优化导致 | 对照实验与多种证据交叉检查 | 工作量、错误率、环境和统计波动 |\n\n工具组合不必意味着所有采集器长期开到最高精度。可先保留低频汇总以发现异常，再触发一小段详细追踪。触发窗口是否覆盖原因、是否只保留故障结果、缓冲保留时长是否足够，都属于实验设计。需要复盘时保存构建身份、配置、时区/时钟说明、采集窗口、筛选条件、原始文件与工具版本，避免只剩无法复算的截图。","html":"<figure class=\"advanced-figure\" id=\"fig-selection\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"selection-title selection-desc\"><title id=\"selection-title\">按缺失的证据选择下一步<\/title><desc id=\"selection-desc\">先写出尚不确定的问题，再选择能够增加所缺维度的采集。多个工具给出一致图形也不能替代研究设计。<\/desc><defs><marker id=\"selection-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">成本分布不明<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">CPU / heap profile<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#selection-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">时间原因不明<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">调度 / runtime trace<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#selection-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">内核边界不明<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">有针对性的 eBPF<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">保存身份、构建、单位、窗口、过滤条件和缺失计数<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">采样降开销；聚合降传输；每种压缩都有信息代价<\/text>\n<\/svg><figcaption><strong>按缺失的证据选择下一步。<\/strong> 先写出尚不确定的问题，再选择能够增加所缺维度的采集。多个工具给出一致图形也不能替代研究设计。 <a class=\"figure-open\" href=\"figures/selection.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n\n<p>若症状是总 CPU 很高，先固定请求量和输入分布，采集 CPU profile，检查总权重、未知归因、flat/cum 和热点路径。若症状是 CPU 不高而尾延迟变差，应补充请求区间、排队、线程调度或 Go execution trace，区分未获 CPU、同步阻塞、外部依赖与流控。若怀疑内核路径、系统调用、线程唤醒或跨语言栈，才把 eBPF 的观察点设计加入方案。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU采集生命周期\">[pp-cpu-api]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><\/p>\n\n<div class=\"table-wrap\"><table><thead><tr><th>要回答的问题<\/th><th>优先证据<\/th><th>仍需补足的语义<\/th><\/tr><\/thead><tbody><tr><td>CPU 花在哪些执行路径<\/td><td>带匹配构建信息的 CPU profile<\/td><td>稳定负载、采样覆盖、单位请求成本<\/td><\/tr><tr><td>哪些分配路径推动堆增长<\/td><td>GC 口径一致的 heap profile<\/td><td>持有路径、RSS 与堆的区别<\/td><\/tr><tr><td>为什么请求长时间未完成<\/td><td>请求区间、调度和运行时事件<\/td><td>请求身份、队列与依赖关系<\/td><\/tr><tr><td>哪种系统行为频繁发生<\/td><td>明确 hook 与过滤的 eBPF 观测<\/td><td>缺失计数、开销、对象生命周期<\/td><\/tr><tr><td>前后变化是否真由优化导致<\/td><td>对照实验与多种证据交叉检查<\/td><td>工作量、错误率、环境和统计波动<\/td><\/tr><\/tbody><\/table><\/div><p>工具组合不必意味着所有采集器长期开到最高精度。可先保留低频汇总以发现异常，再触发一小段详细追踪。触发窗口是否覆盖原因、是否只保留故障结果、缓冲保留时长是否足够，都属于实验设计。需要复盘时保存构建身份、配置、时区/时钟说明、采集窗口、筛选条件、原始文件与工具版本，避免只剩无法复算的截图。<\/p>\n\n","advanced":true},{"title":"端到端数据通路如何搭建","body":"一种 CPU 归因通路是：perf 事件触发 eBPF 程序 → 获取允许的栈信息 → 以进程/构建/栈/标签为键累加 → 用户态周期性取出计数 → 符号化 → 编码为 profile.proto → 用 pprof 查看。设计者必须选择实际事件来源和周期，解释权重单位，报告栈截断与读取失败。把任意计数写进 cpu/nanoseconds 并不会让它变成 CPU 时间。[[pp-proto]](#src-pp-proto)\n\n另一种时序通路是：内核调度数据和应用埋点 → 事件传输与丢失统计 → 带身份及时间域的 trace 包 → Perfetto Trace Processor → SQL/时间线。若采集器使用 eBPF ring buffer，仍需自己完成到 Perfetto 协议或其支持输入格式的转换。CO-RE 不提供转换格式；ring buffer 不提供跨主机时钟同步；可导入文件也不保证其业务归因正确。\n\n结合两条通路时，优先关联“同一构建、同一进程生命周期、同一时间窗口、同一工作类别”。火焰图中的 Encode 热点可以指导在时间线检查编码区间；时间线发现队列等待可以指导增加对应边界观测。两者是相互约束的解释。若只凭“某段区间里某个函数也很热”就认定该函数造成整段等待，便跨越了证据允许的范围。","html":"\n<p>一种 CPU 归因通路是：perf 事件触发 eBPF 程序 → 获取允许的栈信息 → 以进程/构建/栈/标签为键累加 → 用户态周期性取出计数 → 符号化 → 编码为 profile.proto → 用 pprof 查看。设计者必须选择实际事件来源和周期，解释权重单位，报告栈截断与读取失败。把任意计数写进 cpu/nanoseconds 并不会让它变成 CPU 时间。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>另一种时序通路是：内核调度数据和应用埋点 → 事件传输与丢失统计 → 带身份及时间域的 trace 包 → Perfetto Trace Processor → SQL/时间线。若采集器使用 eBPF ring buffer，仍需自己完成到 Perfetto 协议或其支持输入格式的转换。CO-RE 不提供转换格式；ring buffer 不提供跨主机时钟同步；可导入文件也不保证其业务归因正确。<\/p>\n\n<p>结合两条通路时，优先关联“同一构建、同一进程生命周期、同一时间窗口、同一工作类别”。火焰图中的 Encode 热点可以指导在时间线检查编码区间；时间线发现队列等待可以指导增加对应边界观测。两者是相互约束的解释。若只凭“某段区间里某个函数也很热”就认定该函数造成整段等待，便跨越了证据允许的范围。<\/p>\n\n","advanced":true},{"title":"六种常见误判及其修正","body":"第一，把 flame graph 横轴看成时间。宽度表示所选权重，排列通常是布局；应到原始 trace 检查先后。第二，把 cum 当作 self CPU。cum 是含下游的累计归因；应该结合 flat 和调用上下文。第三，把 heap 的 inuse 当作操作系统驻留集。Go 堆剖析有采样和 GC 发布时间，并不覆盖全部 RSS。[[pp-flame]](#src-pp-flame)[[pp-graph]](#src-pp-graph)[[pp-mprof]](#src-pp-mprof)\n\n第四，把 off-CPU 全叫 I/O。线程可能等待锁、定时器、网络、用户态调度或其他条件；需要状态、唤醒源和程序边界共同解释。第五，把 verifier 接受当作程序测量正确。验证器关心其模型下的安全性，不能证明筛选条件、单位或统计归因满足研究问题。第六，把一份能解析的 trace 当作完整事实。丢包、增量状态失效、未闭合区间和观测边界都会改变可回答的问题。\n\n每一种修正都要求检查被工具省略的维度：对象、时间、单位、路径上下文或覆盖集合。最有价值的阅读习惯是先找“不再保留什么”，再讨论图形怎样解释。这能把不同工具的界面还原为同一个测量设计问题。","html":"\n<p>第一，把 flame graph 横轴看成时间。宽度表示所选权重，排列通常是布局；应到原始 trace 检查先后。第二，把 cum 当作 self CPU。cum 是含下游的累计归因；应该结合 flat 和调用上下文。第三，把 heap 的 inuse 当作操作系统驻留集。Go 堆剖析有采样和 GC 发布时间，并不覆盖全部 RSS。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/stacks.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"火焰图栈数据与递归索引\">[pp-flame]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/graph/graph.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"flat/cum和调用图累积规则\">[pp-graph]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>第四，把 off-CPU 全叫 I/O。线程可能等待锁、定时器、网络、用户态调度或其他条件；需要状态、唤醒源和程序边界共同解释。第五，把 verifier 接受当作程序测量正确。验证器关心其模型下的安全性，不能证明筛选条件、单位或统计归因满足研究问题。第六，把一份能解析的 trace 当作完整事实。丢包、增量状态失效、未闭合区间和观测边界都会改变可回答的问题。<\/p>\n\n<p>每一种修正都要求检查被工具省略的维度：对象、时间、单位、路径上下文或覆盖集合。最有价值的阅读习惯是先找“不再保留什么”，再讨论图形怎样解释。这能把不同工具的界面还原为同一个测量设计问题。<\/p>\n\n","advanced":true},{"title":"研读源码的顺序","body":"eBPF 路线从程序加载和 attach 开始，再看 verifier 的寄存器/指针状态与分支收敛，接着看 map 和 ringbuf 的同步协议，最后阅读 BTF/CO-RE 重定位与所用架构的栈路径。每一段都应回答输入、状态、失败分支和输出。仅阅读 README 很难发现 busy 记录阻塞消费、栈展开失败或 helper 可用性约束。\n\npprof 路线从 profile.proto 的字段和单位开始，回到 Go producer 确认权重如何产生，再看 merge/filter/report。可以使用本专题的合成 profile，逐次改变标签、地址、内联和递归，观察哪些报告变化、哪些不变。小而可手算的反例比大图更能说明算法。[[pp-proto]](#src-pp-proto)[[pp-merge]](#src-pp-merge)[[pp-filter]](#src-pp-filter)[[pp-total]](#src-pp-total)\n\nPerfetto 路线先看 producer—service—consumer 的通路，再看 TracePacket 的序列状态与时钟，最后跟进 tokenizer—sorter—parser—storage 的数据流。对每张 SQL 表问清行代表事件、区间还是采样；对每个 dur 检查负值和窗口裁剪。使用可控的小输入先验证自己的查询，再处理大规模生产 trace。","html":"\n<p>eBPF 路线从程序加载和 attach 开始，再看 verifier 的寄存器/指针状态与分支收敛，接着看 map 和 ringbuf 的同步协议，最后阅读 BTF/CO-RE 重定位与所用架构的栈路径。每一段都应回答输入、状态、失败分支和输出。仅阅读 README 很难发现 busy 记录阻塞消费、栈展开失败或 helper 可用性约束。<\/p>\n\n<p>pprof 路线从 profile.proto 的字段和单位开始，回到 Go producer 确认权重如何产生，再看 merge/filter/report。可以使用本专题的合成 profile，逐次改变标签、地址、内联和递归，观察哪些报告变化、哪些不变。小而可手算的反例比大图更能说明算法。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/filter.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"样本筛选与帧隐藏\">[pp-filter]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><\/p>\n\n<p>Perfetto 路线先看 producer—service—consumer 的通路，再看 TracePacket 的序列状态与时钟，最后跟进 tokenizer—sorter—parser—storage 的数据流。对每张 SQL 表问清行代表事件、区间还是采样；对每个 dur 检查负值和窗口裁剪。使用可控的小输入先验证自己的查询，再处理大规模生产 trace。<\/p>\n\n","advanced":true},{"title":"练习与解题线索","body":"练习一：保持第21章两条线程的 CPU 分别为 8 和 15 ms，把 worker 推迟到主线程计算结束后才开始。CPU profile 是否必须变化？请求墙钟是否可能变化？解题线索：栈权重保留，先后与依赖可能变化；若请求等待 worker 完成，关键路径会改变。\n\n练习二：某次采集 1% 的事件无法展开栈，能否把所有已知函数权重统一乘以 1/0.99？解题线索：只有缺失对目标量近似独立且其他假设满足时才可能用这种估计。若缺失集中在某个原生库或深栈路径，简单扩张会把偏差传播到所有已知函数；应先保留 unknown 桶并研究缺失机制。\n\n练习三：两个同时采集 10 秒的实例合并后，pprof 文件 duration 为 20 秒，能否说系统经历了 20 秒？解题线索：头部合并使用求和；真实时间并集、实例时间总和、CPU 总量是三种量。[[pp-merge]](#src-pp-merge)\n\n练习四：调度 trace 中某线程在请求区间内执行 5 ms，能否把 5 ms 全归到该请求？解题线索：线程可能执行其他任务，G 与 M 的映射也可能变化；时间重叠只是候选关联，需要明确的任务边界或标签。\n\n练习五：ring buffer 没有 reserve 失败，能否宣布零丢事件？解题线索：还需检查 hook 覆盖、过滤、采样、栈失败、用户态处理和文件写出等其他环节；“本环节没有报告失败”和“端到端完整”是不同命题。\n\n练习六：同一请求 A 与 B 的调用栈汇总完全相同，能否从 profile 恢复两者的 p99？解题线索：聚合已丢掉请求级持续时间分布，无法从总权重反演分位数。必须保留请求级时间记录，或有另外经过验证的统计模型。","html":"\n<p>练习一：保持第21章两条线程的 CPU 分别为 8 和 15 ms，把 worker 推迟到主线程计算结束后才开始。CPU profile 是否必须变化？请求墙钟是否可能变化？解题线索：栈权重保留，先后与依赖可能变化；若请求等待 worker 完成，关键路径会改变。<\/p>\n\n<p>练习二：某次采集 1% 的事件无法展开栈，能否把所有已知函数权重统一乘以 1/0.99？解题线索：只有缺失对目标量近似独立且其他假设满足时才可能用这种估计。若缺失集中在某个原生库或深栈路径，简单扩张会把偏差传播到所有已知函数；应先保留 unknown 桶并研究缺失机制。<\/p>\n\n<p>练习三：两个同时采集 10 秒的实例合并后，pprof 文件 duration 为 20 秒，能否说系统经历了 20 秒？解题线索：头部合并使用求和；真实时间并集、实例时间总和、CPU 总量是三种量。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><\/p>\n\n<p>练习四：调度 trace 中某线程在请求区间内执行 5 ms，能否把 5 ms 全归到该请求？解题线索：线程可能执行其他任务，G 与 M 的映射也可能变化；时间重叠只是候选关联，需要明确的任务边界或标签。<\/p>\n\n<p>练习五：ring buffer 没有 reserve 失败，能否宣布零丢事件？解题线索：还需检查 hook 覆盖、过滤、采样、栈失败、用户态处理和文件写出等其他环节；“本环节没有报告失败”和“端到端完整”是不同命题。<\/p>\n\n<p>练习六：同一请求 A 与 B 的调用栈汇总完全相同，能否从 profile 恢复两者的 p99？解题线索：聚合已丢掉请求级持续时间分布，无法从总权重反演分位数。必须保留请求级时间记录，或有另外经过验证的统计模型。<\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"要把“找到了热点”推进到“这个优化确实有效”，下一步最有说服力的做法是什么？","options":["只保留一张优化后的火焰图。","把最大的 cum 函数改短，然后直接宣布完成。","隐藏 unknown 和丢样记录，使图形更整洁。","写出机制假设，在可比负载下重复测量，并核对业务指标、误差与工具开销。"],"answer":3,"explanation":"热点是线索。可信结论还需要可反驳的机制假设、可比实验、业务工作量口径，以及对采样误差、覆盖缺口和诊断开销的检查。"}],"exercises":[],"references":["pp-proto","pp-cpu-api","pp-mprof","pp-merge","pp-filter","pp-total","pp-graph","pp-flame"],"part":"advanced","source_path":"content/06-method.md"}],"s rification":{"url":"https://raw.githubusercontent.com/golang/go/go1.25.0/src/runtime/pprof/pprof.go","status":200,"bytes":31881,"method":"local verified Go toolchain source"}},{"id":"go-sync-pool","title":"Go 1.25 sync.Pool：对象可随时移除的接口契约","url":"https://github.com/golang/go/blob/go1.25.0/src/sync/pool.go#L14-L43","year":2025,"kind":"官方版本源码","accessed":"2026-10-02","notes":"Pool用于临时对象复用；对象可随时被自动移除，不保证持久性；首次使用后不可复制。","verification":{"local_file":"lab/.gopath/pkg/mod/golang.org/toolchain@v0.0.1-go1.25.0.linux-amd64/src/sync/pool.go","sha256":"d613639cb20b77b0db9104bc0de2590f781f4ea3a01494619e521aa727114f99","lines":"14–43"}},{"id":"proj-pprof","title":"google/pprof：固定提交的驱动与报告实现","url":"https://github.com/google/pprof/tree/60bf690a9302b860b2110fbb4dccdfbbeb26ab89","year":2026,"kind":"primary-source-code","accessed":"2026-10-02","notes":"固定提交60bf690a9302b860b2110fbb4dccdfbbeb26ab89；提交时间经API核实为2026-10-01T06:43:31Z。v2审读profile/merge.go:135–574、internal/driver/fetch.go:37–89；合并错误、差分与输入缺失边界。不是最新版承诺。"},{"id":"proj-pprof-model","title":"pprof Profile 数据模型与归并实现","url":"https://github.com/google/pprof/blob/60bf690a9302b860b2110fbb4dccdfbbeb26ab89/profile/profile.go","year":2026,"kind":"primary-source-code","accessed":"2026-10-02","notes":"审读Profile/Sample/Location/Mapping/Function模型、ParseData和CheckValid；对象图和本地ID是合并算法的前提。配合固定提交profile/merge.go交叉验证。"},{"id":"proj-delve","title":"Delve v1.24.2：调试器核心与Linux native后端","url":"https://github.com/go-delve/delve/tree/v1.24.2","year":2025,"kind":"primary-source-code","accessed":"2026-10-02","notes":"固定v1.24.2；pkg/proc/target.go:65–68缓存失效；pkg/proc/native/proc.go:395–417固定OS线程ptrace；历史实现不作为Go1.25兼容性保证。"},{"id":"proj-delve-stack","title":"Delve v1.24.2：goroutine栈展开","url":"https://github.com/go-delve/delve/blob/v1.24.2/pkg/proc/stack.go","year":2025,"kind":"primary-source-code","accessed":"2026-10-02","notes":"v1.24.2；实读130–179、380–553：线程/保存G寄存器、部分栈错误、内联栈和callpc修正、FDE/CFA寄存器恢复。"},{"id":"proj-pyroscope","title":"Grafana Pyroscope v1.14.0：Distri   if(line.includes('|')&&isTableDivider(lines[i+1])){const headers=parseTableRow(line);i+=2;let rows=[];while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))rows.push(parseTableRow(lines[i++]));out.push('<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th scope="col">'+inlineMd(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+headers.map((_,j)=>'<td>'+inlineMd(row[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}

function migratePrinciplesProgress(){
 try{
  if(!['17','18','19','20','21','22'].every(id=>chapterMap.has(id)))return;

    const done=new Set(state.completed[id]||[]);(chapter.sections||[]).forEach((_,index)=>done.add(index));
    const merged=[...done].sort((a,b)=>a-b);if(merged.length!==(state.completed[id]||[]).length){state.completed[id]=merged;changed=true;}
   }
   const key=id+':0',choice=answers[oldId],question=chapter.quiz?.[0];

   }
  }

function simulatorHTML(){return '<section class="simulator" aria-labelledby="sim-title"><div class="sim-head"><div><div class="eyebrow">AN INTERACTIVE MENTAL MODEL</div><h2 id="sim-title">CPU 不忙，为什么请求还很慢？</h2></div><span class="small-pill">交互教学模型</span></div><p class="sim-intro">调整同一请求的三个串行阶段。观察 CPU profile 看到了什么，以及你还缺少哪些证据。</p><div class="sim-grid"><div>'+[['cpu','CPU 执行时间',30,1,300],['io','I/O 等待时间',120,0,500],['lock','锁等待时间',50,0,500]].map(([id,label,value,min,max])=>'<div class="slider-row"><label class="slider-label" for="sim-'+id+'"><span>'+label+'</span><strong id="value-'+id+'">'+value+' ms</strong></label><input id="sim-'+id+'" type="range" min="'+min+'" max="'+max+'" value="'+value+'" step="1" data-sim="'+id+'"></div>').join('')+'<div class="library-controls" style="margin:13px 0 0"><button class="filter-btn" data-preset="cpu">CPU 密集</button><button class="filter-btn" data-preset="io">I/O 等待</button><button class="filter-btn" data-preset="lock">锁竞争</button></div></div><div class="sim-chart"><div class="sim-values"><div class="sim-value"><strong id="sim-wall">200 ms</strong><span>请求墙钟时间</span></div><div class="sim-value"><strong id="sim-ratio">15.0%</strong><span>CPU / wall（单个请求）</span></div></div><div class="wall-bar" role="img" aria-label="请求时间分布" id="wall-bar"><span class="cpu" id="bar-cpu" style="width:15%"></span><span class="io" id="bar-io" style="width:60%"></span><span class="lock" id="bar-lock" style="width:25%"></span></div><div class="legend"><span><i style="background:#81bc51"></i>CPU 执行</span><span><i style="background:#91c4ce"></i>I/O 等待</span><span><i style="background:#eac474"></i>锁等待</span></div><div class="sim-result" id="sim-result" aria-live="polite"></div></div></div><p class="model-note">教学假设：一个请求在一个 goroutine 上串行执行，wall = CPU + I/O 等待 + 锁等待，无阶段重叠。真实程序还包含调度、并发、GC、内核行为等；此图不是实测结果，也不是整个进程的 CPU 利用率。CPU profile 不会直接显示等待阶段的持续时间。</p></section>';}
function updateSimulator(){const cpu=Number(document.getElementById('sim-cpu')?.value||30),io=Number(document.getElementById('sim-io')?.value||0),lock=Number(document.getElementById('sim-lock')?.value||0),wall=cpu+io+lock;if(!document.getElementById('sim-wall'))return;for(const[id,value]of [['cpu',cpu],['io',io],['lock',lock]]){document.getElementById('value-'+id).textContent=value+' ms';document.getElementById('bar-'+id).style.width=100*value/wall+'%';}document.getElementById('sim-wall').textContent=wall+' ms';document.getElementById('sim-ratio').textContent=(100*cpu/wall).toFixed(1)+'%';document.getElementById('wall-bar').setAttribute('aria-label','墙钟 '+wall+' 毫秒：CPU '+cpu+' 毫秒，I/O 等待 '+io+' 毫秒，锁等待 '+lock+' 毫秒');let message;if(cpu>=io&&cpu>=lock)message='<strong>先调查 CPU 热点。</strong>用 CPU profile 找主要调用栈，结合源码、基准测试验证优化是否降低总 CPU 时间。';else if(io>=lock)message='<strong>等待主要发生在 I/O 阶段。</strong>用 execution trace、请求追踪和 I/O 指标定位等待；CPU profile 只能解释 '+cpu+' ms 的执行部分。';else message='<strong>等待主要发生在锁竞争阶段。</strong>结合 mutex / block profile 和 execution trace 验证竞争；区分累计等待与单请求延迟。';document.getElementById('sim-result').innerHTML=message;}

let visualCompactWidth=360;
function isSchedulerVisual(v){return vnodes(v).some(n=>n.kind==='goroutine')&&vnodes(v).some(n=>n.kind==='cpu');}
function visualScene(v,index,width){const compact=width<580;visualCompactWidth=Math.max(230,Math.round(width));if(isSchedulerVisual(v))return renderQueue(v,index,compact);switch(v.type){case'pipeline':return renderGraph(v,index,compact);case'timeline':return renderTimeline(v,index,compact);case'stack':return renderStack(v,index,compact);case'heap':return renderHeap(v,index,compact);case'queue':return renderQueue(v,index,compact);case'matrix':return renderMatrix(v,index,compact);default:return renderGraph(v,index,compact);}}
function renderVisualCard(v,inGallery=false){const steps=vsteps(v),index=Math.max(0,Math.min(steps.length-1,visualRemembered.get(v.id)||0)),refs=(v.sourceRefs||[]).map(id=>sourceMap.get(String(id))).filter(Boolean);return '<article class="mechanism" id="visual-'+esc(vid(v.id))+'" data-viz-id="'+esc(v.id)+'"><header class="mechanism-head"><div><div class="viz-kicker">WATCH · STEP · UNDERSTAND <span class="viz-type">'+esc(isSchedulerVisual(v)?'G / M / P 调度':visualTypeNames[v.type]||'机制图')+'</span></div><h3>'+esc(v.title)+'</h3></div>'+(inGallery?'<button class="btn quiet small viz-home" data-chapter="'+esc(v.chapter)+'" data-section="'+(Number(v.section)||0)+'">第 '+esc(v.chapter)+' 章 ↗</button>':'')+'</header><div class="viz-canvas" aria-label="'+esc(v.title)+'机制图"></div><div class="viz-controller"><div class="viz-stage"><span class="viz-stage-no">'+String(index+1).padStart(2,'0')+'</span><div><h4 class="viz-stage-title"></h4><p class="viz-stage-detail"></p></div></div><div class="viz-controls" aria-label="机制动画控制"><button class="viz-step-btn" type="button" data-viz-action="previous" aria-label="上一步">'+icon('left')+'</button><button class="viz-play" type="button" data-viz-action="play" aria-label="播放步骤" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg></button><button class="viz-step-btn" type="button" data-viz-action="next" aria-label="下一步">'+icon('arrow')+'</button><input class="viz-range" type="range" min="0" max="'+(steps.length-1)+'" value="'+index+'" step="1" aria-label="'+esc(v.title)+'：选择步骤"><span class="viz-step-count">'+(index+1)+' / '+steps.length+'</span></div><div class="viz-footer"><p class="viz-caption">'+esc(v.caption||'教学机制示意。图中的构造数量与布局不是生产实测结果。')+'</p>'+(refs.length?'<span class="viz-source">来源'+refs.map((s,i)=>'<a href="'+esc(safeURL(s.url))+'" target="_blank" rel="noopener noreferrer" title="'+esc(s.title)+'">['+(i+1)+']</a>').join('')+'</span>':'')+'</div><span class="viz-live-announcement" aria-live="polite"></span></div></article>';}

 const charts=VISUALS.filter(v=>String(v.chapter)===String(c.id)&&Number(v.section)===i);

 return charts.length?charts.map(v=>renderVisualCard(v)).join('')+'<details class="detail-reading"><summary>'+icon('book')+'展开推导与细节<span style="font-size:12px;font-weight:400;color:var(--muted)">完整教材原文</span></summary><div class="prose">'+content+'</div></details>':'<div class="prose">'+content+'</div>';
}
function pauseVisual(controller){if(controller.timer){clearInterval(controller.timer);controller.timer=null;}if(controller.element?.isConnected){const button=controller.element.querySelector('[data-viz-action="play"]');button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',controller.index===vsteps(controller.visual).length-1?'重新播放步骤':'播放步骤');button.innerHTML='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg>';}}
function disposeVisuals(){for(const controller of visualControllers.values())pauseVisual(controller);visualControllers.clear();clearTimeout(visualResizeTimer);}

 element.querySelector('.viz-stage-no').textContent=String(controller.index+1).padStart(2,'0');element.querySelector('.viz-stage-title').textContent=step.title||'观察步骤';element.querySelector('.viz-stage-detail').textContent=step.detail||'';element.querySelector('.viz-range').value=controller.index;element.querySelector('.viz-range').setAttribute('aria-valuetext','第 '+(controller.index+1)+' 步，共 '+steps.length+' 步：'+step.title);element.querySelector('.viz-step-count').textContent=(controller.index+1)+' / '+steps.length;element.querySelector('[data-viz-action="previous"]').disabled=controller.index===0;element.querySelector('[data-viz-action="next"]').disabled=controller.index===steps.length-1;if(announce)element.querySelector('.viz-live-announcement').textContent='第 '+(controller.index+1)+' 步：'+step.title;visualRemembered.set(visual.id,controller.index);
}
function mountVisuals(){for(const el of document.querySelectorAll('[data-viz-id]')){const visual=visualMap.get(el.dataset.vizId);if(!visual)continue;const controller={visual,element:el,index:Math.max(0,Math.min(vsteps(visual).length-1,visualRemembered.get(visual.id)||0)),timer:null};visualControllers.set(visual.id,controller);drawVisual(controller,false,false);}}
function stepVisual(controller,index,manual=true){if(manual)pauseVisual(controller);controller.index=Math.max(0,Math.min(vsteps(controller.visual).length-1,index));drawVisual(controller,manual,true);}
function playVisual(controller){if(controller.timer){pauseVisual(controller);return;}if(vsteps(controller.visual).length<2)return;if(controller.index===vsteps(controller.visual).length-1)stepVisual(controller,0,false);const button=controller.element.querySelector('[data-viz-action="play"]');button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','暂停播放');button.innerHTML='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="4"/></svg>';controller.timer=setInterval(()=>{if(!controller.element.isConnected||document.hidden){pauseVisual(controller);return;}stepVisual(controller,controller.index+1,false);if(controller.index>=vsteps(controller.visual).length-1)pauseVisual(controller);},2200);}
function visualGallery(){const list=VISUALS.filter(v=>(visualChapterFilter==='all'||String(v.chapter)===visualChapterFilter)&&(visualTypeFilter==='all'||v.type===visualTypeFilter));return '<div class="visual-gallery-controls"><select class="input" id="visual-chapter-filter" aria-label="按章节选择图解"><option value="all">全部 '+chapters.length+' 章</option>'+chapters.map(c=>'<option value="'+esc(c.id)+'"'+(visualChapterFilter===String(c.id)?' selected':'')+'>第 '+esc(c.id)+' 章 · '+esc(c.title)+'</option>').join('')+'</select><select class="input" id="visual-type-filter" aria-label="按机制类型选择图解"><option value="all">所有机制类型</option>'+Object.entries(visualTypeNames).map(([id,name])=>'<option value="'+id+'"'+(visualTypeFilter===id?' selected':'')+'>'+name+'</option>').join('')+'</select><span class="filter-count">'+list.length+' 张图 · 默认暂停 · 可逐步观察</span></div><div class="visual-grid">'+(list.length?list.map(v=>renderVisualCard(v,true)).join(''):'<div class="empty"><strong>此组合没有可播放机制图</strong><p>第17–22章的新增原理图与专题交互位于正文；也可切换章节或机制类型。</p><button class="btn" data-nav="library">打开完整教材</button></div>')+'</div>';}
function labWorkspace(){if(labMode==='visuals')return advancedModelLinks()+'<div class="visual-intro"><span class="visual-intro-badge">'+VISUALS.length+'</span><div><strong>先看机制如何发生，再展开完整推导。</strong><p>播放或拖动步骤，追踪对象、等待队列、时间游标与样本归因的真实状态变化。选择章节与机制类型，或从上方的工具实验继续探索。</p></div></div>'+visualGallery();if(labMode==='model')return simulatorHTML();return '<div class="library-controls"><label class="filter-count" for="lab-filter">查看章节实验</label><select class="input" id="lab-filter"><option value="all">全部章节</option>'+chapters.map(c=>'<option value="'+esc(c.id)+'">第 '+esc(c.id)+' 章 · '+esc(c.title)+'</option>').join('')+'</select></div><div id="labs-list">'+renderLabList('all')+'</div>';}
function switchLabMode(mode){if(!['visuals','model','practice'].includes(mode))return;labMode=mode;disposeVisuals();document.querySelectorAll('[data-lab-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.labMode===mode);b.setAttribute('aria-selected',String(b.dataset.labMode===mode));b.tabIndex=b.dataset.labMode===mode?0:-1;});document.getElementById('lab-workspace').innerHTML=labWorkspace();document.getElementById('lab-workspace').setAttribute('aria-labelledby','tab-'+mode);if(mode==='model')updateSimulator();mountVisuals();}

document.addEventListener('input',e=>{if(e.target.matches('.viz-range')){const controller=visualControllers.get(e.target.closest('[data-viz-id]')?.dataset.vizId);if(controller)stepVisual(controller,Number(e.target.value));}});
document.addEventListener('change',e=>{if(e.target.id==='visual-chapter-filter'||e.target.id==='visual-type-filter'){if(e.target.id==='visual-chapter-filter')visualChapterFilter=e.target.value;else visualTypeFilter=e.target.value;disposeVisuals();document.getElementById('lab-workspace').innerHTML=labWorkspace();mountVisuals();}});

document.addEventListener('click',e=>{const control=e.target.closest('[data-reader-action]');if(!control)return;const key=control.dataset.readerAction;if(!['large','expanded'].includes(key))return;readerPreferences[key]=!readerPreferences[key];try{localStorage.setItem(readerPreferenceKey,JSON.stringify(readerPreferences));}catch{}control.setAttribute('aria-pressed',String(readerPreferences[key]));if(key==='expanded')document.querySelectorAll('.detail-reading').forEach(el=>el.open=readerPreferences.expanded);applyReadingPreferences();});
