哪一类？","options":["CPU 执行","runnable 调度等待","必定是网络阻塞","必定是 GC 暂停"],"answer":1,"explanation":"解除阻塞后进入 runnable，获得执行资源后才 running；应结合 P 与系统 CPU 供给分析。"},{"question":"关于 task 与 region，哪项正确？","options":["二者都必须只存在于单个 goroutine","task 可跨 goroutine，region 应在同一 goroutine 正确配对","region 可任意跨 goroutine End","task 会自动等待全部子 goroutine"],"answer":1,"explanation":"context 关联逻辑任务，region 标记当前 goroutine 区间；任务结束时间需要应用显式维护。"},{"question":"Go 1.25 的 MaxBytes=32 MiB 保证什么？","options":["进程总 RSS 不超过 32 MiB","任何快照文件严格小于 32 MiB","作为窗口容量提示参与保留策略，不提供绝对内存和输出硬上限","至少保留 32 秒"],"answer":2,"explanation":"源码文档明确将其视为 hint，容量配置优先于 MinAge，并不提供输出或内存硬保证。"},{"question":"Go 1.25 FlightRecorder 能否与 trace.Start 同时运行？","options":["能，但同一时间仅一个 recorder 和一个普通 trace 消费者","不能，二者完全互斥","能启动无限多个 recorder","只允许在 Windows 上并行"],"answer":0,"explanation":"标准库明确支持一个 flight recorder 与普通 trace 消费者并存；不要沿用早期实验 API 的限制推断。"}],"exercises":[{"question":"假设请求在 0 ms 启动，两个子任务分别在 10–70 ms、20–100 ms 执行，父任务等待两者后在 110 ms 返回。计算请求延迟与子任务累计区间，并说明优化优先级。","answer":"请求延迟为 110 ms；两个子任务区间分别为 60 和 80 ms，累计 140 ms，因重叠不能等同延迟。第二个任务在 100 ms 最晚结束，通常处于关键路径；缩短第一个任务而不改变依赖可能不改善总延迟。还需检查 0–20 ms 的调度/启动以及 100–110 ms 的收尾。"},{"question":"按与记录器窗口一致的字节口径，假设某服务 trace 数据以恒定的 12 MiB/s 产生，希望保留 15 秒。配置 MinAge=15s、MaxBytes=32 MiB 是否足以规划该历史窗口？应如何设计实验？","answer":"仅数据量模型就需要约 180 MiB；32 MiB 相当于约 2.7 秒的数据量，并非保证的覆盖时长，在该模型下不足以规划 15 秒历史。真实开销与代际粒度也会影响结果。应测定事件速率分布与峰值，增加容量预算、减少不必要的业务标注，或选择事件量更适合预算的采集实例，并以快照中实际最早事件时间验证覆盖。MaxBytes 非硬上限，还要同时监控额外内存及导出 I/O。"}],"references":["tools-trace-doc","tools-trace-cmd","tools-trace-annotation","tools-go122","tools-trace2024","tools-go125","tools-flight-blog","tools-flight-source"]},{"id":"09","title":"Delve、崩溃与现场调试","subtitle":"在理解暂停语义和现场边界的前提下检查程序状态","objectives":["选择 debug、exec、attach、test 与 core 的适用场景","使用条件断点、goroutine 和 frame 检查并发程序","理解优化构建、DWARF、内联与变量不可用的关系","安全保存崩溃现场，并区分状态证据与性能证据"],"prerequisites":"第 02、07、08 章；掌握 Go 错误、panic/recover、栈帧与并发基础。","sections":[{"title":"调试器回答状态问题，而非平均成本问题","body":"Profile 通过汇总寻找高成本路径，调试器则在具体执行点检查寄存器、局部变量、栈帧与 goroutine。“缓存键为何错误”“哪个条件阻止退出”“panic 时指针是什么”适合 Delve；“哪个函数占 20% CPU”通常应先用 pprof。断点暂停和单步会改变时间、锁竞争及外部超时，因此调试会话不能直接作为生产性能基准。\n\nDelve 理解 Go 的 goroutine、类型和运行时数据结构，并通过平台后端访问进程状态。以下列出不同的调试入口，各自会启动一个独立会话，应按场景选择执行；路径、包名与进程号需要替换成实际对象：\n\n```sh\ndlv version\ndlv debug ./cmd/service\ndlv exec ./service -- -config=test.json\ndlv test . -- -test.run '^TestPipeline$'\ndlv attach 12345\ndlv core ./service core.12345\n```\n\n`debug` 会构建关闭优化的程序并调试；`exec` 使用已有二进制；`test` 构建测试目标；`attach` 附加到已有进程；`core` 读取静态转储。参数分隔符 `--` 后面的内容交给被调试程序，而不是 Delve。本章依据 Delve v1.25.2 文档描述命令语义，安装版本应与目标 Go 工具链兼容，保留默认版本检查。[tools-delve-debug][tools-delve-exec][tools-delve-core]\n\n附加到正在运行的进程通常会暂停或干扰服务，应优先调试本地复现程序、隔离副本，或分析已有 core。现场保全包括二进制、构建 ID、源代码提交、Go 与 Delve 版本、命令行和必要配置；配置中的秘密应另外控制访问。\n\n一次调试记录应明确“观察到的状态”与“对过去的推断”。某个字段现在为零，不能独自证明它从未赋值；某个 goroutine 当前等待，也不能说明它此前一直没有进展。条件断点可以在状态将发生变化的位置取证，日志或 trace 可以补足时间顺序，core 则提供某一时刻更完整的静态现场。根据问题组合这些工具，比让单一调试器承担全部诊断更可靠。\n\n版本兼容还包含调试器自身的构建版本。Delve v1.25.2 这一固定版本的常规 Go 版本检查范围是 1.22–1.25，riscv64 还要求目标使用 Go 1.24 或更新版本；遇到 DWARFv5 可执行文件时，其兼容检查还要求 Delve 自身由 Go 1.25 或更新版本构建。只看 dlv 的发布号、或用 `--check-go-version=false` 压过错误，都不能证明运行时布局和 DWARF 读取已经兼容。版本检查通过也不代表支持所有平台与架构，仍应核对对应后端和 core 的支持矩阵。[tools-delve-compat]"},{"title":"构建信息、优化和可调试性","body":"调试器依赖调试信息将机器地址映射到源码、类型与变量位置。Go 默认优化构建通常仍带有有用调试信息，但内联、寄存器分配、常量折叠和变量生命周期缩短会使某些变量显示为优化掉、不可访问或不再位于直观位置。`-ldflags='-s -w'` 去除符号/调试信息后，源码级调试能力会进一步受限。\n\n```sh\ngo build -gcflags='all=-N -l' -o service.debug ./cmd/service\ndlv exec ./service.debug\ngo version -m ./service\ngo tool buildid ./service\n```\n\n`-N` 关闭优化，`-l` 关闭内联，是构造本地调试副本的常见方式；该副本的性能与调度不再等同生产二进制。重建一个“相同源码”的调试版本，也不能拿它解释既有生产 core 的地址。core 与二进制必须匹配，最好还保存原始构建环境与依赖信息。[tools-delve-exec]\n\n若生产问题只在优化后发生，应先使用原二进制检查可获得的信息，再构造最小复现。关闭优化后不再出现，只说明复现条件改变，不能直接断言编译器有 bug。并发时序、未同步访问或 unsafe 误用都可能受到影响。\n\n源码目录移动时，可以配置路径映射而不是改造二进制。内联函数可能对应多个机器位置，一个源码断点也可能安装到多个位置；设置后检查断点列表及实际命中栈。变量读取失败时先核对当前 goroutine、frame 和变量作用域，再考虑调试信息是否缺失。"},{"title":"断点、条件、栈帧和检查命令","body":"一个有效会话从明确问题开始。例如“只有 id=2 的 worker 返回错误”，就应在 worker 的关键位置设置条件断点，而非反复暂停全部任务。下面是 Delve 提示符中的命令，不是 shell 命令：\n\n```text\nbreak workerEntry main.worker\ncondition workerEntry id == 2\ncontinue\nargs\nlocals\nprint id\nstack 10\nframe 1\nlist\nbreakpoints\n```\n\n`break` 支持函数、文件行与其他 location spec；`condition` 支持断点名称或编号。条件只能使用该执行位置可访问的表达式，错误条件或优化后的不可用变量都需要检查。`args` 与 `locals` 分别查看参数和局部变量；`frame` 改变检查上下文，不会让程序倒退执行。[tools-delve-cli]\n\n`next` 跨过当前源码行的调用，`step` 进入可单步的调用，`stepout` 运行到当前函数返回。它们是源码级控制指令，不承诺每次正好执行一个机器指令；编译器移动、内联、defer 与调度都会影响所见位置。继续运行时也可能先命中其他断点。\n\n`trace` 命令设置 tracepoint，命中后显示信息并继续，而非等待用户交互。它与 `runtime/trace` 执行追踪完全不同；其实现仍可能需要陷入调试器并造成开销。`set` 修改状态，`call` 可执行函数且可能阻塞或产生副作用，应明确区分观察与干预。排查初期优先只读变量、栈和反汇编，避免把现场改成另一个状态。\n\n查看复杂对象时应逐步展开。先检查长度、容量、关键字段和指针是否为空，再按需读取部分元素，避免一次打印巨大的映射或缓冲区拖慢调试器并暴露无关数据。界面截断也不代表对象真的只有显示出的元素；需要核对输出配置和实际长度。\n\n对于错误路径，可以在生成错误的位置断住，向上检查调用者是否丢弃、包装或错误地重试。若只在最终 panic 位置检查，原始输入和中间状态可能早已不可用。断点位置应由具体假设驱动，并在每次命中时记录必要字段；大量无条件断点会改变调度，增加噪声。"},{"title":"Goroutine 与线程：选择检查上下文与恢复执行","body":"Go 的 goroutine 在多个操作系统线程间调度，goroutine ID 与线程 ID 不是同一标识。`goroutines` 列出逻辑执行单元，`threads` 列出后端跟踪的系统线程。选择 goroutine 后可以查看它的栈，即使它当前停在同步等待而没有独占某个线程。\n\n```text\ngoroutines\nthreads\ngoroutine 17\nstack 20\ngoroutine 17 print requestID\nthread 1234\n```\n\n这里的 17 与 1234 仅为示例，应使用当前列表中的实际 ID。goroutine ID 只在该进程现场有意义，不能在重启后拿它当稳定业务标识。调试器通常需要协调多个线程的停止状态；选择 goroutine 只是选择观察/操作上下文，并不意味着后续 continue 只让它运行。\n\n若需要针对已知 goroutine 限定断点，Delve 支持条件表达式，例如：\n\n```text\ncondition workerEntry runtime.curg.goid == 17\n```\n\n这是 Delve 提供的调试表达式惯例，不是业务程序应依赖的公开 Go goroutine ID API。普通业务代码不应通过解析栈文本获取 ID 建立逻辑。条件求值和断点命中仍会干扰调度，应限制频度。[tools-delve-cli]\n\n调试死锁时先画出等待依赖：A 等哪个锁或 channel，谁能解除该等待，解除方又等什么。检查锁顺序、channel 的生产者与关闭者、WaitGroup 计数以及取消信号。单步可能暂时消除竞态，暂停也可能让外部系统超时；如果现场只在真实并发下出现，转向低侵入 trace、race detector 的独立实验或录制重放方案更合适。"},{"title":"Panic、core 与离线分析","body":"未恢复 panic 打印的栈，是获取成本较低的崩溃证据之一，但通常不足以恢复全部堆对象和其他线程状态。`GOTRACEBACK` 控制崩溃时的栈输出范围；`crash` 在相应平台上以触发系统崩溃转储的方式退出。实际是否生成 core 还取决于 shell 限额、内核 core_pattern、容器配置和 systemd-coredump 等收集器。[tools-runtime-debug]\n\n以下 Linux shell 命令仅用于本章的隔离实验程序；先按 9.6 构建 debug-lab，`-crash` 会故意结束该测试进程：\n\n```sh\nulimit -c unlimited\ncat /proc/sys/kernel/core_pattern\nGOTRACEBACK=crash ./debug-lab -crash\n```\n\n不要假设文件一定名为 `core` 并出现在当前目录。若系统交给转储服务管理，应先查询本机收集方式；获得实际文件后使用匹配的二进制打开：\n\n```sh\ndlv core ./debug-lab ./actual.core\n```\n\n也可在 Delve 暂停的本地实验进程内执行 `dump snapshot.core`。v1.25.2 文档说明原生 core 输入覆盖 Linux amd64/arm64、Windows amd64 minidump 及 Delve 自己生成的 dump；平台和架构支持不是无限的，应查本地 `dlv help core`。离线 core 没有“继续执行”的能力，它是转储采集时刻的寄存器与内存现场。[tools-delve-core][tools-delve-cli]\n\nCore 可能包含请求正文、认证材料、密钥及堆中的业务数据，体积也可能很大。保全时记录校验值、访问范围和保留期；共享教材或工单只提供脱敏的栈与必要字段。源码重建、调试符号和 core 的匹配性比截图更重要。\n\n转储分析的结论也有边界。一个线程停在系统调用里，并不能仅凭 core 得到该调用已经持续多久；一个锁处于锁定状态，也不必然说明死锁。静态现场需要与故障前日志、指标、超时记录以及其他 goroutine 的依赖一起解读。对于尚在运行的复现进程，必要时可以间隔采集多次受控转储，比较状态是否持续无进展；已经退出的进程无法补采过去的现场。\n\n现场涉及本地原生库时，还应保存对应共享库与映射信息。只有 Go 主二进制可能不足以解释原生栈；缺少符号时可以先记录地址与模块偏移，明确未解析范围，而不是把未知帧随意归入 Go 运行时。\n\n每份转储应同时标注采集触发原因、时间边界和已知缺失的映射，防止后续审阅者把不完整现场理解为全部执行历史。\n\n## Go 1.23+：使用 SetCrashOutput 保存额外崩溃文本\n\n`debug.SetCrashOutput(f, debug.CrashOptions{})` 从 Go 1.23 起支持把未处理 panic 和其他 fatal error 的文本额外写到一个文件，标准错误输出仍然保留。它配置的是单一额外目标：再次调用会替换旧目标；传入 nil 可关闭。运行时复制文件描述符，因此成功返回后调用方可以关闭原 `f`，但仍须检查设置错误。若替换目标与崩溃并发，部分正在写出的内容可能继续进入旧目标。[tools-crash-output]\n\n它不是 panic 恢复接口，不生成可供 Delve 使用的 core，也不捕获被应用 recover 吞掉的 panic。SIGKILL、容器 OOM kill 或机器断电未必给 Go 运行时输出机会；不能用“没有崩溃文件”证明程序正常退出。应在启动阶段设置受控输出，结合退出状态、日志和系统转储收集机制分析。崩溃文本同样可能包含敏感栈信息，需要控制文件权限与保留范围。"},{"title":"完整实验与远程调试边界","body":"以下完整程序保存为 `debug.go`，三个 worker 的参数和局部变量可供观察，`-crash` 是显式的本地崩溃实验开关。\n\n```go\npackage main\n\nimport (\n\t\"flag\"\n\t\"fmt\"\n)\n\nfunc worker(id int, out chan<- int) {\n\ttotal := 0\n\tfor i := 0; i < 5; i++ {\n\t\ttotal += id + i\n\t}\n\tout <- total\n}\n\nfunc main() {\n\tcrash := flag.Bool(\"crash\", false, \"panic after local experiment\")\n\tflag.Parse()\n\tout := make(chan int)\n\tfor id := 1; id <= 3; id++ {\n\t\tgo worker(id, out)\n\t}\n\tfor i := 0; i < 3; i++ {\n\t\tfmt.Println(<-out)\n\t}\n\tif *crash {\n\t\tpanic(\"intentional local experiment\")\n\t}\n}\n```\n\n```sh\ngo build -gcflags='all=-N -l' -o debug-lab debug.go\ndlv exec ./debug-lab\n```\n\n按 9.3 设置条件断点后检查 id；在循环内部设置行断点观察 total，再检查其余 goroutine 停在何处、是否等待发送，以及是否已经进入 worker。进程暂停时显示的运行时状态不表示它此刻仍在消耗 CPU。程序打印顺序不固定，条件断点不会把并发程序变成具有固定执行顺序的程序。\n\n远程调试服务具有读取和修改目标内存、继续执行乃至调用函数的能力，不是可公开的只读诊断网页。若隔离开发环境确需 headless 模式，应绑定 loopback，通过受控隧道连接并保留默认同用户检查：\n\n```sh\ndlv exec ./debug-lab --headless --listen=127.0.0.1:2345 --api-version=2\n```\n\n另一终端通过 `dlv connect 127.0.0.1:2345` 连接。不要把 `--accept-multiclient` 理解成认证，也不要为了方便将监听地址改成公网通配地址。容器中的 ptrace 权限需要按平台最小范围配置，不能照搬“完全特权”作为默认安装步骤。[tools-delve-exec]"}],"labs":[{"title":"从条件断点到离线现场","steps":["以调试构建运行 debug.go，设置 id==2 的 worker 条件断点并检查参数、局部变量和调用栈。","列出 goroutines 和 threads，说明两种 ID 的差别以及哪些 goroutine 正在等待。","保存一个本地 Delve dump，退出后用匹配二进制尝试 dlv core；若平台不支持，记录准确错误与支持矩阵。","用默认优化重新构建另一个二进制并比较单步和变量可见性，不能将新二进制用于旧 core。","完成后退出调试器和监听服务；交付脱敏命令记录、版本及状态解释，不用断点期间耗时宣称性能结论。"]}],"quiz":[{"question":"选择 goroutine 17 后执行 continue，意味着什么？","options":["保证只有 goroutine 17 运行","选择检查上下文不等于只恢复一个 goroutine","所有其他 goroutine 永久停止","线程 ID 也自动变为 17"],"answer":1,"explanation":"goroutine 与系统线程由调度器映射，调试上下文选择不等于独占执行或线程调度策略。"},{"question":"生产 core 应搭配哪一个二进制？","options":["同源码重建且关闭优化的任意文件","实际生成该现场的匹配二进制","只要 main 函数同名即可","最新版服务二进制"],"answer":1,"explanation":"地址布局、构建信息和调试数据必须匹配；同源码重建也可能改变地址与布局。"},{"question":"Delve tracepoint 与 runtime/trace 的关系是什么？","options":["同一种事件文件的两个入口","前者是自动继续的调试断点，后者是运行时事件追踪","二者都不产生开销","前者能导出全部 GC 时序"],"answer":1,"explanation":"名字相似但机制与数据不同；调试 tracepoint 仍可能造成陷入与停顿。"},{"question":"调试构建消除了问题，能否直接证明优化器错误？","options":["能，关闭优化就是证明","不能，并发时序、未同步访问和 unsafe 误用等也可能受到影响","能，只要某个变量不可见","不能，但可直接忽略生产问题"],"answer":1,"explanation":"构建改变了性能和调度，需要最小复现、正确性检查与原构建证据，才能讨论编译器缺陷。"}],"exercises":[{"question":"goroutine A 持有 mu 并等待 ack 接收；goroutine B 必须取得 mu 后才能向 ack 发送确认。说明死锁依赖并给出检查与修复方案。","answer":"A 等待 B 的确认，B 等待 A 释放 mu，形成 A→B→A 的环。用 A、B 的栈、channel 与锁的地址，以及源码中的加锁、解锁和收发路径，确认它们确实引用同一组资源。普通 sync.Mutex 不记录一个可直接查询的所属 goroutine，不能只看锁结构就确定谁应解锁。可在不破坏不变量的前提下先释放锁再等待确认，或重新设计所有权与消息协议，避免持锁等待依赖自己锁的操作；通过超时、取消和并发重复测试验证。"},{"question":"某变量在 Delve 显示不可用。给出从低成本到高成本的排查顺序。","answer":"先确认当前 goroutine、frame、源码位置与作用域；再检查是否已过变量存活期、函数内联和优化情况；核对二进制与源码及 core 是否匹配、DWARF 是否被移除；最后在隔离环境以 -N -l 构建复现。不可用不等于变量为零，也不允许用调试副本替代生产 core 的匹配文件。"}],"references":["tools-delve-debug","tools-delve-exec","tools-delve-cli","tools-delve-core","tools-delve-compat","tools-runtime-debug","tools-crash-output"]},{"id":"10","title":"运行时诊断与操作系统工具","subtitle":"建立从低成本指标到内核观测的分层证据链","objectives":["读取 runtime/metrics 并正确区分计数器、瞬时量和直方图","建立受控的 pprof/trace 诊断端点并管理采集开销","解释 GODEBUG、perf、strace 与 eBPF 各自的测量边界","把 Go 调度、内核线程和容器资源约束关联起来"],"prerequisites":"第 02、05–09 章；具备 Linux 进程、线程、系统调用和容器资源的基本知识。","sections":[{"title":"分层工具与生态地图","body":"当服务慢时，不应同时开启所有工具并希望自动出现答案。先写出待验证问题：是否 CPU 饱和、是否堆增长、是否同步竞争、是否下游等待、是否被容器节流。然后选择能观察该机制且成本最低的工具，再用更细证据解释异常。\n\n| 层次 | 工具 | 能回答 | 主要边界 |\n|---|---|---|---|\n| 运行时总量 | runtime/metrics、GODEBUG | GC、分配、调度和锁等待趋势 | 缺少完整业务归因 |\n| 调用栈聚合 | pprof | CPU、分配、同步热点 | 不保留完整时间顺序 |\n| 运行时时序 | go tool trace | goroutine 依赖与调度延迟 | 不覆盖所有进程/内核细节 |\n| 具体状态 | Delve、core | 变量、栈和崩溃现场 | 暂停会扰动执行 |\n| 系统执行 | perf | 计数器、CPU 栈、内核事件 | 线程不等于 goroutine |\n| 系统调用 | strace | syscall 参数、结果、时长 | 不能直接观察 Go channel |\n| 可编程内核观测 | eBPF | 调度、I/O、网络等定制事件 | 受权限、内核与展开能力约束 |\n\n保持单位和身份可对齐：记录 PID、容器、构建、时间窗口及逻辑请求类别。进程 PID 可以复用，容器内外 PID 命名空间不同；一个 Go goroutine 会跨线程迁移。只有名称类似的事件不足以证明它们属于同一请求。\n\n## 生态工具地图：补足等待、发现、指标与机器码\n\n### fgprof：同时看计算和等待的聚合栈\n\nfgprof v0.9.5 是 wall-clock profiler：按名义 99 Hz 调用 goroutine 栈采样接口，覆盖正在执行以及等待 I/O、channel、锁等状态的 goroutine，并输出 pprof 或 folded 格式。它适合“请求很慢但 CPU profile 没有大热点”的混合计算与等待负载。汇总权重近似为 goroutine 时间，多条并发或空闲等待栈可以叠加超过墙钟窗口；它不是进程 CPU 使用量。[tools-fgprof][tools-fgprof-source]\n\n与内核线程 off-CPU 工具不同，fgprof 观察 Go goroutine 层；但聚合结果仍不保留请求依赖与完整事件顺序，不能直接证明等待因果。长期空闲 worker 可能很宽，应结合业务类别和 trace 判断。开销随 goroutine 数增加，采样 goroutine 自身还可能受到调度延迟影响；旧 Go 版本有明显暂停风险，版本升级和本机评估都必要。把处理器注册到受控诊断 mux 后，可以用熟悉的 pprof 界面阅读。\n\n### google/gops：发现进程，再进入已启用的诊断能力\n\ngops v0.3.28 可列出 Go 进程的 PID、构建版本和程序路径；启动诊断 agent 的进程会被特别标记。能发现进程并不表示能读取它的 Go 栈或 profile：高级能力要求目标程序显式运行 `agent.Listen`，并能访问其诊断端口。典型查询入口如下，数字仅为示例 PID：\n\n```sh\ngops\ngops 12345\ngops stack 12345\ngops memstats 12345\n```\n\n本地 PID 模式要求同用户环境和可用的端口发现配置，远程模式使用明确的地址。v0.3.28 默认监听 loopback 随机 TCP 端口，但源码明确同机其他程序也能连接；同用户发现约定并非 TCP 身份认证。诊断接口还可触发 GC、改变 GC 参数和采集 trace，不能按只读网页对待。进程元数据权限、容器 PID 命名空间以及 listener 可达性都可能限制使用。[tools-gops][tools-gops-agent]\n\n### expvar：暴露聚合计数，不提供调用栈\n\n标准库 expvar 将整数、浮点数、映射与回调计算值以 JSON 暴露在 `/debug/vars`。它适合请求计数、缓存条目等简单业务状态；使用自定义 mux 时应显式注册 `expvar.Handler()`。导入包不会自动启动服务器，默认还会注册命令行参数与 memstats，诊断边界应与 pprof 一起管理。[tools-expvar]\n\n原子更新一个计数器不代表读取多个变量得到同一时刻的事务快照；回调暴露的数据也需要应用自行保证并发安全。计数器做区间差分，再除以窗口时长，才能得到该窗口的平均速率。但这些计数无法告诉你哪条调用栈消耗 CPU、哪些对象被保留或一次请求如何排队。用它发现趋势，再用 metrics、pprof 和 trace 查机制，职责更清晰。\n\n### nm 与 objdump：验证编译器实际生成了什么\n\n`go tool nm` 列出目标文件、归档或可执行文件中的符号、地址和类型，`-size` 显示大小，按 size 排序可检查代码或数据体积；`go tool objdump` 反汇编匹配符号，`-S` 交错显示可找到的源码。例如可使用第 09 章已有的调试二进制：\n\n```sh\ngo tool nm -size -sort size ./debug-lab\ngo tool objdump -S -s 'main[.]worker' ./debug-lab\n```\n\n它们适合验证函数是否保留、调用是否内联以及热循环生成的指令。符号大小不是执行成本，指令条数也不等于运行时间；必须与 profile 的热点权重和真实构建相结合。内联、裁剪和符号剥离会影响结果，分析生产问题时应使用生产匹配产物。[tools-nm][tools-objdump]\n\nfgprof 的一个具体反例：只考虑主 goroutine 等待 10 秒、四个 worker 同时各活动 10 秒这五条栈，聚合总量约为 50 goroutine 秒，主等待栈约占 20%。这不表示主 goroutine 消耗了 20% CPU，也不表示删除其等待就能加速请求；它可能恰好是正确等待子任务的汇合点。v0.9.5 只去除采集器自身栈，并不会自动识别这种业务等待为无用工作。[tools-fgprof-source]"},{"title":"runtime/metrics：稳定名称、明确种类和区间差分","body":"`runtime/metrics` 提供带单位的名称与类型，使用 `metrics.All()` 查询当前工具链支持的集合，再读 `Description.Kind`、`Cumulative` 和说明文字。名称未知时返回 `KindBad`；不要因开发机存在某个指标就假定所有生产 Go 版本都支持。估计速率时，计数器需要差分后除以窗口时长；瞬时量可直接观察数值与趋势；累计直方图需要逐桶相减得到区间分布。前后样本应来自同一未重启进程，并使用一致的指标定义和桶边界。[tools-metrics][tools-metrics-read]\n\n常用指标包括 `/gc/heap/allocs:bytes`、`/gc/heap/live:bytes`、`/sched/goroutines:goroutines`、`/sched/latencies:seconds` 和 `/sync/mutex/wait/total:seconds`。其中 live 反映上一次 GC 标记的存活对象占用量，并不是任意时刻所有已分配堆内存的精确值。最后一项近似累计 goroutine 在 sync.Mutex、sync.RWMutex 和运行时内部锁上的阻塞时间，用于发现整体竞争变化；要归因仍需 mutex/block profile。调度直方图统计 runnable 到实际运行的时间，不包括所有阻塞时间。\n\n一个易错点是 `/cpu/classes/total:cpu-seconds`：它表示由 GOMAXPROCS 积分得到的估计可用 CPU 时间，包含该分类体系中的 idle，并不是操作系统记录的实际进程 CPU 消耗。官方明确 `/cpu/classes` 的估计值不能直接与系统 CPU 时间比较，宜在同一分类家族内比较比例。[tools-metrics]\n\n下面是完整的指标读取程序，保存为 `metrics.go`。它打印标量指标的当前读数与累计直方图的事件总数：其中分配字节和锁等待是累计量，live 则是上一次 GC 得到的存活堆值。这些输出均不应直接标为每秒速率：\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime/metrics\"\n\t\"time\"\n)\n\nfunc main() {\n\tsamples := []metrics.Sample{\n\t\t{Name: \"/gc/heap/allocs:bytes\"},\n\t\t{Name: \"/gc/heap/live:bytes\"},\n\t\t{Name: \"/sched/latencies:seconds\"},\n\t\t{Name: \"/sync/mutex/wait/total:seconds\"},\n\t}\n\tfor round := 0; round < 3; round++ {\n\t\tmetrics.Read(samples)\n\t\tfor _, s := range samples {\n\t\t\tswitch s.Value.Kind() {\n\t\t\tcase metrics.KindUint64:\n\t\t\t\tfmt.Println(s.Name, s.Value.Uint64())\n\t\t\tcase metrics.KindFloat64:\n\t\t\t\tfmt.Println(s.Name, s.Value.Float64())\n\t\t\tcase metrics.KindFloat64Histogram:\n\t\t\t\th := s.Value.Float64Histogram()\n\t\t\t\tvar n uint64\n\t\t\t\tfor _, count := range h.Counts {\n\t\t\t\t\tn += count\n\t\t\t\t}\n\t\t\t\tfmt.Println(s.Name, \"cumulative events\", n)\n\t\t\tdefault:\n\t\t\t\tfmt.Println(s.Name, \"unsupported\")\n\t\t\t}\n\t\t}\n\t\ttime.Sleep(time.Second)\n\t}\n}\n```\n\n这个短程序没有主动制造业务负载或触发 GC，部分读数可能很小或保持为零，应先核对指标定义再解读。重复读取可能复用内部存储，特别是直方图切片；若保存旧窗口或跨 goroutine 传递，必须深拷贝所需数据，避免前一次快照被覆盖或发生数据竞争。同一批读取也不应被想当然地当作所有字段的事务性业务快照。[tools-metrics-read]"},{"title":"GODEBUG：快速观察 GC 与调度趋势","body":"GODEBUG 适合在受控进程中临时输出运行时诊断信息；不同 Go 版本支持项和输出格式可能改变，解析前阅读对应版本文档。启动时指定仅影响该命令，不要为了一个实验修改全局环境。\n\n```sh\nGODEBUG=gctrace=1 ./service\nGODEBUG=schedtrace=1000,scheddetail=1 ./service\nGODEBUG=scavtrace=1 ./service\n```\n\n`gctrace` 输出 GC 周期、相关时间与堆规模等信息；`schedtrace=1000` 大约每 1000 ms 输出调度摘要，`scheddetail=1` 加入更细的 P、M、G 状态；`scavtrace` 观察向操作系统归还内存的情况，区分后台清退和主动清退等统计。摘要中的字段不是统一口径的请求延迟，更不应把不同列的 wall time 和 CPU time 随意相加。[tools-runtime-debug]\n\n调度队列持续增长而可用 P 全忙，支持 CPU 供给不足的假设；goroutine 多而队列短、P 空闲，则可能正常等待或依赖外部资源。这里“空闲”需要和容器配额一起解释：进程可见很多逻辑核，但 cgroup 的时间配额较小，会出现宿主机看似空闲、容器却被节流的情况。\n\nGo 1.25 改进了容器环境下默认 GOMAXPROCS 的选择和自动更新，但具体行为还受模块语言版本影响：本书 lab 的 go.mod 声明 go 1.22，因此在没有显式覆盖相关设置时默认保留旧行为，详见第 02 章。对配额实验同时记录 Go 工具链、go.mod、显式 GOMAXPROCS 与相关 GODEBUG，不能仅凭运行 go version 就推断新策略已启用。不要把手工设置一个很大的 GOMAXPROCS 当作普遍优化；更多并发执行者可能加重争用和配额突发。应记录实际值并检查相应版本说明。[tools-go125]\n\n运行时文本诊断可能产生大量 stderr 数据，详细调度输出尤其如此。小范围、短窗口使用并记录启停时间；长期监控优先使用结构化 metrics。"},{"title":"runtime/debug：区分读取、干预和完整堆转储","body":"`runtime/debug` 既提供诊断数据，也提供改变运行时行为的控制接口；名称中带 debug 不代表只读。`ReadGCStats` 读取 GC 次数与有限的近期暂停记录，适合快速检查，不是整个进程生命周期的完整暂停事件日志。长期监控应优先使用结构化指标和明确定义的统计窗口。[tools-runtime-debug-api]\n\n| API | 行为 | 使用边界 |\n|---|---|---|\n| SetGCPercent | 改变 GC 增长目标并返回旧值 | 影响整个进程，不能当作无副作用 getter |\n| SetMemoryLimit | 改变软内存限制并返回旧值 | 负参数只读取当前限制 |\n| FreeOSMemory | 强制 GC 并尽力归还内存 | 会扰动执行，不适合请求热路径 |\n| SetTraceback | 改变崩溃栈详细程度 | 不能降低环境变量要求的详细级别 |\n| WriteHeapDump | 输出对象级堆转储 | 写出期间暂停全部 goroutine |\n\n特别注意，`debug.SetMemoryLimit(-1)` 是读取当前限制的合法方式，但 `debug.SetGCPercent(-1)` 会关闭按普通增长目标触发的 GC；达到软内存限制时仍可能回收，不能因为两者名字类似就推断负值含义相同。动态参数实验应由单一管理者实施，记录原值、变更时刻和恢复方式。\n\n`FreeOSMemory` 可以帮助区分运行时保留页与不可回收存活集，但调用后 RSS 降低只证明此时能归还部分内存，不能证明此前的分配策略合理。它还改变后续分配和缺页行为，所以不应通过每请求强制回收“修复”内存曲线。\n\n`WriteHeapDump` 与 `pprof.WriteHeapProfile` 完全不同：前者输出对象与引用层面的特定堆转储格式，后者输出按分配栈采样聚合的数据。完整转储需要专门读取工具，不能直接交给 `go tool pprof`。官方还要求输出目标不能是由同一个 Go 进程另一端消费的管道或套接字，因为全部 goroutine 被暂停时可能无法排空写入。这种操作必须在已评估暂停和存储预算的隔离场景下使用。"},{"title":"诊断端点：可访问性、隔离与采集控制","body":"以下是完整的本地诊断服务器，保存为 `diagnostics.go`。实际服务可将相同路由放进独立的诊断 listener。使用显式 mux 避免误以为注册到 DefaultServeMux 的端点会自动出现在自定义服务器里；Go 1.22+ 的 `GET ...` 方法路由限制常见非读取方法，但标准 ServeMux 的 GET 模式也匹配 HEAD。自定义 mux 必须自行采用方法模式；处理器函数本身不普遍替调用方检查方法。\n\n```go\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\thttppprof \"net/http/pprof\"\n\t\"time\"\n)\n\nfunc main() {\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /debug/pprof/\", httppprof.Index)\n\tmux.HandleFunc(\"GET /debug/pprof/profile\", httppprof.Profile)\n\tmux.HandleFunc(\"GET /debug/pprof/trace\", httppprof.Trace)\n\tsrv := &http.Server{\n\t\tAddr:              \"127.0.0.1:6060\",\n\t\tHandler:           mux,\n\t\tReadHeaderTimeout: 3 * time.Second,\n\t}\n\tlog.Fatal(srv.ListenAndServe())\n}\n```\n\n导入 `net/http/pprof` 本身不会启动 listener，也不会自动启用 block 和 mutex 采集率。heap 默认以二进制输出；未设置 seconds 时，`debug>0` 切换可读文本，`heap?gc=1` 先触发 GC；CPU 的 `seconds` 是采集时长，而 heap/block/mutex 等的 `seconds` 是前后快照差分，含义不可互换。heap 同时设置 seconds 与 gc=1 时进入差分分支，不执行该处理器的强制 GC 分支；差分也不支持 debug>0。[tools-http-pprof]\n\nLoopback 绑定降低误暴露机会，但并不等于完整认证体系；同主机、代理转发和容器网络仍需按部署边界处理。生产访问应通过受控管理网络、已有认证代理或授权隧道。profile、trace 与栈可能包含标签和运行细节，应按诊断数据管理。\n\n采集控制至少要约束并发次数、窗口上限和文件保留。CPU 与普通 trace 各有全局活动限制，多个运维自动任务不能无限重试争抢；高频强制 GC 或超长 trace 也会扰动业务。服务端采集失败要检查 HTTP 状态和文件可解析性，不能把错误响应保存成 `.pprof` 后认为采集成功。"},{"title":"perf 与 strace：观察线程和内核边界","body":"Linux `perf` 可读取性能计数器并采样执行栈。先用 `perf stat` 查看任务时钟、上下文切换及硬件计数，再用 `perf record` 定位执行位置。以下为针对自有实验进程的示例，先将目标 PID 替换为实际值，并确认进程能覆盖整个采集窗口；权限和可用事件取决于本机 perf_event 配置。每轮应在独立输出目录运行，避免 perf.data 和后续 syscalls.log 覆盖先前结果。\n\n```sh\ntarget_pid=12345\nperf stat -p \"$target_pid\" -- sleep 10\nperf record -F 99 --call-graph dwarf -p \"$target_pid\" -- sleep 10\nperf report\n```\n\n`--call-graph dwarf` 需要保存用户栈并展开，可能产生明显数据量与开销；frame pointer 模式依赖目标架构和编译产物保留可靠链。cgo、Go 栈增长、内联、内核符号和容器映射都可能影响栈质量。perf 的线程视角可以补足内核执行热点，但不能自动把一个线程的全部成本分给某个 goroutine。[tools-perf]\n\n`strace` 记录系统调用边界，适合解释重复失败、futex、epoll、打开文件和网络读写等行为。`-T` 显示 syscall 进入到返回的墙钟间隔，不是纯 CPU 时间；阻塞 syscall 可以持续很久却几乎不消耗 CPU。`-c` 的汇总和 `-w` 的墙钟汇总有不同计时口径，解读前确认实际参数。[tools-strace]\n\n```sh\ntimeout --signal=INT 10s strace -f -T -tt   -e trace=futex,epoll_wait,epoll_pwait   -o syscalls.log -p \"$target_pid\"\n```\n\nGo 的许多 channel 操作和用户态调度不会触发 syscall，所以 strace 中看不到不等于它们没有发生。附加追踪器会改变 syscall 性能，尤其高频 I/O；应限制事件种类和时间窗口。若扩展到 read/write 参数，需要考虑输出包含业务正文的风险。"},{"title":"eBPF、容器资源与跨层归因","body":"eBPF 允许在受验证的内核执行环境中处理事件，并通过 map 或事件缓冲区把聚合数据送到用户态。Tracepoint、kprobe、uprobe 等附着点观察的对象不同；成熟工具通常将内核采集程序、用户态符号化、栈展开与聚合结合起来。验证器保障特定程序安全属性，并不保证观测零开销、数据无丢失或业务归因准确。[tools-ebpf]\n\nOn-CPU 采样适合找执行热点；调度切换事件可构造线程 off-CPU 时间；网络和块设备事件能定位外部等待。对 Go 服务必须注意两层调度：goroutine 在用户态等待 channel 时，线程可能立即去执行另一个 goroutine；线程 off-CPU 的开始/结束也不自动对应某个请求。因此声称“无侵入精确得到所有 Go 请求等待时间”的方案，需要明确它如何识别 goroutine、处理版本布局、关联上下文及展开用户栈。\n\nLinux 容器排查还应读取 cgroup 配额、节流计数、内存事件与压力指标，并区分容器视图和宿主机视图。cgroup v2 的 `cpu.stat`、`cpu.max`、`memory.events` 等路径与归属由实际部署决定，不能直接假定任意 `/sys/fs/cgroup` 文件就是目标服务所属组。结合 `/proc/<pid>/cgroup` 与部署配置定位后再解释。\n\n当 CPU profile 有稳定计算热点且 perf 同样指向相应用户栈，计算解释更有力；当 trace 显示很长 runnable 间隔而 cgroup 节流同步增加，应优先分析 CPU 供给；当 Go 堆稳定而 RSS 增长，应检查 mmap/cgo 和内核映射；当 syscall 延迟高而进程 CPU 低，则需进一步追踪 I/O 或远端依赖。每项结论都应明确各工具覆盖了什么，以及仍有哪些未知项。"},{"title":"建立可重复的分层诊断流程","body":"第一步固定负载与身份，记录构建、工具链、PID/容器、时间边界、GOMAXPROCS 和资源限额。第二步观察低成本总量：吞吐、错误率、延迟、CPU、内存、GC、调度与锁等待趋势。第三步用对应 profile 找候选调用路径。第四步在需要因果顺序时补 trace，在需要具体状态时补 Delve/core，在运行时解释不到的位置补 perf、strace 或 eBPF。\n\n每一轮只验证一个主要机制。例如“编码路径的分配速率过高导致 GC assist 增加”需要 alloc profile 指向编码栈、GC/CPU 证据支持 assist 成本，以及减少分配后同等负载的改善；仅看到 gctrace 频繁输出不能完成证明。排查阶段改变了采样率或构建参数，也必须写入实验记录。\n\n跨工具对账不要追求不可能的逐字节或逐纳秒相等。它们可能使用不同对象集合、采样机制、时钟、窗口和版本语义。先列出口径，再解释差异：pprof CPU 是执行采样估计，runtime CPU classes 是运行时分类估计，操作系统 CPU 是内核记账；三者可以趋势一致而数值不完全相同。\n\n最后用不依赖诊断采集的重复基准或服务实验验证修改，检查功能、吞吐、延迟与资源是否共同满足目标。原始数据、命令和清晰的未知项，是可复核工程结论的一部分。下一章将以这套证据选择优化与 PGO 策略。"}],"labs":[{"title":"同一现象的分层观测","steps":["运行 metrics.go，并通过当前工具链的 metrics.All() 核对名称、种类与 Cumulative；把一个累计计数的区间增量除以窗口时长，转换成平均速率，直方图差分时深拷贝旧桶。","启动 diagnostics.go，确认仅 loopback 监听并分别采集 CPU、heap、goroutine；检查 HTTP 状态与文件可解析性。","在第 07 章锁实验中短时开启 schedtrace，并保证实验持续时间覆盖多个输出周期；分别采集 block/mutex 与 trace，说明各工具的观察粒度。必要时延长循环次数，但各对照轮次保持相同工作量。","在支持的 Linux 隔离环境中，对同一实验进程运行有界 perf 或 strace；权限不足时记录实际限制，不修改宿主机全局安全策略。","提交分层对照表，列出每项指标单位、累计/瞬时属性、时间窗口、版本、采样设置与无法解释的剩余部分。"]}],"quiz":[{"question":"/cpu/classes/total:cpu-seconds 能否当作进程实际 CPU 消耗？","options":["能，它就是内核 task-clock","不能，它是由 GOMAXPROCS 积分得到的估计可用 CPU 总量","只能在单核 Linux 上精确相等","它表示全部请求延迟"],"answer":1,"explanation":"该家族为运行时估计分类，total 包含可用容量中的 idle；官方要求不要直接与系统 CPU 时间比较。"},{"question":"保存 Float64Histogram 指针作为上次快照后再次 metrics.Read，主要风险是什么？","options":["直方图单位变成字节","底层存储被复用，旧快照被覆盖或并发访问产生数据竞争","自动清空全部 runtime 指标","Go 自动深拷贝，因此没有风险"],"answer":1,"explanation":"Read 可能复用指针型 Value 的存储；差分保留旧样本或跨 goroutine 传递时，需要深拷贝所需数据。"},{"question":"strace 中 epoll_wait 的 -T 显示 3 秒，说明什么？","options":["CPU 执行内核代码 3 秒","系统调用从进入到返回经过约 3 秒墙钟时间","所有 goroutine 都等待 3 秒","CPU profile 应出现同样 3 秒"],"answer":1,"explanation":"阻塞调用的墙钟持续时间包含睡眠，不能直接当作计算消耗或所有 goroutine 的等待。"},{"question":"eBPF 线程 off-CPU 数据为何不能直接等同 Go 请求等待？","options":["eBPF 不支持 Linux","Go 存在 goroutine 到线程的用户态调度与迁移","Go 程序从不使用线程","所有 Go 等待都在内核完成"],"answer":1,"explanation":"一个线程可承载多个 goroutine，用户态阻塞后也可能运行其他工作；需要明确关联机制才能做请求级归因。"}],"exercises":[{"question":"在同一未重启进程的 5 秒窗口内，累计分配增加 500 MiB，锁等待指标增加 40 秒，GOMAXPROCS 固定为 4，CPU classes total 增加约 20 秒。分别解释这些数值；若估计平均同时等待人数，还需什么前提？哪些数值不能直接相加？","answer":"分配速率约 100 MiB/s。40 秒锁等待是多个 goroutine 等待时间的累计估计，覆盖用户同步锁及运行时内部锁；仅当估计误差与跨窗口等待的记账影响可忽略时，40/5 才近似对应平均 8 个 goroutine 同时等待。若有很长的未完成等待或窗口前已开始的等待，应像第 07 章一样检查边界，不能直接解释为精确人数。CPU classes total 的 20 CPU 秒是 4×5 秒的估计可用容量，不是已使用 20 CPU 秒。分配、等待与可用 CPU 属于不同量纲/对象集合，不能相加，也不能据此直接得到请求耗时或 OS CPU 利用率。"},{"question":"假设 runtime.MemStats.HeapInuse 稳定、进程 RSS 持续上升，CPU 与 goroutine 数稳定。提出三种待验证解释及对应工具。","answer":"可能是运行时保留但尚未归还的空闲堆：比较 /memory/classes/heap/free:bytes、/memory/classes/heap/released:bytes 与 scavtrace；可能是 cgo 库分配：检查库自身统计、原生分配跟踪和系统映射；可能是 mmap 或其他映射驻留增长：检查目标进程 smaps/映射及相关系统调用。先排除口径和采样窗口差异，再定位所有权，不应仅根据 RSS 宣布 Go 堆泄漏。"}],"references":["tools-metrics","tools-metrics-read","tools-runtime-debug","tools-go125","tools-http-pprof","tools-perf","tools-strace","tools-ebpf","tools-runtime-debug-api","tools-fgprof","tools-fgprof-source","tools-gops","tools-gops-agent","tools-expvar","tools-nm","tools-objdump"]},{"id":"11","title":"优化决策与 PGO","subtitle":"用证据选择优化，理解编译器反馈怎样转化为收益。","objectives":["根据瓶颈类别选择算法、内存、同步或编译优化","建立代表性 PGO profile 和可重复构建流程","解释内联、逃逸和去虚化之间的联系","评估分布漂移、收益退化与回滚条件"],"prerequisites":"第 03–08 章；Go 编译与接口调用基础。","sections":[{"title":"先减工作量，再优化执行方式","body":"常见优化顺序是：消除不必要工作 → 选择更合适的算法与数据结构 → 减少数据移动与分配 → 处理共享资源竞争 → 微调局部实现和编译选项。这个顺序并非硬性规定；它用于根据潜在收益和维护成本确定排查优先级。\n\n|证据|候选干预|验证与风险|\n|---|---|---|\n|重复编码占大量 CPU|复用结果、标准库编码器|缓存失效与输入变化|\n|相同工作量下 alloc_objects 增量很高|预分配、避免临时字符串|对象存活时间与峰值内存|\n|锁等待集中|缩小临界区、分片、批处理|顺序和一致性语义|\n|runnable 延迟高|削减并发、检查配额|吞吐与公平性|\n|下游等待高|截止时间、并发预算、批请求|重试放大和错误率|\n|稳定 CPU 热点|PGO 及编译器优化|profile 代表性与代码体积|\n\n`sync.Pool`可以复用部分临时对象，减少重复分配，但不提供持久缓存保证：池中的对象可随时被自动移除。采用对象池前，应评估对象大小、复用率、敏感内容的清理方式和并发访问成本。零拷贝可能延长底层大缓冲区的生命周期，因此应同时测量 CPU 收益与堆内存保留量。[go-sync-pool]"},{"title":"Go PGO 的输入、位置与开关","body":"剖析引导优化（profile-guided optimization，PGO）将代表性运行的 CPU profile 作为编译输入，辅助决定哪些调用值得内联、哪些动态调用目标值得生成专门路径。Go 1.21 正式支持 PGO。编译器需要符合要求的 CPU 剖析数据，不能用 heap 或 mutex profile 代替。[go-pgo][go-pgo-blog]\n\n```bash\n# main 包目录中放置代表性的 CPU profile\ncp representative.cpu.pb.gz default.pgo\ngo build -o app.pgo .\ngo build -pgo=off -o app.base .\n# 或显式指定输入，避免依赖自动发现\ngo build -pgo=representative.cpu.pb.gz -o app.pgo .\ngo version -m app.pgo\n```\n\n默认 `-pgo=auto` 会在 main 包目录中查找 default.pgo。构建多个 main 包时，应分别核对各主包所选用的 profile。要实现可复现构建，应将 profile 及其采集来源、工具链、工作负载比例和更新策略一同纳入版本管理。不要把含敏感标签的生产 profile 未经检查提交到公开仓库。\n\nPGO 不改变 Go 程序的语义契约，但会改变生成代码、热点归属和内联形态。它不能解决网络下游瓶颈、无限增长缓存或算法复杂度不合理等问题。\n\n输入语义比文件扩展名更重要。Go 的 PGO 要求样本代表 CPU 时间；fgprof 的 wall-clock 聚合含等待，不能当作等价训练数据。v0.9.5 虽导出 samples/count，仍不代表 CPU 样本，且其导出函数记录没有设置 Go PGO 所需的 function.start_line。不能靠格式能否解析来替代采集语义与源码元数据验证。[tools-fgprof-source]"},{"title":"内联、逃逸与条件去虚化","body":"内联把被调用函数体放入调用者上下文，可能消除调用成本，也可能使常量传播、死代码消除与逃逸分析看到更多信息。收益有时主要来自这些后续优化，而不仅是省去一次函数调用。过度内联也可能增大代码体积和指令缓存压力。\n\n条件去虚化根据 profile 中的常见动态目标产生快路径，并保留其他目标的通用回退路径。例如接口调用大多数落在某具体实现，编译器可检查该类型后走直接调用；profile 不是“以后永远只会调用这个类型”的保证，所以正确的回退不可省略。\n\nGo 官方 PGO 案例解释了更积极内联促使某些对象不再逃逸，从而减少分配的机制；这是一个具体案例，不应写成所有程序都获得相同收益。[go-pgo-blog] 分析 PGO 结果时可对照编译诊断、alloc profile 和 CPU 差分，寻找跨层证据。\n\n```bash\ngo build -pgo=default.pgo -gcflags='-m=2' . 2> pgo-compile.txt\ngo build -pgo=off -gcflags='-m=2' . 2> base-compile.txt\n```\n\n编译器诊断文本不是稳定 API。对关键词做报告时保留完整工具链版本，并避免把单个 inlining 提示当作最终性能证明。"},{"title":"采集与合并：权重就是工作负载假设","body":"profile 要覆盖真实重要路径、代表性输入、请求类型和时间段。只采到冷启动、单租户、单一热点或错误风暴，可能把编译器引向不代表常态的代码。应将线上请求分布与训练 profile 构成对照，并将高价值但稀少路径纳入回归测试。\n\n```bash\ngo tool pprof -proto cpu-a.pb.gz cpu-b.pb.gz > merged.cpu.pb.gz\n```\n\n在类型和单位兼容的前提下，pprof 合并会累加样本权重，不会自动按采集时长或请求数求平均。CPU 密集实例或采集更长的窗口会产生更多权重。如果希望不同业务按特定比例影响编译，就必须明确缩放策略和输入来源；不能因为每种业务各提供一个文件，就认为它们对优化的影响相同。[go-pgo]\n\n代表性还涉及空间与时间：不同地区、租户、硬件、特性开关、数据尺寸和版本都可能造成分布漂移。profile 随代码变化可能逐渐变旧；Go 有一定的源码变化容忍能力，但无法免除匹配率、收益和新路径验证。"},{"title":"基准与灰度：把训练和评价分开","body":"至少设置三组构建：禁用 PGO 的基线、使用候选 profile 的构建，以及使用偏置 profile 的构建。评价负载应与训练采集分离，避免只证明编译器适应了训练样本。保持相同源代码、依赖、工具链和输入批次，使用第 03 章统计协议比较 CPU/请求、延迟、内存和代码大小。\n\n之后在受控灰度中验证：按固定比例或独立实例组运行，记录配置和流量差异；同时监视错误率、p99、GC CPU 和超时。若基线随时间变化，交替窗口或配对实例可以减轻漂移，但不能完全消除不同用户分配造成的混杂。\n\n配套实验包含 PGO 构建冒烟测试，即检查构建流程能否完成的最小测试。它不能仅凭退出码证明 profile 包含可用热点，或证明编译器已据此实施优化。Go 1.25 编译器接受并忽略空文件或无样本的 profile；构建信息记录 -pgo 路径也不证明有优化发生。需另查 profile 非空、CPU sample type、有效源码匹配、编译诊断，并以独立性能实验判断收益。小示例没有显著收益，并不意味着 PGO 对所有程序都无效；同样，构建冒烟测试也不能替代生产收益评估。正式结论必须来自独立工作负载的重复实验。"},{"title":"优化停止规则与维护预算","body":"一个可交付优化应同时满足：正确性通过；指标达到预设阈值；收益大于噪声且可重复；维护与内存成本可接受；有观测和回滚路径。应在实验开始前定义停止规则，避免不断挑选有利运行直到得到想要的数字。\n\n当热点只占很小比例、干预复杂度很高、profile 样本不足或负载代表性无法保证时，先改善证据质量可能比继续改代码更有价值。持续剖析的作用之一就是让这些决策有长期基线支持，而非让工程师不停地优化排名第一的函数。"}],"labs":[{"title":"构建可审计的 PGO 对照","steps":["在 lab 中运行 CPU 基准并生成 profile，分别构建禁用 PGO 的基线，以及使用该 profile 的候选版本。","保存构建信息和 profile 校验值；检查 CPU 样本、有效权重与源码匹配，并结合编译诊断判断 profile 是否实际参与了优化。仅构建成功不算通过这一检查。","使用不同于训练样本的输入长度做重复评价；不预设 PGO 一定获益。","故意用偏向某一种工作负载的 profile 再构建，对比另一类输入上的变化。","提交收益、无收益或退化结果，并解释 profile 代表性和统计限制。"]}],"quiz":[{"question":"Go 编译器 PGO 使用什么主要输入？","options":["heap profile","CPU pprof profile","goroutine 文本栈","任意 trace 文件"],"answer":1,"explanation":"Go PGO 使用 CPU profile；格式相似不能替代采集语义。"},{"question":"合并两份 profile 默认是否意味着两种业务等权？","options":["是","否，主要按样本权重累加","只有文件名相同时才等权","完全随机"],"answer":1,"explanation":"采样时间和 CPU 消耗影响总权重。"},{"question":"PGO 构建冒烟测试通过，能够证明什么？","options":["生产加速 10%","该构建命令完成，仍须验证 profile 和优化是否生效","所有路径都优化了","不再需要基准"],"answer":1,"explanation":"空文件或无有效样本也可能被编译器接受并忽略；成功构建不证明使用了有效热点，更不证明获得性能收益。"}],"exercises":[{"question":"业务 A 占请求 90%但每次 1 ms CPU，B 占 10%但每次 20 ms CPU。CPU 权重比例是多少？","answer":"以 100 请求计算 A=90 ms、B=200 ms，因此 CPU 权重约 31%和 69%。按请求比例加权与按 CPU 成本加权回答不同问题，训练目标必须说明。"},{"question":"PGO 后 allocs/op 下降而热点函数调用次数未减少，可能是什么机制？","answer":"更积极内联可能改善逃逸分析，使对象从堆分配转为栈或被消除。需对照编译诊断和 alloc profile，不能仅凭最终数值认定唯一原因。"}],"references":["go-pgo","go-pgo-blog","tools-fgprof-source","go-sync-pool"]},{"id":"12","title":"生产环境持续剖析","subtitle":"让短时诊断升级为可控成本、可检索和可治理的长期证据。","objectives":["设计从 agent 到符号存储再到查询的完整链路","制定采样、基数、访问控制与开销预算","关联 profile 与 metrics/logs/traces 而不混淆语义","诊断数据丢失、符号缺失与采集偏差"],"prerequisites":"第 04–10 章；HTTP、容器和基础可观测性知识。","sections":[{"title":"持续剖析的体系结构","body":"持续剖析周期性或连续地采集程序的资源使用数据，并通过查询按服务、版本、环境和时间窗口聚合调用栈及其权重。典型链路为：进程内或 eBPF 采集器 → agent 批处理 → 摄取与验证 → 栈/符号归并 → 长期存储 → 查询聚合 → 火焰图/差分/告警。第 15 章比较 Pyroscope 与 Parca 的真实实现。\n\n架构首先解决采什么，而不是先选可视化界面。CPU、分配、存活堆、锁等待和 off-CPU 数据的单位与时间边界不同，不能合并成一个没有类型的“性能值”。采集器也不等于符号化器；某些环境在 agent 展开栈，在服务端补符号，两端版本和构建元数据都影响可靠性。\n\n连续并不意味着 100%捕获每次事件。低开销统计采样牺牲单次请求完整性，换取长期趋势。发现异常后，可再用定向追踪、飞行记录器或调试器获取局部细节，使不同工具提供的证据相互补充。"},{"title":"采集策略：pull、push 与 eBPF","body":"pull 模式由中心或 agent 定时请求 HTTP profile，便于沿用 net/http/pprof；push 模式由 SDK 控制采集与上传，便于穿越网络边界和补业务标签；eBPF 模式常从主机采样线程并关联容器，减少应用显式埋点，但会受到内核权限、栈展开、运行时识别和平台支持限制。\n\n|方式|主要优势|主要代价|\n|---|---|---|\n|进程内 HTTP 采集|标准接口、Go 语义直接|端点保护、采集调度冲突|\n|应用 SDK push|生命周期与标签可控|依赖和运行时开销|\n|主机 eBPF 采样|跨服务覆盖、集中治理|内核权限、平台与展开限制|\n|事件追踪|提供调度与因果上下文|事件量、时间窗与分析复杂度|\n\nGo 原生`runtime/pprof`在同一进程中只允许一个活动的 CPU 采集，因此应指定负责启动和停止它的唯一控制器，并协调临时诊断请求。这一限制不等于所有外部采集器都无法同时运行；例如 eBPF 采样可能与 Go 原生采样并存，但仍须评估二者的开销和测量语义。[tools-pprof]多来源生成相同 pprof 格式也不自动等价：采样频率、丢失、栈深、cgo 展开和内核帧覆盖都应单独校验。"},{"title":"标签基数、数据量与预算","body":"稳定标签建议包括 service、environment、version、region 和有限集合的 workload；不要将 user_id、完整 URL、SQL 文本或随机 request_id 直接作为长期聚合维度。高基数不但增加索引和存储成本，也可能泄露敏感信息。\n\n教学容量模型：若 N 个实例每分钟产生 B 字节压缩 profile，保留 D 天，则在忽略副本、索引和压缩率变化时，载荷总量约为 `N × B × 1440 × D`。假设 1000 实例、每分钟 100 KiB、保留 7 天，已压缩 profile 载荷总量约 961.3 GiB；真实值要用自己的样本测量，不能拿此示例作为产品存储承诺。\n\n预算至少包括 agent CPU、应用吞吐变化、内存缓冲上限、网络带宽、摄取队列、存储增长、查询延迟和损失率。应在相同工作量下比较开启与关闭采集时的开销。不能只统计 agent 进程的 CPU 消耗，因为进程内采集的成本会记在被测应用上。"},{"title":"关联与检索：相关性仍需上下文","body":"指标帮助发现资源或服务状态异常；profile 反映选定窗口内的成本分布；分布式 trace 展示请求路径和各 span 的时间关系，执行追踪还可揭示调度与等待状态；日志补充具体事件。有效关联需要一致的服务身份、版本、时间范围以及明确的时钟和聚合粒度。profile 窗口为 60 秒而 trace 只包含某一次请求时，不能直接宣布窗口内最大栈就是该请求根因。\n\n把 trace ID 附着到每个样本并长期索引可能导致基数爆炸。可以考虑有界的代表性样本关联（exemplar），或只在临时调查中建立关联；采用哪种方式，仍需结合数据模型、覆盖率与隐私要求评估。Go 原生 pprof labels 也不保证所有 profile 类型均支持标签传播。\n\n符号化失败会把成本推入 unknown，从而使已知函数占比看似改变。查询界面应展示未知帧、截断栈、丢样和过滤总量，并能定位到构建 ID。健康度先于美观：一张信息缺失的漂亮火焰图不能作为优化依据。"},{"title":"安全、隔离与故障模式","body":"诊断端点独立监听在回环或管理网络，通过已有认证代理、网络策略和审计控制访问。profile 与 core 按敏感诊断数据管理，设置最小留存与按角色查询。尤其要避免公开暴露 cmdline、goroutine、trace 等端点。\n\n采集器要有超时、并发上限、退避、队列边界与丢弃策略；后端故障不能反向拖垮业务。短生命周期容器可能在一个采样窗口结束前就退出；如果退出前未能完成缓冲数据上传（flush），这类实例还会进一步缺失。两种情况都可能造成代表性偏差。丢失的数据如果集中在 CPU 高峰或崩溃前，长期查询会系统性低估最需要观察的区间。\n\n常见故障排查顺序是：目标发现 → 权限/连接 → 采集是否生成有效数据 → 解析单位与标签 → 栈展开与符号 → 摄取排队和丢弃 → 存储和查询过滤。不要因为页面为空就立即更改采样率。"},{"title":"上线与质量验证协议","body":"小规模试点先覆盖不同 Go 版本、架构、容器限制和 cgo 使用。以受控 CPU 热点、内存保留和锁竞争注入验证工具能否看见预期机制；同时设计负例，例如纯等待不应被误判为 CPU 热点。\n\n扩大范围前定义验收条件：可识别帧比例、预期热点排名稳定性、开销上界、未知数据可见性、服务隔离与访问审计。逐步扩大覆盖范围，并保留能够停用采集的开关。在常规发布流水线保留符号、构建信息和 PGO profile 来源，形成性能基线与代码版本之间的长期连接。\n\n诊断系统自身也应设置服务等级目标（SLO）：从发现目标到数据可查询的延迟、查询延迟的 p95、agent 离线比例、数据完整性，以及留存策略的达成情况。没有这些观测，所谓“连续”可能只是间歇性采到幸存实例。"}],"labs":[{"title":"为一个 20 实例服务设计剖析方案","steps":["选择 CPU 和一种内存指标，定义采样周期、唯一采集所有者与错误处理。","列出有限集合标签和明确禁止的高基数标签，并估算 7 天数据量。","设计 A/B 开销实验与至少三个故障注入：上传失败、符号缺失、实例短生命周期。","说明如何从 CPU 异常跳转到相同版本和时间段的 profile，再用 trace 验证等待假设。","写出诊断系统回滚、数据留存、权限和审计方案。"]}],"quiz":[{"question":"profile 窗口和某条 trace 重合能证明什么？","options":["最大热点一定造成该请求慢","仅提供关联线索，仍需确认上下文与路径","两种数据完全等价","无需版本标识"],"answer":1,"explanation":"窗口聚合与单请求时序的粒度不同。"},{"question":"哪个标签最适合长期聚合？","options":["随机 request_id","完整 SQL","有限集合的 workload 类别","用户手机号"],"answer":2,"explanation":"稳定低基数标签兼顾可查询性、成本与隐私。"},{"question":"eBPF 采集意味着什么？","options":["完全无开销、全语言同等支持","减少某些应用改动，但仍有平台与栈展开限制","一定比进程内 profile 准确","不需要权限"],"answer":1,"explanation":"eBPF 能力受内核、硬件、运行时和采集实现约束。"}],"exercises":[{"question":"某 agent 只在低负载时成功上传，高峰时大量丢样。按可用样本求平均会如何偏差？","answer":"缺失与目标变量相关，属于非随机缺失；结果会低估高峰成本。应监视丢弃率和队列，对高峰做独立受控采集，不能靠简单补零修复。"},{"question":"某函数占比从 10%升到 20%，同时 unknown 帧大幅下降，能直接认定回归吗？","answer":"不能。符号化改善可能把原未知样本重新归属该函数。需固定符号状态、比较绝对成本及业务工作量，并检查构建 ID 和展开质量。"}],"references":["go-diagnostics","go-http","go-pprof","tools-pprof"]},{"id":"13","title":"综合案例与证据链","subtitle":"把工具组合成可证伪的诊断过程。","objectives":["为 CPU、分配、保留、锁等待与下游等待建立鉴别诊断","避免根据单一 profile 过早下结论","区分正证据、负证据和未观测项","完成包含正确性与性能验证的调查报告"],"prerequisites":"第 01–12 章；能够运行附带实验模块。","sections":[{"title":"案例 A：编码路径消耗 CPU","body":"症状：相同输入下，/cpu 的吞吐低于预期，进程 CPU 较高。候选机制包括重复格式化、字符串复制、GC 或 CPU 配额节流。先固定请求数与输入长度，记录每请求 CPU 时间、每请求分配字节数和错误率；在函数基准中另记录 B/op。随后采集 CPU 和 alloc profile。\n\nlab 的 encodeSlow 逐字节 fmt.Sprintf 并反复拼接字符串。合理预测是格式化、分配与复制相关栈可见，encodeFast 使用 encoding/hex 减少工作。但只有运行后的实际 profile 能证明这次环境中哪些栈占主导，不能把代码直觉当作测量结果。\n\n干预把编码器替换为标准库实现，先验证所有字节值、空输入与输出格式一致。随后在多个输入长度下重复 benchmark，并保留关闭剖析采集时的对照结果，避免把采集开销计入优化收益。若长输入收益更大，可能与重复拼接的累计复制有关；需要规模扫描支撑复杂度解释。\n\n可反驳条件：CPU profile 没有预期热点、分配没有变化、吞吐受发生器限制、错误请求比例变化，或者环境正在被节流。任意一项出现都要求修订解释。"},{"title":"案例 B：分配压力不等于内存泄漏","body":"症状：/alloc 负载下 alloc_space 快速增长，inuse_space 却在 GC 后回落，RSS 未立刻下降。它支持“临时对象制造分配压力”，不支持“内存一定泄漏”。/retain 则把 1 MiB 对象保存在全局切片中，上限 64 MiB；如果统一 GC 及 profile 记账的可见性后，该分配栈的存活量仍随请求增加，就支持“可达对象持续积累”的解释。\n\n```bash\ncurl -o alloc.pb.gz http://127.0.0.1:6060/debug/pprof/allocs\ncurl -o live.pb.gz 'http://127.0.0.1:6060/debug/pprof/heap?gc=1'\ngo tool pprof -sample_index=alloc_space -top alloc.pb.gz\ngo tool pprof -sample_index=inuse_space -top live.pb.gz\ncurl -X POST http://127.0.0.1:8080/reset\n```\n\n采样、GC 周期和内存释放时机都会影响数值。`gc=1`会主动触发 GC，具有观察者效应；释放引用后，仍需允许 GC 完成，且向 OS 归还驻留页可能滞后。RSS 还包含栈、runtime 元数据、代码、共享库与其他映射。\n\n修复判断应以相同操作次数、稳定阶段、多轮 GC 后的存活趋势与业务正确性为基础。不要仅用“调用 reset 后 RSS 没有马上降”来否定引用已释放，也不要仅用 alloc_space 单调增加来证明泄漏。"},{"title":"案例 C：共享锁把并发变成排队","body":"lab 的/lock 在共享 mutex 内 sleep，故意模拟慢操作占据临界区。并发增加时，单请求延迟与等待总量可增长，而 CPU 不一定很高。先同时看完成率、在途数和请求延迟，再用 mutex、block 与 trace 区分持锁路径、阻塞位置和调度延迟。\n\nmutex profile 常将成本归于临界区结束的解锁栈；它不是简单告诉你“Lock 调用花了多少 CPU”。block profile 记录等待发生处，trace 帮助看到阻塞与唤醒的时间关系。等待总量可以超过墙钟采集时长，因为多个 goroutine 同时等待。\n\n理想化计算：临界区 10 ms 且完全串行，不考虑其他成本，吞吐上界约 100 req/s。将并发从 10 增到 100 不会让这个临界区并行，只会扩大队列。真实结果还受到调度、定时器精度和负载生成方式的影响，因此这是模型上界，不是实验测得的吞吐。\n\n干预首先判断 sleep 或 I/O 能否移出锁；若不能，考虑分片、批处理或明确串行队列的背压。改变锁粒度可能改变一致性边界，必须检验状态更新顺序与取消行为。"},{"title":"案例 D：等待导致长尾，CPU 图却很平","body":"/wait 通过 timer 等待；它模拟等待形态而非真实网络栈。对比/cpu 和/wait 可学习一个重要负证据：CPU profile 热点弱或总样本少，不等于没有性能问题。请求可以绝大多数时间处于等待，仍有很高的用户可见延迟。\n\n```bash\ncurl -o trace.out 'http://127.0.0.1:6060/debug/pprof/trace?seconds=3'\ngo tool trace trace.out\ngo tool trace -pprof=sched trace.out > sched.pb.gz\ngo tool pprof -top sched.pb.gz\n```\n\n时间线区分 timer 等待、runnable 等待和实际运行。若要证明真实下游慢，应加入真实可控下游、网络 trace 或系统调用证据，不能从 timer 示例推广到 DNS、TCP 拥塞或磁盘服务时间。\n\n可考虑减少串行等待、限制并发、设置总截止时间，并将取消信号正确传递到下游操作。重试须有总预算与抖动，避免把下游故障放大为重试风暴。这里的因果链最终要由故障注入和恢复实验检验。"},{"title":"案例 E：混合负载下的错觉","body":"生产请求通常混合 CPU 密集、低频大对象和等待型业务。总体 CPU 占比变化可能只是请求组合变化，而非代码退化。利用有限集合 workload 标签分析 CPU 分布，同时记录每类请求成功数、输入大小与延迟。标签缺失的 profile 类型应通过独立实验或版本/实例隔离补证，而非假定能按标签过滤。\n\n例如，发布后的同长度窗口中，alloc_space 增量上升 50%，而大输入请求比例也从 10%升到 40%。应分别比较同类请求的每请求分配字节数，并以相同的输入组合重放负载。若没有保留类别分母，最多能报告总分配上升，不能精确归因到发布。\n\n混合负载还会产生相互干扰：内存型业务引发 GC，影响 CPU 型业务；锁持有者被调度延迟，放大等待者长尾。分析时需要资源共享模型，不能将各类独立 benchmark 简单相加当作混跑结果。"},{"title":"把发现写成可以复查的结论","body":"建议每条发现用四句结构：现象是什么；原始证据来自何处；当前最合理机制是什么；下一步干预如何区分替代解释。例如：“固定批次下 B/op 上升；alloc_space 集中于某编码栈；重复格式化可能增加临时对象；替换实现并验证输出后观察分配与 CPU 是否同步下降。”\n\n报告还应说明验证边界：本地结果不能直接代表生产；未采集相应硬件事件，就不能声称缓存未命中率有所改善。race detector 仅检测本次执行路径上的数据竞争，即使检查通过，也不能排除未执行路径的数据竞争、死锁或逻辑并发错误。仅凭单次运行结果，通常也不足以给出可靠的不确定性估计。[go-race]\n\n附带 verification 目录保存本次实际执行的命令、原始 profile、日志与检查结果。教材中的模型数值均标记为示例或假设，实测结果只在验证报告中按环境解释。"}],"labs":[{"title":"完成五种负载的盲诊断","steps":["先只看每种负载的 CPU、延迟和内存趋势，不阅读对应 handler 实现，写出候选假设。","为每种情况选择两种相互补充的工具；收集 CPU、heap、block、mutex 和 trace。","打开源码验证机制，记录哪些初始假设被否定。","至少完成一个保持语义的优化或一个负结果实验，并进行独立重复评价。","将模型预测、实际观测和生产外推限制分别写入报告。"]}],"quiz":[{"question":"alloc_space 持续增大能否单独证明泄漏？","options":["能","不能，累计分配本来就可持续增大","只要超过 RSS 就能","采样率高就能"],"answer":1,"explanation":"泄漏分析要关注可达存活对象、生命周期与长期趋势。"},{"question":"10 ms 串行临界区的理想吞吐上界约是多少？","options":["100 req/s","10000 req/s","并发多少就多少倍","无法给模型上界"],"answer":0,"explanation":"1/0.01s=100 req/s，只是忽略其他开销的模型上界。"},{"question":"混合请求比例变化后 CPU 占比变了，首先需要什么？","options":["直接回滚所有代码","按业务类别和相同工作量比较","移除所有标签","只看函数排名"],"answer":1,"explanation":"工作负载构成变化本身可以改变 profile 分布。"}],"exercises":[{"question":"mutex profile 中的累计等待为 20 秒，而你本次采集持续 5 秒。这是否说明数据损坏？","answer":"不一定。应先确认 20 秒是累计总量还是本次基线差：累计值可能包含此前的历史。即使它是区间增量，多个 goroutine 并发等待也会使总等待超过墙钟时长；事件记账边界还可能跨越窗口。应核对版本、采样缩放和时间边界，不能把 20/5 解释为 400%的 CPU 使用率。"},{"question":"临时内存下降而 RSS 不变，列出两种解释和补证工具。","answer":"运行时保留已空闲堆页、其他内存映射或 cgo 占用均可能。结合 runtime/metrics 内存类别、heap、/proc 映射与后续 GC/归还趋势；不要仅据 RSS 推断 Go 对象仍可达。"}],"references":["go-pprof","go-http","go-memory","go-race"]},{"id":"14","title":"实验课程与研究项目","subtitle":"把命令、数据、推理和复现打包为完整学习成果。","objectives":["从零运行本地诊断服务和自动验证脚本","完成从采集到解释再到干预的六组实验","设计有消融和效度讨论的研究型项目","按明确评分量规审核自己的结业报告"],"prerequisites":"第 01–13 章；至少一台可运行 Go 的开发机器。","sections":[{"title":"实验包布局、环境与运行方式","body":"配套目录包含 `lab/main.go`、`main_test.go`、`go.mod`、FlightRecorder 示例，以及 `scripts/verify_lab.py` 和验证报告。普通实验使用 Go 1.22 或更新版本；FlightRecorder 要求 Go 1.25 及以上版本。本文按 Go 1.25.0 核查运行时源码，不声称它是发布时最新补丁版；实际部署应采用受支持的安全补丁版本。\n\n```bash\ncd lab\ngo test ./...\ngo run .\n# 在第二个终端进行采集\ncurl http://127.0.0.1:8080/health\ncurl 'http://127.0.0.1:8080/cpu?n=1000'\n```\n\n服务分开监听 127.0.0.1:8080 业务端口和 127.0.0.1:6060 诊断端口。CPU 循环、临时分配、保留对象和等待时间均有教学上限；/reset 要求 POST。实验启用高密度 block/mutex 采样以便短时间内观察，因此不可将其配置直接复制到生产。\n\n用项目根目录下的 `python3 scripts/verify_lab.py` 可重跑验证。脚本自动选择空闲回环端口，使用有界负载，只停止自己启动的进程，并把本次结果写入 verification/lab。手动启动可用 -app-port 与 -diag-port 指定其他端口。/health 的 finished_handlers 只统计通过 annotate 包装且正常返回的业务处理器，包含其中的失败与取消，不统计 /health、/reset，也不能作为成功请求分母；负载脚本单独统计成功响应。\n\n这些上限有范围：/alloc 的 n 和 size 只约束单次请求，多个并发请求仍可叠加显著内存；64 MiB 是 /retain 的教学保留上限，并非进程 RSS 或全部内存的上限。/lock 故意使用不可取消的 Mutex.Lock 与 Sleep，等待中的请求即使取消也不会立即释放这段工作；应把它当成反例，而非完整取消设计。\n\n实验服务为兼容展示而手动注册诊断 handler，没有全部使用第 10 章的 GET 方法模式；因此不能把标准库在 DefaultServeMux 上的默认方法限制当作该手工 mux 的属性。正式部署应沿用受控监听并明确方法和认证策略。"},{"title":"六组实验及提交清单","body":"|实验|核心问题|必须提交的证据|\n|---|---|---|\n|L1 基准|优化真的少做了工作吗|相同输出测试、10 次原始结果、输入规模扫描|\n|L2 CPU|哪个调用路径消耗 CPU|CPU profile、`top`/`top -cum`/`list`输出、成功请求分母|\n|L3 内存|是分配压力还是长期保留|四种 sample index、GC 前后趋势、生命周期解释|\n|L4 并发|等待发生在哪里、谁持锁|block、mutex、trace 与吞吐—并发曲线|\n|L5 调试|变量状态与优化构建有何差别|Delve 会话记录、构建参数、已验证边界|\n|L6 综合|PGO/持续采集如何改变表现|对照构建、开销实验、代表性分析、回滚方案|\n\n每组实验必须有负例或反证：例如纯等待负载不应被 CPU 图解释为 CPU 热点；alloc 快速增长但 live 稳定时不能称为泄漏；PGO 构建成功不应等同于运行更快。负例能检验学习者是否掌握测量语义，而非只会执行命令。"},{"title":"手动采集操作卡","body":"先在一个终端持续运行服务，在第二个终端持续产生负载，在第三个终端采集。采集 CPU profile 时如果没有工作，得到少量样本是正常现象。\n\n```bash\n# 终端2：有界并发负载，Linux/macOS 环境需有curl和xargs\nseq 1 200 | xargs -P 8 -I{} curl -s -o /dev/null   'http://127.0.0.1:8080/cpu?n=10000'\n# 终端3：采集时终端2应仍在运行\ncurl -o cpu.pb.gz 'http://127.0.0.1:6060/debug/pprof/profile?seconds=5'\ncurl -o heap.pb.gz 'http://127.0.0.1:6060/debug/pprof/heap?gc=1'\ncurl -o mutex.pb.gz http://127.0.0.1:6060/debug/pprof/mutex\ncurl -o block.pb.gz http://127.0.0.1:6060/debug/pprof/block\ncurl -o goroutine.txt 'http://127.0.0.1:6060/debug/pprof/goroutine?debug=2'\ncurl -o trace.out 'http://127.0.0.1:6060/debug/pprof/trace?seconds=3'\n```\n\n上述`-o`参数使用相对路径，输出文件保存在执行命令时的当前目录；如果要保存在 lab 中，应先切换到该目录。建议为不同实验建立独立子目录，并记录负载和采集时间。alloc 等累计指标、以及启用采样后积累的 block/mutex 数据，可能包含当前负载之前的历史；应使用新进程或语义兼容的基线差，避免将旧负载的成本计入本次实验。CPU 区间采样、goroutine 快照和当前存活堆各有不同时间语义，不能一概按累计总量处理。\n\n本书自动脚本仅进行短时功能验证，不代替以上完整性能研究。若缺少 Linux perf 权限、core 转储配置或外部调试器，报告应注明未执行的实验，不补造结果。"},{"title":"研究型项目：三条可选路线","body":"路线 A：比较 CPU 采样与执行追踪对低频尾延迟事件的诊断能力。控制事件发生率和持续时间，测量发现率、定位准确率、数据量与扰动，并探索触发式 flight recorder。必须讨论“已知人工注入”的机制与未知生产异常之间的差距。\n\n路线 B：研究 PGO 的训练负载漂移。设计三类请求与多种混合比例，训练和评价分离，测量 CPU/请求、代码尺寸和尾延迟；用 profile 权重分布变化解释收益退化。消融实验包括无 PGO、代表性 profile、偏置 profile 和过期 profile。\n\n路线 C：比较进程内与 eBPF CPU 采样。固定相同工作量、构建与时间窗，评价栈完整性、unknown 比例、热点排序稳定性和开销。须报告 cgo、内联、架构、内核、容器和权限差异；不能仅以火焰图相似就宣布两采集器等价。\n\n第 16 章将这些项目连接到近五年原始工作。优秀项目应提出一个可以通过实验检验并可能被推翻的假设，而不是“部署某工具并截图”。"},{"title":"报告结构、评分量规与复现要求","body":"|维度|分值|合格条件|\n|---|---|---|\n|问题与模型|15|明确指标、分母、假设和可推翻条件|\n|实验设计|20|控制变量、独立重复、负载代表性与对照|\n|工具与数据|20|原始文件、版本、单位、采集边界正确|\n|机制解释|20|跨工具证据、替代解释、消融或干预|\n|正确性与限制|15|输出一致、并发安全、效度边界诚实|\n|复现与表达|10|脚本可运行、路径清晰、结论可审查|\n\n这份 100 分评分量规评价论证质量，不以性能提升的百分比作为评分标准。负结果只要设计严谨、解释充分，同样可获得高分。提交包包含 README、源码、命令、原始数据、处理脚本、图表及来源清单；隐去敏感信息时说明脱敏规则及其对复现的影响。\n\n至少讨论内部效度（是否真由干预引起）、外部效度（是否能推广）、构念效度（指标是否代表目标）和统计结论效度（样本与不确定性是否足够）。这四个角度让工程诊断达到研究生课程的论证要求。"},{"title":"口试与同行复核","body":"口试应围绕原始证据追问：若 profile 采样窗口减半结论是否稳定？若请求组合变化是否仍获益？为什么这个 cum 百分比不能相加？为何 heap 下降但 RSS 不变？为什么 perf 与 Go CPU profile 可能出现不同栈？答案必须回到时间、单位、采样、生命周期和平台边界。\n\n同行复核者首先运行正确性测试，再复现一项核心结论，然后尝试构造反例。作者根据反例更新结论范围，不应把所有偏差都归为“机器不同”。最终交付的是可维护的知识：哪些条件下有效、哪些条件下无效、怎样快速判断当前系统属于哪一类。"},{"title":"完整实验服务源码","body":"以下为配套 lab/main.go 的完整源码，使用标准库，无第三方运行依赖。文件 go.mod 声明 module example.com/golab 与 go 1.22。\n\n```go\n// GoLab: bounded, local-only diagnostics laboratory. See README.md.\npackage main\n\nimport (\n\t\"context\"\n\t\"encoding/hex\"\n\t\"flag\"\n\t\"fmt\"\n\t\"log\"\n\t\"net/http\"\n\t\"net/http/pprof\"\n\t\"runtime\"\n\trpprof \"runtime/pprof\"\n\t\"runtime/trace\"\n\t\"strconv\"\n\t\"sync\"\n\t\"sync/atomic\"\n\t\"time\"\n)\n\nvar retained struct {\n\tsync.Mutex\n\tblobs [][]byte\n}\nvar serial sync.Mutex\n\n// This counts finished handlers, including canceled or rejected requests.\nvar finishedHandlers atomic.Uint64\n\nfunc encodeSlow(src []byte) string {\n\tout := \"\"\n\tfor _, b := range src {\n\t\tout += fmt.Sprintf(\"%02x\", b)\n\t}\n\treturn out\n}\nfunc encodeFast(src []byte) string { return hex.EncodeToString(src) }\nfunc bounded(r *http.Request, key string, fallback, max int) int {\n\tv, err := strconv.Atoi(r.URL.Query().Get(key))\n\tif err != nil || v < 1 {\n\t\treturn fallback\n\t}\n\tif v > max {\n\t\treturn max\n\t}\n\treturn v\n}\nfunc annotate(kind string, next func(context.Context, http.ResponseWriter, *http.Request)) http.HandlerFunc {\n\treturn func(w http.ResponseWriter, r *http.Request) {\n\t\trpprof.Do(r.Context(), rpprof.Labels(\"workload\", kind), func(ctx context.Context) {\n\t\t\tctx, task := trace.NewTask(ctx, \"request\")\n\t\t\tdefer task.End()\n\t\t\ttrace.Log(ctx, \"route\", kind)\n\t\t\tregion := trace.StartRegion(ctx, kind)\n\t\t\tdefer region.End()\n\t\t\tnext(ctx, w, r)\n\t\t\tfinishedHandlers.Add(1)\n\t\t})\n\t}\n}\nfunc main() {\n\tappPort := flag.Int(\"app-port\", 8080, \"loopback application port\")\n\tdiagPort := flag.Int(\"diag-port\", 6060, \"loopback diagnostics port\")\n\tflag.Parse()\n\tappAddr := fmt.Sprintf(\"127.0.0.1:%d\", *appPort)\n\tdiagAddr := fmt.Sprintf(\"127.0.0.1:%d\", *diagPort)\n\t// Aggressive rates make short lab runs visible. Do not copy into production.\n\truntime.SetBlockProfileRate(1)\n\truntime.SetMutexProfileFraction(1)\n\tdiagnostic := http.NewServeMux()\n\tdiagnostic.HandleFunc(\"/debug/pprof/\", pprof.Index)\n\tdiagnostic.HandleFunc(\"/debug/pprof/cmdline\", pprof.Cmdline)\n\tdiagnostic.HandleFunc(\"/debug/pprof/profile\", pprof.Profile)\n\tdiagnostic.HandleFunc(\"/debug/pprof/symbol\", pprof.Symbol)\n\tdiagnostic.HandleFunc(\"/debug/pprof/trace\", pprof.Trace)\n\tgo func() {\n\t\tlog.Println(\"diagnostics http://\" + diagAddr + \"/debug/pprof/\")\n\t\tlog.Fatal(http.ListenAndServe(diagAddr, diagnostic))\n\t}()\n\tapp := http.NewServeMux()\n\tapp.HandleFunc(\"/health\", func(w http.ResponseWriter, r *http.Request) {\n\t\tfmt.Fprintf(w, \"ok finished_handlers=%d\\n\", finishedHandlers.Load())\n\t})\n\tapp.HandleFunc(\"/cpu\", annotate(\"cpu\", func(ctx context.Context, w http.ResponseWriter, r *http.Request) {\n\t\tsrc := []byte(\"profiling-with-go-0123456789abcdef\")\n\t\titerations := bounded(r, \"n\", 1000, 100000)\n\t\tfast := r.URL.Query().Get(\"fast\") == \"1\"\n\t\tvar value string\n\t\tfor i := 0; i < iterations; i++ {\n\t\t\tif i%256 == 0 {\n\t\t\t\tselect {\n\t\t\t\tcase <-ctx.Done():\n\t\t\t\t\treturn\n\t\t\t\tdefault:\n\t\t\t\t}\n\t\t\t}\n\t\t\tif fast {\n\t\t\t\tvalue = encodeFast(src)\n\t\t\t} else {\n\t\t\t\tvalue = encodeSlow(src)\n\t\t\t}\n\t\t}\n\t\tfmt.Fprintln(w, value)\n\t}))\n\tapp.HandleFunc(\"/alloc\", annotate(\"alloc\", func(ctx context.Context, w http.ResponseWriter, r *http.Request) {\n\t\tn := bounded(r, \"n\", 2000, 20000)\n\t\tsize := bounded(r, \"size\", 512, 4096)\n\t\t// Retain the batch within this request so allocations cannot disappear.\n\t\tblobs := make([][]byte, n)\n\t\tfor i := range blobs {\n\t\t\tblobs[i] = make([]byte, size)\n\t\t\tblobs[i][0] = byte(i)\n\t\t}\n\t\tfmt.Fprintf(w, \"temporary=%d checksum=%d\\n\", n*size, blobs[n-1][0])\n\t\truntime.KeepAlive(blobs)\n\t}))\n\tapp.HandleFunc(\"/retain\", annotate(\"retain\", func(ctx context.Context, w http.ResponseWriter, r *http.Request) {\n\t\tretained.Lock()\n\t\tdefer retained.Unlock()\n\t\tif len(retained.blobs) >= 64 {\n\t\t\thttp.Error(w, \"64 MiB lab cap reached; call POST /reset\", http.StatusTooManyRequests)\n\t\t\treturn\n\t\t}\n\t\tb := make([]byte, 1<<20)\n\t\tfor i := 0; i < len(b); i += 4096 {\n\t\t\tb[i] = 1\n\t\t}\n\t\tretained.blobs = append(retained.blobs, b)\n\t\tfmt.Fprintf(w, \"retained=%d MiB\\n\", len(retained.blobs))\n\t}))\n\tapp.HandleFunc(\"/reset\", func(w http.ResponseWriter, r *http.Request) {\n\t\tif r.Method != http.MethodPost {\n\t\t\thttp.Error(w, \"POST required\", http.StatusMethodNotAllowed)\n\t\t\treturn\n\t\t}\n\t\tretained.Lock()\n\t\tretained.blobs = nil\n\t\tretained.Unlock()\n\t\tfmt.Fprintln(w, \"references released; next GC determines reclamation\")\n\t})\n\tapp.HandleFunc(\"/wait\", annotate(\"wait\", func(ctx context.Context, w http.ResponseWriter, r *http.Request) {\n\t\ttimer := time.NewTimer(time.Duration(bounded(r, \"ms\", 40, 500)) * time.Millisecond)\n\t\tdefer timer.Stop()\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\tcase <-timer.C:\n\t\t\tfmt.Fprintln(w, \"waited\")\n\t\t}\n\t}))\n\tapp.HandleFunc(\"/lock\", annotate(\"lock\", func(ctx context.Context, w http.ResponseWriter, r *http.Request) {\n\t\t// Intentionally bad: hold a shared mutex while sleeping.\n\t\tserial.Lock()\n\t\ttime.Sleep(time.Duration(bounded(r, \"ms\", 10, 100)) * time.Millisecond)\n\t\tserial.Unlock()\n\t\tfmt.Fprintln(w, \"serialized\")\n\t}))\n\tserver := &http.Server{Addr: appAddr, Handler: app, ReadHeaderTimeout: 3 * time.Second}\n\tlog.Println(\"application http://\" + appAddr)\n\tlog.Fatal(server.ListenAndServe())\n}\n\n```"},{"title":"完整基准与正确性测试源码","body":"以下为同目录中的 main_test.go。它只覆盖若干代表性输入，并非完整的输入域验证；研究实验还应补充全部 256 种字节值、不同长度和随机输入，并设计独立重复。\n\n```go\npackage main\n\nimport \"testing\"\n\nvar result string\n\nfunc TestEncoders(t *testing.T) {\n\tfor _, in := range [][]byte{nil, {}, []byte(\"hello\"), {0, 1, 15, 16, 127, 128, 255}} {\n\t\tif a, b := encodeSlow(in), encodeFast(in); a != b {\n\t\t\tt.Fatalf(\"encode mismatch: %q != %q\", a, b)\n\t\t}\n\t}\n}\nfunc BenchmarkEncodeSlow(b *testing.B) {\n\tinput := []byte(\"profiling-with-go-0123456789abcdef\")\n\tb.ReportAllocs()\n\tb.SetBytes(int64(len(input)))\n\tb.ResetTimer()\n\tfor i := 0; i < b.N; i++ {\n\t\tresult = encodeSlow(input)\n\t}\n}\nfunc BenchmarkEncodeFast(b *testing.B) {\n\tinput := []byte(\"profiling-with-go-0123456789abcdef\")\n\tb.ReportAllocs()\n\tb.SetBytes(int64(len(input)))\n\tb.ResetTimer()\n\tfor i := 0; i < b.N; i++ {\n\t\tresult = encodeFast(input)\n\t}\n}\n\n```"}],"labs":[{"title":"提交结业证据包","steps":["完成六组实验中的至少四组，其中必须包含 CPU、内存和并发。","选择一条研究路线，预先写出假设、主指标、重复单元和停止规则。","保留原始数据并执行至少一个消融或反例实验。","邀请另一人按 README 复现；记录失败原因并修复环境说明。","按 100 分量规自评，写出三条最重要结论和三条适用边界。"]}],"quiz":[{"question":"结业项目最关键的产物是什么？","options":["一张颜色丰富的火焰图","可复查的证据、机制解释和复现协议","最长的命令清单","一定超过 50%的加速"],"answer":1,"explanation":"课程评估科学推理与可复现性，不预设性能收益。"},{"question":"自动烟测可以替代长期性能统计吗？","options":["可以","不能，它主要验证路径可运行","只要日志无 error 即可","有 PDF 就可以"],"answer":1,"explanation":"运行正确与统计结论是不同层级的验证。"},{"question":"设计消融实验的目的是什么？","options":["让报告页数更多","隔离某机制对结果的贡献","隐藏失败结果","只看最有利样本"],"answer":1,"explanation":"消融移除或改变特定因素，帮助区分因果机制。"}],"exercises":[{"question":"为 PGO 漂移项目写一个可反驳假设。","answer":"例如：在固定源码和资源下，训练与评价的 CPU 权重分布距离增大时，CPU/请求收益下降。设计多种混合比例、无 PGO 对照、独立重复，并接受无单调关系的负结果；不能只比较两个任意点。"},{"question":"如何区分“采集器栈展开不完整”与“函数没有执行”？","answer":"使用已知执行路径的受控负载、匹配构建符号、比较原始样本和 unknown/truncated 计数，必要时以另一采集机制交叉验证。图上没有函数本身不足以做判断。"}],"references":["go-diagnostics","go-pgo","go-pprof"]},{"id":"15","title":"成熟开源项目的实现与核心技术","subtitle":"沿一条样本追踪采集、展开、规范化、存储与查询，并用固定源码核对各步的数据转换","objectives":["逐步计算含 ASLR、局部 ID、标签和多种单位的 profile 合并结果","从栈展开规则、符号引用重写及列式查询推导数据结构与复杂度","定位部分栈、累计计数重置、缓存淘汰和过滤造成的信息损失","比较暂停调试、进程内剖析与持续剖析的适用边界，并设计交叉验证"],"prerequisites":"第 04—12 章；理解指针、哈希表、树、CPU 寄存器、采样误差与基本数据库聚合。","sections":[{"title":"贯穿案例：同一条调用栈为何有多种身份","body":"### 阅读任务：沿数据流分析实现\n本章选择 google/pprof、Delve、Grafana Pyroscope、Parca 与 Parca Agent。这些项目分别把“观测程序”中的不同难点做成了可用系统：pprof 定义和操作带权调用栈；Delve 从停止的进程恢复语言现场；Pyroscope 与 Parca 承担多实例、长时间的数据存储和查询；Agent 负责低侵入的系统级采样。沿同一个样本追踪这些系统，才能解释为什么相同的火焰图外观可能来自不同测量语义。\n\n源码固定为 pprof 提交 `60bf690a9302b860b2110fbb4dccdfbbeb26ab89`、Delve `v1.24.2`、Pyroscope `v1.14.0`、Parca `v0.23.1`、Parca Agent `v0.38.1`。Agent 的 Go 模块替换指向 OpenTelemetry（OTel）eBPF profiler 的 Parca 分支 `edfa6253a8b2`。这是可复查的历史截面，不是“均为最新版”的声明；尤其不能据 Delve 旧版本推断它支持本教材的 Go 1.25。不同系统是可比较的实现，不要求读者把它们串联部署。[proj-pprof] [proj-delve] [proj-pyroscope] [proj-parca] [proj-parca-agent]\n\n### 构造一个可手算的输入\n把两份 profile 记为 P1、P2，假设各自进程使用的二进制构建标识（Build ID）都是 B1。函数 encode、hash、serve、main 在同一映射内的相对地址分别为 `0x1120、0x1800、0x2020、0x3030`。P1 记录的装载基址为 `0x400000`，P2 为 `0x700000`；地址空间布局随机化（ASLR）可以造成这种差异。同一 encode 指令因而可能显示为 `0x401120` 或 `0x701120`。映射大小和文件偏移相同；本例没有内联帧。\n\nP1 用位置 ID 7、3、1 表示 encode、serve、main，P2 却使用 42、8、9；hash 在 P2 中用 ID 43。ID 只在各自文件中有效，数字接近或相等都不构成函数同一性的证据。下面的栈均按 pprof 的叶到根顺序书写，值向量的类型依次是 `samples/count`、`cpu/nanoseconds`。\n\n|输入记录|局部位置 ID|route 标签|计数|CPU 时间|\n|---|---|---|---|---|\n|P1-A|7 → 3 → 1|/pay|3|30 ms|\n|P2-A|42 → 8 → 9|/pay|2|20 ms|\n|P2-B|43 → 8 → 9|/pay|1|10 ms|\n|P2-C|42 → 8 → 9|/admin|1|10 ms|\n\n这是人为构造的 10 ms 周期示例，不是一次真实服务测量，也不意味着可以任意调整 Go 的标准 CPU profiler。本例中，两份 profile 采自先后运行的进程，对应两个连续采集窗口。后文另讨论并发实例的累计采集时长与墙钟时间为何不同。\n\n正确的语义合并产生三条样本：encode 栈的 `/pay` 为 `[5,50 ms]`，hash 栈的 `/pay` 为 `[1,10 ms]`，encode 栈的 `/admin` 为 `[1,10 ms]`。有三条样本，却只有两条不同调用路径。全局总计 7 次、70 ms；筛选 `/pay` 后是 6 次、60 ms，其中 encode 的 flat 为 50 ms，hash 为 10 ms，serve 与 main 的 cum 都为 60 ms。各函数 cum 相加会重复计算，不能得到总 CPU。\n\n### 全章要维持的五个不变量\n从内核到界面，必须分别保持二进制身份、调用顺序、单位、标签分组和时间含义。地址去重不能跨 Build ID 误合并；位置表重编号不能倒转栈；将 count 变为时间要显式乘周期；同栈不同标签不能提前合并；累计量和区间量不能相加后解释成同一种时间序列。\n\n接下来的每个实现都在减少成本：内核使用有限规则，传输复用栈 ID，存储复用符号，查询提前过滤。节约的代价是增加假设和状态。源码阅读的主问题因此是：转换是否保持上述不变量，失败时系统如何告诉我们已经失去哪些信息？"},{"title":"采集与栈展开：从一组寄存器恢复可用调用链","body":"### 一个 CPU 样本起初并不是函数名\n系统级采样通常先得到时间戳、进程线程标识、指令指针 PC 和部分寄存器，再读用户内存恢复调用者。知道当前 PC 只够识别栈顶；要得到 encode → serve → main，还需回答每一帧保存返回地址的位置，以及调用者的栈指针如何恢复。Go 的栈可增长和移动，且存在运行时栈切换，不能把“沿内存不断读指针”当成普适算法。\n\n所审读的 OTel eBPF 分支将可执行文件解析放在用户态，生成紧凑的 StackDelta 规则供内核查询，用它们描述不同 PC 区间如何恢复调用者状态。这里 SP 表示栈指针。`elfgopclntab.go:480–626` 读取 Go 函数表和 PCSP 信息，将 PC 区间映射成栈恢复规则；x86 路径按情况选择帧指针策略或 SP delta 策略。PCSP 表表示“程序计数器走到这里时，SP 相对函数入口变化了多少”，不是采样权重。[proj-go-unwind]\n\n用一个简化的 x86-64 模型说明。CFA（规范帧地址）是恢复调用者状态的参考地址；本例当前 `SP=0x1000`，规则给出 `CFA=SP+40`。返回地址保存于 `CFA−8`，该位置的值为 `0x40202a`。于是下一帧使用 `SP=0x1028、PC=0x40202a`，再查询 serve 所处 PC 的规则。真实编译器可以使用不同序言、尾声、寄存器和特殊函数规则；这组地址只用来演示递推，不是 Go ABI 的固定布局。\n\n### 为什么需要页索引、二分和分段执行\nDWARF 是一种调试信息格式；在 BPF 的受限执行环境中，不宜每次采样都完整解析它。`native_stack_trace.ebpf.c:137–217` 先按可执行文件标识和地址页找规则表，再在页内寻找覆盖当前 PC 的最后一条规则。页面为 64 KiB，源码使用至多 16 步的有界二分。它先找严格大于目标的边界，再退一项取得不大于目标的规则，必要时使用前一页延伸来的区间规则。[proj-ebpf-unwind]\n\n这个“前驱查询”很重要。假设规则起点为 10、20、35，目标 PC 偏移为 27，应使用起点 20 的规则，下一条起点 35 尚未生效。规则描述半开区间上的状态；即使目标改为 29、数值上更接近 35，也仍应使用起点 20 的规则。按最近距离选择记录可能得到错误 SP。对有序规则表，二分每一步砍掉约一半候选；其工作量随规则数对数增长，而内核验证器需要额外看到确定的最大迭代次数。\n\n一次 BPF 程序只展开受限数量的本地代码帧（native frame）；需要继续时，通过 BPF tail call 跳转到后续展开程序。`575–630` 行把本轮展开、遇到解释器帧后的分派、错误码与继续执行组合起来。这样拆分的目的在于让每一段的资源消耗可分析，而不是无限扩大单个内核程序。深栈、特殊运行时边界和解释器切换仍然可能触及限制。\n\n### 部分成功比完全失败更难发现\n该实现先把已知当前帧压入结果，再尝试恢复调用者。因此，已经保存 encode、serve 两帧后，仍可能因为缺少 serve 当前 PC 区间的展开规则，或读取其返回地址失败而停止，无法继续恢复 main。返回的栈非空，不代表展开完整；“有一张火焰图”也不能证明它的根节点真实。\n\n规则页不存在、嵌套 BPF 映射（map-of-maps）查找失败、没有可用前驱规则和读栈失败，都有各自的错误路径。对生产数据应分别统计采样事件数、成功取得栈顶数、完整展开数、符号化成功数和标签可读数。若只统计非空栈，某些工作负载被截短的比例会被掩盖。这组质量指标由源码控制流推导，具体名称与采集方式仍需在监测方案中实现。\n\n把失败栈删除也不总是正确：假如 cgo 热点更容易展开失败，删掉它们会系统性高估纯 Go 热点占比。保留错误类别、可用前缀和原始总权重，有助于给查询结果标注“剩余部分未知”。但将所有失败样本统一合入一个正常函数名同样会制造虚假的调用关系。\n\n### Go 栈、Go 标签与兼容性是三个问题\n该 fork 的 `interpreter/golang/runtime_data.go` 中最新标签布局为 `go1.24`；加载器遇到未知版本会告警并尝试最新布局。标签依赖运行时对象的具体内存结构，正确展开 native 栈并不能证明正确读到了 goroutine 的 pprof 标签。Go 1.25 应分别验证两个能力，不能用旧布局回退当成兼容性保证。[proj-otel-ebpf]\n\n对照实验可以让 `/pay` 与 `/admin` 执行相同函数，只给它们不同 pprof 标签。若系统级结果的栈相同但标签缺失，先检查标签布局和继承路径；不要立即解释为请求没有运行。再加入 cgo、深递归和 goroutine 迁移，比较进程内 profile 的总量与完整栈比例。本节只给出实验设计，尚无这组对照的运行结果。\n\nDelve 与这种连续采样的底层材料有重叠：二者都要从寄存器和二进制恢复栈。但采样器要在极短时间内反复执行，Delve 可以在暂停状态做更丰富的内存读取。选择预计算规则而非内核完整解析，正是性能、权限和覆盖之间的工程折中。"},{"title":"pprof 规范化与合并：建立语义身份后才能相加","body":"### 先重写对象引用，再计算样本身份\npprof 的 profile 不是一张平铺函数表，而是一张有依赖的对象图：Sample 引用 Location，Location 引用 Mapping 和带行号的 Function，函数名与路径等另有字符串表示。输入文件里的 ID 是局部索引。`profile/merge.go:135–147` 因而同时维护“本次输入的 ID 缓存”和“所有输入共享的语义表”。处理新文件时前者重建，后者继续累积。[proj-pprof-merge]\n\n回到案例，P1 的 location 7 与 P2 的 location 42 只有在映射和函数信息完成归一化后才能判断等价。映射匹配使用按页对齐的大小、文件偏移和身份；有 Build ID 优先用它，否则退化到文件名，缺失时还存在较弱的占位路径。这里的风险非常实际：同名二进制被重新编译后，其地址含义可能已经改变；文件名相同远不如 Build ID 相同可靠。\n\n`mapMapping` 为匹配映射计算“已有起始地址减去新输入起始地址”的重定位差。P2 的 `0x701120` 加上 `0x400000−0x700000` 后成为 `0x401120`。后续 location 的语义键使用相对映射起点的地址，同时包含映射 ID、折叠状态，以及函数、行、列组成的序列。于是 ASLR 被消除，内联信息仍参与身份。只用函数名或绝对 PC 合并都会丢失不同层次的信息。\n\n### 源码精读一：为什么值不在去重键里\n下面摘录 `profile/merge.go:155–164` 的核心，省去函数后半段创建新样本的代码。这是源码片段，不是可独立编译的程序。\n\n```go\nfunc (pm *profileMerger) mapSample(src *Sample) *Sample {\n    // Check memoization table\n    k := pm.sampleKey(src)\n    if ss, ok := pm.samples[k]; ok {\n        for i, v := range src.Value {\n            ss.Value[i] += v\n        }\n        return ss\n    }\n```\n\n参数 `src` 是待合并的输入样本。`sampleKey` 先把局部位置变为合并后的语义位置，再编码标签。查表成功说明两条记录代表同一调用路径与同一组标签。循环按列相加，保留 count 与 nanoseconds 两个量纲；最后返回已存在的样本对象。若值本身也进入键，`[3,30 ms]` 与 `[2,20 ms]` 会得到不同键，从而永远不能汇总。\n\n源码 `196–245` 行使用变长整数及带长度的字符串编码，避免简单拼接导致边界歧义。字符串标签的键排序后写入，消除 Go map 遍历顺序的不稳定；数值标签连同单位进入键。注意它排序的是标签键，不是任意重排同一键下的全部值。读取这类代码时，不能把“看到了 sort”扩大成所有标签表示都具有任意顺序不变性。\n\n现在可以逐行执行案例：P1-A 首次生成 encode 栈 `/pay` 的条目；P2-A 映射后命中并加为 `[5,50 ms]`；P2-B 的栈不同，创建第二条；P2-C 的标签不同，创建第三条。先删标签再合并虽然可以得到 encode 共 60 ms，却无法以后恢复 `/pay` 的 50 ms。按完整键合并能够保持各分组的总权重，但不再保留每个输入各自贡献多少，因此不是对原始记录的可逆压缩。删除标签还会进一步丢失分组信息。\n\n### 合并头部不是重新估计采样过程\n`combineHeaders:468–518` 先检查 period 类型和有序的 sample 类型/单位是否兼容，再累加 Duration，取最早 TimeNanos，并使用最大的 Period。它没有因为选了最大 Period 就重新缩放所有值。已按纳秒给出的 CPU 值应作为纳秒相加；不同频率来源的 count 要换算时间，则必须保留或利用各自周期，不能事后对合并 count 乘一个任意周期。\n\n例如两个来源各 1 次，周期分别为 10 ms 和 20 ms，正确估计时间为 30 ms。若仅剩总 count 2 与最大周期 20 ms，再相乘就变成 40 ms。这个反例不是说 pprof 的所有报告都会这样算，而是说明不能把头部 Period 选择误解为已经完成了重新加权。第 05 章讨论的采样误差仍然存在；格式兼容不等于估计量可直接比较。\n\nDuration 相加也有明确边界。连续窗口的 10 s 与 20 s 合并可解释为累计采集 30 s；两个实例在同一个 10 s 墙钟区间采集，合并 Duration 为 20 s，并不表示服务经历了 20 s。计算核占用或每请求成本时，分母应来自所选估计目标，不能盲从某个文件头字段。\n\n### 差分与报告为何还能改变结论\n`internal/driver/fetch.go:63–89` 的差分路径可先调用 `p.Normalize(pbase)`：按各 sample type 的总量，把当前 profile 缩放到基线总量。例如当前总量 200、基线总量 100，当前值会统一乘 0.5。随后才给基线值乘以 −1，与当前 profile 合并，再进行符号化。\n\n差分是带符号权重，不能当作普通正权重样本；“百分比上升”也可能来自总量变化。该文件还允许部分输入获取失败后合并成功取得的输入，因此必须检查警告，不能只看到输出文件就认定全部实例都在分母中。[proj-pprof]\n\n复杂度也可从对象图推导。设总栈引用数为 R，标签编码字节为 B，每条样本有 k 个标签键；在常见哈希表平均假设下，主要工作约为 `O(R + B + Σ k log k)`，另加映射、函数和位置的规范化成本。它不是最坏情况严格线性证明；深栈、大量独特标签与无效输入都能增加常数和内存。源码的稠密切片与稀疏 map 两级 ID 缓存减少常见连续 ID 的查表成本，但不改变语义身份必须先建立这一前提。"},{"title":"Pyroscope：共享栈树、符号重写与累计量差分","body":"### 样本值和调用栈应分开保存\n假设服务每秒产生许多 encode → serve → main 样本。若每条都携带三组函数名、文件名和行号，存储和传输成本会主要花在重复符号上。Pyroscope 的符号分区把字符串、映射、函数、位置分别去重，再为调用栈分配可复用 ID；profile 记录保存时间、类型及“栈 ID—权重”。这种设计主要减少跨样本重复存储的符号和调用路径。[proj-pyroscope-store]\n\n`dedup_slice.go:32–104` 的处理次序是字符串、映射、函数、位置、样本。这个顺序来自依赖关系：位置引用映射和函数，后两者又引用字符串；只有被引用对象的新 ID 已知，引用者才能安全改写。跨分区压缩的 `rewriter.go:128–217` 进一步先找需要的栈和符号，再按依赖顺序追加和改号。把旧 ID 原样复制到目标分区会把“42”错误指向另一个位置，文件格式可以合法而语义已经损坏。\n\n### 一棵从根到叶插入、从叶到根恢复的树\n`stacktrace_tree.go` 的可变节点保存四个整数：父节点 p、位置引用 r、第一个子节点 fc、下一个兄弟节点 ns。输入栈是叶到根，插入时反向遍历，因而共享调用前缀。对于本章两条栈，可以得到下面的教学树；数字是本例假设的节点号，不承诺与任意运行实例一致。\n\n```text\n0 sentinel\n└─ 1 main\n   └─ 2 serve\n      ├─ 3 encode    stack ID = 3\n      └─ 4 hash      stack ID = 4\n/pay 与 /admin 可以引用同一个 stack ID 3\n标签区分样本，树只表示调用路径\n```\n\n根方向的 main、serve 只保存一次，叶节点号即可作为完整栈的入口。这里称“共享调用前缀”是以根到叶阅读而言；若按 pprof 的叶到根数组阅读，它共享的是数组后缀。没有先约定方向，讨论前缀压缩很容易互相矛盾。[proj-pyro-tree]\n\n### 源码精读二：恢复路径只需不可变字段\n下面摘自 `stacktrace_tree.go:89–101`，仅省略源码中的注释。它是片段，接收已经存在的树和栈 ID。\n\n```go\nfunc (t *stacktraceTree) resolve(dst []int32, id uint32) []int32 {\n    dst = dst[:0]\n    if id >= uint32(len(t.nodes)) {\n        return dst\n    }\n    for i := int32(id); i > 0; i = t.nodes[i].p {\n        dst = append(dst, t.nodes[i].r)\n    }\n    return dst\n}\n```\n\n第一条赋值清空逻辑长度，并在容量足够时复用缓冲区，减少重复分配；遇到越界 ID 则直接返回空结果。循环从叶节点开始，读取当前位置引用 r，再跳父节点 p；当遇到保留的节点 0 时停止。以 ID 3 输入，输出 encode、serve、main，恰好恢复 pprof 所需方向。恢复时不读取 fc 和 ns，所以新增兄弟节点不改变已有路径。\n\n并发安全仍需进一步看切片。`partition_memory.go:131–149` 在读锁下复制节点切片头，再释放锁逐栈解析；注释解释 p/r 插入后不变，但切片扩容会改切片头，必须处理这一层竞争。持久化的 parentPointerTree 只需 p/r，省去插入专用的 child/sibling 字段。这里的空间节约来自读写阶段分工，不能简单归纳为“树天然线程安全”。\n\n恢复长度 d 的栈需要 O(d) 次父指针访问。插入却不保证 O(d)：源实现沿兄弟链寻找匹配子节点，某一层分支越多，线性扫描越长；代价是各层经过兄弟数之和。给每个节点增加 child 哈希表可以改善宽树查找，却引入额外分配和哈希表空间。该实现另用栈哈希到 ID 的缓存加速重复栈，先读锁查命中，未命中才写锁插入。源码的 size 方法还明确没有计入 map 占用，因此不能直接把它当作完整内存测量。\n\n### 累计分配 profile 必须先变成区间增量\nCPU profile 通常已经描述某段时间的样本；`alloc_space` 和 `alloc_objects` 则具有累计语义。Pyroscope `delta.go` 的这条实现路径仅对 memory 的这两种 sample 类型启用差分，不应外推到所有 CPU、live heap 或 block 数据。[proj-pyro-delta]\n\n该模块维护 `fingerprint → stack ID → 最高累计值`。fingerprint 是根据标签集合计算的系列标识。第一份 profile 只建立基线，返回空样本；后续对每条栈做当前值减历史值。如果发现计数下降，代码会重建基线并丢弃这一可疑区间。可能的原因包括进程重启、计数重置或旧数据迟到，需结合输入记录判断。假设单栈累计分配字节依次为 100、160、20、45，其区间输出为“空、60、空、25”。第一个空并不表示第一段零分配，也不是上传丢失。\n\n为什么不把 20−160 得到的 −140 当成释放？因为 alloc_space 是累计分配量，释放要由其他指标表达，负增长违背该计数的模型。另一种方案是遇到重置就输出当前 20；这样可能保留重启后的活动，但需要明确知道新起点时间，否则区间速率的分母不确定。当前实现选择保守丢弃，可比性与覆盖率之间存在取舍。\n\n还需审查原地更新顺序。该版本 `deltaSamples:85–99` 一边遍历一边修改输入 Values；若较后的栈出现下降，`computeDelta:63–68` 会从已被部分修改的输入重建基线。\n\n考虑两条栈：旧值为 `[100,100]`，新值为 `[160,20]`。第一条栈先被减成 60，第二条栈随后触发重置，重建所见便是 `[60,20]`。下一份 `[180,30]` 因而得到 `[120,10]`；若使用原始新值重建基线，则应为 `[20,10]`。\n\n本书用逐字复制的原始 `delta.go` 和 Samples 方法完成了最小隔离 Go 测试，复现了这个序列，并用正常增长和首栈重置作对照。输入保持同一系列、同一 sample type 和排序后的稳定栈 ID，符合真实调用链允许单份 profile 含多条栈的条件。外围标签与类型使用最小桩；本次没有运行完整服务或上游测试套件，结论也不外推到后续版本。\n\n可验证的替代设计有两种：先检查全部栈是否需要重置，再统一相减；或保存原始输入，专门用于重建基线。[proj-pyro-delta]\n\n系列身份因此成为算法的一部分。若两个进程共享不合适的 fingerprint，交错到达的累计值会彼此污染；若旧数据迟到，也可能伪装成计数重置。排查“刚重启后曲线空一段”时，应先核对基线与到达顺序，再决定是否需要重试。评估应同时报告差分后覆盖区间与丢弃原因，不能仅展示一条平滑曲线。\n\n### 查询和写入的近似必须分别审计\n该版本的 distributor 在较昂贵的规范化之前执行租户限流。它可将数据发送到 ingester（写入节点）、segment writer（段写入组件），或同时发给两者。可选聚合路径标注的 best-effort（尽力处理）和 at-most-once（至多一次）只约束该路径，不代表全系统的交付保证。查询则按时间拆分内存 ingester 与历史 store gateway 的范围，分别取得树后归并，最终才受最大节点数等展示限制影响。[proj-pyroscope] [proj-pyroscope-store]\n\n“写入前丢弃一个 profile”和“报告省略小节点”都让图变小，但前者改变可观测总量，后者可能只改变展示粒度。诊断时应沿输入数、入库数、查询总权重和渲染节点数分别检查。实际租户限流、对象存储和查询延迟仍需部署后测量。"},{"title":"Parca：按需补栈、列式执行与延后符号化","body":"### Agent 先发送什么，后端还需要什么\nParca Agent 的 `ReportTraceEvent` 先缓存 TraceHash 对应的栈，再将标签、时间戳和权重写入 Arrow builder。每次事件都检查栈缓存，因为按最近最少使用策略（LRU）管理的条目可能已被淘汰。标签提取、重标记过滤、无效 UTF-8 跳过也发生在这条路径；“采到了事件”不自动等于“后端得到带完整标签的样本”。[proj-parca-agent]\n\n采样来源决定值和单位。普通 CPU 采样写入 value=1、sample 类型 samples/count、period 类型 cpu/nanoseconds；off-CPU 来源用 OffTime 写入 wallclock/nanoseconds。后者表达离开 CPU 的时间，不能加入 CPU count 后画成统一时间。`buildSampleRecord:1096–1120` 对该采样批次写入配置频率对应的周期，并标记 delta 语义。\n\n这解释了本章案例与线上传输的差异：表中的 `[3,30 ms]` 是教学用聚合记录，Agent 可以先发三条 value=1 的事件。只有在明确周期为 10 ms 时，它们才合计 30 ms。不能假设每个采集器的传输记录都直接携带 count 和 cpu 两列，更不能因列名都叫 value 就跨来源相加。\n\n`reportDataToBackend:969–1081` 首先发送样本批次，其中保留权重、时间和标签，但调用栈仅用 ID 表示。若后端已知这些 ID，返回空记录即可结束；否则会在 `stacktrace_id` 列中返回尚未解析的 ID 列表，Agent 查询缓存后再发送完整栈。响应字段数、列名和二进制类型都有检查。这个双阶段协议把“经常变化的权重/时间”和“多数时候不变的结构”分开。[proj-parca-agent]\n\n对大量重复栈，它减少重复传输；对全新栈，它增加一次请求往返及状态管理。若发样本后栈被淘汰，`buildStacktraceRecord:1133–1137` 会输出缺失 locations 和 `is_complete=false`；缺少可执行文件信息也使记录不完整。不能将未知栈静默补成空调用链并参与正常占比。较大的缓存、主动随批携带首次栈、后端持久字典各有内存、带宽和一致性代价，选择要看栈复用率与批次延迟。\n\n### 列存保存的不是一棵预先画好的火焰图\nParca 的 pprof WriteRaw 入口通过 normalizer 转换为 Arrow record，再交给 ingester 插入表。normalizer 逐 sample type 拆分值，保留类型、单位、周期、时间和标签。因而同一 profile 的 count 与 cpu 两列不会未经说明就变成同一数值序列。[proj-parca-store]\n\n`pkg/profile/schema.go:38–158` 给出了实际物理布局：labels 是可空动态列，类型与单位适合字典编码；stacktrace 是重复的可空字符串列，配合字典编码和 LZ4；时间和值使用 delta binary packed 编码。将同列值放在一起可以让重复标签和相近时间更容易压缩，也使查询只读取所需维度。这里的 delta 是整数编码方式，和上一节累计分配差分是两个概念。\n\nArrow 则描述内存中批量数据的布局及生命周期；不能仅凭使用 Arrow 就推断落盘格式、持久化保证或查询一定零拷贝。该版本 ingester 在插入前显式初始化字典，注释说明这是避免惰性初始化并发竞争的处理。优秀架构不只在于列式大方向，也在于引用计数、字典初始化和错误路径这些细节。\n\n### 源码精读三：乘周期应发生在聚合之前\n`pkg/parcacol/querier.go:1431–1479` 先选择 stacktrace 和请求的分组列，再把 count 转成 period 的量纲，最后聚合。核心片段如下：[proj-parca-query]\n\n```go\nvar valueCol logicalplan.Expr = logicalplan.Col(profile.ColumnValue)\nif isSamplesCount(queryParts.Meta.SampleType) {\n    valueCol = logicalplan.Mul(\n        logicalplan.Col(profile.ColumnValue),\n        logicalplan.Col(profile.ColumnPeriod),\n    ).Alias(profile.ColumnValue)\n    resultType = queryParts.Meta.PeriodType\n}\n```\n\n初始表达式读取原始值；只有 sample type 确认是 samples/count 才进入分支。乘法按行结合各自周期，随后把结果类型改成周期类型，以保证数值与元数据一致。若先 `sum(count)` 再乘单一周期，不同频率的来源会产生前节 30 ms 误算为 40 ms 的问题。这里的写法展示了估计量语义如何直接约束查询算子顺序。\n\n完整执行链是扫描、过滤、投影、聚合、最终投影，之后再符号化。`selectMerge` 对时间使用包含两端的比较，而 `QueryRange` 的部分范围路径使用严格比较；读者实现相邻窗口拼接时应检查具体接口，不能凭经验假定一律半开区间。还应明确 `start/end` 端点是否包含在查询范围内。\n\n把教学输入代入查询：先限定 `/pay` 与时间，再分别算 3×10、2×10、1×10 ms，按栈汇总为 50 与 10。若不保留 route 分组且不过滤，它会得到 encode 60、hash 10；这不是引擎算错，而是查询已经要求丢掉 route 维度。为了回答两个接口分别消耗多少，必须在过滤或分组阶段保留该维度，而不是等火焰图生成后猜测。\n\n### 延后符号化节省了什么，又依赖什么\n`QueryMerge:1367–1401` 先获取聚合结果，再调用 SymbolizeArrowRecord。若许多事件共享同一栈，先聚合可减少重复符号处理。符号化路径取决于配置和文件中的可用信息，可以使用外部地址解析器、DWARF、Go pclntab 或符号表；缓存和二进制定位以 Build ID 等信息为关键。[proj-parca]\n\n代价是查询依赖符号保留策略。部署时只保留正在运行的二进制，可能使一个月前的剖析只能显示地址。文件路径不能替代构建身份。源码行归因需要可用的文件与行号映射，但未必需要完整 DWARF：该版本 GoLiner 可通过 Go 符号表的 `PCToLine` 获得文件和行号。恢复内联调用则需要额外信息；`pkg/symbol/addr2line/go.go:92–105` 的注释明确指出这条 Go 路径尚未展开内联函数。应分别检查地址、函数、行号和内联帧的解析程度。\n\n对于过滤后 N 行、唯一栈 U、平均深度 d，可以粗略推导：扫描受读取列和谓词选择性影响，哈希聚合通常约 O(N)，还原栈/符号的工作与 U 和 d 更相关。没有实测就不能声称某后端一定快于另一个；高基数标签使 N 与 U 的压缩关系变差，复杂正则或符号缺失也可能主导查询。这个成本分解比产品口号更能指导实验。"},{"title":"Delve 交叉验证：暂停现场如何补齐采样解释","body":"### 一个 goroutine 不总对应一条正在运行的线程\n当采样结果提示 serve 热点时，Delve 能回答“当前局部变量是什么、goroutine 停在哪里、谁持有状态”。它不能仅凭一次暂停给出 serve 消耗了多少 CPU。时间权重来自重复采样或计时，调试快照来自一个具体执行点；混淆两者会把等待很久的 goroutine 错认成 CPU 热点。\n\n`pkg/proc/stack.go:130–146` 明确区分寄存器来源：G 正在某线程运行时从线程读取；不在线程运行时，从保存的 PC、SP、BP、LR 构造起始寄存器，再结合映像静态基址。选择错误来源会把 OS 线程当前执行的另一个 goroutine 当作目标 G。[proj-delve-stack]\n\n随后 stackIterator 逐帧前进，`advanceRegs:490–553` 查询当前 PC 对应的帧描述条目（FDE），建立 DWARF 帧上下文，再执行 CFA 与寄存器恢复规则。CFA 可以看作对调用者帧进行定位的参考位置，具体由规则计算；不是所有架构都等于当前 SP 加固定字节数。缺少 FDE 时还有架构相关修正路径，不能把 DWARF 作为唯一信息来源。\n\n### 物理栈帧与逻辑内联调用不是一回事\n编译器把某函数内联到 encode 后，机器栈中未必多一帧，但源码层仍希望看到该函数。`appendInlineCalls:426–487` 读取 DWARF 内联树，生成标记 `Inlined=true` 的逻辑帧；非顶层帧还对 call PC 做减一处理，避免把返回后的指令错误归到下一行或函数边界。\n\n因此 Delve 多出的某一逻辑帧不一定证明采样器漏采；需要先比较是否启用内联展开、二者所用符号是否一致、栈中的 PC 是调用点还是返回点。相反，源程序优化导致变量无法恢复，也不自动表示程序数据被破坏。调试信息、寄存器分配和生命周期共同决定可观测性。\n\n### 部分栈和缓存都带时间条件\n`stack.go:380–412` 在已经有帧时，把后续展开错误附为带 Err 的 Stackframe；若第一帧就失败则直接返回错误。这和 eBPF 的部分成功问题相呼应：必须保留失败边界，不能只数正常显示的行。\n\n`target.go:65–68` 注释要求每次恢复执行都清空 goroutine 缓存。一次暂停时得到的 G 地址、栈和状态不能无条件沿用到下一次暂停。`native/proc.go:395–417` 还把 ptrace 操作固定到同一个 OS 线程，利用 channel 串行提交。应用层 goroutine 调度自由，不代表底层调试协议也允许操作任意换线程。[proj-delve]\n\n一套有解释力的验证流程是：先从 profile 定位 serve 热路径，保留对应构建产物；在可控环境用兼容版本的 Delve 暂停相同代码，检查具体分支与状态；再恢复运行，用基准测试验证修改是否降低对应时间权重。Delve 本身改变调度和时序，所以不能拿“单步时延”替代服务延迟测量。本章所读旧 tag 用于展示机制，真实 Go 1.25 实验应另核对支持版本。"},{"title":"把实现比较变成可检验的系统设计","body":"### 一个查询结果应能追溯回哪些中间量\n现在反向追踪 `/pay` 中 encode 的 50 ms：界面宽度来自聚合权重；权重来自过滤后两个兼容来源；二者依 Build ID 和相对地址归为同一路径；局部 ID 已全部重写。栈顶 PC 来自采样时的寄存器，其余调用路径则依赖正确的栈展开。任一层不满足条件，50 ms 都可能变成另一个含义。\n\n为系统建立检查点比单独验证火焰图更有效。教学案例的预期如下：规范化前四条聚合记录，语义合并后三条，唯一调用路径两条，全局 70 ms，`/pay` 60 ms，encode 在 `/pay` 为 50 ms。树去重可以减少结构节点，却不能改变总权重；标签过滤会改变所选样本的权重；百分比分母可以是过滤前的全局总量，也可以是过滤后的所选总量，必须明确采用哪一种；渲染裁剪不应伪装成完整证据。\n\n将这些性质写成变形测试：重编号所有局部 ID，结果不变；给同一映射的地址与基址加同一偏移，结果不变；把一条样本拆成两个相同键且权重和不变的样本，结果不变；仅改变 route，应改变分组结果而不改变全局总量；改变 Build ID，不能继续无条件按原地址解释。这些测试针对语义不变量，比对着某个内部函数重复写相同实现更有价值。\n\n### 四类设计选择及其可验证代价\n|设计选择|节约的资源|增加的约束|适合如何验证|\n|---|---|---|---|\n|内核预计算展开规则|每次采样的解析工作|规则覆盖、版本布局、有限深度|完整率与权重偏差随栈类型变化|\n|栈字典与共享父指针树|重复字符串及公共路径|ID 重写、字典生命周期、宽树插入|固定样本下验证去重率和峰值内存|\n|列存先过滤聚合再符号化|无关行扫描、重复符号工作|标签基数、历史二进制可得性|相同查询语义下测试延迟和缺符号比例|\n|暂停调试恢复完整状态|运行时持续观测成本|进程扰动、单点时序、版本支持|以状态解释为目标，另测运行性能|\n\n这张表不提供产品排名。单进程问题通常可从 pprof 和 Delve 入手，必要时补充 trace 与操作系统观测；跨实例回归需要持续采集、构建身份、时间与标签查询；系统级观测还需要 eBPF 权限和不同语言栈的质量评估。前一个场景的最小配置，不应被下一个场景的全部复杂性淹没。\n\n### 故障注入比只测正常吞吐更能暴露设计问题\n建议至少注入四种异常：删除一个二进制的调试信息；缩小栈缓存造成按需补栈未命中；让累计分配序列乱序到达；让两个构建使用相同文件名。分别观察符号缺失、完整性标记、delta 基线重置和 Build ID 隔离。异常是否可见，比系统是否始终返回一张漂亮图更重要。\n\n实验报告应记录原始输入与查询约定，明确样本量、单位、窗口端点、失败计数、输出总量与符号完整率。若比较 Pyroscope 与 Parca，要同时控制 profile 类型、标签、采样率、保留时间和查询范围；只比较两个默认界面的延迟没有可解释性。\n\n本章完成了源码审读、算法推导、手算例证，以及 Pyroscope 原函数的隔离复现。尚未部署这些平台，也没有平台开销排名或生产规模实验结果。附带的研究记录给出文件与行号，可沿同一版本重复检查。下一章将用相同标准阅读研究论文：先辨认估计目标，再检查方法如何改变数据，最后判断实验到底支持了多大范围的结论。"}],"labs":[{"title":"实验 15：追踪同一组样本的身份、权重与信息损失","steps":["使用正文四条合成记录建立表格，记录 Build ID、映射起点、局部位置 ID、route、count 和 cpu 单位。先手算三条语义样本及 70/60/50 ms 三个检查点。","用自选语言实现教学版语义键：先以映射内相对地址和 Build ID 建立位置身份，再编码边界明确的有序调用路径与标签；对同键权重逐列求和。写明简化范围，避免将其当作完整 pprof 解析器。","进行五种变形：局部 ID 重编号、ASLR 整体平移、样本等量拆分、route 修改、Build ID 修改。前三种应保持查询结果，第四种改变标签分组但保留全局总量，第五种要求重新建立符号身份。","手工建立父指针树，验证栈 ID 3 恢复 encode/serve/main，且 /pay 与 /admin 复用树路径时仍保留不同样本。对宽分支输入，比较兄弟链扫描和按孩子建立哈希索引的查找次数与内存。","先输入单栈累计分配 100→160→20→45；再从头执行，并在 160 之后插入一份时间戳早于它、累计值为 150 的迟到记录，再继续输入 20、45。分别记录基线、区间输出及被丢弃的区间，说明按实例隔离和按时间排序各解决什么问题。","在隔离环境运行实际项目时，先核对 Go、内核和项目的兼容版本，再用真实源码入口验证这些不变量。报告应区分教学实现、原函数隔离测试与完整平台运行结果。"]}],"quiz":[{"question":"P1 与 P2 的 encode 地址不同、位置 ID 也不同，什么条件最能支持它们合并？","options":["局部 ID 都是正整数","归一化后的映射身份、相对地址、函数行信息及样本标签兼容","函数名包含相同子串","两张火焰图的颜色相同"],"answer":1,"explanation":"局部 ID 与 ASLR 地址不是跨文件身份。应先规范化对象依赖，再依据栈与标签形成语义键。"},{"question":"两条 CPU count 样本各为 1，周期分别 10 ms 和 20 ms，如何汇总 CPU 时间？","options":["count 求和后乘最大周期，得到 40 ms","count 求和后乘最小周期，得到 20 ms","分别乘周期再求和，得到 30 ms","取平均 count，得到 1 ms"],"answer":2,"explanation":"不同来源要按行保留权重。pprof 合并头部选择最大 Period，并不自动为全部 count 重新加权。"},{"question":"Pyroscope 该路径收到第一份 alloc_space profile 后输出空样本，最合理的解释是？","options":["应用完全没有分配","首次建立累计计数基线，尚不能可靠估计该区间增量","树为空所以忽略一切数据","网络一定丢包"],"answer":1,"explanation":"所读 delta 实现首次只建立基线；空输出不能当作零分配。计数重置时也存在保守丢弃。"},{"question":"Agent 已返回两帧且 goroutine 标签存在，能否断言调用栈完整？","options":["能，两帧足够","能，标签能证明全部 PC 正确","不能；栈展开和标签读取需分别验证，部分栈仍可能带错误","不能，所有 eBPF 栈均不可靠"],"answer":2,"explanation":"当前帧可以在下一帧恢复失败前已被保存。应检查错误和完整性信息，避免把非空与完整混为一谈。"}],"exercises":[{"question":"在贯穿案例中先删除 route 标签再合并，得到几条样本？仍能回答 /pay 的 encode CPU 时间吗？","answer":"得到两条调用栈样本：encode 为 60 ms，hash 为 10 ms，总量仍为 70 ms。无法从这两条记录恢复 /pay 的 encode 50 ms，因为 /admin 的 10 ms 已混入。保留原始记录或在聚合键中保留 route 才可回答。"},{"question":"把共享栈树的孩子查找从兄弟链扫描改成哈希表，是否一定更快、更省内存？给出反例与测量方案。","answer":"不一定。每层只有一个孩子的深链几乎只需一次比较；哈希表会增加对象、桶和哈希计算的成本。宽树可能受益。应分别构造深窄、浅宽、重复率高和持续出现新栈的输入，控制路径总数与权重，测插入时间、查找次数、分配和峰值内存；恢复出的栈必须一致。"},{"question":"Delve 暂停时发现许多 goroutine 的栈都经过 serve，但同一负载的 CPU profile 中 serve 的 cum 很低，这一定矛盾吗？","answer":"不一定。暂停快照中的这些 goroutine 可能大多在等待，而 CPU profile 统计的是采集期间实际运行时的样本权重。应再核对构建、采集窗口、内联展开、PC 归属和栈完整性，不能用暂停时 goroutine 数乘一个假定时间来替代 CPU 总量。"}],"references":["proj-pprof","proj-pprof-model","proj-pprof-merge","proj-delve","proj-delve-stack","proj-pyroscope","proj-pyroscope-store","proj-pyro-tree","proj-pyro-delta","proj-parca","proj-parca-store","proj-parca-query","proj-parca-agent","proj-otel-ebpf","proj-ebpf-unwind","proj-go-unwind"]},{"id":"16","title":"近五年前沿工作与研究方向","subtitle":"从三篇原始论文的算法、图表与失效条件，走向 Go 的持续观测和反馈优化研究","objectives":["复述三篇代表论文的估计目标、关键算法和原始实验分母","计算阈值采样、测量窗口偏移和 TCP 时间戳匹配的教学例子","识别论文结果的适用边界、对照混杂、有效性威胁及公式一致性问题","把 PGO、Flight Recorder 与开放 profile 格式转化为有基线、可证伪的 Go 研究方案"],"prerequisites":"第 01、03、05、06、08、11、12、15 章；会区分累计量和区间量，理解采样、实验基线和基本概率。","sections":[{"title":"研究地图与证据方法：近五年意味着什么","body":"### 先固定时间，再区分证据类型\n本章检索窗口为 2021-10-02 至 2026-10-02，按论文正式发表时间或官方工程文章发布日期判断是否入选。选择三篇已取得原始全文的学术工作，分别研究多资源归因、细粒度硬件计量和网络延迟观测；再以 Go PGO、Trace、Flight Recorder 和 OpenTelemetry Profiles 讨论工程演进。它们不是全部相关文献的穷尽目录，也不是按引用数自动筛出的排行榜。\n\n|工作|时间与载体|研究的问题|主要原始证据|\n|---|---|---|---|\n|Triangulating Python Performance Issues with Scalene|OSDI 2023|CPU、内存、复制如何共同解释源码性能|算法章节，图 3—8，表 1—3|\n|Fine-Grained Hardware Profiling – Are You Using the Right Tools?|SIGMOD Record 53(2)，2024 年 6 月|短区间硬件计数的边界与自扰动|Listings 2—4，图 1—5|\n|Efficient Continuous Latency Monitoring with eBPF|PAM 2023|高流量下持续 RTT 观测的覆盖与成本|图 1—9，表 1，附录算法 1|\n|Go PGO、执行追踪、Flight Recorder|2023—2025 官方工程资料|将观测接入优化和异常回溯|发布说明、实现说明、Go 1.25.0 源码|\n|OpenTelemetry Profiles|2024 官方介绍及 2026-10-02 规范快照|不同剖析来源与其他信号如何互操作|数据模型、状态与兼容性约束|\n\nSIGMOD Record 的期刊文章不能写成 SIGMOD 主会长文；官方技术文章也不能写成经过同样同行评审的论文。OTel 在检索日的状态快照不是一篇发表于 2026 年的新研究。入选工程资料中，明确发布日期最晚的是 2025-09-26 的 Flight Recorder 文章；这并不证明 2026 年没有其他工作。\n\n### 用同一套问题阅读每篇论文\n先写出估计目标：是执行时间、分配活动、存活内存，还是某段网络的往返时间（RTT）？再找观测机制：信号、分配器钩子、硬件性能监控单元（PMU）计数或协议字段。随后分析从观测到估计的规则、基线为何失败、实验如何构造真值，以及算法在哪些输入上失去前提。\n\n本章的论文数字均标为作者原实验结果；手算例子明确标为教学构造；Go 迁移方案属于本教材推导，尚未实施。逐图阅读比转述摘要更重要：表中中位数、图中单个案例与某应用最高加速不能混写成同一个普遍结论。源码与文献的实际阅读范围及证据条目保存在配套研究记录中。"},{"title":"Scalene：改变采样对象，比增加采样频率更关键","body":"### 问题与失败基线：一行 Python 不等于一种资源\nBerger、Stern 和 Pizzorno 的 OSDI 2023 工作指出，仅给每行分配一个 CPU 百分比不足以指导优化。一行 Python 可能在解释器中执行，也可能等待本地扩展计算，还可能不断分配和复制大型对象。把本地扩展成本归到 Python 解释器，会诱导读者优化错误层次；把驻留集大小（RSS）当作程序已分配内存，又会混入触页和物理驻留行为。[paper-scalene]\n\n论文第 2 节利用 CPython 的信号交付特征做 CPU 归因。信号处理通常要等主线程回到可处理 Python 信号的位置；设按 CPU 时间计的目标采样间隔为 q，两次信号处理之间实际流逝的进程虚拟时间为 T。Scalene 用 q 估计 Python 部分，将延后的 `T−q` 归于本地代码（native）部分。图 3 展示这种区别。它依赖解释器行为，不能拿同一公式直接处理 Go goroutine。\n\n多线程更复杂。第 2.2 节为阻塞操作设置可间断的等待与线程状态，检查线程当前栈及字节码；停留在 CALL 可作为正在本地调用中的线索。这是结合运行时语义的推断，不是精确记录每条 CPU 指令。异步机制、解释器版本或扩展对全局解释器锁（GIL）的使用方式变化，都要求重新验证前提。\n\n### 算法一：净变化阈值采样\n传统按分配字节数触发的采样擅长估计分配活动。如果一个程序反复分配又立即释放 1 MiB，它可能需要处理大量样本，即使存活规模几乎不变。Scalene 第 3.2 节转而维护自上次采样以来分配 A 和释放 F 的字节计数，当 `abs(A−F) ≥ T` 时输出记录并重置计数。论文实现中的 T 为略大于 10 MB 的素数，以降低固定步长与阈值产生周期性耦合的风险。\n\n用 T=4 MiB 做教学例子：依次分配 2、释放 2、分配 2、释放 2 MiB，分配加释放活动已累计 8 MiB，但净变化始终没有达到阈值，不触发净变化样本；随后连续分配 3 MiB 和 2 MiB，净增长 5 MiB，触发一次记录。输出的是显著存量变化，不是对所有短命分配逐一计数。\n\n若目标是画内存规模趋势，重复的分配释放可能对趋势贡献很小，却让按活动采样产生大量记录。反过来，若目标是找导致 GC 压力的高频临时对象，这些被抵消的活动恰恰重要。因此阈值法减少样本不等于保留了所有性能信息。迁移到 Go 时应并列考察 `alloc_space`、`inuse_space` 和 GC 时间，不能用一张净增长曲线替代全部堆剖析。\n\n### 算法二：钩子重入、归因与泄漏候选\n第 3.1 节在系统分配器与 Python 分配器两层拦截。上层分配器可能继续调用下层，如果两层都计数，分配量会重复。Scalene 用线程局部的“已处在分配器中”标记，使嵌套钩子只转发而不重复记录，也避免 profiler 自身分配触发无限递归。这是多层观测必须回答的所有权问题。\n\n样本触发时，C++ 扩展读取 Python 栈并找到受分析的源码行；后台线程读取采样文件更新统计。短时启用 `PyEval_SetTrace`，直到执行离开当前行，用来处理行级平均内存归属。该设计将高频轻量计数与低频昂贵归因分开；与第 15 章预计算展开规则的思想相通，但优化的事件和运行时不同。\n\n第 3.4 节在达到新内存高点时跟踪一个对象是否最终释放，将持续不释放的位置列为候选，再以概率阈值及整体增长趋势过滤报告。这里必须保留“候选”措辞：业务缓存也可以长期不释放，泄漏涉及程序意图，不能只由统计值定义。\n\n原文还提供一个值得研究生练习的公式一致性问题。其定义说 mallocs 是跟踪分配总次数，frees 是其中回收次数，却将泄漏概率写为 `1−(frees+1)/(mallocs−frees+2)`。按这一定义代入 mallocs=frees=3 得 −1，不在概率范围内；这已核对 PDF 印刷页 56，而非 OCR 推测。\n\n如果采用 Beta(1,1) 先验，并将是否回收建模为独立同分布的伯努利观测，下一对象不回收的后验预测概率为 `1−(frees+1)/(mallocs+2)`。后一个式子只是通用统计推导，不能擅自替换作者实现；还需核查对应发布源码的变量含义，才能判断是排版、定义还是实现问题。\n\n### 原始实验：哪些结果可以准确引用\n第 6.1 节使用 2022-12-08 发布的原型、CPython 3.10.9、Linux 5.13.0-35、8 核 AMD Ryzen 7、32 GB 内存和 NVIDIA RTX 2070。选取 pyperformance 中耗时最长的十个基准，重复到各自超过 10 s；每个基准运行十次，开销使用四分位间均值，即根据中间 50% 的观测值计算均值。它是特定软硬件和工作负载下的测量，不是今天所有 Python 或 Go 服务的成本上界。\n\n|原图表|作者报告的数据|可支持的解释|\n|---|---|---|\n|图 6，512 MB 数组、改变触页比例|Scalene 与 Fil 的误差在真实分配大小的 1% 内，Memray 在 6% 内|该受控输入中，直接分配观测比 RSS 代理更贴近已分配大小|\n|表 2，pprint|按活动 7976 个样本，阈值 23 个，约 347 倍差异|大量抵消活动使净变化采样明显减量|\n|表 2，sympy 与整体|6757 对 10，约 676 倍；十个基准中，两种方法样本数之比的中位数为 18|减少的是样本数量，不是程序得到同倍数加速|\n|表 3|CPU 模式中位相对时间 1.02×，完整模式 1.32×|完整模式中位开销约 32%|\n|表 3，pprint 完整模式|4.03×|中位开销不能代表每一种负载|\n\n论文叙述处出现完整模式约 30% 的概括，本章引用表 3 可核对的 1.32×，不把近似文字与表中数值混合。图 5 比较两种语义等价的写法：在循环中调用另一个函数，以及把相同逻辑直接写入循环；据此检查归因精度。这里的“内联”指源码展开，不是 Go 编译器的自动内联。不能把任一图上的最差工具表现泛化为所有采样器。[paper-scalene]\n\n### 有效性威胁与 Go 迁移\n首先，净变化采样可能忽略大量迅速分配又释放的对象，这是估计目标选择的后果；其次，比较工具与版本是历史截面，不能用于今天的产品排名；第三，源码行、native 调用和 GPU 指标属于不同时间边界，联合呈现仍可能产生关联而非因果。UI 还进行曲线简化和约 100 点下采样，显示轨迹本身有信息损失。\n\n可迁移的研究问题是：在固定 CPU/内存预算下，能否同时用低频存活堆快照、累计分配量差分及复制热点，区分 Go 服务的“高分配但平稳”和“低分配但持续保留”？基线应包含现有 Go pprof，评估目标分别设为 GC 成本定位、存活增长定位和优化后的实际收益。不能用 Python 的信号规则替代 Go runtime 事件，也不能因净变化样本更少就宣布检测能力更强。"},{"title":"硬件计量：时间边界错误怎样污染优化决策","body":"### 问题不是有没有计数器，而是计了哪一段\nKakaraparthy 与 Patel 的 2024 年文章研究短区间 PMU 测量。目标是在每批哈希表查询前后读取 CPU 周期数（cycles）、已提交指令数（retired instructions）和缓存未命中数（cache misses）。如果启动工具、目标区间和停止工具没有对齐，读数可以看似合理却覆盖错误窗口；测量本身还可能改变被测工作。[paper-hardware]\n\n第 2 节的 Listings 2—4 对照三条路径。第一种为每批工作 fork/exec 一个 perf stat 并附加到父进程；第二种在进程内部调用 PAPI，借助 perf_event 接口配置与读取；第三种 PMU-metrics 直接配置 PMU 寄存器并用 rdpmc 读取。第三种低层路径依赖硬件、权限和计数器所有权，不能直接当作多租户生产环境的默认建议。\n\n### 误差模型：漏掉工作和改变工作可以同时发生\n设目标函数真实开始于 a、结束于 b，计数器从 a+δ 才开始，读数近似只包含 `[a+δ,b]` 的事件，漏掉前面的工作。即使采样或计数器本身完全准确，观测窗口仍有偏差。若启动附加子进程还使目标因写时复制产生缺页和地址转换缓存（TLB）扰动，那么被测期间的实际执行也已从原基线改变。\n\n图 3 正是在区分这两件事：原始单批约 330 ms，fork 后 processRequests 本体约 429 ms，完整批次约 452 ms。工具开始计数较晚，导致记录偏小；同时程序被扰动变慢。看到“计数少、时间长”不能立即推断每周期指令数（IPC）提高或缓存行为改善，二者可能来自边界和自扰动的组合。\n\n一个教学例子是：无工具任务耗时 1 ms，启动后延迟 0.4 ms 才开始计数，而工具使工作延长到 1.2 ms。计数覆盖的只是后 0.8 ms，但用户测得总时间却多了 20%。用 0.8 ms 对应 cycles 去解释原始 1 ms 的行为，已经把两个不同执行过程拼在一起。正确实验需要同步开始、尽量减少被测路径外扰，并单独测量空窗口成本。\n\n### 原始图 1—3：准确度数字的适用范围\n第 3 节在独占服务器上运行：Intel Xeon Silver 4114、10 核，通过 taskset 固定核心，CPU 调频策略设为 performance，对应所用硬件的 3 GHz 频率；每种实验五次取中位数。总计 1 亿次哈希查询，每批 1000 万次，未剖析时每批约 330 ms。perf 情况使用两个核心以容纳其进程。这个细节也意味着配置条件并非仅有工具名称不同。\n\n图 1 用 `估计 cycles = 已测时间 t × 频率 f` 作交叉参照。作者报告 perf、PAPI、PMU-metrics 的 cycles 准确度分别 23.9%、99.3%、99.7%。图 2 中整体执行时间相对无剖析基线分别增加 40%、3%、2%。这些数字针对论文所用的按批 fork/exec 方法，不能读成“perf 无法准确计量”。常驻工具、同步控制或直接 perf_event 读数是不同实验。\n\n`t×f` 也不是无条件真值：它依赖频率估计和执行边界，若发生频率变化、抢占或虚拟化计数语义变化，需另外处理。论文还说明不同库预设事件可能映射到不同 native events，例如 retired-instruction 的事件变体；名称相似不能证明测的是同一硬件事件。比较 cache misses 时，更不能把 cycles 的校准自动推广为各类 cache 的独立真值验证。\n\n### 原始图 4—5：测量越来越细会改变最优选择\n第 4.1 节保持总查询数 1 亿不变，将每批 1000 万逐步降到 100，使单批从约 0.33 s 降至约 3.3 μs。每个工具以自身粗粒度结果为基线，五次取中位数。图 4 在最细粒度报告 PAPI 指令数偏离约 +12%、运行时间 +268%；PMU-metrics 则约 +2%、+8%。这里的 +268% 不是图 2 无工具基线的同一个比较，应保留“相对各自粗粒度”的分母。\n\n直观模型是 `总成本 ≈ 有效工作 + 测量次数 × 每次固定开销`。批次越小，测量次数越多，即使每次仅有少量系统调用，也可能超过实际任务。直接读取硬件计数器降低固定成本，但必须解决计数器复用、任务切换和访问权限，不能只看指令执行时延。\n\n第 4.2 节把计数器放进 BLARE 的正则策略选择：多臂老虎机依据各策略的 cycles 作为奖励信号，选择后续策略。实验使用 100 MB 数据集，十次取中位数。图 5 相对“最佳正则策略”的额外运行时间为 perf_event 20%、PAPI 25%、PMU-metrics 10%。这个基线不是“同一自适应程序关闭计量”，因此同时包含学习选择等成本，不能把全部差异都称为计数器读取开销。\n\n这揭示了更深的问题：测量不仅用于事后报告，还会反馈到算法。相同的固定开销加在各策略上，并不会颠倒它们的单次耗时排序；但若策略的尝试次数、测量频率或计量路径不同，观测成本就可能改变奖励信号。反馈系统应分别测量目标工作与观测成本，检查策略选择是否受后者驱动。\n\n### 迁移到 Go：goroutine 与核心不是同一个归属单位\nGo 函数可能在不同线程执行，线程又可能迁核；进程级 PMU 统计还可能包含 GC、调度和其他 goroutine。单纯在函数两侧读“当前核心计数器”，两次读数不保证属于同一核心和同一工作实体。固定 OS 线程或核心只是受控实验工具，还要明确系统调用、异步工作和 cgo 是否计入。\n\n可设计三组 Go 实验：较长批次用稳定 PMU 观测校准；逐步缩短批次测量固定开销占比；再让服务开启正常调度与 GC，检查计量从受控环境迁移后的误差。报告原始事件配置、核心亲和性、频率、空窗口成本和是否多路复用。对 PGO 等反馈优化还应增加最终吞吐和延迟验证，避免“profile 变好”只是观测对象变了。"},{"title":"ePPing：协议语义、观测覆盖与低开销聚合","body":"### 问题与基线：看见更多报文才能正确配对\nSundberg 等人的 PAM 2023 论文将被动 TCP RTT 观测放进 eBPF。传统 PPing 在用户态捕获报文并匹配，流量升高时抓包路径可能丢失大量报文。若算法需要“第一次出现的某个时间戳”，丢失第一次而看到第二次不仅减少样本，还会改变 RTT 数值。这是覆盖率与准确性耦合的典型案例。[paper-epping]\n\nePPing 在 XDP（较早的收包处理点）和 tc（流量控制钩子）等内核路径解析必要头部，以流标识及协议时间戳建立状态，再在用户态加载程序、清理过期映射和输出结果。高频配对在内核进行，低频控制与展示在用户态。它减少报文复制和每包用户态处理，但仍占用 CPU 与 map 内存；“运行在内核”本身不是低开销证明。\n\n### 核心算法：保存首个 TSval，匹配回显 TSecr\nTCP 时间戳选项携带发送端 TSval；接收端在响应里用 TSecr 回显所观察的值。简化的 RTT 配对过程如下：对流的某个方向，首次见到时间戳 v 时存下本机观察时间 t0；反向 ACK 首次回显 v 时取当前时间 t1，得到 `RTT_est=t1−t0`，并按规则处理状态。匹配键需包含流和方向，不能只拿时间戳整数全局查表。\n\n教学例子：观察点在 0 μs 看到 `TSval=100`，在 200 μs 再看到同值，1500 μs 看到反向 `TSecr=100`。保留同一 TSval 的首次观测时间，得到 1500 μs；如果第二包覆盖 t0，会误成 1300 μs。时间戳粒度使同一值对应多个报文，简单“最后写入覆盖”破坏了被动估计。\n\n这个 RTT 是相对观察点的部分往返时间，包含该段路径、远端 TCP 协议处理及确认等待。它不是 Go handler 从接收请求到完成响应的耗时。放在中间盒观察，既不能恢复请求到达服务器前的全部路径，也不能直接拆出应用排队。它适合给第 13 章的跨层证据链增加网络信号，而不是替代 trace。\n\n### 附录算法为何关系到测量定义\n论文附录 A、图 8 与算法 1 解释 TCP 时间戳回显规则：当 `SEG.TSval ≥ TS.Recent` 且 `SEG.SEQ ≤ Last.ACK.sent` 时，更新待回显的时间戳缓存 TS.Recent。这里 SEG 表示当前报文，SEQ 是其起始序号，Last.ACK.sent 是最近已发送 ACK 中的确认序号。结果是时间戳方法常包含 delayed ACK，而常见基于序号的匹配可能选择更晚的报文起点。两者出现小差异，不一定是谁计时错误，首先要比较测量定义。\n\n重传也不能一概消除歧义：如果重传有新的 TSval，匹配更容易区分；若快速重传仍共享同一个时间戳值，估计仍可能偏大，通常受时间戳周期约束。附录用受控实验展示异常样本，目的不是承诺所有网络栈都满足固定误差上界，而是暴露协议粒度和 ACK 策略的后果。\n\n### 原始实验分三步揭示不同限制\n第 3 节的端主机为 i7-7700、16 GB、Linux 5.16，中间盒为 Xeon E5-1650、32 GB、Linux 5.19，使用 100 Gbps 链路；在中间盒关闭 GRO/GSO/TSO 等接收聚合与发送分段卸载功能，以明确观测报文粒度。实验设置会影响可迁移性，尤其不能直接外推到开启合并卸载的云网络。\n\n第一步验证 RTT。图 3 用 netem 将延迟从 0 到 100 ms、每 10 ms 一档、每档 10 s，流量为单条限速 100 Mbps 流。图 4 比较 ePPing、PPing 与 tshark；PPing/ePPing 获得的 RTT 数比 tshark 约少 13%，因此作者对匹配 ACK 的共同子集比较。ePPing 相对 tshark 常高约 1—5 μs，与 delayed ACK 定义有关；共同子集的一致性不等于所有报文的完整覆盖。\n\n第二步测多核转发。图 5 在十条并发流、六核条件下，无监测平均 CPU 利用率 47%，ePPing 57%，PPing 77%。增加的是 10 与 30 个百分点，不能写成 10% 与 30% 的相对增幅。PPing 只处理略高于 6% 的报文，ePPing 看到约 16 倍数量；吞吐相近还受端主机瓶颈限制，不能据此宣称观测没有成本。\n\n第三步把中间盒限制为单核，使观测开销直接体现在转发能力。表 1 的基线总包率约 1.90—1.95 Mpps；图 6 中，流数从 1 增至 1000，ePPing 从 1.53 降到 1.13 Mpps。PPing 转发率看似从 0.97 升至 1.18 Mpps，但它实际处理的包率从约 170 kpps 降到 60 kpps。后者“更快”是漏看更多，不能算成更高效地完成同一观测任务。\n\n开销实验每组运行十次、每次 120 s、丢弃最初 20 s。包率比字节吞吐更贴近每包算法成本：流数改变 ACK 数量，字节数相近时需要处理的报文数仍可不同。论文把瓶颈位置和工作量分母显式改动，值得在 Go 服务实验中照做。\n\n### 两种降本算法：控制采样对象和压缩输出\n为了降低开销，作者保留“看见每包”的能力，但限制同一流写入新待匹配时间戳的频率：保存一次后，至少等待 t 才为该流保存下一次。与先随机丢包不同，它更容易保留首边缘配对语义，也避免大流独占全部样本预算。不过限流后的观测仍会遗漏短时变化，不能说稀疏流天然获得完整 RTT。\n\n图 7a 使用 t=0、10、100、1000 ms。在论文的时间戳配置下，对应每流每秒最多约 1000、100、10、1 个 RTT。t=0 的约 1000 来自时间戳更新粒度，并非数学上 1/0。1000 流时，t=1000 ms 的转发能力为 1.54 Mpps，未启用采样限流时约 1.14 Mpps；图 6 邻近情形写成 1.13，不应人为合并成一个无误差数字。\n\n另一方案在 BPF 内维护 RTT 直方图及最小最大值，用户态每秒拉一次，减少逐样本上报。图 7b 的 1000 流情况下，未启用采样限流时，转发包率约从 1.14 提升到 1.45 Mpps。代价是丢失单个 RTT 与精确时刻的关联，桶边界还影响分位数分辨率。它与第 15 章只发送栈 ID 的压缩不同：直方图本身是有损统计，不能日后重建原始事件时间线。\n\n### 适用边界与 Go 研究方案\n论文主要测试实验室中的持续大流量 iperf 传输，未覆盖运营商网络中的各种混合流量，流数最高 1000；协议依赖时间戳，不能直接推广到全部 QUIC、DNS。作者讨论每包额外处理很短仍可能通过队列累积放大端到端时延，这说明局部纳秒成本与业务尾延迟之间不是简单加法关系。\n\n迁移到 Go 服务时，可联合 handler trace、调度延迟、CPU profile 与 RTT 分布，分别注入网络延迟、CPU 饱和和锁竞争，制造表现相似但原因不同的慢请求。按连接和时间窗对齐网络与应用证据；若连接复用了多个请求，还需避免把某次 RTT 直接归给其中一个请求。验证系统能否把“网络变慢”和“本地排队”分开。若只在 CPU 低时提高网络采样，会改变观测选择，应把采样策略一并记录，防止将策略变化误报为业务改善。"},{"title":"Go 工程前沿：PGO 与异常回溯形成反馈环","body":"### PGO 把样本变成编译决策，偏差也会随之放大\nGo 1.21 将 PGO 作为正式功能，构建可通过 `-pgo=auto` 使用主包目录的 `default.pgo`。CPU profile 影响内联与带保护的去虚化等优化：热点接口调用可在运行时检查实际类型，命中时走更易优化的直接调用路径，未命中仍保留通用路径。因此性能收益取决于代表性、热点稳定性和代码变化，而非 profile 文件是否能解析。[front-go121]\n\n这与硬件论文的 BLARE 存在共同结构：观测决定下一轮执行策略。若训练 profile 只含 `/pay`，却把结果部署到 `/admin` 占主导的负载，优化目标已经漂移。假设教学流量中 encode 50 ms、hash 10 ms，后来流量反过来，旧热点排序不能代表新收益。不能仅用同一训练负载自证 PGO 有效。\n\n研究级评估应把负载分为采集、调参和未见测试集合，同时报告总吞吐、尾延迟、二进制体积与构建变化。修改源代码后还需检查 profile 匹配覆盖，而不仅是编译器没有报错。比较均匀采样与自适应采样时，最终优化收益比火焰图相似度更接近任务目标；但必须保留 CPU 总量与采样偏差，防止优化只惠及被过度观测的路径。\n\n### Trace 结构重写解决了持续事件数据的工程障碍\n2024-03-14 的 Go 官方文章介绍 Go 1.22 执行追踪重写，通过按代组织事件、改进时间信息等方式，降低采集开销并改善数据处理。分段、自包含的数据有利于增量处理和保留窗口；但文章发表时 `go tool trace` 仍需要整体加载，不能因格式支持分段便宣称当时所有工具都能无限流式分析。[front-trace2024]\n\n采样 profile 擅长估计一段时间中“哪里消耗资源”，trace 保存调度、阻塞和事件顺序。一次短时出现的尾延迟尖峰可能在总 CPU 样本里权重很小，却需要精确的先后关系解释。二者联合不是多画一张图，而是要把相同时间窗、实例和请求的证据对齐，并确认时钟与 ID 的边界。\n\n### Flight Recorder 把问题改成何时保留证据\n2025-09-26 的官方文章和 Go 1.25.0 源码提供 Flight Recorder：持续记录有限窗口，异常触发后写出快照，从而保留“知道故障之前”的事件。设慢请求在时刻 t 被检测到。如果此时才开启 trace，就可能错过此前的排队过程；记录器可保留 t 之前的一段历史。[front-flight2025] [front-flight-source]\n\nGo 1.25.0 的接口有明确约束：同一进程只能启用一个 FlightRecorder，但可与 `trace.Start` 并存；同一时刻只允许一个 `WriteTo`，重叠调用返回错误。窗口大小目标 `MaxBytes` 优先于历史保留时长目标 `MinAge`，但仍只是提示，不保证快照文件或进程内存始终低于该数值。高事件率下为了满足空间目标，保留的有效历史长度可能缩短。\n\n因此可研究的变量不只是缓冲区大小，还包括触发延迟、事件生成速率、故障前因跨度和重复触发策略。假设教学窗口实际保留 5 s，但报警经过 8 s 聚合才触发，最有价值的前因仍然可能被覆盖。正确指标是“异常所需因果片段的保留率”，再结合内存与 CPU 成本，而不是配置里写了几秒。\n\n联合设计可以先以低成本指标识别候选异常，再保存 Flight Recorder 快照，必要时补充 CPU 或 heap profile。快照可能同时涵盖多个请求和异步后台工作；请求关联需结合显式的 trace task/region/log 注解，不能假定 pprof 标签会自动成为 trace 注解。应按第 08 章的方法重建时间线，辨认与异常有关的活动。研究方案应加入假阳性触发、重复异常和缓存高压，才能评估持续观测的实际价值。"},{"title":"开放 Profiles：互操作问题本质上是语义守恒","body":"### 从格式兼容到可比较的观测\nOpenTelemetry 在 2024 年介绍 Profiles 方向，意图把剖析纳入日志、指标和 trace 之外的共同观测体系。2026-10-02 阅读的规范快照仍标为 Alpha。原始公告说明发展方向，当前规范定义接口要求，二者都不是“所有后端已兼容”的实
