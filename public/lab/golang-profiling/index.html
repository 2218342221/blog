.advanced-interactives{
  color-scheme: light;
  --green: #58b900;
  --green-dark: #397d00;
  --green-deep: #286300;
  --green-pale: #eff8e7;
  --ink: #233c38;
  --muted: #64746e;
  --line: #e4ebe3;
  --blue: #117ea9;
  --blue-pale: #edf8ff;
  --yellow: #ffc641;
  --white: #fff;
  --page: #f7f9f5;
  --radius: 22px;
  --sidebar-width: 264px;
  --content-width: 1600px;
  --gutter: clamp(24px, 2.4vw, 44px);
  --shadow: 0 2px 3px #263d2603, 0 6px 24px #263d2603;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}
.advanced-interactives *{ box-sizing: border-box; }
.advanced-interactives html{ scroll-behavior: smooth; scroll-padding-top: 98px; }
.advanced-interactives body{ margin: 0; color: var(--ink); background: var(--page); font-size: 16px; line-height: 1.65; }
.advanced-interactives a{ color: var(--blue); }
.advanced-interactives button,
.advanced-interactives input{ font: inherit; }
.advanced-interactives button,
.advanced-interactives a,
.advanced-interactives input,
.advanced-interactives summary{ -webkit-tap-highlight-color: transparent; }
.advanced-interactives button{ cursor: pointer; }
.advanced-interactives button:disabled{ cursor: default; }
.advanced-interactives button,
.advanced-interactives input,
.advanced-interactives summary{ touch-action: manipulation; }
.advanced-interactives :focus-visible{ outline: 3px solid #086b9e; outline-offset: 4px; border-radius: 5px; }
.advanced-interactives [hidden]{ display: none !important; }
.advanced-interactives .visually-hidden{ position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.advanced-interactives .skip-link{ position: fixed; top: -90px; left: 18px; z-index: 200; padding: 12px 20px; background: var(--ink); color: white; border-radius: 10px; }
.advanced-interactives .skip-link:focus{ top: 14px; }
.advanced-interactives .sidebar{ position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); background: white; border-right: 1px solid var(--line); padding: 28px 18px 22px; overflow-y: auto; z-index: 30; scrollbar-width: thin; scrollbar-color: #dce4d7 transparent; }
.advanced-interactives .brand{ display: flex; align-items: center; gap: 12px; padding: 0 8px; color: var(--green-dark); text-decoration: none; font-size: 21px; font-weight: 850; letter-spacing: -.5px; line-height: 1.25; }
.advanced-interactives .brand small{ display: block; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 1px; margin-top: 7px; }
.advanced-interactives .brand-symbol{ display: flex; align-items: center; justify-content: center; gap: 1px; width: 45px; height: 45px; flex: 0 0 45px; border: 1px solid #469900; border-radius: 14px; background: var(--green); color: white; font-size: 30px; font-weight: 900; box-shadow: 0 3px 0 #398000, inset 0 2px 0 #ffffff25; font-family: ui-rounded, system-ui, sans-serif; }
.advanced-interactives .brand-symbol span{ font-size: 23px; transform: translateY(-1px); }
.advanced-interactives .path-heading{ margin: 40px 12px 17px; display: flex; align-items: center; justify-content: space-between; color: #738079; font-size: 12px; letter-spacing: .8px; font-weight: 650; }
.advanced-interactives .path-count{ color: #567344; background: #f0f5eb; padding: 2px 8px; border-radius: 6px; letter-spacing: 0; font-size: 11px; }
.advanced-interactives .path-list{ list-style: none; margin: 0; padding: 0; }
.advanced-interactives .path-list li{ position: relative; margin: 0 0 8px; }
.advanced-interactives .path-list li:not(:last-child)::after{ content: ""; position: absolute; top: 55px; left: 30px; height: 30px; width: 2px; background: #e5ebdf; z-index: -1; }
.advanced-interactives .chapter-link{ display: flex; align-items: center; gap: 12px; min-height: 72px; color: #52665c; text-decoration: none; padding: 11px 10px; border: 1px solid transparent; border-radius: 14px; transition: background .16s, border-color .16s; }
.advanced-interactives .chapter-link:hover{ background: #f6f9f2; color: var(--ink); }
.advanced-interactives .step-number{ position: relative; display: grid; place-items: center; flex: 0 0 39px; width: 39px; height: 39px; border-radius: 50%; border: 1px solid #d6dfce; background: #f4f7f0; box-shadow: 0 3px 0 #dce4d4; font-size: 17px; font-weight: 800; color: #718267; font-variant-numeric: tabular-nums; }
.advanced-interactives .nav-text{ display: block; font-size: 14px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.advanced-interactives .nav-text small{ display: block; font-size: 11px; font-weight: 450; margin-top: 4px; color: #68776e; }
.advanced-interactives .chapter-link[aria-current="page"]{ color: #316606; background: var(--green-pale); border-color: #deedcf; }
.advanced-interactives .chapter-link[aria-current="page"] .step-number{ background: var(--green); border-color: #499a07; box-shadow: 0 3px 0 #3d8600, 0 0 0 4px #e2f1d6; color: #173c00; }
.advanced-interactives .chapter-link.is-complete .step-number{ background: #dff3cd; border-color: #90c96b; box-shadow: 0 3px 0 #90c96b; color: #3f820a; }
.advanced-interactives .chapter-link.is-complete[aria-current="page"] .step-number{ background: var(--green); border-color: #499a07; box-shadow: 0 3px 0 #3d8600, 0 0 0 4px #e2f1d6; color: #173c00; }
.advanced-interactives .sidebar-note{ display: flex; align-items: flex-start; gap: 9px; margin: 28px 10px 22px; padding: 18px 0 0; border-top: 1px solid var(--line); }
.advanced-interactives .sidebar-note svg{ width: 20px; height: 20px; flex-shrink: 0; color: #839763; margin-top: 2px; }
.advanced-interactives .sidebar-note p{ margin: 0; color: #677760; font-size: 11px; line-height: 1.9; }
.advanced-interactives .sidebar-note strong{ display: block; font-weight: 500; }
.advanced-interactives .sidebar-book{ display: flex; align-items: center; gap: 11px; padding: 16px 13px; background: #f6f9f2; border: 1px solid #e5ebdd; border-radius: 13px; text-decoration: none; color: #48613d; transition: border-color .16s, background .16s; }
.advanced-interactives .sidebar-book:hover{ border-color: #b8d2a0; background: #f0f7e8; }
.advanced-interactives .sidebar-book svg{ width: 25px; height: 25px; flex-shrink: 0; color: #78995a; }
.advanced-interactives .sidebar-book span{ font-size: 12px; font-weight: 650; }
.advanced-interactives .sidebar-book small{ display: block; margin-top: 3px; color: #6d7d63; font-size: 11px; font-weight: 400; }
.advanced-interactives .sidebar-book > span:last-child{ margin-left: auto; font-size: 17px; }
.advanced-interactives .source-shortcut{ display: flex; justify-content: space-between; margin: 12px 10px 0; font-size: 12px; font-weight: 500; text-decoration: none; color: var(--muted); min-height: 38px; align-items: center; }
.advanced-interactives .source-shortcut:hover{ color: var(--green-dark); }
.advanced-interactives .course-shell{ margin-left: var(--sidebar-width); }
.advanced-interactives .topbar{ position: sticky; top: 0; z-index: 20; background: rgb(255 255 255 / 94%); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.advanced-interactives .topbar-inner{ display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 80px; max-width: var(--content-width); padding: 14px var(--gutter); margin: 0 auto; }

<script>
(() => {
"use strict";
  const DEFAULT_SCENARIO = {
    durationMs: 20,
    main: [{start:0,end:4,state:'Running'}, {start:4,end:6,state:'Runnable'},
      {start:6,end:16,state:'Sleeping'}, {start:16,end:20,state:'Running'}],
    worker: [{start:1,end:16,state:'Running'}]
  };
  const $ = (selector, base = document) => base.querySelector(selector);
  const $$ = (selector, base = document) => Array.from(base.querySelectorAll(selector));
  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }
  function initDemo() {
    const lifetime = new AbortController();
    const listen = (target, type, handler) => target.addEventListener(type, handler, {signal: lifetime.signal});
    const container = $('#request-demo'); if (!container) return null;
    const supplied = window.PROFILING_SCENARIO;
    const scenario = supplied && Number.isFinite(supplied.durationMs) && supplied.durationMs > 0 && Array.isArray(supplied.main) && Array.isArray(supplied.worker) ? supplied : DEFAULT_SCENARIO;
    const duration = scenario.durationMs;
    const slider = $('#demo-slider');
    const playButton = $('#demo-play');
    const playLabel = $('#demo-play-label');
    const status = $('#demo-status');
    let time = 0, playing = false, frameId = 0, previousFrame = null;
    const segmentElements = [];
    slider.max = String(duration);
    ['main', 'worker'].forEach(lane => {
      const element = $(`#demo-${lane}-lane`);
      element.replaceChildren();
      element.setAttribute('aria-label', `${lane}：${scenario[lane].map(s => `${s.start}至${s.end}毫秒 ${s.state}`).join('；')}`);
      scenario[lane].forEach(segment => {
        const block = node('span', `timeline-segment state-${segment.state.toLowerCase()}`, (segment.end - segment.start) / duration >= 0.14 ? segment.state : '');
        block.style.left = `${segment.start / duration * 100}%`;
        block.style.width = `${(segment.end - segment.start) / duration * 100}%`;
        block.title = `${lane}: ${segment.start}–${segment.end} ms · ${segment.state}`;
        element.append(block); segmentElements.push({block, segment});
      });
    });
    const ticks = $('#demo-ticks'); ticks.replaceChildren();
    for (let i = 0; i < 5; i++) ticks.append(node('span', '', `${Number((duration * i / 4).toFixed(2))}${i === 4 ? ' ms' : ''}`));
    const cpu = lane => scenario[lane].reduce((sum, segment) => sum + (segment.state === 'Running' ? Math.max(0, Math.min(time, segment.end) - segment.start) : 0), 0);
    function snapshot() { const main = cpu('main'), worker = cpu('worker'); return {time, wallMs: time, mainCpuMs: main, workerCpuMs: worker, cpuMs: main + worker, ratio: time > 0 ? (main + worker) / time : null, playing}; }
    function render() {
      const current = snapshot();
      $('#demo-wall').textContent = time.toFixed(1);
      $('#demo-cpu').textContent = current.cpuMs.toFixed(1);
      $('#demo-main-cpu').textContent = current.mainCpuMs.toFixed(1);
      $('#demo-worker-cpu').textContent = current.workerCpuMs.toFixed(1);
      $('#demo-ratio').textContent = current.ratio === null ? '—' : current.ratio.toFixed(2);
      $('#demo-ratio-unit').textContent = current.ratio === null ? '' : '核';
      $('#demo-time').textContent = `${time.toFixed(1)} / ${duration} ms`;
      $('#demo-cursor').style.left = `${time / duration * 100}%`;
      $('#demo-cursor-label').textContent = time.toFixed(1);
      slider.value = String(time);
      slider.style.setProperty('--range-progress', `${time / duration * 100}%`);
      slider.setAttribute('aria-valuetext', `当前时间 ${time.toFixed(1)} 毫秒，累计 CPU ${current.cpuMs.toFixed(1)} 毫秒`);
      playLabel.textContent = playing ? '暂停' : time >= duration ? '重播' : '播放';
      $('.play-icon', playButton).textContent = playing ? 'Ⅱ' : '▶';
      playButton.setAttribute('aria-label', playing ? '暂停时间线' : time >= duration ? '重新播放时间线' : '播放时间线');
      segmentElements.forEach(({block, segment}) => block.classList.toggle('is-current', time >= segment.start && time < segment.end));
    }
    function pause(message) {
      playing = false; cancelAnimationFrame(frameId); previousFrame = null; render();
      if (message) status.textContent = message;
    }
    function step(timestamp) {
      if (!playing) return;
      if (previousFrame !== null) time = Math.min(duration, time + (timestamp - previousFrame) * duration / 8000);
      previousFrame = timestamp;
      render();
      if (time >= duration) { pause(`到达终点：墙钟 ${duration} ms，累计 CPU ${snapshot().cpuMs.toFixed(1)} ms。可以重播或拖动回看。`); return; }
      frameId = requestAnimationFrame(step);
    }
    function play() {
      if (playing) return;
      if (time >= duration) time = 0;
      playing = true; previousFrame = null;
      status.textContent = '正在播放。点击暂停，或拖动滑块停在任意时刻。';
      render(); frameId = requestAnimationFrame(step);
    }
    function setTime(value) {
      const numeric = Number(value); if (!Number.isFinite(numeric)) return;
      time = Math.max(0, Math.min(duration, numeric));
      pause(`已暂停在 ${time.toFixed(1)} ms。main 与 worker 的 CPU 权重在累计 CPU 卡片中相加。`);
    }
    listen(playButton, 'click', () => playing ? pause(`已暂停在 ${time.toFixed(1)} ms。`) : play());
    listen($('#demo-reset'), 'click', () => { setTime(0); status.textContent = '已重置。拖动滑块，或点击播放。'; });
    listen(slider, 'input', () => setTime(slider.value));
    listen(document, 'visibilitychange', () => { if (document.hidden && playing) pause('页面进入后台，演示已暂停。'); });
    listen(window, 'pagehide', () => pause());
    render();
    // Always paused initially, including prefers-reduced-motion environments.
    return {destroy() { playing = false; cancelAnimationFrame(frameId); lifetime.abort(); }, setTime, getState: snapshot, play, pause: () => pause(`已暂停在 ${time.toFixed(1)} ms。`)};
  }

window.createRequestDemo = initDemo;
})();

(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const copy = value => JSON.parse(JSON.stringify(value));
  const RING_STATES = [
    {a:'empty', b:'empty', reserved:[], submitted:[], consumed:[], blocked:false,
      title:'准备开始', note:'点击“前进一步”，让 A 先预留一条记录。', consumer:'consumer 位于 A 将要出现的位置'},
    {a:'busy', b:'empty', reserved:['A'], submitted:[], consumed:[], blocked:false,
      title:'A reserve', note:'A 占据第一条预留记录，BUSY = 1。它还没有提交，消费者尚不能读取这条记录。', consumer:'下一条将读取 A；A 尚未提交'},
    {a:'busy', b:'busy', reserved:['A','B'], submitted:[], consumed:[], blocked:false,
      title:'B reserve', note:'B 在 A 后面预留。两条记录都处于 busy 状态；预留顺序现在是 A → B。', consumer:'下一条将读取 A；A、B 均未提交'},
    {a:'busy', b:'ready', reserved:['A','B'], submitted:['B'], consumed:[], blocked:false,
      title:'B submit', note:'B 先完成提交，BUSY 清零。A 仍然 busy，所以 B 已提交并不等于消费者可以越过 A 读取 B。', consumer:'下一条仍是 A；B 提交不会改变预留顺序'},
    {a:'busy', b:'ready', reserved:['A','B'], submitted:['B'], consumed:[], blocked:true,
      title:'consumer 遇到 A busy', note:'消费者检查 A 的记录头，发现 BUSY = 1，于是停止本次消费。它不能跳过 A 直接消费已提交的 B。', consumer:'consumer 停在 A：BUSY = 1'},
    {a:'ready', b:'ready', reserved:['A','B'], submitted:['B','A'], consumed:[], blocked:false,
      title:'A submit', note:'A 完成提交，BUSY 清零。两条记录现在都可读；下一次消费可以从 A 继续，再到 B。', consumer:'consumer 可以从 A 继续前进'},
    {a:'consumed', b:'consumed', reserved:['A','B'], submitted:['B','A'], consumed:['A','B'], blocked:false,
      title:'consume A / B', note:'消费者先读 A，再读 B。提交顺序是 B → A，消费仍按预留顺序 A → B 进行。', consumer:'consumer 已依次越过 A、B'}
  ];
  const PROFILE_RECORDS = Object.freeze([
    Object.freeze({id:'first', name:'main.first_work', cpuMs:4}),
    Object.freeze({id:'worker', name:'worker.work', cpuMs:15}),
    Object.freeze({id:'finish', name:'main.finish_work', cpuMs:4})
  ]);
  function initRing() {
    const root = byId('ml-ring-lab'); if (!root) return null;
    let step = 0;
    const nextButton = byId('ml-ring-next');
    function render() {
      const state = RING_STATES[step];
      byId('ml-ring-step').textContent = `${step} / 6 步`;
      ['a','b'].forEach(key => {
        const status = state[key];
        const record = byId(`ml-ring-record-${key}`);
        record.className = `ml-ring-record ml-record-${status}`;
        byId(`ml-ring-status-${key}`).textContent = {empty:'尚未预留', busy:'已预留，未提交', ready:'已提交', consumed:'已消费'}[status];
        byId(`ml-ring-flag-${key}`).textContent = status === 'empty' ? '—' : `BUSY = ${status === 'busy' ? 1 : 0}`;
      });
      ['reserved','submitted','consumed'].forEach(key => { byId(`ml-ring-${key}`).textContent = state[key].join(' → ') || '—'; });
      byId('ml-ring-consumer').textContent = state.consumer;
      const note = byId('ml-ring-note');
      note.querySelector('strong').textContent = state.title;
      note.querySelector('span').textContent = state.note;
      root.querySelectorAll('[data-ml-step]').forEach(item => {
        const index = Number(item.dataset.mlStep);
        item.classList.toggle('ml-step-done', index < step);
        if (index === step) item.setAttribute('aria-current', 'step');
        else item.removeAttribute('aria-current');
      });
      nextButton.disabled = step === 6;
      nextButton.textContent = step === 6 ? '六步已完成 ✓' : '前进一步 →';
    }
    function next() { if (step < 6) { step++; render(); } }
    function reset() { step = 0; render(); }
    nextButton.addEventListener('click', next);
    byId('ml-ring-reset').addEventListener('click', reset);
    render();
    return {next, reset, getState: () => ({step, ...copy(RING_STATES[step])})};
  }

  function initPprof() {
    const root = byId('ml-pprof-lab'); if (!root) return null;
    let order = [0,1,2], shuffles = 0;
    function snapshot() {
      return {order: order.map(index => PROFILE_RECORDS[index].id),
        records: order.map(index => ({...PROFILE_RECORDS[index]})),
        totalCpuMs: order.reduce((total, index) => total + PROFILE_RECORDS[index].cpuMs, 0),
        flatMs: Object.fromEntries(PROFILE_RECORDS.map(record => [record.name, record.cpuMs])), shuffles};
    }
    function render(animate = false) {
      const list = byId('ml-pprof-samples');
      list.replaceChildren();
      order.forEach((recordIndex, position) => {
        const record = PROFILE_RECORDS[recordIndex];
        const item = document.createElement('li'); item.dataset.mlRecord = record.id;
        const number = document.createElement('span'); number.className = 'ml-sample-position'; number.textContent = String(position + 1);
        const name = document.createElement('code'); name.textContent = record.name;
        const weight = document.createElement('strong'); weight.append(document.createTextNode(String(record.cpuMs) + ' '));
        const unit = document.createElement('small'); unit.textContent = 'ms'; weight.append(unit);
        item.append(number, name, weight); list.append(item);
        if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && item.animate) {
          item.animate([{opacity:.6, transform:'translateY(4px)'}, {opacity:1, transform:'translateY(0)'}], {duration:180, easing:'ease-out'});
        }
      });
      const current = snapshot();
      byId('ml-pprof-total').textContent = String(current.totalCpuMs);
      byId('ml-pprof-flat').textContent = 'first 4 / worker 15 / finish 4 ms';
      const sum = current.records.map(record => record.cpuMs).join(' + ');
      byId('ml-pprof-note').textContent = shuffles === 0
        ? `初始排列。三条记录的权重之和为 ${sum} = ${current.totalCpuMs} ms。`
        : `第 ${shuffles} 次换序：${sum} = ${current.totalCpuMs} ms。各函数 flat 保持不变；没有改变真实调用时间。`;
    }
    function shuffle() {
      const previous = order.join(',');
      const nextOrder = [...order];
      for (let i = nextOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nextOrder[i], nextOrder[j]] = [nextOrder[j], nextOrder[i]];
      }
      // Each explicit click must produce a different visible arrangement.
      if (nextOrder.join(',') === previous) nextOrder.push(nextOrder.shift());
      order = nextOrder; shuffles++; render(true);
    }
    function reset() { order = [0,1,2]; shuffles = 0; render(); }
    byId('ml-pprof-shuffle').addEventListener('click', shuffle);
    byId('ml-pprof-reset').addEventListener('click', reset);
    render();
    return {shuffle, reset, getState: snapshot};
  }

  function initPerfetto() {
    const root = byId('ml-perfetto-lab'); if (!root) return null;
    let inputCount = 0, policy = 'ring';
    const capacity = 4;
    const nextButton = byId('ml-perfetto-next');
    function snapshot() {
      const input = Array.from({length:inputCount}, (_, i) => i + 1);
      const retained = policy === 'ring' ? input.slice(-capacity) : input.slice(0, capacity);
      const lost = policy === 'ring' ? input.slice(0, Math.max(0, input.length - capacity)) : input.slice(capacity);
      return {policy, capacity, inputCount, input, retained, lost};
    }
    function render() {
      const current = snapshot();
      const name = policy === 'ring' ? 'RING_BUFFER' : 'DISCARD';
      root.querySelectorAll('input[name="ml-perfetto-policy"]').forEach(radio => {
        radio.checked = radio.value === policy;
        radio.parentElement.classList.toggle('ml-policy-selected', radio.checked);
      });
      byId('ml-perfetto-count').textContent = `${inputCount} / 6`;
      byId('ml-perfetto-inputs').querySelectorAll('li').forEach((item, index) => {
        const number = index + 1, seen = number <= inputCount, lost = current.lost.includes(number);
        item.classList.toggle('ml-input-seen', seen && !lost);
        item.classList.toggle('ml-input-lost', lost);
        item.setAttribute('aria-label', `块 ${number}，${!seen ? '尚未输入' : lost ? policy === 'ring' ? '被覆盖' : '被丢弃' : '已保留'}`);
      });
      byId('ml-perfetto-buffer').querySelectorAll('li').forEach((item, index) => {
        const value = current.retained[index];
        item.textContent = value === undefined ? '—' : String(value);
        item.classList.toggle('ml-slot-filled', value !== undefined);
        item.setAttribute('aria-label', value === undefined ? '空位' : `保留块 ${value}`);
      });
      nextButton.disabled = inputCount === 6;
      nextButton.textContent = inputCount === 6 ? '已输入六块 ✓' : '输入下一块 →';
      let note;
      if (!inputCount) note = `${name}：尚未输入。容量为 4 个抽象块。`;
      else if (inputCount <= capacity) note = `${name}：已输入 ${inputCount} 块，保留 ${current.retained.join('、')}。${inputCount === capacity ? '容量现在恰好填满。' : '尚未填满容量。'}`;
      else note = `${name}：已输入 ${inputCount} 块，保留 ${current.retained.join('、')}；${policy === 'ring' ? '旧块' : '新块'} ${current.lost.join('、')} 被${policy === 'ring' ? '覆盖' : '丢弃'}。`;
      byId('ml-perfetto-note').textContent = note;
    }
    function next() { if (inputCount < 6) { inputCount++; render(); } }
    function reset() { inputCount = 0; render(); }
    function setPolicy(value) { if (value === 'ring' || value === 'discard') { policy = value; render(); } }
    nextButton.addEventListener('click', next);
    byId('ml-perfetto-reset').addEventListener('click', reset);
    root.querySelectorAll('input[name="ml-perfetto-policy"]').forEach(radio => radio.addEventListener('change', () => setPolicy(radio.value)));
    render();
    return {next, reset, setPolicy, getState: snapshot};
  }
  function init() {
    const container = byId('ml-mechanism-labs');
    if (!container || container.dataset.mlInitialized === 'true') return;
    container.dataset.mlInitialized = 'true';
    window.MechanismLabs = {ring: initRing(), pprof: initPprof(), perfetto: initPerfetto()};
  }
  window.initMechanismLabs = init;
})();

(() => {

  };
})();

'use strict';
const COURSE = {"meta":{"title":"Go 程序剖析与诊断","subtitle":"基础课程 · 工程实践 · 研究前沿 · 工具机制深研","brand":"GoLab 性能学院","date":"2026-10-02","language":"zh-CN","version":"2.2","baseline":"Go 1.25.0","researchWindow":"2021-10-02 — 2026-10-02","texFile":"golang-profiling.tex","pdfFile":"golang-profiling.pdf","dataFile":"course-data.json","chapterCount":22,"visualCount":64,"revision":"2.2 机制深研增订版","editionDate":"2026-10-05","errataCount":2,"baseChapterCount":16,"advancedChapterCount":6,"animatedVisualCount":39,"advancedFigureCount":25,"advancedInteractiveCount":4,"quizCount":62,"sectionCount":142,"packageFile":"golang-profiling-complete.zip","pdfPages":231},"chapters":[{"id":"01","title":"性能剖析的科学方法","subtitle":"先形成可证伪的假设，再选择观察工具。","objectives":["区分工作量、吞吐、延迟、资源消耗与成本","建立从症状到机制再到干预验证的证据链","运用 Amdahl 定律与 Little 定律限制优化预期","定义可复现、可反驳的性能结论"],"prerequisites":"具备 Go 函数、接口、goroutine 与基本 Linux 使用经验。","sections":[{"title":"问题定义：剖析究竟回答什么","body":"程序剖析研究资源消耗在代码、时间和请求类别之间如何分布。调试研究某个状态为什么出现；追踪研究事件发生的先后关系；指标描述聚合趋势。四者共同服务于因果解释，但任何单一工具都不能直接证明“这行代码导致了线上慢请求”。Go 官方诊断指南按 profiling、tracing、debugging 与 runtime statistics 组织能力，本书沿用这一分类。[go-diagnostics]\n\n先把问题写成实验陈述：“在固定版本、固定输入分布和相同资源约束下，吞吐从 A 下降到 B；假设是分配率上升导致 GC CPU 增长。”陈述至少包含对象、负载、观察区间、比较基线、成功指标和可推翻条件。只有“CPU 很高”并不充分：批处理充分利用 CPU 可能恰恰是好事。\n\n|量|定义与单位|常见误读|\n|---|---|---|\n|延迟|一次操作从进入到完成的时间，ms|把平均值等同于 p99|\n|成功吞吐|成功完成操作数/观测时间，req/s|以发出数替代成功完成数|\n|CPU 用量|窗口内所有线程累计的 CPU 秒/墙钟秒，core|以单核百分比解释整机百分比|\n|分配率|窗口内累计分配字节的增量/窗口时长，B/s|等同于当前活跃堆|\n|资源效率|CPU 秒/成功请求、分配字节/成功请求|比较不同业务工作量|\n|错误与超时|失败数/尝试数|删除失败请求后只看快请求|\n\n可复查的性能结论必须说明统计范围、单位和分母。将吞吐提高 10% 写成“性能提升 10%”会掩盖错误率、成本或延迟的变化。"},{"title":"时间分解与排队模型","body":"墙钟时间包含执行、等待 CPU、等待锁、I/O、定时器以及业务主动休眠。对于串行且互斥的阶段，可用 `Twall = Tcpu + Trunnable + Tsync + Tio + Tother` 建立账本；并行请求不能把所有 goroutine 的 CPU 和等待直接相加当作该请求延迟，因为这些区间可能重叠。\n\n稳定系统中 Little 定律为 `L = λW`：平均在途数等于到达率乘平均逗留时间。例如，在没有失败或丢弃、到达与完成速率平衡的教学场景中，完成速率为 1000 req/s，平均逗留时间为 0.04 s，则平均在途请求数约为 40。到达率、在途数和逗留时间必须对应同一系统边界与同一类请求；若存在失败请求，不能把总在途数与成功完成速率混用。队列持续增长时，也不能直接套用上述稳态估计。\n\n当利用率逼近容量，排队延迟可能急剧增大。因此 CPU 从 70% 增至 90% 并不意味着 p99 会按相同比例增加。实验应同时展示吞吐—延迟曲线，确定目标负载位于容量曲线的哪个区段。把并发数设为固定值的闭环压测会在服务变慢时自动降低发压，可能掩盖过载；开环压测则须记录调度延迟、丢失请求和发生器是否饱和。"},{"title":"优化收益的上界与归一化","body":"Amdahl 定律：若可优化部分占原总运行时间的比例为 f，该部分加速 s 倍，则整体加速比为 `S = 1 / ((1−f)+f/s)`。如果编码阶段占 40%，局部加速 2 倍，模型给出的整体加速比为 1.25；“热点函数的处理速度提高一倍”并不等于业务吞吐翻倍。这个模型假定其他成本不变；缓存、竞争和并发的非线性相互作用会使真实结果偏离。\n\n对比 profile 时先问工作是否相等。若两个版本的观测时长相同，新版本成功吞吐翻倍、累计 CPU 时间增加 20%，则 CPU/成功请求下降了 40%：`1.2/2=0.6`。应报告原始消耗和归一化消耗，并说明是否按请求数、输入字节或记录数归一化。只看占比还存在分母陷阱：某函数占比下降，可能只是其他函数变贵。\n\n性能预算比全局排名更可执行。将 100 ms 延迟预算分给排队、计算、下游与余量，或将 0.5 CPU-ms/请求拆到编码、业务和框架；预算是规划工具，实测仍需核对阶段重叠与未知项。"},{"title":"证据阶梯：从相关性走向干预","body":"建议使用六步闭环：症状量化 → 机制假设 → 工具选择 → 定位与解释 → 单变量干预 → 回归与部署观察。每个阶段都保存事实、推断、未知项，避免把函数名当作根因。\n\n例如：CPU profile 中 `runtime.mallocgc` 的排名升高是一项观测；“业务对象分配增加”是候选解释；“改用池即可解决”尚是未经验证的干预。应进一步用累计分配 profile 定位分配栈，用基准测试确认 B/op，检查存活对象和逃逸原因，再衡量池化带来的持有内存、同步与正确性成本。\n\n强证据包括：相同工作量下重复观测到变化；移除候选机制后症状按预测缓解；把改动撤回后症状复现；解释能预测另一个输入规模的结果。负结果同样有价值：热点消失而延迟不变，可能说明真正限制来自下游或排队。它不应被作为“测试失败”删除。"},{"title":"观察者效应与伦理边界","body":"采样、栈展开、事件记录、符号解析都会占用资源。不要把启用与关闭剖析器时的数据直接拼接成一组可比测量。可设置 A=原版本且不开启采集、B=原版本且开启采集、C=优化版本且不开启采集：A 与 B 用于估计采集扰动，A 与 C 用于估计优化收益。如果还需要比较优化前后的 profile，应另采集优化版本的样本，并保持采集配置一致。高频采集应先在副本上测量开销。\n\nprofile、trace 和 core 可能包含函数名、路径、命令行、请求标签或内存中的敏感值。生产采集需要鉴权、最小权限、低基数标签、短留存和审计。开源工具能采到数据，不代表可以将生产样本上传公共页面。调试器暂停进程、core 生成和高密度事件采集都可能影响服务可用性。\n\n本书所有示例服务默认仅监听回环地址。若需要远程操作，应在已有授权通道内做端口转发，并限制访问范围。不要通过把监听地址改为 `0.0.0.0` 来省略诊断面访问控制。"},{"title":"全书路线与结业标准","body":"第 02–04 章建立运行时与统计基础；第 05–10 章形成工具使用能力；第 11–14 章完成优化、生产落地与研究型实验；第 15 章从成熟开源实现理解机制，第 16 章追踪近五年研究。每章均包含目标、实验、诊断选择题和有参考答案的分析题。\n\n建议用 16 周修读：每周一章，理论 2 小时、实验 3 小时、阅读 1 小时；第 13–14 周完成小组项目，最后两周进行源码报告和研究复现。若已有 Go 生产经验，可先做第 13 章综合案例，再按证据缺口回读。\n\n结业能力不是记住命令，而是提交可以被另一位工程师复查的证据包：代码与构建标识、负载描述、环境约束、原始 profile/trace、统计方法、关键观察、替代解释、优化补丁、正确性检查和适用范围。"}],"labs":[{"title":"建立一份性能调查卡","steps":["选择一个函数或服务，记录版本、输入分布、CPU/内存限制及目标 SLO。","分别写出一个 CPU、一个等待、一个内存假设；为每个假设写明能推翻它的观测。","定义相同工作量：例如处理同一批 100000 条记录，而不是简单运行相同时长。","填写计划采集的指标、profile 与 trace；明确采集开销和停止条件。"]}],"quiz":[{"question":"CPU 消耗相同、p99 延迟显著增大时，首选判断是什么？","options":["CPU profile 已足以定位","应检查等待、排队与负载分布","增加 CPU 采样率必能定位","这一定是 GC"],"answer":1,"explanation":"CPU profile 主要反映线程实际占用 CPU 时的执行。排队、等待和长尾延迟还需要结合 trace、指标及负载分布解释。"},{"question":"占总时间 30% 的阶段加速 3 倍，整体理想加速约为多少？","options":["3 倍","1.25 倍","1.8 倍","无法计算任何上界"],"answer":1,"explanation":"在可优化部分占比和工作量固定、其他成本不变的模型中，整体加速比为 1/(0.7+0.3/3)=1.25。"},{"question":"哪个结论最可复查？","options":["新版本更快","火焰图变窄","固定输入下 CPU-ms/请求下降，重复实验并保留失败率","排名第一的函数被删掉"],"answer":2,"explanation":"必须给出指标、分母、控制条件和重复观测。"}],"exercises":[{"question":"在到达与完成速率平衡的服务中，同一类请求的完成速率为 2000 req/s，平均在途数为 100。估计平均逗留时间，并指出一个使该估计不适用的条件。","answer":"在同一稳态系统边界内，W=L/λ=100/2000=0.05 s，即 50 ms。若队列在观测窗口内持续增长，或在途数包含另一类请求而完成速率不包含，则不能直接使用这一估计。"},{"question":"在相同工作量和可比采集配置下，某函数的 CPU 占比从 20% 降到 10%，但总 CPU 时间增至原来的 2 倍。这个函数的绝对 CPU 成本下降了吗？","answer":"没有下降。若旧版本总 CPU 时间为 100 秒，该函数占 20 秒；新版本总 CPU 时间为 200 秒，该函数仍占 20 秒。若工作量也发生变化，则还需按完成工作量归一化，不能仅凭占比判断效率。"}],"references":["go-diagnostics"]},{"id":"02","title":"Go 运行时与系统模型","subtitle":"把火焰图和时间线中的运行时符号，与具体的执行机制对应起来。","objectives":["解释 G、M、P 与 OS 线程之间的关系","区分 runnable、running、waiting 对 profile 的影响","理解栈、堆、逃逸与 GC 的成本来源","把语言内存模型与性能诊断分开使用"],"prerequisites":"第 01 章；Go 并发和基本操作系统知识。","sections":[{"title":"G、M、P：语言并发不是操作系统线程数","body":"G 表示 goroutine，M 表示执行 Go 或系统代码的操作系统线程，P 持有执行 Go 代码所需的调度资源。`GOMAXPROCS` 决定可供并行执行 Go 代码的 P 数量，并不限制程序总线程数、goroutine 数量或所有 cgo 活动。调度器在本地运行队列、全局队列、网络轮询器和工作窃取之间协调工作，具体策略属于版本相关实现细节。[go-scheduler]\n\n在 Go 调度器中，running G 已被安排到 M 上执行；runnable G 已具备运行条件，正在等待调度；waiting G 则可能在 channel、锁、网络或计时器上等待。Go 的 running 状态不保证对应的 OS 线程此刻正在 CPU 上运行，线程仍可能被操作系统抢占。因此，CPU profile 主要反映实际占用 CPU 的执行，而执行追踪可以帮助分析 Go 层面的可运行延迟和同步唤醒。CPU 空闲而 goroutine 很多可能意味着大家都在等 I/O，不能仅据数量判断调度器瓶颈。\n\n本书源码分析固定 Go 1.25.0；实验核心程序兼容 Go 1.22，但 FlightRecorder、testing.B.Loop 等能力有单独版本门槛。Go 1.25 引入的容器感知默认 GOMAXPROCS 会考虑 Linux cgroup CPU 带宽和亲和性等约束，但当主模块声明的 Go 语言版本为 1.24 或更早时，`containermaxprocs` 与 `updatemaxprocs` 的兼容默认值仍为 0。本书 lab 的 go.mod 声明 go 1.22，因此只换成 Go 1.25 工具链并不会自动启用这两项新默认；对照实验须明确记录模块语言版本与 GODEBUG。不要把宿主机核数直接当成容器可以持续使用的 CPU 容量。\n\nGo 1.25 的默认计算通常取逻辑核数、CPU 亲和性数量和配额容量中的较小者；非整数配额向上取整，并且除非逻辑核或亲和性不足 2，否则不会因小配额自动降到少于 2 个 P。通过环境变量显式设置正数 `GOMAXPROCS`，或调用 `runtime.GOMAXPROCS(n)`（n > 0），会关闭自动更新；`runtime.GOMAXPROCS(0)` 只是查询。`runtime.SetDefaultGOMAXPROCS()` 可恢复默认策略，但仍尊重 GODEBUG 开关。[tools-go125]"},{"title":"阻塞、系统调用与网络轮询","body":"当 goroutine 阻塞于可调度的同步操作时，运行时可以让 M 执行其他 G。进入可能长时间阻塞的系统调用时，P 也可以被重新交给其他线程。网络轮询器让大量网络连接在就绪之前不必各占一个阻塞的 OS 线程。这解释了“百万 goroutine”与“百万 OS 线程”成本的差别，也解释了为何 CPU profile 通常不记录网络等待本身。\n\n并非所有等待都由 Go 运行时完整观察。cgo、内核调度、缺页异常、磁盘阻塞、容器 CPU 节流可能要求 perf、strace、eBPF 或 cgroup 指标。每跨一层就需要重新明确时间边界：系统调用耗时不等同于设备服务时间，off-CPU 时间也不全是锁等待。\n\n第 08 章学习把唤醒事件与实际获得 CPU 连接起来；第 10 章补齐内核侧证据。跨层关联最好保留 PID、构建标识、时间区间与相同实验标签，不能仅根据相似函数名拼接结论。"},{"title":"栈、堆、逃逸与对象生命期","body":"goroutine 栈可以增长和收缩。局部变量是否分配在栈上由编译器逃逸分析与实现限制决定，语法上出现 `new` 不保证上堆，返回指针也不能替代对编译器结果的检查。接口装箱、闭包捕获、对象尺寸、对象是否需要在调用返回后继续存活等因素，都可能影响分配。\n\n```bash\ngo build -gcflags='-m=2' ./...\ngo test -run='^$' -bench=BenchmarkEncode -benchmem ./...\n```\n\n逃逸诊断用于解释某一构建的决定；`B/op` 和 `allocs/op` 用于实测动态代价。诊断输出中出现 escape 不意味着它一定是热点；某处启动时分配一次，可能无须优化。反之，极小对象每请求分配数百次，累积的分配和 GC 成本可能显著。\n\n对象的逻辑生命周期、GC 可达生命周期和操作系统驻留生命周期不相同。一个小切片保留大数组、全局 map 未删除键、goroutine 闭包捕获对象，都可能使可达性超出业务所需。heap profile 记录对象的分配位置；要判断“谁还持有它”，通常还需分析代码中的引用关系或进行受控实验，不能把分配栈直接当作持有者的引用链。"},{"title":"GC：吞吐、延迟与内存预算","body":"Go 使用并发、追踪式垃圾回收。GC 仍存在短暂停顿、后台标记、写屏障、扫描与分配辅助成本。大部分 GC 时间并不表现为全局 STW；“停顿很短”不能推出“GC 开销很低”。应同时观察分配率、存活堆、扫描量、GC CPU 与请求延迟。[go-memory]\n\n简化模型为 `目标堆大小 ≈ 存活堆大小 + (存活堆大小 + GC 根扫描量) × GOGC/100`。其中各项均以字节计，GC 根扫描量包括需要扫描的 goroutine 栈和全局变量等。该式用于理解现代 Go 的堆目标，忽略了最小堆目标和内存限制等约束，也不是 RSS 的上界。提高 GOGC 通常以更多堆空间换取较少 GC 周期；降低 GOGC 可能减少堆增长但增加 GC CPU。设置 `GOMEMLIMIT` 约束运行时管理内存的软预算，需要为进程其他内存、cgo、映射与容器余量留空间。压力过高时运行时可为避免 GC 抖动而超出软限制。\n\n因此调参不能替代根因修复。若每请求制造大量临时字符串，减少分配可能同时改善 CPU 和内存；若有效工作集本就超过预算，只调低 GOGC 往往加重回收压力。详细采集与验证见第 06 章。"},{"title":"缓存、NUMA 与共享状态","body":"在多核系统中，算法复杂度相同不意味着运行时间相同。连续数组和指针链在缓存局部性上差异很大；由不同核频繁写入、但位于同一缓存行的相邻变量可能引起伪共享，使缓存行反复失效；锁的争用成本可能来自排队、缓存行在多个核之间迁移和内核调度的共同作用。\n\nNUMA 系统中，访问本地与远端内存也可能具有不同成本，需要结合线程调度、内存放置与机器拓扑分析。Go 的 CPU profile 通常不能直接证明某个热点由“缓存未命中”或远端内存访问造成。这需要硬件计数器、固定频率/负载对照、数据结构变体和平台支持。硬件事件具有型号、权限与采样偏差限制，不宜把一台机器上的 cycles/instruction 阈值推广为通用标准。\n\n诊断共享状态时，先验证程序正确性，再考虑分片、批处理、只读快照或缩短临界区。增加 goroutine 数可能提高并发，也可能扩大共享资源竞争；并发不是必然加速。"},{"title":"正确性优先：内存模型与动态检测","body":"Go 内存模型以单个 goroutine 内的 sequenced-before 顺序和跨 goroutine 的 synchronized-before 关系为基础，取它们的传递闭包，定义 happens-before 关系。互斥锁、channel 和原子操作等提供具体的同步保证。[go-model] 把 map 改成无锁共享访问以消除 mutex profile 热点，可能只是引入数据竞争。性能优化必须保持 API 契约、错误处理、取消和资源释放行为。\n\n```bash\ngo test -race ./...\ngo vet ./...\n```\n\nrace detector 只检查真实执行过的路径，未报告竞争不等于证明程序无竞争。它会明显改变时间、内存与调度，因此开启 race 的运行用于正确性检查，常规性能结论应使用独立的正式构建。[go-race]\n\n死锁、活锁、逻辑竞态和 goroutine 泄漏也不都属于 data race。诊断应分别使用栈转储、执行追踪、取消测试和生命周期审计。每个优化结果都应回答：快的原因是否只是少做了必要的工作？"}],"labs":[{"title":"构建运行时状态地图","steps":["在 lab 目录启动示例服务，分别访问 /cpu、/wait、/lock 和 /retain。","分别采集 CPU profile、goroutine profile 和 trace，指出运行、可运行和等待状态的差异。","用 GOMAXPROCS=1 与 GOMAXPROCS=2 运行相同 CPU 工作量；记录吞吐和调度等待，不预设一定线性加速。","开启 -race 单独运行正确性检查，并把该结果与性能测量分开记录。"]}],"quiz":[{"question":"GOMAXPROCS=2 直接限制什么？","options":["总 goroutine 数","进程 OS 线程总数","可供并行执行 Go 代码的 P 数量","全部网络连接数"],"answer":2,"explanation":"OS 线程数和 goroutine 数都可能超过 2；cgo 调用及线程在 Go 代码之外的活动也不能只按 P 数量推断。"},{"question":"heap profile 中归因权重最高的分配栈，一定能指出谁仍在持有这些对象吗？","options":["是","否，分配位置与引用持有者不同","只要开启 gc=1 就是","只对切片成立"],"answer":1,"explanation":"profile 记录的是分配栈，而不是完整的对象引用图；对象的分配者与持有者可能不同。"},{"question":"race 检查未报错意味着什么？","options":["证明没有并发问题","执行过的路径中未检测到该类数据竞争","没有死锁","可直接用该次运行做性能结论"],"answer":1,"explanation":"动态检测只覆盖实际执行的路径，而且 race detector 会改变执行时间、内存占用和调度。"}],"exercises":[{"question":"服务的 goroutine 数量很高，但 CPU 用量较低。请给出三个可以分别检验的假设。","answer":"候选假设包括：goroutine 在等待下游 I/O；在等待共享锁或 channel；任务未及时取消，导致挂起的 goroutine 积累。可分别结合 trace 中的网络等待、block/mutex profile，以及 goroutine 栈和生命周期实验加以区分；这些现象可能同时存在，不能直接据此建议调高 GOMAXPROCS。"},{"question":"一个 100 字节切片来自 10 MiB 数组并长期保留，会发生什么？","answer":"若切片仍被后续代码使用，它可能使整个底层数组保持可达。因此，业务只需要 100 字节，不等于只保留了 100 字节内存。将所需区间复制到独立的小数组可以解除对大数组的引用，但仍须结合 heap 趋势、复制成本和正确性测试评估是否值得。"}],"references":["go-scheduler","go-memory","go-model","go-race","tools-go125"]},{"id":"03","title":"基准测试与实验设计","subtitle":"从单次测量的快慢判断，走向可复现的统计比较。","objectives":["明确基准测试的计时边界，避免准备工作混入目标测量或结果被优化消除","选择正确的重复单元和负载生成方式","解释采样误差、置信区间与实际显著性","建立版本、环境、工作量一致的比较协议"],"prerequisites":"第 01–02 章；基本概率统计。","sections":[{"title":"可运行基准与测量边界","body":"Go benchmark 使用 `go test -bench` 驱动。下面给出兼容 Go 1.22 的基准函数模式；将计算结果保存在包级变量中，以降低计算被编译器消除的风险。该代码片段需放在导入 testing 且定义了 encodeSlow 的测试文件中。初始化是否在计时区内应由研究问题决定，不能默认一律排除。[go-testing]\n\n```go\nvar result string\nfunc BenchmarkEncodeSlow(b *testing.B) {\n    input := []byte(\"profiling-with-go\")\n    b.ReportAllocs()\n    b.SetBytes(int64(len(input)))\n    b.ResetTimer()\n    for i := 0; i < b.N; i++ {\n        result = encodeSlow(input)\n    }\n}\n```\n\n若研究完整请求，序列化、内存分配与错误检查应被包含；若研究一个纯算法，可在计时前构造输入。`ResetTimer` 清零累计时间、分配统计和用户报告的指标，但不改变计时器的启停状态；`StopTimer`/`StartTimer` 应克制使用，频繁切换本身会造成扰动。Go 1.24 引入 `B.Loop`，能简化常见计时模式并通过保活循环体内函数调用的参数与结果，降低整个调用被优化消除的风险；这不意味着被调用函数内部的优化被全部关闭。不要把该 API 写成所有 Go 版本通用，也不要混用 `b.N` 和 `b.Loop()` 控制同一个基准。\n\n基准值 `ns/op` 的 op 是作者定义的一次迭代。若一次迭代处理 1000 条记录，必须说明它不是每条记录时间。`RunParallel` 的 ns/op 是整个并发 benchmark 的墙钟时间除以全部迭代数，即吞吐的倒数尺度；它不是各 goroutine 逐次延迟的算术平均，更不是单请求 p99。假设两个 worker 各执行一次 10 ms 操作且完全重叠，报告约 5 ms/op，而每次操作延迟仍约 10 ms。"},{"title":"命令、构建与原始数据","body":"本书附带的 lab 是完整 Go 模块。先用功能测试确认慢、快编码器输出相同，再开展性能测量。\n\n```bash\ngo test ./...\ngo test -run='^$' -bench=BenchmarkEncode -benchmem -count=10 > bench.txt\ngo test -run='^$' -bench=BenchmarkEncodeSlow -benchtime=3s   -cpuprofile=cpu.pb.gz -memprofile=mem.pb.gz\ngo tool pprof -top cpu.pb.gz\n```\n\nprofile 文件名后缀只表示约定，不改变实际编码。`go test` 在生成 profile 时会保留测试二进制；应保留匹配的二进制，尤其涉及符号化、反汇编和不同构建。记录 `go version`、`go env GOOS GOARCH`、构建参数、commit、CPU 型号、容器配额、GOMAXPROCS、GOGC 和输入校验值。\n\n同时采集 CPU 与内存可能有额外开销。用于定位的运行和最终报告数值的运行应分开，除非研究问题就是“启用某采集配置的系统性能”。尽量保存原始输出，而不是只复制平均值到表格。\n\n`-cpuprofile` 的采集生命周期也不等于 benchmark 的计时器：testing 在运行测试或基准之前启动 CPU 采集，并在结束阶段停止；`b.StopTimer()`、`ResetTimer()` 并不会暂停 CPU profiler。因此未计入 ns/op 的准备、校准或收尾工作仍可能出现在 CPU profile 中，不能仅按火焰图百分比拆分 ns/op。"},{"title":"重复、随机化与环境噪声","body":"一次进程内的循环迭代并非独立实验：它们共享缓存、堆状态和频率。统计推断需要明确重复单元，是独立进程、机器、输入批次还是时间窗。`-count=10` 会在同一个测试进程中重复基准，产生多份结果；这些结果仍共享进程、主机及环境趋势，不能宣称已代表所有生产部署。\n\n以 ABBA 或随机次序运行旧/新版本，可减轻热机、频率、后台负载和温度漂移。保持 CPU/NUMA 配置、容器额度、输入分布和依赖版本一致。若服务依赖下游，记录下游耗时和错误；若只评估本地代码，可使用明确声明的固定响应下游，但结论限于该模型。\n\n`benchstat` 是 Go 生态常用的基准比较工具，具体输出与统计方法随工具版本变化。安装时固定所用版本并记录帮助信息，不将 p 值当作改动收益的充分证据。[go-benchstat]\n\n```bash\nbenchstat before.txt after.txt\n```\n\n应同时给出效应大小、波动区间、样本数和业务阈值。即使 0.5% 的差异通过了统计检验，也可能不值得为此引入复杂缓存；即使均值改善了 10%，若 p99 或错误率恶化，也可能不符合业务目标。"},{"title":"采样误差：估计不是计数真相","body":"先固定“命中”的定义，例如仅统计叶端属于该函数的样本。若将各样本是否命中近似为独立、同分布的 Bernoulli 事件，N 个样本中命中 k 次，则 `p_hat=k/N`，标准误近似 `SE=sqrt(p_hat(1−p_hat)/N)`。若观测到 p_hat=0.1、N=1000，则估计标准误约为 0.0095，粗略的双侧 95% 正态近似区间为 10%±1.86 个百分点。这里的数字是教学模型，不是 profiler 承诺的置信区间。\n\n真实栈样本存在时间相关性，周期性工作会与采样周期混叠；函数归属也受内联、栈展开和采样丢失影响。极小比例、很少样本或存在相关性时，正态近似不可靠。零命中不证明零开销；在独立、同分布的 Bernoulli 试验模型下，零命中对应的单侧 95% 置信上界为 `1−0.05^(1/N)`；N 较大时可近似为 `3/N`。这约束的是该模型中的命中概率，并不能排除采集器的系统性漏采。\n\n增加时长通常比随意增加频率更稳妥，但会混合更多工作阶段。应先稳定负载，再重复多个可比较时间窗，报告哪些热点在各窗口中持续出现。若目标是偶发慢请求，更长时间的聚合 CPU profile 可能反而稀释事件，此时应考虑 trace 或飞行记录器。"},{"title":"延迟分布与协调遗漏","body":"延迟分布常有长尾。报告 p50、p95、p99 以及成功数和错误数；不要把多个实例的 p99 再简单平均称为全局 p99。全局分位数应从合适的原始样本或可合并分布结构估计，并说明桶边界和误差。\n\n闭环负载发生器通常等收到响应后才发出下一个请求。如果研究目标是外部持续到达的请求流，服务阻塞时，闭环发生器减少发压，原本应到达的请求及其等待时间便不会进入已观测延迟，这会造成协调遗漏。如果真实业务本来就由固定数量、等待响应的用户组成，闭环模型仍可能合适；关键是明确要模拟的到达过程。开环发生器按照外部时间表发压，应分别记录预定到达时刻、实际发送时刻和完成时刻，区分发生器调度滞后与服务耗时，并验证发生器自身的容量。\n\n为了比较实现机制，建议固定工作量；为了评估 SLO，建议画多负载点的响应曲线，并固定到达过程。二者回答不同问题。不要在新版本跑更多请求后只比较 profile 总量，也不要在闭环过载时宣称“p99 仍很稳定，因此容量充足”。"},{"title":"实验报告的最小可复现协议","body":"建议报告按“问题—假设—方法—结果—解释—限制”写作。方法章节至少覆盖自变量、响应变量、控制变量、随机化、重复次数、预热、异常剔除规则和采集开销。异常值若来自真实 GC、节流或尾部排队，正是待解释现象，不能为了曲线好看而删除。\n\n因果主张要控制替代解释：性能改变是否由输入更小、缓存更热、失败更早或正确性降级导致？运行一组撤回实验、输入规模扫描和关闭 profiler 的对照实验，可以增强结论可信度。最后以真实工作负载或至少另一个独立负载验证外部有效性。\n\n课程评分不奖励预设“成功优化”。明确解释无收益、给出原因并诚实保留数据，同样是合格研究结果。第 14 章提供完整评分量规。"}],"labs":[{"title":"完成一次严谨的编码器比较","steps":["进入 lab，阅读 encodeSlow 与 encodeFast，先运行 TestEncoders。","将两种基准各测量 10 次，交错或随机安排比较顺序，保存原始输出、Go 版本、CPU 信息及容器配额；若只使用 -count=10，应注明这些重复来自同一测试进程。","检查 ns/op、B/op 和 allocs/op；在相同负载下比较关闭与开启 CPU 采集的结果，估计观察者效应。","将输入长度改为 16、256、4096 字节等多个规模，检验结论是否稳定。","对相同工作量采集 profile，解释 CPU 差异的来源；将尚未验证的生产环境外推写入适用范围与限制。"]}],"quiz":[{"question":"为何不能把 benchmark 的每次内层迭代都当成独立实验？","options":["Go 不支持统计分析","共享缓存、堆与环境会使样本相关","迭代一定没有执行","独立样本必须来自不同语言"],"answer":1,"explanation":"独立性是统计假设，不由循环次数自动保证。"},{"question":"提高采样率的正确态度是？","options":["越高一定越真实","先测开销、平台支持与采样相关性","设为每纳秒一次","用它代替所有 trace"],"answer":1,"explanation":"频率提升会增加扰动，且不消除系统性偏差。"},{"question":"能否将多个实例的 p99 取算术平均，得到全局 p99？","options":["能","不能，需可合并分布或原始样本","只有实例数偶数时能","只需查看平均 CPU 用量"],"answer":1,"explanation":"分位数不是可直接线性平均的统计量。"}],"exercises":[{"question":"在独立、同分布样本及正态近似下，预期占比为 10% 的热点若要达到约 ±1 个百分点的双侧 95% 误差范围，需要多少个样本？","answer":"解不等式 1.96×sqrt(0.1×0.9/N)≤0.01，得到 N≥3457.44，因此至少需要 3458 个样本。这只是一项模型内的样本量规划，不包含时间相关性、栈展开错误或负载偏差；实际采集仍需用多个可比较时间窗检验稳定性。"},{"question":"优化后报告的平均延迟下降 8%，但超时比例从 0.1% 升到 2%，应如何解释？","answer":"首先检查平均延迟是否只统计成功请求。报告应同时给出尝试总数、成功数、超时数、超时阈值及失败请求已观测到的耗时；超时请求的真实完成时长通常不可知，应说明超时截止后数据的处理方式。若最慢的请求因超时被排除，成功请求的均值就可能看似改善。还需比较容量曲线与业务 SLO，不能仅凭均值判定优化成功。"}],"references":["go-testing","go-benchstat"]},{"id":"04","title":"pprof 的数据模型与读图方法","subtitle":"理解样本值、调用路径、符号化和查询过滤，才能避免读错图。","objectives":["解释 profile.proto 中 sample、location、function 与 mapping","正确选择 sample_index 并读懂 flat/cum","区分火焰图、调用图和时间线","在一致工作量下解释差分 profile 与标签过滤"],"prerequisites":"第 01–03 章；调用栈和采样基础。","sections":[{"title":"一个 profile 的结构","body":"pprof 既指 Go 的采集接口，也指分析工具和通用 profile 数据格式。Go 程序可以通过 runtime/pprof 或 HTTP 诊断端点导出 profile，再交给 go tool pprof 解析。不同语言采集器也可产生相同格式，但相同格式不保证相同统计语义。[go-proto][go-pprof]\n\nprofile.proto 中，`sample_type` 定义各项样本值的类型与单位；每个 `sample.value` 都必须具有相同的长度，并与 `sample_type` 逐项对应。`sample.location_id` 引用栈中的 location，叶端位于索引 0。location 的 `line` 记录引用 function，并保存对应源码行号；function 保存函数名、文件名与函数起始行；`mapping_id` 则关联二进制映射。`string_table` 通过共享字符串表减少重复存储，标签为样本附加字符串或数值维度。\n\n|结构|作用|需要检查的条件|\n|---|---|---|\n|sample_type|例如 alloc_objects/count、alloc_space/bytes|选择的统计量是否与问题一致|\n|sample.value|对应各 sample_type 的数值向量|不是任意原始事件计数|\n|location|地址、行号和可能的内联帧|是否正确展开与符号化|\n|function|函数名、文件名、起始行|是否匹配该构建|\n|mapping|地址区间、文件与 build ID|二进制与调试符号是否正确|\n|label|样本属性或业务分类|是否低基数、是否包含敏感数据|\n\nGo 的 CPU profile 通常同时包含样本计数和估计的 CPU 时间；heap profile 则包含多个内存计量维度。优先检查 `go tool pprof -raw file.pb.gz`，而不是依靠图形默认值猜测。"},{"title":"flat 与 cum：相同样本的两种归因","body":"flat 将所选样本权重归给报告中保留的叶端位置，具体归因还受内联展开、聚合和栈节点过滤影响；cum 则统计包含该报告节点的样本权重，涵盖它自身及其下游调用路径。对于 CPU profile，cum 不等于函数独占的 CPU 时间，也不能与其子函数的 cum 直接相加。一个业务包装函数的 flat 很小、cum 很大，通常意味着成本主要发生在其下游调用中。\n\n教学例：假设有 100 个等权样本，60 个栈为 main→serve→encode，30 个为 main→serve→hash，10 个为 main→cleanup。serve 的 flat 为 0、cum 为 90；encode 的 flat 与 cum 均为 60。若将 main 的 100、serve 的 90 和 encode 的 60 相加，就会重复统计共享样本。\n\n```bash\ngo tool pprof -top cpu.pb.gz\ngo tool pprof -top -cum cpu.pb.gz\ngo tool pprof -list=encodeSlow cpu.pb.gz\ngo tool pprof -raw cpu.pb.gz\n```\n\n调用图的边表示调用关系与样本归因，默认会裁剪权重较低的节点；递归、内联、多父调用和聚合会让图不同于静态调用图。节点未出现可能是过滤或阈值所致，并不能证明函数没有执行。\n\n递归还要避免另一种重复：在同一报告聚合节点中，同一条样本重复经过该节点时，cum 只计该样本一次。例如一条权重 10 的 A→A→B 样本，在按函数聚合时 A 的 cum 为 10，而非 20；火焰图展开出的不同递归深度也不能再相加解释为额外 CPU。[tools-pprof-cli]"},{"title":"火焰图不是时间线","body":"在常规的非负权重 profile 中，火焰图的框宽反映对应调用路径的所选样本权重，纵向表示调用栈层次。左右位置一般来自排序和布局，不表示开始时间；颜色往往只是区分或编码类别，必须看具体工具图例。“左边先发生，右边后发生”是常见误读。\n\n差分模式需要另外解读。本书核对的 pprof 网页实现中，使用 -diff_base 时，框宽反映子树中增加量与减少量绝对值的合计，净变化另以阴影表示。在文档的示例中，一个子分支减少 150、另一个增加 200，框宽对应 350，净增加为 50，不能把框宽直接读作净增量。[tools-pprof-cli]\n\npprof 网页火焰图聚合的是整个 profile 中的栈和权重，适合分析成本分布；go tool trace 提供时间轴，适合分析事件先后和等待。持续消耗 CPU 的函数适合用 CPU 采样定位；发生在 5 ms 内的偶发锁竞争或排队，则通常需要事件追踪补充证据。工具之间的差异来自数据模型，不是界面优劣。\n\n```bash\ngo tool pprof -http=127.0.0.1:8081 cpu.pb.gz\n```\n\n图形视图中部分调用图输出依赖 Graphviz，终端的 top/list 输出则不需要。建议保留命令行摘要，即使浏览器图形环境暂时不可用，核心证据仍然可复查。"},{"title":"选择统计量与过滤范围","body":"堆 profile 的四个常见 sample index 为 `alloc_objects`、`alloc_space`、`inuse_objects`、`inuse_space`。累计分配适合分析分配压力，存活量适合分析保留内存；对象数和字节数则区分大量小对象与少量大对象。Go 的 heap profile 默认通常选择 inuse_space，allocs profile 则默认选择 alloc_space。研究报告应显式记录所选统计量，避免因默认值不同而比较了不同指标。\n\n```bash\ngo tool pprof -sample_index=alloc_space -top mem.pb.gz\ngo tool pprof -sample_index=inuse_space -top mem.pb.gz\ngo tool pprof -focus='encode|hash' -top cpu.pb.gz\ngo tool pprof -hide='runtime\\.' -top cpu.pb.gz\n```\n\nfocus 与 ignore 以整条样本为单位筛选：只要栈中包含匹配位置，样本就可能被选入或排除。hide 与 show 则主要过滤栈中的报告节点；例如，上面的 hide 命令隐藏 runtime 节点，不会仅因栈中含有 runtime 就删除整条样本。如果一条样本的所有栈节点都被隐藏，工具会移除这条空栈样本。若误用 `-ignore='runtime\\.'`，大量包含运行时栈帧的业务样本也可能被排除。报告应记录过滤条件、active filters 和百分比分母。隐藏运行时节点只是一种观察方式，并不能证明 GC 或调度与业务成本无关。\n\n标签过滤也不能让不支持标签的 profile 突然具有请求维度。Go 的 pprof labels 主要供 CPU 和 goroutine profile 使用，标签传播及继承应按具体版本检查；不能默认 heap、block 和 mutex profile 都支持按标签细分。[go-pprof]\n\n默认 `relative_percentages=false` 时，pprof 在 focus/ignore 等过滤前确定总量，过滤后的表不一定重新归一到 100%。显式启用 `-relative_percentages` 才先过滤再取报告分母；hide/show 主要改变栈节点显示，不等同删除整条样本。比较图表时应保留这个开关以及 active filters。"},{"title":"差分、基线与代表性","body":"在相同工作量、相同采样配置、可比构建下，差分能提示成本迁移。`-base` 常用于同一进程的累计快照相减；在正常单调累计的情形，百分比相对总量之差。`-diff_base` 适合前后对比，百分比相对基线总量并保留有意义的负变化。一般有正负样本的情况分母处理更复杂，应同时报告绝对权重并核对工具帮助。不要把不同时间长度的两个累计 profile 直接相减后宣布优化成功。\n\n```bash\ngo tool pprof -top -base=before.pb.gz after.pb.gz\ngo tool pprof -top -diff_base=before.pb.gz after.pb.gz\n```\n\n比较周期内若请求数不同，可同时报告总量和每请求归一化结果。可使用工具归一化能力作形状比较，但按总 profile 权重归一化会掩盖总成本变化，不能替代业务分母。更稳妥的实验是完成相同输入批次后分别采集，并把独立基准结果与 profile 的解释配对。\n\n对长期运行进程的累计分配、block 和 mutex profile，先后快照之差可近似表示窗口内的增量；进程重启、采样率变化或语义不同会破坏可比性。heap 中的存活量估计与 GC 周期及对象回收有关，可能自然减少；它的差分表示保留量的净变化，不能解释为窗口内的累计分配。"},{"title":"符号化、优化编译与证据保存","body":"分析样本需要从程序计数器恢复函数和源码。ASLR、内联、裁剪符号、二进制不匹配、源码版本漂移都会影响结果。发布时应保留构建 ID、完整二进制或对应符号产物及源码 commit；对 cgo 和原生库还需保留相应库映射与调试信息。\n\n为提高 Delve 对变量和控制流的可见性，使用 `-gcflags='all=-N -l'` 会禁用优化和内联，适用于调试构建；不能把它的 profile 当作正常生产优化构建的性能特征。先剖析真实构建，再为具体控制流问题使用调试构建，明确两者的边界。\n\n证据包至少包含 profile 文件、采集命令、采集时间、duration、sample index、构建标识、输入或流量统计、环境和解读命令。分享截图时仍保留原始文件；截图无法恢复过滤、采样权重和符号化细节。"}],"labs":[{"title":"同一文件的四种内存视角","steps":["在 lab 中运行第 03 章生成 mem.pb.gz 的基准命令，保留 profile 文件及匹配的测试二进制。","使用 -raw 检查 sample_type，然后分别选择四种内存 sample_index，记录各自的类型与单位。","比较 flat、cum 和 list 输出，写出每种视图能回答的问题。","打开网页火焰图，选择一个父节点，解释其宽度为何不能与子节点相加。","选取一个未在 top 中出现的函数，检查过滤条件和显示阈值，并查看 list 输出；区分“未采到样本”与“采到了但被显示规则裁剪”，不要把零命中直接判为零成本。"]}],"quiz":[{"question":"火焰图从左到右通常表示什么？","options":["执行先后","按栈聚合后的布局，通常不含时序","CPU 核心编号","网络包到达次序"],"answer":1,"explanation":"横向宽度代表选定的样本权重，左右布局通常不表示事件先后；要分析时序，应查看 trace。"},{"question":"为何不能将父函数的 cum 与子函数的 cum 直接相加？","options":["单位不同","共享样本会重复计数","cum 永远为 0","只因递归存在"],"answer":1,"explanation":"父函数的 cum 已包含经过下游函数的样本权重，相加会重复计数。"},{"question":"分析临时小对象分配压力应优先比较什么？","options":["只查看 inuse_space","同时比较 alloc_objects 与 alloc_space","只查看 RSS 截图","源码行数"],"answer":1,"explanation":"临时对象可能很快被回收，不再体现在存活堆中；累计分配对象数和字节数有助于揭示分配压力。"}],"exercises":[{"question":"在 100 个等权样本中，调用栈 A→B 出现 40 次，A→C 出现 60 次。求按函数聚合后 A、B 的 flat 与 cum。","answer":"A 没有作为叶端出现，因此 A 的 flat=0、cum=100；B 的 flat=40、cum=40。这里假设没有内联、递归、过滤或其他改变归因的因素。"},{"question":"旧版本的 CPU profile 采集了 30 秒，新版本采集了 60 秒。能否直接用两者的 CPU 总权重判断效率变化？","answer":"不能直接作出效率结论。应固定完成工作量，或按同一口径的成功请求数归一化，同时报告采集时长、吞吐及失败率。仅按 profile 总权重归一化，通常只能比较成本分布，可能掩盖总消耗的变化。"}],"references":["go-proto","go-pprof","go-diagnostics","tools-pprof-cli"]},{"id":"05","title":"CPU 剖析","subtitle":"把采样热点转化为可检验的计算成本解释","objectives":["区分墙钟时间、累计 CPU 时间和 CPU profile 样本权重","从 flat、cum、调用图及源码视图逐层定位计算热点","正确传播低基数 labels，并识别未覆盖的异步工作","用独立复测判断 CPU 优化是否转化为业务收益"],"prerequisites":"第 02–04 章；能够构建 Go 程序、运行基准测试并理解调用栈。","sections":[{"title":"测量对象：CPU 时间不是请求耗时","body":"CPU profile 回答的是“采样期间，处理器执行哪些调用栈”，而非“每个函数从进入到返回用了多久”。设墙钟窗口为 T，进程内各线程消耗的 CPU 时间之和为 C，则平均使用的 CPU 核数近似为 C/T。四个核充分繁忙时，10 秒窗口可以产生约 40 CPU 秒；窗口内等待网络的请求即使持续 8 秒，也可能只贡献很少 CPU 样本。报告中的百分比通常以所选样本类型的总权重为分母，不能直接读作单核利用率或请求延迟占比。[tools-pprof]\n\nGo 1.25 的 `runtime/pprof.StartCPUProfile` 固定设置名义 100 Hz 采样率，样本通常带有约 10 ms 的 CPU 时间权重。它并不每 10 ms 遍历全部 goroutine，也不准确记录每一次函数调用。操作系统、调度、cgo、信号处理、采样缓存丢失及栈展开都会影响实际覆盖。一次 2 ms 的函数调用可能完全没有被采到；大量重复的小调用则可以凭总体占比稳定出现。应观察足够的工作量，而非把采样周期当成最小可优化函数耗时。[tools-pprof]\n\n把 CPU、on-CPU、off-CPU 与 wall time 分开记账。CPU 时间包含执行所消耗的时间；内核性能工具的 on-CPU 事件能覆盖特定配置下的用户态和内核态执行；off-CPU 是线程不在 CPU 上的时间集合，可能包含睡眠、I/O 等待或等待调度。Go 中处于 runnable 状态的 goroutine 还可能在运行队列中等待调度；与此同时，持有 P 的线程可能正在执行其他 goroutine。只有把运行时状态和操作系统状态关联起来，才可能解释尾延迟。第 07、08、10 章分别补足同步等待、时序与系统边界。\n\n名义 100 Hz 是 `StartCPUProfile` 内部固定值，不是 HTTP 参数可调的默认选项。不要先调用 `runtime.SetCPUProfileRate` 再期待 pprof 自动采用该频率：两者管理同一运行时采集器，活动期间改频率会被拒绝，混用还可能使生命周期不一致。教学动画中的采样间隔变化应理解为统计模型，不是标准 pprof 的调频接口。"},{"title":"采集：选择代表性窗口和正确二进制","body":"短程序可使用 `runtime/pprof`，基准测试可使用 `go test -cpuprofile`，服务可使用第 10 章的诊断 HTTP 端点。保留实际参与采集的二进制、源码提交、构建参数、Go 版本、负载参数和起止时间。源码行号与反汇编需要匹配的构建产物；相同函数名不足以证明二进制匹配。不要为了采 CPU profile 默认关闭内联与优化，否则测到的是调试构建的性能。\n\n```sh\ngo test -run='^$' -bench='BenchmarkEncode$' -benchtime=10s   -cpuprofile=cpu.pprof -o encode.test .\ngo tool pprof -top ./encode.test cpu.pprof\ngo tool pprof -http=127.0.0.1:8081 ./encode.test cpu.pprof\n```\n\n上述命令假设当前包确实含有 `BenchmarkEncode`。通过 `-run='^$'` 避开普通测试，通过明确的 benchmark 正则固定采样工作负载。服务端采集则必须在施加稳定负载的同时进行：\n\n```sh\ncurl --fail --max-time 40 -o cpu.pprof   'http://127.0.0.1:6060/debug/pprof/profile?seconds=30'\ngo tool pprof -top ./service cpu.pprof\n```\n\n默认 CPU 窗口为 30 秒，但窗口长度应取决于事件频度及稳定性。长窗口可以降低随机误差，也可能把冷启动、稳态和故障恢复混合成无法解释的平均值。先划分阶段，再选择窗口。进程只允许一个活动的 CPU profile；HTTP 采集与程序内部的 `StartCPUProfile` 会竞争同一全局资源。必须检查开始采集的错误，并在退出前调用 `StopCPUProfile`；后者返回时才保证 profile 写出完成。[tools-http-pprof][tools-pprof]"},{"title":"从 flat 与 cum 走向调用路径","body":"`flat` 是样本直接归属于某函数的权重，`cum` 是该函数及其下游调用所覆盖的权重。若入口 `Handle` 的 flat 为 0.1 秒、cum 为 8 秒，而 `sha256.block` 的 flat 为 6 秒，则入口是主要工作路径，哈希实现是主要执行地点。不能将所有函数的 cum 相加；同一份样本沿调用栈进入多个祖先节点。递归、内联和多调用方会让“每层加一次”的直觉更加危险，具体累计以工具的调用图聚合规则为准；官方说明同一样本重复出现同一位置时仅计入一次。[tools-pprof-cli]\n\n```sh\ngo tool pprof -top -cum ./service cpu.pprof\ngo tool pprof -list='Encode|Marshal' ./service cpu.pprof\ngo tool pprof -disasm='main.hotLoop' ./service cpu.pprof\n```\n\n按 flat 排序适合寻找自身执行成本较高的函数，按 cum 排序适合寻找值得重新设计的调用路径。接着用 callers/callees 与源码视图回答：热点被谁调用、输入规模是否异常、是否重复计算、是否出现不必要的格式转换。如果编码库位居榜首，仅替换一条循环语句未必有效；上层重复序列化可能才是原因。\n\n火焰图的宽度表示聚合后的样本权重，高度表示调用深度，横向相邻的两个块通常不代表时间先后。火焰图不能证明“先发生 GC，再发生请求超时”。源码行权重也可能由于编译器移动指令、内联和指令地址映射而集中到某一行；反汇编帮助检查实现，但不是逐语句精确计时器。\n\n初学者可分三步缩小范围：先找到贡献最大的业务路径，再在该路径内寻找成本最高的阶段，最后用基准测试或输入规模实验检验机制。每一步都应保留原始总量与当前过滤范围；如果视图按筛选后的集合重新归一化，一个占原始总量很小的函数也可能显示为 100%。pprof 的默认百分比分母及 `relative_percentages` 开关见第 04 章。\n\n还有一类热点来自算法输入规模。若排序耗时随输入项数增长，应该用几组不同规模的数据测量增长趋势，而不仅仅替换一个比较函数。将问题表述为“每个请求排序几次、每次多少元素”，再用调用计数或业务指标确认；调用次数本身通常不能从普通 CPU 样本精确恢复。找到高累计入口后，检查重复解析、无效重试和不必要的跨格式转换，往往比优化叶子函数常数因子更有效。\n\n在数学上，假设可优化部分占总成本比例为 p，局部加速倍数为 s，且其余工作与负载保持不变，则整体加速比模型为 `1 / ((1-p) + p/s)`。如果热点占四成，即使将这部分耗时降至零，总耗时仍为原来的六成，整体加速比上限约为 1.67。这个模型帮助筛选投资方向，但请求存在并行、排队或外部等待时，需要先判断该 CPU 成本是否位于关键路径。"},{"title":"使用 labels 归因请求类别及其限制","body":"当不同业务共用编码、压缩或加密代码时，函数栈无法直接说明成本属于哪类请求。`pprof.Do` 将传入 context 的标签与 `Labels` 参数合并，并安装到当前 goroutine；回调结束后恢复传入 context 所携带的标签。回调内新建的 goroutine 继承创建者当时的 labels。`WithLabels` 只返回新的 context，并不会独自改变当前 goroutine 的采样标签。Go 1.25 明确只有 CPU 与 goroutine profiles 使用这些 labels，不能据此承诺 heap、block 或 mutex 已实现按租户归因。[tools-labels][tools-label-runtime]\n\n以下为集成片段，`encode` 与 `payload` 来自业务代码：\n\n```go\npprof.Do(ctx, pprof.Labels(\"route\", \"search\", \"phase\", \"encode\"),\n    func(ctx context.Context) {\n        encode(payload)\n    })\n```\n\n```sh\ngo tool pprof -tags ./service cpu.pprof\ngo tool pprof -top -tagfocus='route=search' ./service cpu.pprof\n```\n\n常驻 worker pool 不会因为接收了带标签的 context 就自动更换 goroutine labels。应在 worker 处理每个任务时调用 `pprof.Do`，并让任务携带相应的 context。新 goroutine 的继承也不等于生命周期自动结束：若请求启动永久后台 goroutine，其标签可能长久保留。把请求级工作、后台维护和共享批处理分别建模；共享 GC 或批量任务的成本通常不能简单归还到某个请求。\n\n标签维度应是有限的路由、操作类型或服务等级，避免每请求唯一的 ID、完整 URL、用户输入和令牌。高基数会削弱聚合效果，并增加存储、处理和隐私保护成本。labels 用于按类别拆分聚合数据，不能替代分布式调用链；关联跨进程因果关系仍需 span 与请求上下文。"},{"title":"采样误差、编译器效应与常见误判","body":"在理想独立采样模型中，若总样本数为 n、某热点占比为 p，则比例估计的标准误差近似为 `sqrt(p × (1-p) / n)`。例如假设 n=100、p=0.1，标准误差约为 3 个百分点；仅凭 10% 降为 8% 无法证明优化。真实程序存在阶段性和自相关，独立模型通常过于乐观。用不同采集窗口、不同进程的重复实验评估稳定性，比只看一次火焰图更可靠。\n\n较少样本不一定说明程序快：可能没有施加负载、任务提前退出、采集窗口落在空闲阶段，或耗时主要发生在外部服务；采集器对部分内核或非 Go 执行路径的覆盖不足，也可能影响结果。`runtime.mallocgc` 或 GC 标记占比高通常指向分配压力；应转到第 06 章查找分配源。`runtime.futex` 等系统边界符号则需要结合调用上下文与第 10 章工具分析，不能仅凭名字认定锁竞争。\n\n内联让逻辑函数与机器栈不再一一对应，去虚拟化和逃逸分析会改变工作位置。Go 的符号化可以恢复许多内联信息，但行级热点仍需结合优化报告。运行 `go build -gcflags='all=-m=2'` 时输出可能很大，应限定到相关包；输出本身只是编译器决策证据，不是优化收益证据。\n\n比较前后 profile 时，必须同时比较每请求 CPU、吞吐和延迟。假设总 CPU 从 10 秒涨到 12 秒，但处理请求从 1000 增至 2000，则单位请求 CPU 从 10 ms 降至 6 ms。反之，某函数占比减半可能只是其他工作增多。第 11 章将把这种归一化用于 PGO 与算法优化决策。\n\n复测时应将诊断采集与正式性能测量分开运行：一组保留诊断证据，另一组关闭采集测量收益。测试顺序可随机交替，避免温度、频率、缓存预热与邻居负载随时间变化造成系统性偏差。若优化只改变少数长尾输入，还应分别报告各输入类别与整体加权结果；在类别分布改变后得到的平均下降，不能归功于代码修改。\n\n最终结论最好写成可反驳的命题：某路径对同样大小的输入重复执行三次编码，删除两次后单位请求 CPU 下降，同时输出与错误语义保持一致。与“火焰图更漂亮”相比，这样的结论明确了机制、条件和验证指标。"},{"title":"可运行实验：让计算与等待分离","body":"下面是完整程序，保存为 `cpu.go`。程序先做带标签的哈希计算，再做 600 ms 等待。哈希结果参与最终输出，避免把实验写成可被编译器删除的无用计算。该程序用于展示测量语义，不代表真实服务基准。哈希循环以约 3 秒的墙钟截止时间为结束条件，实际哈希次数随机器、调度和采集开销而变化，因而不是固定工作量基准。输出的 `wall` 还包含停止采集、等待 profile 写完及关闭文件的时间，不应预先认定恰好等于 3.6 秒。\n\n```go\npackage main\n\nimport (\n\t\"context\"\n\t\"crypto/sha256\"\n\t\"fmt\"\n\t\"os\"\n\t\"runtime/pprof\"\n\t\"time\"\n)\n\nfunc main() {\n\tf, err := os.Create(\"cpu.pprof\")\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tif err := pprof.StartCPUProfile(f); err != nil {\n\t\tf.Close()\n\t\tpanic(err)\n\t}\n\tstarted := time.Now()\n\tvar sum [32]byte\n\tpprof.Do(context.Background(), pprof.Labels(\"phase\", \"hash\"),\n\t\tfunc(context.Context) {\n\t\t\tuntil := time.Now().Add(3 * time.Second)\n\t\t\tfor time.Now().Before(until) {\n\t\t\t\tfor i := 0; i < 10000; i++ {\n\t\t\t\t\tsum = sha256.Sum256(sum[:])\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\tpprof.Do(context.Background(), pprof.Labels(\"phase\", \"wait\"),\n\t\tfunc(context.Context) { time.Sleep(600 * time.Millisecond) })\n\tpprof.StopCPUProfile()\n\tif err := f.Close(); err != nil {\n\t\tpanic(err)\n\t}\n\tfmt.Printf(\"wall=%v result=%x\\n\", time.Since(started), sum[:4])\n}\n```\n\n```sh\ngo build -o cpu-lab cpu.go\n./cpu-lab\ngo tool pprof -top ./cpu-lab cpu.pprof\ngo tool pprof -tags ./cpu-lab cpu.pprof\n```\n\n应检验的预期是哈希阶段贡献主要 CPU 样本，而 600 ms 的 `Sleep` 不会变成同等 CPU 样本；实际数字由本机测量获得。扩大等待时间会增加墙钟耗时而不相应增加计算成本。再把哈希阶段改成两个并发 worker，并保持各自状态独立。若比较优化收益，应先改为固定哈希总次数，并在两种实现之间保持总工作量相同；若仍让每个 worker 运行约 3 秒，则这是并发容量演示。累计 CPU 时间与墙钟时间的关系取决于可用核数、GOMAXPROCS 及配额，不能预先写成固定两倍。"}],"labs":[{"title":"CPU profile 到优化假设的闭环","steps":["构建并执行 5.6 的完整程序，保存 go version、二进制和初始 profile；为每次运行使用独立输出目录，避免 cpu.pprof 被覆盖。","将等待改为 2 秒，在相同机器上重新构建采集；比较墙钟与样本总量，解释差别。","在原程序上分别运行 flat、cum、tags 视图，写出热点调用路径及标签覆盖范围。","选择一个实际业务 benchmark，记录代表性输入和每次操作的 CPU 时间与墙钟时间；提出一项减少重复计算的修改并独立复测。","提交原始 profile、命令、至少三个独立进程的复测结果及汇总统计与结论；若结果不稳定，报告不确定性而不宣称优化成立。"]}],"quiz":[{"question":"10 秒采集窗口得到 28 CPU 秒，最合理的解释是什么？","options":["profile 文件损坏","进程平均使用约 2.8 个 CPU 核","单个请求延迟为 28 秒","所有 goroutine 均等待 18 秒"],"answer":1,"explanation":"CPU profile 聚合多线程计算时间；CPU 秒可以超过墙钟秒，C/T 估计平均使用的核数。"},{"question":"入口函数 cum 很高而 flat 很低，下一步应该做什么？","options":["删除入口函数","沿调用图查找下游热点及重复工作","只优化入口处的变量赋值","把 cum 与所有子函数 cum 相加"],"answer":1,"explanation":"cum 说明该调用路径承载大量成本，flat 低说明执行成本主要在下游；cum 包含关系不能重复求和。"},{"question":"任务进入早已存在的 worker pool 后，CPU labels 不见了，最可能缺少什么？","options":["给 context 增加更多任意字段","在 worker 处理任务时调用 pprof.Do","开启 heap 的 debug=2","将所有路由改成唯一 UUID"],"answer":1,"explanation":"传递 context 不会自动更新既有 goroutine 的 labels，需要在实际执行工作的位置安装并恢复标签。"},{"question":"Go 1.25 的 pprof labels 原生用于哪些 profile？","options":["所有 profile","仅 heap 和 allocs","CPU 和 goroutine","仅 block 和 mutex"],"answer":2,"explanation":"固定版本的 runtime/pprof 文档明确限于 CPU 与 goroutine；其他采集器的扩展能力不能当成标准库承诺。"}],"exercises":[{"question":"假设优化前后两个观测窗口时长相同。优化前处理 6000 个请求，共有 30 CPU 秒，其中 Encode 为 12 CPU 秒；优化后处理 9000 个请求，共有 36 CPU 秒，Encode 为 9 CPU 秒。计算总 CPU/请求及 Encode CPU/请求，并评价只看总 CPU 的结论。","answer":"优化前总成本为 30/6000=5 CPU-ms/请求，Encode 为 2 CPU-ms/请求；优化后总成本为 36/9000=4 CPU-ms/请求，Encode 为 1 CPU-ms/请求。单位请求总 CPU 下降 20%，编码成本下降 50%。总 CPU 上升是吞吐也上升后的结果。还需控制请求分布与成功请求的统计口径，排除输入和错误率变化等替代解释，并检查延迟是否满足目标，才能作因果归因。"},{"question":"一个 15 秒请求包含约 20 ms 编码、14 秒网络等待和约 980 ms 排队。CPU profile 能否说明 15 秒都耗在哪里？设计最小证据链。","answer":"不能。CPU profile 主要能归因编码及其他实际执行，网络等待需要 trace 的 net 阻塞事件或请求级 span，排队需要 runnable 调度时延或应用队列时间。应先明确 980 ms 是调度队列还是业务队列，再在 trace task/region 中标注阶段，并用与采样窗口一致的请求计时验证总账。"}],"references":["tools-pprof","tools-http-pprof","tools-labels","tools-label-runtime","tools-pprof-cli"]},{"id":"06","title":"内存、分配与垃圾回收","subtitle":"把分配流量、存活堆和操作系统驻留内存分开解释","objectives":["正确选择 heap profile 的四种 sample type","解释字节抽样、GC 可见性延迟和差分 profile 的含义","区分逃逸、保留、分配抖动和 RSS 增长","用 GC 指标与分配栈检验内存优化的因果链"],"prerequisites":"第 02–05 章；理解可达性、垃圾回收周期和 Go 切片与 map 的基本语义。","sections":[{"title":"四种 sample type：存量与流量的坐标系","body":"Go 的 `heap` 与 `allocs` 使用同一组底层内存采样记录，区别主要是默认展示的 sample type：heap 默认看 `inuse_space`，allocs 默认看 `alloc_space`。四种视角分别沿“存量或累计分配”与“对象数或字节数”展开。[tools-pprof]\n\n| sample type | 问题 | 主要用途 |\n|---|---|---|\n| inuse_space | 采样可见状态下仍在使用多少字节 | 存活堆、长期保留、大对象 |\n| inuse_objects | 仍在使用多少堆分配块 | 存活分配块数量、小块保留 |\n| alloc_space | 进程运行以来累计分配多少字节 | 分配流量、GC 压力 |\n| alloc_objects | 累计分配多少堆分配块 | 小块频繁分配、分配次数估计 |\n\n这里的 objects 使用采样器的堆分配块口径，并不保证与语言层对象一一对应；tiny allocator 和采样外推的边界见下一节。\n\n“inuse”不等于操作系统 RSS，“alloc”不等于内存泄漏。一个反复分配临时缓冲区、用完后不再持有它们的服务，alloc_space 可以持续增长，而 GC 后的 inuse_space 保持稳定；一个缓存每次只增加一点数据的服务，分配速率不高却可能长期保留更多对象。先观察趋势，再确定要用 profile 回答的问题。\n\n```sh\ngo tool pprof -top -sample_index=inuse_space ./service heap.pprof\ngo tool pprof -top -sample_index=inuse_objects ./service heap.pprof\ngo tool pprof -top -sample_index=alloc_space ./service heap.pprof\ngo tool pprof -top -sample_index=alloc_objects ./service heap.pprof\n```\n\n若同一栈在对象数视图很大、字节数视图很小，可能是大量细碎对象；反过来则可能是少量大缓冲区。平均大小可以辅助判断，但采样校正、不同分配尺寸和聚合栈意味着它不是精确类型布局。profile 的栈说明对象在哪里分配，并不直接给出谁正在持有它。"},{"title":"字节采样与 GC 的可见性边界","body":"Go 1.25 默认 `runtime.MemProfileRate=512*1024`，目标是每分配这么多字节平均采到一次分配，并非每 512 KiB 给整个堆拍照，也不是均匀抽取对象。大对象更容易被抽中；在近似泊松字节抽样模型下，尺寸 s 的对象被选中概率约为 `1-exp(-s/R)`，工具利用采样率校正权重。这些数字是外推估计量：Go 1.25 按桶内平均分配尺寸计算逆概率权重，最后把对象数和字节数转换为 int64 写入 profile。它并不输出精确的原始事件清单，也不是浮点对象计数；界面上的缩放单位不能改变这一点。[tools-mprof]\n\n`MemProfileRate=1` 可记录采集器覆盖的每个堆分配块，适用于隔离实验；代价可能很高。它不包含栈上对象，tiny allocator 还会将多个小对象装入同一堆块，因此不等于逐一记录所有语言级对象。空间按分配槽大小记账，可包含内部碎片，而非精确等于请求的切片长度。官方要求若修改该值，应在程序生命周期尽早只改一次，因为分析工具假设整段记录使用恒定采样率。采完后随意改回默认值会令一份 profile 混合不同抽样机制。\n\nheap profile 的对外语义以最近完成的 GC 为基准，避免近期尚未回收的垃圾压倒存活对象。底层 `runtime.MemProfile` 文档还提醒结果可能最多滞后两个 GC 周期：分配记录与释放记录需要协调发布，尤其释放随清扫发生，不能把这一实现细节当成即时对象清单。二者并不矛盾：它们共同强调 heap profile 不是读取瞬间精确堆快照。[tools-pprof][tools-mprof]\n\n```sh\ncurl --fail -o heap.pprof   'http://127.0.0.1:6060/debug/pprof/heap?gc=1'\n```\n\n`gc=1` 先请求一次 GC，再取 profile，适合有意对齐 GC 状态的实验；它会扰动服务，不能无条件放进高频采集任务。`runtime.GC()` 也不承诺把全部闲置堆立刻返还给操作系统。没有发生 GC 时，heap profile 有报告已知分配的特殊规则，分析关闭 GC 的实验尤其要说明这一点。[tools-http-pprof]\n\n参数也不能机械组合：Go 1.25 的 heap handler 遇到 `seconds=N` 时先进入差分分支，不再执行后面的 `gc` 处理。因此，`heap?seconds=5&gc=1` 中的 `gc=1` 不会触发该 handler 的强制 GC 分支；这不排除采集期间因其他原因发生 GC。若研究要求 GC 对齐，应分别取明确的 `heap?gc=1` 快照，再按所选 sample type 比较。"},{"title":"差分分析与泄漏假设","body":"内存泄漏诊断应先问“在相同稳态工作下，经历 GC 后的存活集是否持续增长”。在固定工作批次前后，采集同一进程的两份 heap profile；确认期间未重启、采样率未改变，并比较相同 sample type、相同构建及相近 GC 状态。仅比较进程运行 1 分钟与 1 小时的 alloc_space，通常只证明程序一直在工作。\n\n```sh\ncurl --fail -o before.pprof   'http://127.0.0.1:6060/debug/pprof/heap?gc=1'\n# 在另一个终端执行固定批次的代表性请求。\ncurl --fail -o after.pprof   'http://127.0.0.1:6060/debug/pprof/heap?gc=1'\ngo tool pprof -top -sample_index=alloc_space   -base=before.pprof ./service after.pprof\ngo tool pprof -top -sample_index=inuse_space   -diff_base=before.pprof ./service after.pprof\n```\n\n第一种差分估计该批次新增的累计分配字节；若要计算分配速率，还须除以两次快照之间的时长。第二种差分关注存活字节的变化。存活差分可能为负，意味着相应分配栈的保留量减少，不能将它当作坏数据删掉。`-diff_base` 以基线样本总量作为百分比分母；累计 profile 使用 `-base` 时通常以总量之差为分母。解释时保留绝对字节变化，并阅读本地工具帮助。[tools-pprof-cli]\n\nHTTP 的 `heap?seconds=N` 也是快照差分，并不是另一种“持续采集实时存活堆”的机制。[tools-http-pprof]\n\n若字符串/切片引用使一个很小的子片段保留整个底层大数组，分配栈常指向原始大缓冲区，持有者却是下游缓存。此时需要检查对象所有权、容器增长、生命周期和取消路径。常见模式包括无界 map、未退出的 goroutine 捕获请求数据、未释放的计时资源及错误的缓存淘汰。pprof 提供候选分配点，不能自动展示完整保留引用图。\n\n证据强度依次为：监控发现趋势，profile 指出增长来源，代码找出保留路径，受控实验切断该路径，重复工作后存活集恢复有界。仅看到某个 map 分配较多，还不足以宣布泄漏。\n\n泄漏实验还要控制系统是否已到达稳态。缓存从空状态装入常用键、连接池逐步建立连接、程序首次使用某种类型触发初始化，都会造成合理的单调增长。可以先完成预热，再施加多个相同工作批次，在每批请求结束后，确认相关后台任务已完成或正确取消，再观察 GC 后的存活集。如果增长逐渐趋平，倾向于有界缓存；如果增长与请求总数或某类错误次数保持稳定斜率，则更值得追查生命周期遗漏。\n\n分配源和持有者的分离尤其重要。一个通用解码函数可能为所有请求分配对象，却只在某条异常分支被缓存永久引用。优化解码函数的对象大小只能减缓增长，修复异常分支的所有权才可能消除无界保留。"},{"title":"逃逸分析、对象复用与成本转移","body":"逃逸分析决定对象能否放在栈上，它是编译器证明结果，不是“用了指针就进堆”的语法规则。返回局部对象地址可能逃逸，也可能在内联后被消除；接口装箱、闭包捕获、容器保存及对象大小都可能影响分配。先使用 benchmark 的 `-benchmem` 判断每操作分配，再用编译器诊断定位原因。\n\n```sh\ngo test -run='^$' -bench='BenchmarkEncode$' -benchmem -count=5 .\ngo build -gcflags='-m=2' .\n```\n\n未写包匹配模式时，`-gcflags='-m=2'` 只作用于命令行直接列出的包；此处的 `.` 表示当前包。确有必要时再用 `all=-m=2` 扩展到依赖包。诊断中的“escapes to heap”解释潜在存放位置，profile 则反映真实运行路径和频率，两者缺一不可。热路径中减少一次分配，可能比冷路径完全零分配更有价值。\n\n预分配容量可以减少增长和拷贝，但过度预分配会增加峰值与保留内存。复用 `[]byte` 可能减少 alloc_space，却因为一个过大的容量长期留在池中而提高 inuse_space。`sync.Pool` 是临时对象复用机制，元素可随时被运行时移除，不是具有容量和持久性保证的缓存；对象再次交给请求之前，必须确保残留状态已正确清理或覆盖，避免把上一请求的数据带入下一请求。\n\n零拷贝也有权衡。复制一个小片段可能增加短期 alloc_space，却释放巨大的底层数组，降低长期 inuse_space。反过来，减少复制可能降低 CPU，却增加生命周期耦合。应把吞吐、延迟、分配字节、存活字节和代码复杂性一起列入决策。任何使用 unsafe 的“零分配”技巧还需要独立证明内存与并发安全，不能由性能收益替代正确性论证。"},{"title":"GC 指标、内存限制与 RSS 的解释","body":"GC 成本受到分配速度、存活对象规模、指针密度、根集合及可用 CPU 的共同影响。其他条件相近时，较高的分配速率会更快耗尽本周期的可分配空间，从而提高 GC 频率；累计 alloc_space 较大本身不能说明当前 GC 更频繁。可扫描的存活对象、指针及 goroutine 栈根增多，通常会增加标记工作；无指针的大缓冲区并不对应等比例的指针扫描量。CPU profile 中的 GC worker 与 mark assist、运行时 GC 指标、延迟分布需要一起观察，不能只看一次暂停时间。\n\n`GOGC` 控制以存活堆和根集合为基础的增长目标，属于吞吐与内存之间的交换。官方模型中，目标堆近似为“上次存活堆 + (上次存活堆 + 根集合) × GOGC/100”，实际目标还受最小堆、pacer 与内存限制等因素影响。增大 GOGC 往往用更多内存换取较低 GC 频率；减小则反向交换。`GOMEMLIMIT` 是 Go 运行时的软内存限制，不是容器 RSS 的绝对上限，也不能阻止 cgo 库或 mmap 使用额外内存。[tools-gc-guide]\n\n运行时可管理内存近似由 `runtime/metrics` 的 `/memory/classes/total:bytes` 减去 `/memory/classes/heap/released:bytes` 表征；RSS 还受非 Go 内存、共享映射、页驻留和内核统计口径影响。堆已回收的页可能仍由 Go 保留以供再次分配，因此 HeapAlloc 降低而 RSS 暂时不变并不自动表示泄漏。需要同时检查 heap in-use、heap free/released、goroutine 栈、cgo/mmap 和操作系统映射。[tools-metrics]\n\n诊断顺序可以是：先观察是否触及容器限制，再区分运行时管理内存与外部内存，然后判断是分配抖动还是存活增长，最后再调整 GOGC/内存限制。先调参数而不理解存活集，可能把正常分配变成持续 GC 抖动。\n\n估算峰值时不能只取上次 GC 后存活堆。服务还需要容纳正在构建的新对象、尚未完成的并发请求、缓存扩容时新旧存储并存、运行时元数据和外部库分配。假设每个并发请求额外需要 10 MiB 工作集，额外并发 20 个请求就可能再增加约 200 MiB；这类模型虽然粗糙，却能指导负载阶梯实验和并发上限设计。\n\nGC 优化报告应同时给出资源交换。减少对象数可能降低扫描和分配管理成本，压缩数据结构可能降低存活字节但增加解码 CPU；降低内存限制可能缓解容器风险，却放大回收频率。任何单一指标改善都需要放回容量约束和业务目标中评价。"},{"title":"可运行实验：临时分配与长期保留","body":"以下是完整的隔离实验，保存为 `memory.go`。为突出采样语义，它在 main 开始设置 `MemProfileRate=1`，因此只能作为教学实验，不能直接照搬到生产服务。`churn` 产生临时对象，`retained` 保存少量长期对象；具体字节总量仍以本机结果为准。\n\n```go\npackage main\n\nimport (\n\t\"os\"\n\t\"runtime\"\n\t\"runtime/pprof\"\n)\n\nvar retained [][]byte\nvar transient []byte\n\n//go:noinline\nfunc churn() {\n\tfor i := 0; i < 4000; i++ {\n\t\ttransient = make([]byte, 16*1024)\n\t\ttransient[0] = byte(i)\n\t}\n\ttransient = nil\n}\n\n//go:noinline\nfunc keep() {\n\tfor i := 0; i < 64; i++ {\n\t\tretained = append(retained, make([]byte, 64*1024))\n\t}\n}\n\nfunc main() {\n\truntime.MemProfileRate = 1\n\tchurn()\n\tkeep()\n\truntime.GC()\n\truntime.GC()\n\tf, err := os.Create(\"heap.pprof\")\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tif err := pprof.WriteHeapProfile(f); err != nil {\n\t\tf.Close()\n\t\tpanic(err)\n\t}\n\tif err := f.Close(); err != nil {\n\t\tpanic(err)\n\t}\n\truntime.KeepAlive(retained)\n}\n```\n\n```sh\ngo build -o memory-lab memory.go\n./memory-lab\ngo tool pprof -top -alloc_space ./memory-lab heap.pprof\ngo tool pprof -top -inuse_space ./memory-lab heap.pprof\n```\n\n两次 GC 用于让隔离实验中的记录更充分发布，不是生产端点必须执行两次 GC 的规则。预期临时分配在 alloc_space 中明显，而保留缓冲区在 inuse_space 中明显。把 `retained=nil` 放在 GC 前再运行，应检验其存活量是否下降；把采样率恢复为默认值则应在新进程中完成，再比较估计噪声和采集开销。"}],"labs":[{"title":"分配、保留与 GC 的三维对照","steps":["分别运行原始 memory.go、清空 retained 的版本、默认采样率的版本，每次使用独立进程，并在不同输出目录保存二进制和 heap.pprof。","为每个版本生成四种 sample type 的 top 表，解释同一分配栈在不同视角的差异。","在一个可重复的业务 benchmark 中记录 B/op 与 allocs/op，并选择一项复用或复制策略修改。","比较修改前后分配量、稳态存活量、吞吐和延迟，避免仅以 allocs/op 为唯一成功标准。","提交 GC 对齐方式与采样率，并明确哪些结果来自模型预期，哪些来自实际运行。"]}],"quiz":[{"question":"服务 alloc_space 随时间增长，但 GC 后 inuse_space 稳定，最合理的第一判断是什么？","options":["已经证明内存泄漏","累计分配量增加，尚未证明长期保留增长","操作系统必定 OOM","heap profile 不工作"],"answer":1,"explanation":"alloc_space 是累计分配量，正常工作的程序也会持续增长；泄漏假设需要稳态存活集与保留路径证据。"},{"question":"小切片导致大数组长期保留，heap profile 最直接显示什么？","options":["所有持有该切片的对象关系","原始数组的分配栈及估计存活量","准确的内核 RSS","每个对象的释放时间"],"answer":1,"explanation":"标准 heap profile 按分配栈归因，不提供完整引用保留图，持有者需要通过代码和生命周期分析定位。"},{"question":"为什么不应在一个进程里反复切换 MemProfileRate？","options":["Go 语法禁止赋值","工具假设内存 profile 使用恒定采样率","它会自动停用 GC","只有 CPU profile 支持该变量"],"answer":1,"explanation":"混合采样率会破坏校正假设；官方建议在进程早期至多调整一次。"},{"question":"GOMEMLIMIT 的正确理解是什么？","options":["容器 RSS 的严格上限","所有 cgo 与 mmap 分配总额的硬限制","Go 运行时管理内存的软限制","使所有分配改用栈"],"answer":2,"explanation":"运行时会通过 GC 与内存回收努力接近软限制，但不覆盖所有外部内存，也不是绝对 RSS 保证。"}],"exercises":[{"question":"假设两个 GC 对齐快照的 alloc_space 分别为 1.2 GiB 和 2.0 GiB，inuse_space 分别为 80 MiB 和 84 MiB；间隔处理 200000 个请求。估算每请求分配，并说明 4 MiB 增长是否证明泄漏。","answer":"区间分配约 0.8 GiB，即约 8.59×10^8 字节；除以 200000，得约 4295 字节/请求，也就是约 4.2 KiB/请求。存活增长 4 MiB 可能是缓存预热、并发差异或采样波动；需在稳态相同负载下多次 GC 对齐采样，检查持续斜率并验证保留路径。"},{"question":"某优化将每请求分配从 64 KiB 降到 8 KiB，但稳态堆从 200 MiB 升到 900 MiB，容器限制为 1 GiB。如何解释并重新设计？","answer":"可能用无界对象池或保留大容量缓冲区换取了较低分配流量。先比较 inuse_space 分配栈、池中容量分布和并发数，确认持有路径。可限制缓存容量、不把过大缓冲区放回对象池、分级复用并清除跨请求引用。成功标准应同时包括分配率、稳态和峰值内存、GC CPU、尾延迟及容器安全余量。"}],"references":["tools-pprof","tools-mprof","tools-http-pprof","tools-gc-guide","tools-metrics","tools-pprof-cli"]},{"id":"07","title":"并发、阻塞与锁竞争","subtitle":"从等待者、释放者和调度状态重建同步瓶颈","objectives":["区分 block 与 mutex 的归因位置、采样机制和时间单位","解释累计等待为何可以超过墙钟时间","识别 Go 1.22 前后 mutex profile 的语义变化","联合 goroutine 快照、trace 和受控实验验证并发瓶颈"],"prerequisites":"第 02–06 章；熟悉 channel、Mutex、WaitGroup、context 取消和 Go 内存模型基础。","sections":[{"title":"并发瓶颈的四种候选机制","body":"“goroutine 很多”“CPU 很低”“锁函数很热”都不是完整诊断。需要先区分四类问题：计算饱和、同步资源竞争、外部资源等待，以及工作已就绪却迟迟不能运行。它们可能具有相同的吞吐下降或尾延迟上升，但需要不同的证据。CPU profile 主要观察执行；block profile 观察特定 Go 同步操作阻塞；mutex profile 观察锁竞争的释放路径；trace 把状态变化放回时间轴。\n\n`goroutine` 诊断提供当前调用栈的快照，可发现大量相似的 channel receive、锁等待或网络读；其中 `debug=2` 文本还会显示 goroutine 状态。快照中的数量不等于频率，也不等于各状态累计时间。某一时刻看到 1000 个 worker 在 channel receive，可能只是空闲池正常等任务；重复快照显示相同请求 goroutine 长期等待、数量持续增长，才更支持生命周期或资源泄漏假设。\n\n```sh\ncurl --fail -o goroutines.txt   'http://127.0.0.1:6060/debug/pprof/goroutine?debug=2'\ncurl --fail -o goroutine.pprof   'http://127.0.0.1:6060/debug/pprof/goroutine'\ngo tool pprof -top ./service goroutine.pprof\n```\n\n二进制 profile 适合聚合，文本快照适合阅读状态和调用链。采集时刻、请求负载和取消策略必须一起记录。若故障属于数据竞态，应在独立正确性实验中使用 race detector；race 检查会改变执行开销与调度，不宜用其吞吐代表正常构建。"},{"title":"Block profile：等待发生在哪里","body":"Block profile 记录 goroutine 在特定同步原语上阻塞的时间，包括 Mutex/RWMutex、WaitGroup、Cond 以及 channel send/receive/select。栈归因到发生阻塞的位置，例如 `sync.Mutex.Lock`。它不等于所有 off-CPU 时间：网络 I/O、任意 syscall、睡眠和 runnable 排队不能统统期待从 block profile 中找到。[tools-pprof]\n\n```go\n// 集成片段：启动时从受控配置选择，默认不开启。\nruntime.SetBlockProfileRate(1_000_000)\n```\n\n这里的参数单位是纳秒，目标是平均每累计这么多阻塞时间采一个事件；它不是“每一百万次阻塞采一次”，也不是“每毫秒截取所有 goroutine”。Go 1.25 对持续时间短于 `rate` 阈值的事件按与时长成正比的概率抽样，对达到阈值的事件直接采集，再做逆概率权重校正；因此不同长度的事件并非相同概率。`rate=1` 记录所有符合条件的阻塞事件，`rate<=0` 关闭。全量记录适合小型隔离实验，不能假定开销恒定且可忽略。[tools-mprof]\n\n```sh\ncurl --fail --max-time 35 -o block.pprof   'http://127.0.0.1:6060/debug/pprof/block?seconds=30'\ngo tool pprof -top -sample_index=delay ./service block.pprof\ngo tool pprof -top -sample_index=contentions ./service block.pprof\n```\n\n标准记录在阻塞结束等记录点上更新。一个一直没有解除的等待可能尚未进入完整的阻塞统计；此时快照和 trace 比等待 profile 更重要。`delay` 是累计估计等待量，`contentions` 是按采样机制校正的事件量，二者的比值可作粗略平均等待，但不能恢复分布、p99 或最慢请求。\n\nHTTP `block?seconds=N` 是两个累计快照之差，不会把每个等待裁剪为与窗口的交集。某个等待在窗口开始前已持续 50 秒、窗口内又等 1 秒才完成，其本次新增记录可能包含约 51 秒等待。反之，到窗口结束仍未完成的等待可能尚未发布；因此短窗口的 delay/T 只能在边界效应可忽略时近似平均等待人数。"},{"title":"Mutex profile：谁结束了造成竞争的临界区","body":"Mutex profile 的栈通常落在释放锁的调用路径，例如 `sync.Mutex.Unlock`。它将竞争成本归到结束临界区的一侧，帮助定位持锁太久或过于集中的共享资源。其时间值是其他 goroutine 等待该锁的近似累计时间，不是 Unlock 指令的 CPU 耗时，也不是持锁者单次占用锁的准确时长。五个等待者同时等 1 秒，相关释放栈可以记录约 5 秒竞争。[tools-pprof]\n\n```go\n// 集成片段：平均抽取 1/10 的竞争事件。\nprevious := runtime.SetMutexProfileFraction(10)\n// 完成诊断窗口后恢复 previous。\n_ = previous\n```\n\n`rate=1` 采集所有符合条件的竞争事件，`rate=0` 关闭，`rate<0` 只读取当前设置。无竞争的锁获取并不是 mutex contention 事件。采样按事件抽取，并按比例扩大计数和等待权重，这与 block 的时长抽样不同。运行时内部锁也可出现；无法完整归因的事件可能显示为 `_LostContendedRuntimeLock`，不能仅凭该符号把责任归给某个业务 Mutex。[tools-mprof]\n\nGo 1.22 是重要分界：官方发行说明指出 mutex profile 开始按等待 goroutine 的数量缩放竞争量，并加入运行时内部锁竞争。例子中 100 个 goroutine 各等 10 ms，新语义记录约 1 秒，而此前可能只表现为 10 ms。因此跨 Go 1.21 与 1.22 的原始 profile 总 delay 不能直接当作性能退化证据。不同版本对内部锁栈的完整程度还会继续演进，应记录运行时版本并读其发布说明。[tools-go122]\n\n同一个 Mutex 在不同路径中解锁时，竞争量可能分散到多个栈；多个锁实例具有相同栈时也会聚合到一起。Mutex profile 并不天然提供每个锁地址的精细账本。需结合业务分片键、临界区实现和 trace 确认资源身份。"},{"title":"将等待量转化为队列与吞吐解释","body":"设观察窗口为 T，多个 goroutine 累计同步等待时间为 W，则 `W/T` 可近似解释为该窗口平均同时等待的 goroutine 数，前提是采样覆盖和窗口边界足够合理。它不是 CPU 利用率，也不是每请求延迟。假设 10 秒内产生 80 goroutine 秒等待，可解释为平均约 8 个等待者；即使有 16 核空闲，它也可能发生在一个不可并行的共享锁上。\n\n把临界区看成串行服务站，可用排队模型构造假设：若每请求平均持锁 s 秒，该锁串行服务能力上限大致为 `1/s`，到达率逼近上限时排队往往迅速增加。这个模型忽略批处理、公平性、锁交接、缓存与分布，不能直接预测 p99，但能解释为什么再加 goroutine 不一定提高吞吐。\n\n常见有效改变包括缩短临界区、把 I/O 或昂贵格式化移出锁内、按独立数据分片、降低重复获取频率、使用不可变快照，以及通过所有权把共享状态移交给单一执行者。把 Mutex 改成 channel 可能只是换一种排队位置；把有界队列改成无界队列可能提高短期接收速度，却把问题转化为内存与尾延迟。\n\n每个方案都应说明不变量。例如将读写锁改成快照，要证明读者观察的版本一致性；把批量更新移出锁内，要证明顺序与原子性仍满足业务要求。优化必须首先保持正确性。第 13 章将把这类证据链扩展到完整服务。\n\n平均等待并发的解释来自时间积分：每个等待者在时间轴上贡献一条等待区间，将这些区间与观测窗口交集的长度相加，相当于对窗口内的同时等待人数进行积分。除以窗口长度后得到平均人数。若一个等待跨越窗口边界，或统计在事件结束时才发布，短窗口会出现偏差；采样校正也会引入方差。因此应同时报告窗口和绝对等待量，避免把瞬时人数与长期平均混为一谈。\n\n锁的公平性与吞吐之间也存在取舍。高负载下可能发生频繁交接，缓存行在核之间迁移，或者一个请求多次抢不到锁。即便平均 delay 改善，少数任务仍可能饥饿；需要查看等待分布与任务完成性，而不只是总量。"},{"title":"联合证据与诊断陷阱","body":"Block 与 mutex 往往描述同一等待的不同视角，不能简单相加。前者可能显示 `cache.Get` 的 Lock 等待，后者显示 `cache.Refresh` 的 Unlock 路径；两者共同支持“刷新临界区阻塞读取”的假设。此时应检查刷新是否持锁执行序列化或远程调用，并在 trace 中观察读者何时被唤醒。\n\n仅在栈快照中看到大量 goroutine 处于等待，并不能认定程序死锁：服务空闲时，主 goroutine 或网络轮询器可能正在正常等待。若运行时实际输出 `fatal error: all goroutines are asleep - deadlock!`，则已触发全局死锁检测并终止进程，不能再用“服务正常空闲”解释这条错误。反过来，未触发该检测也不保证没有死锁；涉及 cgo、外部系统或局部子系统的逻辑死锁可能不在其覆盖范围内。若只是某类请求永久等待，需检查 channel 关闭、WaitGroup 计数、取消传播和生产者是否仍可能运行。\n\n另一种误判是将 runnable 队列等待归因到 Mutex。goroutine 已具备继续执行的条件，却因 P 不足、CPU 配额节流或其他 goroutine 长时间运行而尚未得到调度时，主要证据是 trace 的 ready-to-running 间隔、`/sched/latencies:seconds` 与操作系统调度信息。它们对应的层次不同，互相印证比互相替代更可靠。[tools-metrics]\n\n采集开销会改变高争用系统的调度。先用低成本指标定位异常窗口，再短时开启高精度 profile；对比开启和关闭时吞吐、p99 与 CPU。若采集本身让争用恶化，必须下调采样率或缩小实验范围。完成记录后恢复设置，并保存采样参数以便解释权重。\n\n对于工作池，还应分开测量提交、排队、执行和交付结果四个阶段。队列满时生产者被阻塞，有时是正常背压；无限排队则让生产者看似迅速完成，但端到端延迟和内存继续增长。是否应阻塞、拒绝、限流或取消，应由服务契约决定，不能仅以消除 block profile 热点为目标。\n\n检查取消路径时，为每个可能长期阻塞的操作说明谁负责终止它。发送结果时调用方已经超时退出，发送者若无人接收且没有取消分支，就可能永久挂起；这种 goroutine 还可能持有请求缓冲区，形成第 06 章的内存保留问题。同步剖析与内存剖析之间因此存在具体的因果联系。\n\n用压力实验发现瓶颈后，还要用较低负载验证修复没有引入空转。把阻塞等待改成反复轮询可以让 block 数值下降，却消耗更多 CPU。正确优化应减少等待原因或控制需求，而不是让等待从一种图表中消失。\n\n排查报告应保留锁保护的数据不变量，以及恢复采样配置的实际时间。"},{"title":"可运行实验：把同一竞争看成等待与释放","body":"下面是完整程序，保存为 `locks.go`。故意在锁内睡眠，仅用于制造容易观察的同步竞争。四个 worker 共享 Mutex；WaitGroup 自身也可能在 block profile 中出现，这反映主 goroutine 等待工作完成的真实同步事件；启动用的 `start` channel 等待也可能被记录。分析时应区分这些协调开销与共享 Mutex 的竞争。\n\n```go\npackage main\n\nimport (\n\t\"os\"\n\t\"runtime\"\n\t\"runtime/pprof\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc writeProfile(name string) {\n\tf, err := os.Create(name + \".pprof\")\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tif err := pprof.Lookup(name).WriteTo(f, 0); err != nil {\n\t\tf.Close()\n\t\tpanic(err)\n\t}\n\tif err := f.Close(); err != nil {\n\t\tpanic(err)\n\t}\n}\n\nfunc main() {\n\truntime.SetBlockProfileRate(1)\n\truntime.SetMutexProfileFraction(1)\n\tvar mu sync.Mutex\n\tvar wg sync.WaitGroup\n\tstart := make(chan struct{})\n\tfor n := 0; n < 4; n++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\t<-start\n\t\t\tfor i := 0; i < 100; i++ {\n\t\t\t\tmu.Lock()\n\t\t\t\ttime.Sleep(500 * time.Microsecond)\n\t\t\t\tmu.Unlock()\n\t\t\t}\n\t\t}()\n\t}\n\tclose(start)\n\twg.Wait()\n\truntime.SetBlockProfileRate(0)\n\truntime.SetMutexProfileFraction(0)\n\twriteProfile(\"block\")\n\twriteProfile(\"mutex\")\n}\n```\n\n```sh\ngo build -o locks-lab locks.go\n./locks-lab\ngo tool pprof -top ./locks-lab block.pprof\ngo tool pprof -top ./locks-lab mutex.pprof\n```\n\n先核对调用栈归因，再把 Sleep 移到 Unlock 后面。比较总完成时间和两个 profile 的变化，并说明语义是否仍可代表原工作：本实验没有受保护的真实状态，所以移动是安全的；真实程序不能机械地把业务操作移出锁。实际 sleep 时长与调度粒度相关，不预设输出恰好是 200 ms。"}],"labs":[{"title":"同步竞争的四种证据","steps":["运行 7.6 实验，保存 Go 版本和原始 block/mutex profile，并使用外部计时工具记录墙钟完成时间；程序本身未打印耗时。各组产物放在独立目录，避免覆盖。","分别将 worker 数改为 1、4、16；原程序每个 worker 执行 100 次，因此总操作数分别为 100、400、1600。按总完成操作数除以墙钟时间计算吞吐，再比较每操作等待量；若研究固定总工作量，应把同一总迭代数分配给不同数量的 worker。","将 Sleep 移出临界区，用相同参数重新采集，解释 Mutex 与 WaitGroup 在 block 中的不同角色。","为原实验增加一个短 trace，比较等待、唤醒与重新运行的间隔；不要把 block 与 mutex delay 相加。","写出一个保留正确性的真实锁优化方案，列出不变量、反例与复测指标。"]}],"quiz":[{"question":"mutex profile 在 Unlock 栈显示 6 秒 delay，说明什么？","options":["Unlock 指令消耗 6 CPU 秒","该释放路径被归因了约 6 goroutine 秒竞争等待","单次持锁必定持续 6 秒","CPU profile 一定丢失了 6 秒"],"answer":1,"explanation":"mutex delay 是竞争等待的近似累计归因，可聚合多个等待者与多个事件，既不是指令时间也不是单次持锁时间。"},{"question":"SetBlockProfileRate(1000000) 的参数主要控制什么？","options":["每百万次阻塞采一次","每秒最多一个样本","按阻塞时间抽样，目标每累计 1 ms 阻塞时间平均一个事件","每 1 ms 全部 goroutine 的快照"],"answer":2,"explanation":"单位为纳秒，抽样与事件持续时间相关，并非等概率按事件序号取样。"},{"question":"为什么 Go 1.21 与 1.22 的 mutex 总 delay 不宜直接比较？","options":["文件扩展名不同","1.22 改为考虑等待 goroutine 数，并纳入内部锁竞争","1.22 完全取消采样","1.21 只运行单线程"],"answer":1,"explanation":"计量与覆盖语义变化会改变总量，即使应用逻辑完全相同也可能出现明显差别。"},{"question":"长期卡住但尚未解除的 channel 等待，首选补充什么证据？","options":["只增加 alloc_space 采样","goroutine 栈快照与执行 trace","把 block 的现有计数视为所有等待","仅查看函数汇编"],"answer":1,"explanation":"尚未完成的等待可能还未发布完整阻塞事件；快照提供当前位置，trace 提供状态变化与唤醒关系。"}],"exercises":[{"question":"假设同一进程在 20 秒窗口前后的快照差分显示，某锁栈的 delay 增加了 100 goroutine 秒；窗口内完成 10000 次请求。估算平均等待并发与每请求归因等待，并说明限制。","answer":"若采样覆盖充分、跨窗口记账偏差可忽略，平均等待并发约为 100/20=5 个 goroutine；按请求归一化的归因等待量为 100/10000=10 goroutine-ms/请求。后者不是请求 p99，也不一定是每个请求真正等待 10 ms；可能少数请求等待很多、一个请求创建多个等待者，或栈同时服务后台任务。尤其要检查是否包含窗口前已经开始的等待，以及窗口结束时尚未记账的等待；若这些影响显著，不能把 delay/T 直接解释为窗口内平均等待人数。"},{"question":"CPU 仅使用 1 核、机器有 16 核、mutex delay 很高。增加 worker 后吞吐不变而延迟变差，给出模型与验证方案。","answer":"先核对 GOMAXPROCS、亲和性与 CPU 配额，避免把机器的 16 个核都当作进程可用容量。一个共享锁可能将关键工作串行化，其理想服务率上限近似为 1/每请求平均持锁时间；增加 worker 只扩大队列。验证释放栈中的临界区，观察 trace 中被阻塞的等待者和唤醒节奏，并在保持不变量的前提下缩短或分片临界区。若争用下降且相同到达率的尾延迟改善，才支持该解释。"}],"references":["tools-pprof","tools-mprof","tools-go122","tools-metrics"]},{"id":"08","title":"执行追踪与时序分析","subtitle":"还原 goroutine 状态转换、关键路径和罕见事件之前的现场","objectives":["用状态转换区分同步等待、网络等待和调度延迟","采集与分析 Go 1.22+ trace，并理解代际分段设计","用 task 关联跨 goroutine 工作，并在各 goroutine 内正确使用 region 与 log","在 Go 1.25 使用 FlightRecorder，并解释时间与容量的非硬保证"],"prerequisites":"第 02、05、07 章；理解 goroutine、线程、P、GC 与同步机制。","sections":[{"title":"从聚合调用栈进入状态时间轴","body":"Profile 将相似栈汇总，trace 保留事件的相对顺序及状态转换。两段请求可以具有相近 CPU profile，却因一个先排队再计算、另一个立刻计算而产生不同延迟。运行时 trace 记录 goroutine 创建、运行、阻塞、解除阻塞、系统调用、GC 和用户标注等事件，让分析者定位“资源什么时候可用，工作什么时候真正继续”。它不是每条机器指令的记录，也不包含所有业务语义。[tools-trace-doc]\n\n分析一条 goroutine 生命周期时，先区分 running、runnable、waiting 等状态。等待 channel 时它还不能执行；被发送者唤醒之后变成 runnable，直到某个 P 调度它才重新 running。这段 ready-to-running 时间属于调度延迟。若将二者合并成“锁慢”，会把 CPU 供给不足错误归因到同步实现。\n\n运行时中的“正在运行”也不完全等于操作系统一直让该线程占用 CPU。线程可能受到内核调度或容器配额影响；Go trace 与 OS 调度信息的结合见第 10 章。跨进程服务延迟需要分布式 tracing 提供 RPC 边界，不能指望一份进程内 trace 自动还原全部网络链路。\n\n阅读顺序应先从总体 CPU/GC/线程视图识别异常时段，再选择相关 task 或 goroutine，最后查看阻塞栈与唤醒关系。直接放大整份 trace 寻找“红色区域”容易失去分母，也容易把正常等待误认成故障。"},{"title":"采集和 Go 1.22 重写的意义","body":"最简单的采集方式是使用测试命令或诊断端点。采集器必须在问题发生前开启；故障结束后才启动 trace，通常会缺少关键因果事件。下面的测试命令假定当前包确有 TestPipeline；若使用其他测试，应替换正则并确认目标测试实际执行。两个查看器分别打开不同文件，前一个会持续占用 8082 端口；切换前应退出前一个进程，或为后一个选择其他端口。\n\n```sh\ngo test -run='TestPipeline$' -trace=trace.out .\ngo tool trace -http=127.0.0.1:8082 trace.out\ncurl --fail --max-time 10 -o service.trace   'http://127.0.0.1:6060/debug/pprof/trace?seconds=5'\ngo tool trace -http=127.0.0.1:8082 service.trace\n```\n\nGo 1.21 的栈回溯优化显著降低了常态采集 CPU 开销；Go 1.22 继续重写执行追踪器，常称为 trace v2。其关键改变包括定期分成可处理的代际片段、改进启动停止延迟、补全系统调用持续时间，并记录 goroutine 所在线程。多数平台采用操作系统时钟，便于与更底层的同主机信息关联；这并不把所有时间戳直接变成可跨主机比较的 UTC。[tools-go122][tools-trace2024]\n\n分段意味着工具不必把整个历史看成一个不可拆分、无限增长的结构，也为保留最近窗口和流式处理奠定基础。需要区分“格式支持分段处理”与“特定版本查看器已经做到恒定内存”：2024 年官方文章明确当时 `go tool trace` 仍加载完整 trace。教材不将该历史实现状态推广到所有后续版本，也不承诺任意大小文件均可无代价打开。\n\n尽量使用与生成版本相同或明确兼容的工具链打开 trace，保留采集端 Go 版本。正常 `trace.Start` 同时只能有一个消费者；HTTP trace 与程序内普通 trace 可能发生冲突。读取开始采集的错误，保证 `trace.Stop` 在文件关闭之前完成。[tools-trace-doc]"},{"title":"Task、region、log 的语义与生命周期","body":"Task 描述一个用户定义的逻辑操作，可跨越多个 goroutine；`trace.NewTask` 返回携带任务信息的新 context 与 Task，`Task.End` 标记逻辑完成。Region 描述同一 goroutine 内的一段活动，开始和结束必须保持正确的 goroutine 与嵌套关系。Log 是带类别的瞬时事件。它们补足“当前业务正在做什么”，而不是替代运行时自动记录的调度事件。[tools-trace-annotation]\n\n以下为集成片段，`encode` 与 `send` 表示业务函数：\n\n```go\nctx, task := trace.NewTask(ctx, \"request\")\ndefer task.End()\ntrace.WithRegion(ctx, \"encode\", func() { encode() })\ntrace.Log(ctx, \"cache\", \"miss\")\ndone := make(chan struct{})\ngo func() {\n    defer close(done)\n    trace.WithRegion(ctx, \"send\", func() { send() })\n}()\n<-done\n```\n\n这里 task 等待子 goroutine 完成才结束；若在创建子 goroutine 后立即返回，task 的生命周期就可能错误地短于实际工作。一个 Region 不能在父 goroutine Start 后交给子 goroutine End；应由子 goroutine 自己创建 region，并通过 context 关联同一 task。\n\ntask type、region type 和日志类别应是有限集合；具体请求参数不应放进类型字符串。日志消息也应控制长度并去掉敏感数据。`trace.Logf` 在未启用 trace 时会避免其内部格式化，但 Go 会先求值调用实参，因此昂贵的 `buildSummary()` 仍可能执行；必要时在外层使用 `trace.IsEnabled()`。注解本身也有开销，特别是每个极小循环迭代创建任务，可能改变分配与时序。"},{"title":"关键路径、时序证据与导出 profile","body":"请求延迟由依赖图中的关键路径决定，不是所有 goroutine 工作时间之和。一个父请求并行执行两个 100 ms 子任务，如果两者完全重叠，完成延迟接近 100 ms 加协调成本，而累计工作可以接近 200 ms。trace 的价值在于查看重叠、依赖和何时唤醒；只按函数累计耗时排序会漏掉这些结构。\n\n实用分析步骤是：选中异常 task；检查持续时间较长的 region，并结合依赖确认它是否处于关键路径；区分它内部的 running、同步/网络等待和 runnable 排队；追到解除阻塞的 goroutine；检查唤醒之前发生了什么；最后把假设映射回业务依赖。例如消费者早已等待，生产者却在持锁写日志，就应优先验证生产者关键路径，而非优化消费者等待函数。\n\n```sh\ngo tool trace -pprof=sched service.trace > sched.pprof\ngo tool trace -pprof=sync service.trace > sync.pprof\ngo tool trace -pprof=net service.trace > net.pprof\ngo tool trace -pprof=syscall service.trace > syscall.pprof\ngo tool pprof -top sched.pprof\n```\n\n这些文件从 trace 事件推导出按调用栈聚合的事件计数与累计延迟，与运行时直接采集的 CPU/block/mutex profile 不是同一数据来源。它们不保留每个事件的完整延迟分布，不能仅凭导出结果恢复事件延迟的 p99。`sched` 关注调度延迟，`sync` 关注同步阻塞，`net` 关注网络阻塞，`syscall` 关注系统调用阻塞。导出后时间顺序被聚合掉，宜用于定位候选栈，再回到时间轴验证。[tools-trace-cmd]\n\n观察相关性还不是因果证明。GC 恰好与慢请求重叠，不等于 GC 导致全部延迟；检查请求是否确实暂停、是否有 assist、是否同时存在队列或下游慢调用。受控改变一个机制并重现时序变化，才形成更强的因果证据。\n\n任务分析还需区分业务完成与资源清理。请求返回客户端之后，后台写日志、清理缓冲区或异步复制可能继续执行；如果这些工作是必要承诺的一部分，应该使用独立任务或正确延长逻辑生命周期。反过来，把永久后台循环放入某个请求任务会使任务迟迟不结束，失去可比较的延迟分布。\n\n对于扇出请求，可以画一个很小的依赖图：入口、各子任务、汇合和响应。先标注真实依赖，再把时间区间映射进去。若本可并行的子任务直到前一子任务完成后才启动，或汇合后仍存在不必要的串行处理，就有潜在的优化空间。已经完成的子任务稍后才被读取结果，本身未必增加总延迟；如果汇合必须等待最慢依赖，则应优先处理那条路径。"},{"title":"Go 1.25 FlightRecorder：保留异常前的窗口","body":"Go 1.25 将 FlightRecorder 纳入标准库 `runtime/trace`；2024 年的 `golang.org/x/exp/trace` 实验接口属于历史阶段，不能与标准库 API 混写。FlightRecorder 持续维护最近执行轨迹，在慢请求、超时或错误率异常触发后，将此前窗口写出，解决“发现问题时已经来不及 Start”的难题。[tools-go125][tools-flight-blog]\n\n```go\n// Go 1.25+ 集成片段：生命周期由单一管理者控制。\nfr := trace.NewFlightRecorder(trace.FlightRecorderConfig{\n    MinAge: 10 * time.Second,\n    MaxBytes: 32 << 20,\n})\nif err := fr.Start(); err != nil { return err }\ndefer fr.Stop()\n// 触发后由单一写入者创建文件并调用 fr.WriteTo(file)。\n```\n\n必须精确理解边界：`MinAge` 表示希望窗口覆盖到至少这么久以前的事件，但容量配置优先；`MaxBytes` 是窗口大小的提示，并不保证运行时内存绝不超出该值，也不保证 `WriteTo` 输出字节数受同样硬限制。事件速率过高时，不能同时承诺固定 10 秒历史和固定 32 MiB 占用。需要根据本机事件速率、异常窗口与内存预算实测规划。[tools-flight-source]\n\nGo 1.25 允许一个活动 FlightRecorder 与一个使用 `trace.Start` 的普通消费者同时存在；不能同时启用多个 FlightRecorder。`WriteTo` 只能由一个 goroutine 同时执行，并发调用会返回错误。`WriteTo` 期望快照覆盖到调用时刻的最新数据，但源码明确说明这不是硬保证。触发器应做去重、冷却、文件限额和错误处理。生命周期操作由明确的管理者串行控制，不要让多个 HTTP 请求随意 Start/Stop。\n\nFlight recording 把持续写盘变成按需导出，并未让持续采集免费。它仍维护事件缓冲区，触发快照还涉及刷新与 I/O。不要把网上某个负载的“低开销”数字作为生产保证；首先分别测量仅 recorder、触发导出以及普通 trace 三种情形的吞吐、p99、CPU 和内存。"},{"title":"完整实验：带 task 的跨 goroutine 请求与飞行记录","body":"下面是完整的 Go 1.25+ 程序，保存为 `flight.go`。它只使用 FlightRecorder，顺序执行 20 个带任务标记的请求后导出快照；每个请求内部由父、子 goroutine 配合完成。短 sleep 用来制造可见等待，数字是实验输入而非性能测量结论。\n\n```go\npackage main\n\nimport (\n\t\"context\"\n\t\"os\"\n\t\"runtime/trace\"\n\t\"time\"\n)\n\nfunc request() {\n\tctx, task := trace.NewTask(context.Background(), \"request\")\n\tdefer task.End()\n\tdone := make(chan struct{})\n\tgo func() {\n\t\tdefer close(done)\n\t\ttrace.WithRegion(ctx, \"backend\", func() {\n\t\t\ttime.Sleep(40 * time.Millisecond)\n\t\t\ttrace.Log(ctx, \"backend\", \"completed\")\n\t\t})\n\t}()\n\ttrace.WithRegion(ctx, \"wait-result\", func() { <-done })\n}\n\nfunc main() {\n\tfr := trace.NewFlightRecorder(trace.FlightRecorderConfig{\n\t\tMinAge:   2 * time.Second,\n\t\tMaxBytes: 8 << 20,\n\t})\n\tif err := fr.Start(); err != nil {\n\t\tpanic(err)\n\t}\n\tdefer fr.Stop()\n\tfor i := 0; i < 20; i++ {\n\t\trequest()\n\t}\n\tf, err := os.Create(\"flight.trace\")\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tif _, err := fr.WriteTo(f); err != nil {\n\t\tf.Close()\n\t\tpanic(err)\n\t}\n\tif err := f.Close(); err != nil {\n\t\tpanic(err)\n\t}\n}\n```\n\n```sh\ngo version\ngo build -o flight-lab flight.go\n./flight-lab\ngo tool trace -http=127.0.0.1:8082 flight.trace\n```\n\n查看请求任务的延迟分布，选择一个实例，检查 backend 的 sleep 与 wait-result 的 channel 等待如何重叠。两个 region 持续时间都接近同一等待窗口，不表示请求延迟等于二者相加。再在后台加入实际 CPU 工作，观察运行和等待状态如何变化。"},{"title":"如何评估 trace 的有效性与扰动","body":"一次可靠的 trace 实验应回答三个问题：是否覆盖目标事件、是否保留足够的前因后果、是否显著改变被观察系统。先用日志或请求指标确认问题确实落在采集窗口，再检查 task/region 是否跨越窗口边界、子任务是否缺失、数据是否能完整解析。只看到异常的最后一步，不足以还原根因。\n\n采集代价包含事件生成、栈记录、缓冲与写出，随 goroutine 切换频率、标注数量和事件密度变化。官方 2024 年文章报告了 Go 1.21–1.22 两次版本演进带来的开销改进及其特定测试背景；教材将其作为设计进步证据，不把报道比例视作任意服务的上界。[tools-trace2024]\n\n设计 A/B 实验时用相同负载分布交替执行“关闭、开启、关闭”，并比较吞吐、p99、CPU、内存与错误率。如果 trace 使系统从接近饱和推到饱和，尾延迟影响可能远大于平均 CPU 开销。可缩短窗口、降低业务注解密度、抽样选实例或采用异常触发保留。\n\n最终报告应同时交付原始 trace、工具链版本、可复现命令、关键事件时间区间及机制解释；截图只用于导航，不能替代原始证据。对于 flight recorder，还应注明配置与实际覆盖时长，特别是容量优先导致的历史缩短。\n\n当事件量很大时，可以先根据业务日志选定异常时间附近的任务，而不是遍历所有事件。筛选条件应该与待验证假设对应，例如指定请求类型、延迟阈值和实例；不要只挑最符合预期的一张图。保留正常样本作为对照，才能判断某种调度或 GC 形态是否真是异常特征。"}],"labs":[{"title":"从任务延迟回溯运行时因果链","steps":["使用 Go 1.25+ 运行 flight.go，确认 flight.trace 可解析并能找到 request 类型任务。","选择一个 task，记录 backend、wait-result 与 task 的起止，解释重叠为何不能相加。","导出 sched、sync、net profile，说明哪些有内容、哪些可能为空以及原因。","将 sleep 替换为计算工作，并分别在 GOMAXPROCS=1 与多个 P 下观察 running/runnable 状态。","把 recorder 的 MaxBytes 调小，比较实际覆盖时长和文件大小；验证它不是历史时长与内存双重硬保证。"]}],"quiz":[{"question":"goroutine 已被唤醒但尚未运行的时间，主要属于
