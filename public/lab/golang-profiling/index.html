验结果。[front-otel2024] [front-otel-spec]\n\n模型包含资源属性，以及采集库名称、版本等作用域信息（InstrumentationScope）、去重字典、样本与 trace/span 的关联，以及保留原始载荷的机制。它们各解决一个具体问题：资源属性用于区分服务及其实例；字典减少重复符号；关联帮助把 CPU 权重与请求时间线连接；原始载荷用于保留尚未映射的格式细节。可扩展字段并不自动保证分析端理解它们。\n\n第 15 章的 count 与 period 示例就是互操作测试的最小反例。一个来源上报 count=1、period=10 ms，另一个来源直接上报 cpu=10 ms；转换器可以让二者统一为时间，但必须显式改变数值和单位。若只把字段名映射到 value，数据传输成功而估计量错误。累计分配量与区间增量的时间语义（temporality）、标签缺失与空标签、内联行序列和部分栈标记，也都需要明确的转换规则。\n\n### 关联 ID 不提供因果证明\n假设后台 goroutine 继承请求标签，却在响应结束后继续执行，profile 与 span 关联可能仍然成立，但这段 CPU 是否计入“请求延迟”要由服务语义定义。多个请求共享批处理任务时，若把全部 CPU 重复记到每个 span，总量就不守恒；若只记到其中一个 span，总量虽守恒，分摊仍可能失真。关联 ID 帮助定位，如何分摊资源成本还需要单独定义。\n\n可用守恒检查发现转换错误：同一合成输入经过 pprof→通用格式→后端查询后，换算到相同单位后，合法样本的总权重应保持；按互斥且覆盖全部样本的标签组拆分后，求和应等于未拆分总量；当后端只支持部分帧或标签时，应显式标注信息丢失。非法单位与未知版本应按明确规则拒绝或保留。合法负差分必须保留符号；后端不支持时应明确报错，不能悄悄改为零。\n\n### eBPF 与开放格式各自负责哪一层\neBPF profiler 可减少语言 SDK 接入，却仍面对 Go 栈变化、cgo、内联符号和标签布局；开放格式可携带完整性信息，却无法修复采集时没有观察到的栈。把它们结合的研究价值在于让采集质量成为跨后端可比较的数据，而不是统一输出一张图就宣布可观测性统一。\n\n一个有意义的原型是“语义保真转换测试集”：覆盖不同采样率、累计重置、乱序、ASLR、Build ID 变更、标签基数、深栈与部分符号。先确定每个转换应保持的量，再测转换吞吐和体积。按格式能解析多少样本只是最低层的成功标准；真正的终点是相同查询是否回答同一个问题。该测试集仍是研究计划，尚无跨后端验证结果。"},{"title":"从论文到研究项目：统一评估目标、对照与失败条件","body":"### 三篇论文共享的技术命题\nScalene 改变要记录的内存事件，减少与目标无关的记录；硬件论文缩短每次观测路径，并校准边界；ePPing 把配对放在更接近数据的位置，再对输出限速或聚合。它们表明，除了降低采样率，还可以通过选择记录对象、缩短观测路径和聚合输出减少开销。每次改变机制，都必须重新确认估计对象有没有变化。\n\n对 Go 工具，需要分别评价四个维度。它们可能相互影响，不能相互替代。准确性衡量数值或归因接近什么参考；覆盖率衡量哪些事件、栈、请求和时间段被观察；开销衡量 CPU、内存、吞吐与尾延迟；行动收益衡量据此实施的优化是否改善真实服务。这四个轴不能压成一个“准确率”，也不能靠某一平台内部统计完全自证。\n\n### 三项可以形成硕士研究课题的设计\n第一项是保留估计量的自适应采样。根据负载和异常程度调整 Go CPU、heap 与 trace 预算，但保留每个来源实际采样概率或周期。以固定预算均匀采样为基线，测试稳定热点、短突发和低频高成本路径；评价热点排序、总量误差和尾事件召回。若只提高告警期频率而不重加权，平均成本会偏向异常期。\n\n第二项是运行时感知的跨层归因。将 Go 调度状态、profile 栈与 eBPF 网络 RTT 对齐，区分 CPU 饱和、锁等待、GC 与网络延迟。先用可控注入建立原因标签，再在混合原因中评估。基线不能只是随机分类器，应包含现有工具组合及熟练人工流程；报告未知类别与误判，而不仅是挑几张成功图。\n\n第三项是观测驱动优化的闭环稳定性。对 PGO 或动态批处理，比较不同 profile 新鲜度、采样策略与训练负载的优化效果。把观测开销和策略收益分开测量，保留未见负载作为外部验证。若优化对训练负载有效却损害另一接口尾延迟，应算作边界发现，而不是删除失败样本。\n\n### 如何设置真值、消融与复现材料\n对合成计算，可用已知调用次数、受控持续时间和总分配字节作局部参考；对真实服务，不存在一个无干扰的完美 profiler，应使用多个独立证据及误差范围。硬件 `t×f`、RSS、trace 时间戳和应用计数都有前提，引用参考值时要同时说明它能证明什么。\n\n消融实验一次去掉一项机制。例如阈值采样去掉净变化而按活动触发；ePPing 去掉内核聚合而逐样本输出；将自适应采样决策替换为固定频率，并使总体观测预算尽量相近。只有这样才能分清收益来自算法、实现语言、批量程度还是默认配置。不同工具功能不等价时，至少提供共同功能子集比较，并单独展示额外信息的成本。\n\n统计报告保留每次重复结果、运行顺序和异常退出，区分中位数、均值、置信区间与最差负载。不要把 ePPing 的百分点改成相对百分数，也不要把 Scalene 的样本减少倍数写成加速倍数。硬件研究的粗粒度自身基线与无工具基线必须分表表达，才能让读者重算。\n\n### 完成研究的最低交付条件\n交付应包括固定工具与源码版本、公开或可生成的输入、实验脚本、采样单位与窗口约定、原始测量、图表生成方式、失败案例和环境约束。若数据涉及真实请求，只保留必要且脱敏的标识，并说明哪些脱敏影响可复现性。图表应能追溯到数字，而不是仅保留截图。\n\n本章提供的是原始论文审读和研究设计，没有重新运行三篇论文的实验，没有完成 PGO 新算法、eBPF 部署或互操作基准。作者结果与本书手算、推论保持分离，才能让读者继续验证、反驳和扩展。研究生教材的终点应是能提出有证据支撑、也可能被实验推翻的问题，而不只是记住更多工具名称。"}],"labs":[{"title":"实验 16：复核一个论文结论，再设计 Go 对照实验","steps":["在三篇论文中选一篇，打开原始全文，逐项记录估计目标、采样机制、软件硬件、基线、重复次数、图表编号与单位。至少选一张支持结论和一张暴露局限的图表。","从原表重算一个数值：Scalene pprint 的 7976/23；ePPing CPU 从 47% 到 57% 的百分点与相对增幅；或硬件图 3 的 452/330 与 429/330。不要将手算写成实验复现。","构造三个最小反例：净变化为零但累计分配很大、计数窗口晚启动、相同 TSval 的首次观测时间被后包覆盖。分别说明目标不匹配、时间边界错误或状态更新错误如何影响结论。","为 Go 迁移制定一个可证伪假设，确定现有工具基线、工作负载、控制变量、消融、误差与开销上限。加入至少一个预期失败的条件。","若仅完成设计，交付协议和预期判定，不填写虚构结果。若执行实验，固定运行时及内核，保存每次原始数据，并把本人测量、论文结果和理论推导分开成表。","最后写一页有效性审查：内部混杂、测量真值的前提、外部可迁移性、符号与标签覆盖、尚未完成的验证。论证应能由另一位读者依图表和数据重算。"]}],"quiz":[{"question":"Scalene 表 2 中两种方法的样本数之比，中位数为 18；表 3 完整模式的相对运行时间中位数为 1.32×。应如何解释？","options":["程序加速了 18 倍","净变化采样减少记录；完整模式相对运行时间的中位数表明约 32% 的额外开销","所有内存活动都被无损压缩 18 倍","任意 Go 服务开销至多 32%"],"answer":1,"explanation":"样本数量与运行时间是不同指标，净变化还改变了目标事件；该结果仅属于论文特定实验。"},{"question":"硬件论文按批 fork/exec perf 的读数偏小，最合适的结论是什么？","options":["所有 perf 功能无效","PMU 永远不会产生测量误差","该测量方式存在窗口错位和自扰动，应校准具体使用路径","只要增加重复次数就消除系统性偏差"],"answer":2,"explanation":"论文研究特定细粒度使用方式。重复可以减小随机波动，不能修复固定的启动延迟或错误边界。"},{"question":"ePPing 图 5 的 CPU 从 47% 到 57%，应报告什么？","options":["增加 10 个百分点；相对增幅约 21.3%","增加 10% 相对开销","增加 57 个百分点","吞吐没下降所以开销为零"],"answer":0,"explanation":"百分点差是 57−47=10；相对增幅为 10/47。端主机可能是吞吐瓶颈，不能由吞吐不变否认 CPU 成本。"},{"question":"采样器支持开放 Profile 格式，是否足以证明 Go 1.25 标签归因正确？","options":["足够，格式会自动修复运行时布局","不足，采集布局、转换语义与查询合同需要分别验证","足够，只要 HTTP 成功","不足，所以开放格式没有价值"],"answer":1,"explanation":"互操作携带信息，无法补回采集端未正确读取的信息。须独立核查运行时版本和语义守恒。"}],"exercises":[{"question":"在采用净变化阈值采样的教学模型中，T=4 MiB。若 Go 程序反复分配并立即释放 1 MiB 一千次，净变化样本可能很少。这能说明程序无需优化吗？","answer":"不能。存量可保持平稳，但累计分配达到 1000 MiB，还可能造成 GC 和分配器成本。应将估计目标从“存量趋势”扩展到 alloc_space、对象数量、GC CPU 和业务吞吐。净变化法在自己的目标上高效，不代表覆盖全部性能问题。"},{"question":"ePPing 记录 TSval=8 的首包在 100 μs、第二包在 400 μs，ACK 回显在 2100 μs。覆盖首时间戳会造成什么误差？","answer":"首边缘估计为 2000 μs；覆盖后变成 1700 μs，低估 300 μs。这是协议时间戳粒度与状态更新造成的误差，增加计时器精度也不能修复。实际算法还需处理流方向、重传和 delayed ACK。"},{"question":"一个 PGO 实验用同一批流量采集 profile 并验证性能提高，如何补成研究级证据？","answer":"保留原测量但限定其为训练分布内收益；另划分未见负载，加入请求结构漂移、构建变化和不同比例接口，比较无 PGO 基线，重复并报告吞吐、尾延迟和体积。记录 profile 匹配覆盖及采集开销，失败负载不得事后删除。"},{"question":"原文公式按声明变量产生负概率时，教材应怎样处理？","answer":"引用原始公式与变量定义，给出可重算反例，明确这是印刷表达的一致性疑问。可另给通用统计模型推导，但不能据此宣称源码有同样 bug，也不能静默替作者修正。需要对应发布源码和实现行为验证后再作实现层结论。"}],"references":["paper-scalene","paper-hardware","paper-epping","front-go121","front-trace2024","front-flight2025","front-flight-source","front-otel2024","front-otel-spec"]},{"id":"17","title":"工具深研导论：测量模型与证据边界","subtitle":"测量、归属与解释，先对齐三个工具的观察层次。","objectives":["用明确的观察对象、单位、归属和分母描述一次测量","区分并行 CPU 总量、请求墙钟与线程状态","把关联证据推进为可反驳的机制假设"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"用七个问题定义一次观察","body":"本专题围绕“程序为什么慢”建立一条可检验的证据链。eBPF 提供在事件发生处运行受限程序的机制；pprof 把带权调用栈组织成成本分布；Perfetto 组织时间事件、线程调度和应用区间，并通过查询解释它们的关系。三者处于不同层次，可以组成一套诊断系统。Perfetto 与 Linux perf 也不同：perf 是 Linux 性能事件基础设施及工具集；Perfetto 是另一套追踪、处理与可视化体系。名字相近不意味着数据格式或命令兼容。\n\n本专题的阅读顺序是：测量模型 → eBPF 如何获得数据 → pprof 如何归因与聚合 → Perfetto 如何保留并查询时间关系 → 同一请求的对照实验 → 组合诊断与研读路线。读者需要操作系统、并发编程与基本概率知识；重要公式均解释其假设。图和动画用于展示机制，完整推导与源码索引用于复核。本篇作为第17–22章追加在原第1–16章之后，承接运行时、剖析工具、开源实现与研究方法的基础。\n\n每次观察都应明确：观察对象是谁，触发条件是什么，记录什么数值，权重怎样产生，归因到哪里，使用什么时钟，哪些事件不在覆盖范围。相同的矩形图可以代表 CPU 纳秒、分配字节、等待时间或对象数量。如果没有这个契约，“最宽的函数就是最慢的函数”只是猜测。[[pp-proto]](#src-pp-proto)[[pp-profile-kinds]](#src-pp-profile-kinds)\n\n把原始观察写成 $e_i=(t_i,o_i,k_i,x_i,s_i)$：时间戳、对象身份、事件类型、数值和栈。采样与过滤先选出一部分观察；编码器可能再把多个观察合并。令 $w_i$ 为选定数值维度最终入账的贡献，已包含生产者进行的采样校正（如有）；它既不必等于事件次数，也不等于包含概率本身。普通栈 profile 可写为 $P(s,k)=\\sum_i w_i\\,1\\{s_i=s,\\,k_i=k\\}$。这个求和保留同一归因桶的总量，却通常丢掉桶内事件的先后。trace 则保留一组有时间戳的事件或区间，仍需知道事件来源、丢失情况和时钟关系，才能解释其顺序。[[pp-proto]](#src-pp-proto)[[pp-cpu-builder]](#src-pp-cpu-builder)\n\n不能把“profile 有抽样、trace 没有抽样”当成定义。profile 可以由全量事件聚合而来；trace 可以因配置筛选、缓冲区覆盖或主动采样而不完整。真正的区别在于输出保留哪些维度，而不是文件后缀。甚至同一采集器也可以只在内核 map 中增加栈计数，或把每个事件送到用户态：前者节约传输，后者保留更多关联机会，代价随事件速率增长。","html":"<figure class=\"advanced-figure\" id=\"fig-layers\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"layers-title layers-desc\"><title id=\"layers-title\">三种能力，三个层次<\/title><desc id=\"layers-desc\">eBPF 是可编程采集机制；pprof 组织栈权重；Perfetto 组织时间事件。箭头表示一种可能的数据通路，不是内置的自动转换。<\/desc><defs><marker id=\"layers-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">eBPF<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">事件触发与受限执行<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#layers-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">pprof<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">栈 + 类型 + 权重<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#layers-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">Perfetto<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">事件 + 身份 + 时间<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">可分别使用，也可通过明确的数据转换组合<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">采集能力、聚合语义与时间语义必须逐层说明<\/text>\n<\/svg><figcaption><strong>三种能力，三个层次。<\/strong> eBPF 是可编程采集机制；pprof 组织栈权重；Perfetto 组织时间事件。箭头表示一种可能的数据通路，不是内置的自动转换。 <a class=\"figure-open\" href=\"figures/layers.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>本专题围绕“程序为什么慢”建立一条可检验的证据链。eBPF 提供在事件发生处运行受限程序的机制；pprof 把带权调用栈组织成成本分布；Perfetto 组织时间事件、线程调度和应用区间，并通过查询解释它们的关系。三者处于不同层次，可以组成一套诊断系统。Perfetto 与 Linux perf 也不同：perf 是 Linux 性能事件基础设施及工具集；Perfetto 是另一套追踪、处理与可视化体系。名字相近不意味着数据格式或命令兼容。<\/p>\n\n<p>本专题的阅读顺序是：测量模型 → eBPF 如何获得数据 → pprof 如何归因与聚合 → Perfetto 如何保留并查询时间关系 → 同一请求的对照实验 → 组合诊断与研读路线。读者需要操作系统、并发编程与基本概率知识；重要公式均解释其假设。图和动画用于展示机制，完整推导与源码索引用于复核。本篇作为第17–22章追加在原第1–16章之后，承接运行时、剖析工具、开源实现与研究方法的基础。<\/p>\n\n\n<p>每次观察都应明确：观察对象是谁，触发条件是什么，记录什么数值，权重怎样产生，归因到哪里，使用什么时钟，哪些事件不在覆盖范围。相同的矩形图可以代表 CPU 纳秒、分配字节、等待时间或对象数量。如果没有这个契约，“最宽的函数就是最慢的函数”只是猜测。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go profile种类与归因契约\">[pp-profile-kinds]<\/a><\/p>\n\n<p>把原始观察写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>e<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>t<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>o<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>k<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>s<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>：时间戳、对象身份、事件类型、数值和栈。采样与过滤先选出一部分观察；编码器可能再把多个观察合并。令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math> 为选定数值维度最终入账的贡献，已包含生产者进行的采样校正（如有）；它既不必等于事件次数，也不等于包含概率本身。普通栈 profile 可写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x0007B;<\/mo><msub><mi>s<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>s<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。这个求和保留同一归因桶的总量，却通常丢掉桶内事件的先后。trace 则保留一组有时间戳的事件或区间，仍需知道事件来源、丢失情况和时钟关系，才能解释其顺序。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>不能把“profile 有抽样、trace 没有抽样”当成定义。profile 可以由全量事件聚合而来；trace 可以因配置筛选、缓冲区覆盖或主动采样而不完整。真正的区别在于输出保留哪些维度，而不是文件后缀。甚至同一采集器也可以只在内核 map 中增加栈计数，或把每个事件送到用户态：前者节约传输，后者保留更多关联机会，代价随事件速率增长。<\/p>\n\n","advanced":true},{"title":"CPU、墙钟、等待：先看单位再做加法","body":"请求墙钟时间是开始到结束的跨度 $T=t_{end}-t_{start}$。请求归属集合为 $G$ 时，其 CPU 消耗可写成 $C=\\sum_{g\\in G}\\int 1\\{g\\text{ 正在 CPU 上执行}\\}\\,dt$。这里的 $g$ 是明确归属的执行活动，不能仅凭与请求时间重叠来选取。多个活动并行时，$C$ 可以大于 $T$；$C/T$ 是容量尺度，不是请求的完成百分比。\n\n对一个给定的 OS 线程，在完整且无重叠的分类条件下，有 $T_{thread}=T_{running}+T_{runnable}+T_{blocked}$。running 是得到 CPU；runnable 是可以运行但尚未得到 CPU；blocked 是还不满足继续执行的条件。这是教学三分法；实际内核状态更丰富，trace 开头、结尾和丢事件处还会有未知区间。对一个跨多个 goroutine 的 Go 请求，不能直接把这三个 OS 线程时间相加当作请求分解。G 会在 M 上切换，同一 M 也会先后执行不同 G。[[pp-cpu-linux]](#src-pp-cpu-linux)[[pp-sema]](#src-pp-sema)\n\n例如一个请求主线程执行 8 ms、等待 12 ms，另有工作线程执行 15 ms，墙钟却只有 20 ms。CPU 是 23 ms；主线程 12 ms 非运行时间又可能由 2 ms runnable 和 10 ms sleeping 构成。CPU profile 可以发现 15 ms 的计算来源，却不会自动显示 10 ms 的等待区间。线程调度 trace 能重建状态变化，却不能仅凭 Sleeping 就证明它在等待磁盘。第21章将让实际工具读取这一合成模型。","html":"\n<p>请求墙钟时间是开始到结束的跨度 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><mo>&#x0003D;<\/mo><msub><mi>t<\/mi><mrow><mi>e<\/mi><mi>n<\/mi><mi>d<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>t<\/mi><mrow><mi>s<\/mi><mi>t<\/mi><mi>a<\/mi><mi>r<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math>。请求归属集合为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><\/mrow><\/math> 时，其 CPU 消耗可写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>g<\/mi><mo>&#x02208;<\/mo><mi>G<\/mi><\/mrow><\/msub><mo>&#x0222B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007B;<\/mo><mi>g<\/mi><mtext>&#x000A0;正在&#x000A0;CPU&#x000A0;上执行<\/mtext><mo stretchy=\"false\">&#x0007D;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>。这里的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 是明确归属的执行活动，不能仅凭与请求时间重叠来选取。多个活动并行时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 可以大于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0002F;<\/mo><mi>T<\/mi><\/mrow><\/math> 是容量尺度，不是请求的完成百分比。<\/p>\n\n<p>对一个给定的 OS 线程，在完整且无重叠的分类条件下，有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>T<\/mi><mrow><mi>t<\/mi><mi>h<\/mi><mi>r<\/mi><mi>e<\/mi><mi>a<\/mi><mi>d<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><msub><mi>T<\/mi><mrow><mi>r<\/mi><mi>u<\/mi><mi>n<\/mi><mi>n<\/mi><mi>i<\/mi><mi>n<\/mi><mi>g<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>T<\/mi><mrow><mi>r<\/mi><mi>u<\/mi><mi>n<\/mi><mi>n<\/mi><mi>a<\/mi><mi>b<\/mi><mi>l<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>T<\/mi><mrow><mi>b<\/mi><mi>l<\/mi><mi>o<\/mi><mi>c<\/mi><mi>k<\/mi><mi>e<\/mi><mi>d<\/mi><\/mrow><\/msub><\/mrow><\/math>。running 是得到 CPU；runnable 是可以运行但尚未得到 CPU；blocked 是还不满足继续执行的条件。这是教学三分法；实际内核状态更丰富，trace 开头、结尾和丢事件处还会有未知区间。对一个跨多个 goroutine 的 Go 请求，不能直接把这三个 OS 线程时间相加当作请求分解。G 会在 M 上切换，同一 M 也会先后执行不同 G。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/os_linux.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux线程CPU时钟与去重\">[pp-cpu-linux]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><\/p>\n\n<p>例如一个请求主线程执行 8 ms、等待 12 ms，另有工作线程执行 15 ms，墙钟却只有 20 ms。CPU 是 23 ms；主线程 12 ms 非运行时间又可能由 2 ms runnable 和 10 ms sleeping 构成。CPU profile 可以发现 15 ms 的计算来源，却不会自动显示 10 ms 的等待区间。线程调度 trace 能重建状态变化，却不能仅凭 Sleeping 就证明它在等待磁盘。第21章将让实际工具读取这一合成模型。<\/p>\n\n<div class=\"advanced-interactives\"><section id=\"request-demo\" class=\"request-demo\" aria-labelledby=\"demo-title\">\n        <div class=\"demo-heading\"><div><span class=\"eyebrow\"><span class=\"section-number\">01<\/span> 热身实验 · 同一个请求<\/span><h2 id=\"demo-title\">20 ms 的请求，为什么用了 23 ms CPU？<\/h2><\/div><span class=\"data-badge\"><i aria-hidden=\"true\"><\/i>合成教学数据<\/span><\/div>\n        <p class=\"demo-intro\">拖动时间，观察主线程 main 与工作线程 worker 的累计工作量。它们都显式归属于 <code>request=demo<\/code>，并行执行的 CPU 时间会相加。<\/p>\n        <div class=\"demo-metrics\">\n          <div class=\"metric\"><span>墙钟经过<\/span><strong><output id=\"demo-wall\">0.0<\/output><small>ms<\/small><\/strong><p>从请求开始到当前时刻<\/p><\/div>\n          <div class=\"metric metric-green\"><span>累计 CPU<\/span><strong><output id=\"demo-cpu\">0.0<\/output><small>ms<\/small><\/strong><p>main <span id=\"demo-main-cpu\">0.0<\/span> + worker <span id=\"demo-worker-cpu\">0.0<\/span><\/p><\/div>\n          <div class=\"metric\"><span>CPU / 墙钟<\/span><strong><output id=\"demo-ratio\">—<\/output><small id=\"demo-ratio-unit\"><\/small><\/strong><p>平均使用的核容量<\/p><\/div>\n        <\/div>\n        <div class=\"timeline-toolbar\"><span class=\"timeline-title\">线程状态时间线<\/span><div class=\"timeline-legend\" aria-label=\"状态图例\"><span><i class=\"legend-running\"><\/i>Running · 执行<\/span><span><i class=\"legend-runnable\"><\/i>Runnable · 等待调度<\/span><span><i class=\"legend-sleeping\"><\/i>Sleeping · 休眠或等待<\/span><\/div><\/div>\n        <div class=\"timeline\" aria-label=\"请求状态时间线\">\n          <div class=\"timeline-axis\"><span><\/span><div id=\"demo-ticks\" class=\"timeline-ticks\"><span>0<\/span><span>5<\/span><span>10<\/span><span>15<\/span><span>20 ms<\/span><\/div><\/div>\n          <div class=\"timeline-row\"><span class=\"lane-name\">main<\/span><div id=\"demo-main-lane\" class=\"timeline-lane\" role=\"img\" aria-label=\"主线程：0至4毫秒运行，4至6毫秒等待调度，6至16毫秒Sleeping，16至20毫秒运行\"><\/div><\/div>\n          <div class=\"timeline-row\"><span class=\"lane-name\">worker<\/span><div id=\"demo-worker-lane\" class=\"timeline-lane\" role=\"img\" aria-label=\"worker：1至16毫秒运行\"><\/div><\/div>\n          <div class=\"timeline-cursor-area\" aria-hidden=\"true\"><div id=\"demo-cursor\" class=\"timeline-cursor\"><span id=\"demo-cursor-label\">0.0<\/span><\/div><\/div>\n        <\/div>\n        <div class=\"demo-controls\">\n          <button type=\"button\" id=\"demo-play\" class=\"button button-primary button-small\"><span class=\"play-icon\" aria-hidden=\"true\">▶<\/span><span id=\"demo-play-label\">播放<\/span><\/button>\n          <button type=\"button\" id=\"demo-reset\" class=\"icon-button\" aria-label=\"重置实验到零毫秒\" title=\"重置\"><svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4 10a8 8 0 1 1 1 7M4 4v6h6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n          <label class=\"visually-hidden\" for=\"demo-slider\">当前时刻<\/label><input id=\"demo-slider\" type=\"range\" min=\"0\" max=\"20\" step=\"0.1\" value=\"0\" aria-valuetext=\"0毫秒；累计CPU为0毫秒\"><output class=\"demo-time\" id=\"demo-time\" for=\"demo-slider\">0.0 / 20 ms<\/output>\n        <\/div>\n        <p id=\"demo-status\" class=\"demo-status\" aria-live=\"polite\">已暂停。也可以用滑块的左右方向键逐步观察。<\/p>\n        <details class=\"demo-explainer\"><summary>这个实验能说明什么？<\/summary><p>终点的主线程 有 8 ms Running、2 ms Runnable、10 ms Sleeping，墙钟合计 20 ms；它的 CPU 为 8 ms，worker 另有 15 ms CPU，所以请求总 CPU 为 23 ms。pprof 汇总这些权重；时间先后和状态区间要从时序记录读取。跨 worker 的请求归属是这里明确给定的前提。<\/p><p>Sleeping 是状态分类，单靠它不能判定具体是磁盘、网络、锁还是主动休眠。本例按操作系统线程与内核 sched_switch 语义解释，不能直接当作 Go G 的调度轨迹。本演示用于理解计量关系，不代表一次运行时采样实验。<\/p><\/details>\n      <\/section><\/div>","advanced":true},{"title":"观察关系不等于因果关系","body":"调用关系、调度关系和业务依赖关系是三种图。调用栈描述同一执行上下文的嵌套；线程调度描述 CPU 上的先后占用；请求依赖描述发起、排队、处理、唤醒和结果交付。worker 完成后 main 才继续，是可能的依赖；把 worker 画成 main 当前栈的子函数，则会捏造调用关系。相反，保留两个独立栈并加正确的任务身份，才保留了二者关系的性质。[[pp-labels]](#src-pp-labels)\n\n即使两个事件显示在同一时间线上，“A 先于 B”也不充分证明 A 导致 B。需要共享请求 ID、显式 flow、唤醒链或协议证据。跨时钟的差值还受转换误差影响；若两事件的相对误差上界大于观测间隔，严格先后便不能确定。时间戳精度为纳秒，也不表示真实因果排序具备纳秒精度。\n\n三种身份尤其值得单独保存：业务对象身份、运行时对象身份、OS 对象身份。请求 ID 不等于 goroutine ID；goroutine ID 不等于 Linux tid；tid 还可能在进程生命周期外复用。把它们关联起来需要明确的生命周期和映射，不应把一个数值相等当作同一对象。pprof 标签适合分组；Perfetto 的 track/utid 与生命周期适合时序组织；eBPF 可在可观察的边界采集关联数据，任何一方都不会自动知道全部业务语义。","html":"<figure class=\"advanced-figure\" id=\"fig-identities\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"identities-title identities-desc\"><title id=\"identities-title\">三种身份不能混为一谈<\/title><desc id=\"identities-desc\">请求、Go goroutine、OS 线程分别有生命周期；箭头表示需显式建立的关联，不是ID相等。<\/desc><defs><marker id=\"identities-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"30\" y=\"60\" width=\"240\" height=\"100\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"150.0\" y=\"96.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">业务请求<\/text>\n<text x=\"150.0\" y=\"123.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">request=demo<\/text>\n<rect x=\"360\" y=\"60\" width=\"240\" height=\"100\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"96.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">运行时任务<\/text>\n<text x=\"480.0\" y=\"123.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">G / task<\/text>\n<rect x=\"690\" y=\"60\" width=\"240\" height=\"100\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"810.0\" y=\"96.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">OS 执行实体<\/text>\n<text x=\"810.0\" y=\"123.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">PID / TID<\/text>\n<line x1=\"275\" y1=\"110\" x2=\"355\" y2=\"110\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#identities-arrow)\"/>\n<line x1=\"605\" y1=\"110\" x2=\"685\" y2=\"110\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#identities-arrow)\"/>\n<text x=\"480\" y=\"220\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">一个请求可涉及多个 G；一个 M 会执行不同 G<\/text>\n<text x=\"480\" y=\"258\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">观察到时间重叠，只能得到候选关联，不能直接确认归属<\/text>\n<\/svg><figcaption><strong>三种身份不能混为一谈。<\/strong> 请求、Go goroutine、OS 线程分别有生命周期；箭头表示需显式建立的关联，不是ID相等。 <a class=\"figure-open\" href=\"figures/identities.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>调用关系、调度关系和业务依赖关系是三种图。调用栈描述同一执行上下文的嵌套；线程调度描述 CPU 上的先后占用；请求依赖描述发起、排队、处理、唤醒和结果交付。worker 完成后 main 才继续，是可能的依赖；把 worker 画成 main 当前栈的子函数，则会捏造调用关系。相反，保留两个独立栈并加正确的任务身份，才保留了二者关系的性质。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/runtime.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go标签安装和继承\">[pp-labels]<\/a><\/p>\n\n<p>即使两个事件显示在同一时间线上，“A 先于 B”也不充分证明 A 导致 B。需要共享请求 ID、显式 flow、唤醒链或协议证据。跨时钟的差值还受转换误差影响；若两事件的相对误差上界大于观测间隔，严格先后便不能确定。时间戳精度为纳秒，也不表示真实因果排序具备纳秒精度。<\/p>\n\n<p>三种身份尤其值得单独保存：业务对象身份、运行时对象身份、OS 对象身份。请求 ID 不等于 goroutine ID；goroutine ID 不等于 Linux tid；tid 还可能在进程生命周期外复用。把它们关联起来需要明确的生命周期和映射，不应把一个数值相等当作同一对象。pprof 标签适合分组；Perfetto 的 track/utid 与生命周期适合时序组织；eBPF 可在可观察的边界采集关联数据，任何一方都不会自动知道全部业务语义。<\/p>\n\n","advanced":true},{"title":"从“热点”到可复核的优化结论","body":"一个可信的结论通常经历四步：用稳定工作量复现症状；用测量定位资源消耗或等待的位置；提出能够改变该机制的干预；在相同工作量和条件下重复验证吞吐、延迟和资源变化。剖析得到的是观察证据，干预前后重复实验才进一步支持因果解释。只比较两张火焰图的形状，会混入请求量、流量组成和采样误差。[[pp-diff]](#src-pp-diff)[[pp-total]](#src-pp-total)\n\n测量开销也要分层。事件触发次数为 $N$、每次执行和传输的平均成本为 $c$，则一阶模型是额外工作约 $Nc$；真实成本还包括缓存扰动、锁竞争、内存分配、调度和下游处理。降低采样频率通常降低部分成本，却增加估计方差；先在内核聚合减少传输，却放弃逐事件时序。这些是可量化的设计权衡，不能用“eBPF 天生低开销”或“追踪一定很重”代替测量。\n\n本专题把证据分为三类：固定版本源码及官方文档，合成数据在真实工具中的执行结果，以及尚未运行的实验建议。合成实验验证格式和算法，不验证生产负载中的采样精度；阅读 verifier 源码不等于在此机器上成功加载了 BPF 程序。这一分层贯穿正文、图注和验证报告。","html":"<figure class=\"advanced-figure\" id=\"fig-evidence\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"evidence-title evidence-desc\"><title id=\"evidence-title\">观察到的热点怎样变成可检验的结论<\/title><desc id=\"evidence-desc\">优化需要控制工作量并进行干预。源码解释、合成输入验证与真实负载实验支持不同层次的结论。<\/desc><defs><marker id=\"evidence-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">控制条件<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">工作量 / 构建 / 环境<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#evidence-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">提出机制<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">热点 / 等待 / 队列<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#evidence-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">干预与复测<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">延迟 / CPU / 错误率<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">同时保存原始数据、配置、版本与缺失指标<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">图形是证据的呈现，不替代对照实验<\/text>\n<\/svg><figcaption><strong>观察到的热点怎样变成可检验的结论。<\/strong> 优化需要控制工作量并进行干预。源码解释、合成输入验证与真实负载实验支持不同层次的结论。 <a class=\"figure-open\" href=\"figures/evidence.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>一个可信的结论通常经历四步：用稳定工作量复现症状；用测量定位资源消耗或等待的位置；提出能够改变该机制的干预；在相同工作量和条件下重复验证吞吐、延迟和资源变化。剖析得到的是观察证据，干预前后重复实验才进一步支持因果解释。只比较两张火焰图的形状，会混入请求量、流量组成和采样误差。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/driver/fetch.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分的操作顺序\">[pp-diff]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/internal/report/report.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"差分总量的绝对值与基线规则\">[pp-total]<\/a><\/p>\n\n<p>测量开销也要分层。事件触发次数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><\/mrow><\/math>、每次执行和传输的平均成本为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>，则一阶模型是额外工作约 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><mi>c<\/mi><\/mrow><\/math>；真实成本还包括缓存扰动、锁竞争、内存分配、调度和下游处理。降低采样频率通常降低部分成本，却增加估计方差；先在内核聚合减少传输，却放弃逐事件时序。这些是可量化的设计权衡，不能用“eBPF 天生低开销”或“追踪一定很重”代替测量。<\/p>\n\n<p>本专题把证据分为三类：固定版本源码及官方文档，合成数据在真实工具中的执行结果，以及尚未运行的实验建议。合成实验验证格式和算法，不验证生产负载中的采样精度；阅读 verifier 源码不等于在此机器上成功加载了 BPF 程序。这一分层贯穿正文、图注和验证报告。<\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"一个请求的墙钟为 20 ms、归属于它的 CPU 合计为 23 ms。最合理的解释是什么？","options":["两个计时结果矛盾，至少有一个工具坏了。","主线程 main 与工作线程 worker 可以并行执行，CPU 权重相加后可超过墙钟。","CPU 的单位应该改成调用次数。","把 Runnable 和 Sleeping 再加到 23 ms，就得到请求延迟。"],"answer":1,"explanation":"墙钟衡量经过的时间，CPU 衡量各执行单元消耗的计算时间。并行工作可以使总 CPU 超过墙钟；前提是 worker 的工作确实归属于该请求。"}],"exercises":[],"references":["pp-proto","pp-cpu-linux","pp-cpu-builder","pp-profile-kinds","pp-sema","pp-labels","pp-diff","pp-total"],"part":"advanced","source_path":"content/01-model.md"},{"id":"18","title":"eBPF 性能观测：从可验证程序到可解释证据","subtitle":"沿加载、验证、执行和传输路径理解内核观测。","objectives":["解释 ELF、BTF、CO-RE 与验证器的不同职责","分析 ring buffer 的预留、提交和消费顺序","对账采样覆盖、栈展开损失与端到端成本"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"先定义观测问题，再选择 eBPF 机制","body":"> 本章是固定版本的原理分析样本，不把分析版本称为最新版本。Linux 基线为正式标签 `v6.12`，完整提交 `adc218676eef25575469234709c2d87185ca223a`；libbpf 为 `v1.5.0`，提交 `09b9e83102eb8ab9e540d36b4559c55f3bcdb95d`；Go runtime 补充样本为 `go1.25.0`，提交 `6e676ab2b809d46623acb5988248d95d1eb7939c`。源码按不可变提交下载；来源与实际阅读区间见 `research/sources-ebpf.json`，缓存见 `research/ebpf/`。本章的成本数字和布局偏移示例均为教学假设，不能作为实测性能结论。\n\neBPF 是 Linux 内核中的受约束程序执行机制及其生态，不是某个 profiler 的名字。一个可运行的性能观测系统至少包括程序生成、加载与验证、事件挂载、内核数据结构、用户态消费、符号化和结果解释。libbpf 主要承担 ELF 处理与加载、挂载和部分消费工作；它不会自动决定何种采样代表 CPU 成本，也不会替用户恢复请求因果链。把所有这些层都简称为“eBPF”会掩盖错误发生的位置。例如程序通过验证却没有挂载，得到的不是零事件工作负载，而是没有建立观测入口。[[eb-libbpf-overview]](#src-eb-libbpf-overview)[[eb-libbpf-load]](#src-eb-libbpf-load)\n\n应当先写出一份测量契约：观测对象是进程、线程、容器还是请求；事件是 CPU 时钟采样、硬件事件溢出、函数调用还是调度切换；值是次数、纳秒、字节还是按周期加权的计数；时间窗口从哪一步开始；哪些分支会过滤或丢弃；调用栈失败如何保留。比如“统计目标进程十秒内的调度切出次数”可以由 `sched_switch` 完成；“解释某个 Go 请求的十秒延迟”则还需要 goroutine 状态、应用请求身份与跨线程传播证据。二者可使用同一内核机制，但测量对象和结论强度不同。[[eb-sched-trace]](#src-eb-sched-trace)[[eb-sched-core]](#src-eb-sched-core)[[eb-go-runtime]](#src-eb-go-runtime)\n\n控制平面负责发现内核能力、选择程序变体、解析对象、创建 map、验证和挂载，并管理链接与对象的生命周期。数据平面在事件发生时执行过滤、读字段、更新聚合值或保留记录；用户态随后读出、符号化、合并并上传。控制平面“启动成功”不能替代数据平面的健康检查：加载日志说明程序被接受，样本计数和失败计数才说明它实际观察到了什么。相反，消费速度慢也不必然意味着内核程序慢，可能是用户态对每条记录进行格式化或同步网络写入。[[eb-libbpf-overview]](#src-eb-libbpf-overview)[[eb-ring-consume]](#src-eb-ring-consume)\n\neBPF 的价值之一是把筛选和聚合前移。例如每秒百万次事件中只关心一个进程，先比较进程标识，再更新固定数量的桶，可以显著减少跨边界输出。但前移操作仍在被观测系统的执行路径上付费，开销包括挂载机制、读取用户内存、查表、原子操作和通知。能加载的程序并不等于适合以任意事件率长期运行的程序；验证器证明的是特定安全约束，而不是业务开销上限，更不是“生产零开销”。[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-map-array-code]](#src-eb-map-array-code)[[eb-ring-code]](#src-eb-ring-code)\n\n学习本章后应能从一次输出反向追踪到事件入口、抽象状态、共享数据和消费顺序；给出“哪些内容被观测、哪些没有”的严格说明；并能发现三个常见错误：把线程当 goroutine，把缺失栈当缺失事件，把 CO-RE 通过当语义正确。后续所有图和练习围绕这一证据链展开。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-stack-helper]](#src-eb-stack-helper)[[eb-core-relo]](#src-eb-core-relo)","html":"<figure class=\"advanced-figure\" id=\"fig-bpf-lifecycle\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"bpf-lifecycle-title bpf-lifecycle-desc\"><title id=\"bpf-lifecycle-title\">eBPF 的加载与运行生命周期<\/title><desc id=\"bpf-lifecycle-desc\">加载时验证程序，事件发生时执行程序；CO-RE 是加载前后的重定位环节之一，attach 决定何时触发。<\/desc><defs><marker id=\"bpf-lifecycle-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">用户态 loader<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">ELF / BTF / 重定位<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-lifecycle-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">内核加载<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">verifier → JIT 等路径<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-lifecycle-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">事件触发<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">执行 → map / 输出<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">加载成功与测量正确是两个判断<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">程序类型、attach 点、helper 和权限共同约束能力<\/text>\n<\/svg><figcaption><strong>eBPF 的加载与运行生命周期。<\/strong> 加载时验证程序，事件发生时执行程序；CO-RE 是加载前后的重定位环节之一，attach 决定何时触发。 <a class=\"figure-open\" href=\"figures/bpf-lifecycle.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<blockquote><p>本章是固定版本的原理分析样本，不把分析版本称为最新版本。Linux 基线为正式标签 <code>v6.12<\/code>，完整提交 <code>adc218676eef25575469234709c2d87185ca223a<\/code>；libbpf 为 <code>v1.5.0<\/code>，提交 <code>09b9e83102eb8ab9e540d36b4559c55f3bcdb95d<\/code>；Go runtime 补充样本为 <code>go1.25.0<\/code>，提交 <code>6e676ab2b809d46623acb5988248d95d1eb7939c<\/code>。源码按不可变提交下载；来源与实际阅读区间见 <code>research/sources-ebpf.json<\/code>，缓存见 <code>research/ebpf/<\/code>。本章的成本数字和布局偏移示例均为教学假设，不能作为实测性能结论。<\/p>\n<\/blockquote>\n\n<p>eBPF 是 Linux 内核中的受约束程序执行机制及其生态，不是某个 profiler 的名字。一个可运行的性能观测系统至少包括程序生成、加载与验证、事件挂载、内核数据结构、用户态消费、符号化和结果解释。libbpf 主要承担 ELF 处理与加载、挂载和部分消费工作；它不会自动决定何种采样代表 CPU 成本，也不会替用户恢复请求因果链。把所有这些层都简称为“eBPF”会掩盖错误发生的位置。例如程序通过验证却没有挂载，得到的不是零事件工作负载，而是没有建立观测入口。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/libbpf/libbpf_overview.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: libbpf overview and CO-RE lifecycle\">[eb-libbpf-overview]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: ELF collection, load ordering, section mapping and attach\">[eb-libbpf-load]<\/a><\/p>\n\n<p>应当先写出一份测量契约：观测对象是进程、线程、容器还是请求；事件是 CPU 时钟采样、硬件事件溢出、函数调用还是调度切换；值是次数、纳秒、字节还是按周期加权的计数；时间窗口从哪一步开始；哪些分支会过滤或丢弃；调用栈失败如何保留。比如“统计目标进程十秒内的调度切出次数”可以由 <code>sched_switch<\/code> 完成；“解释某个 Go 请求的十秒延迟”则还需要 goroutine 状态、应用请求身份与跨线程传播证据。二者可使用同一内核机制，但测量对象和结论强度不同。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><\/p>\n\n<p>控制平面负责发现内核能力、选择程序变体、解析对象、创建 map、验证和挂载，并管理链接与对象的生命周期。数据平面在事件发生时执行过滤、读字段、更新聚合值或保留记录；用户态随后读出、符号化、合并并上传。控制平面“启动成功”不能替代数据平面的健康检查：加载日志说明程序被接受，样本计数和失败计数才说明它实际观察到了什么。相反，消费速度慢也不必然意味着内核程序慢，可能是用户态对每条记录进行格式化或同步网络写入。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/libbpf/libbpf_overview.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: libbpf overview and CO-RE lifecycle\">[eb-libbpf-overview]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>eBPF 的价值之一是把筛选和聚合前移。例如每秒百万次事件中只关心一个进程，先比较进程标识，再更新固定数量的桶，可以显著减少跨边界输出。但前移操作仍在被观测系统的执行路径上付费，开销包括挂载机制、读取用户内存、查表、原子操作和通知。能加载的程序并不等于适合以任意事件率长期运行的程序；验证器证明的是特定安全约束，而不是业务开销上限，更不是“生产零开销”。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/arraymap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: per-CPU array lookup, copy and memory accounting\">[eb-map-array-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<p>学习本章后应能从一次输出反向追踪到事件入口、抽象状态、共享数据和消费顺序；给出“哪些内容被观测、哪些没有”的严格说明；并能发现三个常见错误：把线程当 goroutine，把缺失栈当缺失事件，把 CO-RE 通过当语义正确。后续所有图和练习围绕这一证据链展开。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><\/p>\n\n","advanced":true},{"title":"编译、ELF、BTF、CO-RE 与加载","body":"### 2.1 指令机器：寄存器、调用与受限栈\n\nBPF 的寄存器编号为 `R0` 至 `R10`，均为六十四位：`R0` 放返回值，`R1–R5` 传参数，`R6–R9` 按约定由被调用方保存；`R10` 是只读的栈帧指针，程序不能像普通本机代码那样自由修改栈指针。基本指令占八字节，编码操作码、源/目标寄存器、十六位偏移与三十二位立即数；`ldimm64` 使用两个连续槽、共十六字节，不能把第二槽当独立指令入口。[[eb-stack-helper]](#src-eb-stack-helper)[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-design-qa]](#src-eb-design-qa)[[eb-isa]](#src-eb-isa)\n\n普通 BPF 子程序调用有返回点，成功的 tail call 则转移执行而不返回。固定 v6.12 的调用帧上限为八；验证器按 `MAX_BPF_STACK=512` 检查普通调用链的累计栈用量，不是允许每层任意使用五百一十二字节。子程序调用混合 tail call 时还检查更严格条件：目标子程序含 tail call 且前序帧累计深度达到二百五十六字节会被拒绝。须同时核验版本、调用形态与架构支持，不能把单个常量当作无限递归许可。[[eb-isa]](#src-eb-isa)[[eb-verifier-code]](#src-eb-verifier-code)[[eb-verifier-state]](#src-eb-verifier-state)[[eb-design-qa]](#src-eb-design-qa)\n\n传统 helper 由静态编号调用，属于内核对 BPF 承诺的接口；kfunc 通过 BTF 描述与解析暴露的内核函数，接口不具有相同的稳定性承诺。二者都不是任意内核函数调用权限。kfunc 按程序类型注册，验证器还检查参数类型、可空性、引用获取/释放和可睡眠上下文；仅有函数名或 BTF 记录不足以证明当前程序可调用。增加 kfunc 依赖时应探测目标能力并记录版本，不能期待 CO-RE 自动补出缺失实现。[[eb-design-qa]](#src-eb-design-qa)[[eb-kfuncs]](#src-eb-kfuncs)[[eb-isa]](#src-eb-isa)\n\n### 2.2 目标代码包含程序，也包含解释程序所需的信息\n\n典型构建由 Clang 把受约束的 C 编译为 BPF 指令，输出 ELF 对象。程序段、map 定义、数据段、符号表和重定位信息在同一对象中协作。`SEC(\"tracepoint/sched/sched_switch\")` 并不是 C 语言赋予的内核能力；它把函数放入带约定名称的 ELF section，由 libbpf 解释程序类型与自动挂载线索。`SEC`、`__uint` 和 `__type` 等宏帮助编码元数据，最终仍须经过加载器和内核检查。[[eb-helpers]](#src-eb-helpers)[[eb-libbpf-overview]](#src-eb-libbpf-overview)\n\n普通 ELF 重定位与 CO-RE 重定位必须分开理解。前者解决符号、数据或函数在对象中的关联。例如固定版本 LLVM 重定位文档中，`R_BPF_64_64` 用于 `ld_imm64`，`R_BPF_64_32` 用于调用；调用的重定位计算包含按八字节指令单位换算。CO-RE 则回答“编译时对某种类型的访问，在目标内核类型中应如何实现”。两类记录可能同处一个 ELF，却不解决同一问题；把 ELF 所有 relocation 都叫“内核字段偏移适配”会遗漏全局变量和 BPF 子程序链接。[[eb-llvm-reloc]](#src-eb-llvm-reloc)[[eb-core-relo]](#src-eb-core-relo)\n\nBTF 用紧凑的类型记录和字符串表描述类型关系，类型 ID 在相应 BTF 对象中引用其他记录，并不是跨内核永恒不变的类型编号。`.BTF.ext` 在 ELF 中承载函数、行号和 CO-RE 信息，头部有真实字段 `core_relo_off` 与 `core_relo_len`。还要注意单位：某些内核 API 中指令位置以指令条数表示，ELF 扩展信息使用字节偏移；把二者混用会把正确的指令指向错误位置。调试信息让故障可定位，但不会替代指令验证。[[eb-btf]](#src-eb-btf)\n\n### 2.3 CO-RE 是结构适配，不是完整兼容性证明\n\nCO-RE 的合作方是编译器保留的访问意图、编译时类型信息、目标 BTF 和加载器。常见流程读取 `/sys/kernel/btf/vmlinux`，也可以针对目标类型信息生成 `vmlinux.h`。加载时 libbpf 匹配目标类型与访问路径，计算字段偏移、尺寸、存在性以及类型或枚举相关值，再修补指令的立即数或内存访问偏移。固定版本 `relo_core.c` 中可以直接读到计算与修补函数；这不是运行中每次读字段都查询 BTF 的动态反射。[[eb-libbpf-overview]](#src-eb-libbpf-overview)[[eb-core-relo]](#src-eb-core-relo)\n\n设教学结构 `task_demo` 的 `latency` 字段在构建环境偏移为十六字节，在目标环境偏移为二十四字节。结构重定位可以把访问位置修正到二十四；假如字段在目标内核中的单位从纳秒变为微秒，即使名字、宽度和位置都能成功匹配，乘除比例仍可能完全错误。类似地，字段何时有效、在何种锁保护下读取、函数是否覆盖全部请求，以及读取值是否需要配对事件，都不由布局适配保证。这一例子中的偏移和字段为虚构教学值，不是任何真实 `task_struct` 布局。[[eb-core-relo]](#src-eb-core-relo)[[eb-btf]](#src-eb-btf)\n\n字段不存在也不意味着所有对象必须立刻失败。存在性检测可以引导程序走其他分支；无法完成的访问可能被加载器改写为会触发拒绝的“毒化”指令，只有实际可达时才阻止加载。因此，正确模式是能力检测与有意义的替代语义配合，而不是把失败吞掉后输出零。不要把未执行的分支解释为“该功能被完整支持”；应该把功能不可用与观测值为零分别呈现。[[eb-core-relo]](#src-eb-core-relo)[[eb-verifier-code]](#src-eb-verifier-code)\n\n### 2.4 按阶段定位启动失败\n\nlibbpf 的生命周期可以概括为打开、加载、挂载与释放。打开阶段解析 ELF，收集外部引用、BTF、map、程序和重定位；此时可以修改配置。加载阶段准备目标 BTF、解析外部依赖和重定位，创建内核对象，向内核提交程序。固定的 v1.5.0 代码中，顶层加载顺序包含目标 BTF、外部引用、map 清理、重定位、BTF 加载、map 创建与程序加载；不能机械地宣称“所有重定位都发生在 map 创建之后”。不同重定位类别的最终处理散布在相应阶段。[[eb-libbpf-load]](#src-eb-libbpf-load)\n\n内核程序加载路径检查程序类型、权限与策略，调用安全钩子和验证器，再选择执行引擎，成功后返回可引用该程序的文件描述符。权限能力受到程序类型、内核配置、BPF token 和系统策略影响，不能用一句“只要 root”概括全部部署条件。文件描述符表示已加载对象，不表示某个事件已经引用它；必须完成相应挂载，并在运行期间保留需要的对象引用。关闭、解除链接和清理 map 也属于实验设计，否则下一次实验可能混入旧状态。[[eb-load-syscall]](#src-eb-load-syscall)[[eb-libbpf-overview]](#src-eb-libbpf-overview)\n\n故障报告应保存失败阶段、内核和加载器版本、选中的程序变体与验证日志。例如找不到 section 是对象问题，目标类型不匹配是重定位问题，非法内存访问是验证问题，目标 tracepoint 不存在是挂载问题。按这个顺序缩小问题，比反复调整采样频率更有效。对教学实验而言，先验证“无业务字段读取的计数程序”，再增加读字段和栈收集，可以使首次失败对应的机制变化可解释。[[eb-libbpf-load]](#src-eb-libbpf-load)[[eb-attach-api]](#src-eb-attach-api)[[eb-verifier-doc]](#src-eb-verifier-doc)","html":"<figure class=\"advanced-figure\" id=\"fig-bpf-core\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"bpf-core-title bpf-core-desc\"><title id=\"bpf-core-title\">CO-RE：把字段意图迁移到目标布局<\/title><desc id=\"bpf-core-desc\">图中字段偏移为示意数值。CO-RE 用 BTF 类型与 relocation 信息重写相应访问，不保证 helper、内核功能和语义都兼容。<\/desc><defs><marker id=\"bpf-core-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"25\" y=\"60\" width=\"265\" height=\"120\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"157.5\" y=\"106.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">编译时布局（示意）<\/text>\n<text x=\"157.5\" y=\"133.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">字段 state：偏移 16<\/text>\n<rect x=\"345\" y=\"60\" width=\"265\" height=\"120\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"477.5\" y=\"106.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">BTF + relocation<\/text>\n<text x=\"477.5\" y=\"133.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">定位同名结构成员<\/text>\n<rect x=\"665\" y=\"60\" width=\"265\" height=\"120\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"797.5\" y=\"106.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">目标布局（示意）<\/text>\n<text x=\"797.5\" y=\"133.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">字段 state：偏移 24<\/text>\n<line x1=\"295\" y1=\"120\" x2=\"340\" y2=\"120\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-core-arrow)\"/>\n<line x1=\"615\" y1=\"120\" x2=\"660\" y2=\"120\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-core-arrow)\"/>\n<text x=\"480\" y=\"240\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">迁移的是结构访问意图；功能探测和语义兼容仍需另行处理<\/text>\n<\/svg><figcaption><strong>CO-RE：把字段意图迁移到目标布局。<\/strong> 图中字段偏移为示意数值。CO-RE 用 BTF 类型与 relocation 信息重写相应访问，不保证 helper、内核功能和语义都兼容。 <a class=\"figure-open\" href=\"figures/bpf-core.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<h3>指令机器：寄存器、调用与受限栈<\/h3>\n\n<p>BPF 的寄存器编号为 <code>R0<\/code> 至 <code>R10<\/code>，均为六十四位：<code>R0<\/code> 放返回值，<code>R1–R5<\/code> 传参数，<code>R6–R9<\/code> 按约定由被调用方保存；<code>R10<\/code> 是只读的栈帧指针，程序不能像普通本机代码那样自由修改栈指针。基本指令占八字节，编码操作码、源/目标寄存器、十六位偏移与三十二位立即数；<code>ldimm64<\/code> 使用两个连续槽、共十六字节，不能把第二槽当独立指令入口。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/bpf_design_QA.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF design Q&amp;A: calling convention and API stability\">[eb-design-qa]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/standardization/instruction-set.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF ISA: basic/wide encoding and program-local calls\">[eb-isa]<\/a><\/p>\n\n<p>普通 BPF 子程序调用有返回点，成功的 tail call 则转移执行而不返回。固定 v6.12 的调用帧上限为八；验证器按 <code>MAX_BPF_STACK=512<\/code> 检查普通调用链的累计栈用量，不是允许每层任意使用五百一十二字节。子程序调用混合 tail call 时还检查更严格条件：目标子程序含 tail call 且前序帧累计深度达到二百五十六字节会被拒绝。须同时核验版本、调用形态与架构支持，不能把单个常量当作无限递归许可。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/standardization/instruction-set.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF ISA: basic/wide encoding and program-local calls\">[eb-isa]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/linux/bpf_verifier.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier call-frame and stack-slot representation\">[eb-verifier-state]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/bpf_design_QA.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF design Q&amp;A: calling convention and API stability\">[eb-design-qa]<\/a><\/p>\n\n<p>传统 helper 由静态编号调用，属于内核对 BPF 承诺的接口；kfunc 通过 BTF 描述与解析暴露的内核函数，接口不具有相同的稳定性承诺。二者都不是任意内核函数调用权限。kfunc 按程序类型注册，验证器还检查参数类型、可空性、引用获取/释放和可睡眠上下文；仅有函数名或 BTF 记录不足以证明当前程序可调用。增加 kfunc 依赖时应探测目标能力并记录版本，不能期待 CO-RE 自动补出缺失实现。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/bpf_design_QA.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF design Q&amp;A: calling convention and API stability\">[eb-design-qa]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/kfuncs.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: kfunc registration, argument contracts and lifecycle\">[eb-kfuncs]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/standardization/instruction-set.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF ISA: basic/wide encoding and program-local calls\">[eb-isa]<\/a><\/p>\n\n<h3>目标代码包含程序，也包含解释程序所需的信息<\/h3>\n\n<p>典型构建由 Clang 把受约束的 C 编译为 BPF 指令，输出 ELF 对象。程序段、map 定义、数据段、符号表和重定位信息在同一对象中协作。<code>SEC(&quot;tracepoint/sched/sched_switch&quot;)<\/code> 并不是 C 语言赋予的内核能力；它把函数放入带约定名称的 ELF section，由 libbpf 解释程序类型与自动挂载线索。<code>SEC<\/code>、<code>__uint<\/code> 和 <code>__type<\/code> 等宏帮助编码元数据，最终仍须经过加载器和内核检查。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/bpf_helpers.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: BPF C section and map-definition helper macros\">[eb-helpers]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/libbpf/libbpf_overview.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: libbpf overview and CO-RE lifecycle\">[eb-libbpf-overview]<\/a><\/p>\n\n<p>普通 ELF 重定位与 CO-RE 重定位必须分开理解。前者解决符号、数据或函数在对象中的关联。例如固定版本 LLVM 重定位文档中，<code>R_BPF_64_64<\/code> 用于 <code>ld_imm64<\/code>，<code>R_BPF_64_32<\/code> 用于调用；调用的重定位计算包含按八字节指令单位换算。CO-RE 则回答“编译时对某种类型的访问，在目标内核类型中应如何实现”。两类记录可能同处一个 ELF，却不解决同一问题；把 ELF 所有 relocation 都叫“内核字段偏移适配”会遗漏全局变量和 BPF 子程序链接。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/llvm_reloc.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: LLVM ELF relocations and CO-RE relocation records\">[eb-llvm-reloc]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><\/p>\n\n<p>BTF 用紧凑的类型记录和字符串表描述类型关系，类型 ID 在相应 BTF 对象中引用其他记录，并不是跨内核永恒不变的类型编号。<code>.BTF.ext<\/code> 在 ELF 中承载函数、行号和 CO-RE 信息，头部有真实字段 <code>core_relo_off<\/code> 与 <code>core_relo_len<\/code>。还要注意单位：某些内核 API 中指令位置以指令条数表示，ELF 扩展信息使用字节偏移；把二者混用会把正确的指令指向错误位置。调试信息让故障可定位，但不会替代指令验证。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/btf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF Type Format and BTF.ext\">[eb-btf]<\/a><\/p>\n\n<h3>CO-RE 是结构适配，不是完整兼容性证明<\/h3>\n\n<p>CO-RE 的合作方是编译器保留的访问意图、编译时类型信息、目标 BTF 和加载器。常见流程读取 <code>/sys/kernel/btf/vmlinux<\/code>，也可以针对目标类型信息生成 <code>vmlinux.h<\/code>。加载时 libbpf 匹配目标类型与访问路径，计算字段偏移、尺寸、存在性以及类型或枚举相关值，再修补指令的立即数或内存访问偏移。固定版本 <code>relo_core.c<\/code> 中可以直接读到计算与修补函数；这不是运行中每次读字段都查询 BTF 的动态反射。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/libbpf/libbpf_overview.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: libbpf overview and CO-RE lifecycle\">[eb-libbpf-overview]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><\/p>\n\n<p>设教学结构 <code>task_demo<\/code> 的 <code>latency<\/code> 字段在构建环境偏移为十六字节，在目标环境偏移为二十四字节。结构重定位可以把访问位置修正到二十四；假如字段在目标内核中的单位从纳秒变为微秒，即使名字、宽度和位置都能成功匹配，乘除比例仍可能完全错误。类似地，字段何时有效、在何种锁保护下读取、函数是否覆盖全部请求，以及读取值是否需要配对事件，都不由布局适配保证。这一例子中的偏移和字段为虚构教学值，不是任何真实 <code>task_struct<\/code> 布局。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/btf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF Type Format and BTF.ext\">[eb-btf]<\/a><\/p>\n\n<p>字段不存在也不意味着所有对象必须立刻失败。存在性检测可以引导程序走其他分支；无法完成的访问可能被加载器改写为会触发拒绝的“毒化”指令，只有实际可达时才阻止加载。因此，正确模式是能力检测与有意义的替代语义配合，而不是把失败吞掉后输出零。不要把未执行的分支解释为“该功能被完整支持”；应该把功能不可用与观测值为零分别呈现。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<h3>按阶段定位启动失败<\/h3>\n\n<p>libbpf 的生命周期可以概括为打开、加载、挂载与释放。打开阶段解析 ELF，收集外部引用、BTF、map、程序和重定位；此时可以修改配置。加载阶段准备目标 BTF、解析外部依赖和重定位，创建内核对象，向内核提交程序。固定的 v1.5.0 代码中，顶层加载顺序包含目标 BTF、外部引用、map 清理、重定位、BTF 加载、map 创建与程序加载；不能机械地宣称“所有重定位都发生在 map 创建之后”。不同重定位类别的最终处理散布在相应阶段。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: ELF collection, load ordering, section mapping and attach\">[eb-libbpf-load]<\/a><\/p>\n\n<p>内核程序加载路径检查程序类型、权限与策略，调用安全钩子和验证器，再选择执行引擎，成功后返回可引用该程序的文件描述符。权限能力受到程序类型、内核配置、BPF token 和系统策略影响，不能用一句“只要 root”概括全部部署条件。文件描述符表示已加载对象，不表示某个事件已经引用它；必须完成相应挂载，并在运行期间保留需要的对象引用。关闭、解除链接和清理 map 也属于实验设计，否则下一次实验可能混入旧状态。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/syscall.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF program load permissions, verifier and runtime selection\">[eb-load-syscall]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/libbpf/libbpf_overview.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: libbpf overview and CO-RE lifecycle\">[eb-libbpf-overview]<\/a><\/p>\n\n<p>故障报告应保存失败阶段、内核和加载器版本、选中的程序变体与验证日志。例如找不到 section 是对象问题，目标类型不匹配是重定位问题，非法内存访问是验证问题，目标 tracepoint 不存在是挂载问题。按这个顺序缩小问题，比反复调整采样频率更有效。对教学实验而言，先验证“无业务字段读取的计数程序”，再增加读字段和栈收集，可以使首次失败对应的机制变化可解释。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: ELF collection, load ordering, section mapping and attach\">[eb-libbpf-load]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf public API: object, tracepoint, ring and possible CPUs\">[eb-attach-api]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><\/p>\n\n","advanced":true},{"title":"验证器：抽象状态、路径收敛与资源义务","body":"### 3.1 验证的对象不是源代码文本\n\n验证器分析加载时的 BPF 指令及其环境。它维护寄存器、栈槽、指针来源、数值范围、调用帧以及资源引用等抽象状态。入口寄存器中含受限的上下文指针；未初始化寄存器不能直接读取。调用 helper 后，返回值进入 `R0`，`R1` 至 `R5` 按调用约定失效，`R6` 至 `R9` 可保存值。理解这一点才能解释：源代码中一个变量看似没变化，编译成指令后却因为 helper 调用跨越了寄存器生存期而不能直接沿用。[[eb-verifier-doc]](#src-eb-verifier-doc)\n\n抽象状态不是每个输入各跑一次。对标量，它可同时记录有符号和无符号上下界，以及跟踪已知位与未知位的 tnum；对指针，它还记录对象类别、固定偏移、可变偏移和相关身份。例如一个读入的八位数起初范围为零到二百五十五；经过“小于八”的条件分支，某条路径可以缩小为零到七，从而证明以它访问八元素数组安全。若条件只约束了有符号比较，而后续计算按无符号解释，则不能仅凭源代码直觉认定范围足够。[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-verifier-code]](#src-eb-verifier-code)\n\ntnum 可写成 `(value, mask)`：`mask` 为一的位未知，为零的位由 `value` 指定。官方文档的字节例子从 `(0,0xff)` 出发，按位或 `0x40` 后为 `(0x40,0xbf)`。这不是统计概率，未知位之间也不承诺独立；加法的进位会扩大不确定性，因此按位信息与数值区间需要协同。对性能观测程序，位掩码、直方图索引和长度计算常直接影响是否能证明 map 访问有界。[[eb-verifier-doc]](#src-eb-verifier-doc)\n\n### 3.2 安全证明要求沿每条可达路径成立\n\nmap 查询返回的值可能为空。必须先排除空指针，再按 map 的 value 大小读写；指针的身份关系还能让验证器把同一来源的空值检查传播到相关副本。栈内存则必须在被读取或传给 helper 前完成初始化。只初始化事件结构中的几个可见字段而漏掉填充字节，可能导致拒绝或数据泄露风险；教学代码应显式初始化所有将输出的字节。helper 可用性和参数类型由程序类型与上下文约束，不能因为另一个示例能调用就直接复制。[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-verifier-code]](#src-eb-verifier-code)\n\n验证器还跟踪资源义务。ring buffer 的成功 reserve 获得一项待释放引用，每条后续可达退出路径都要 submit 或 discard；保留成功后提前 `return` 会违反这一义务。它与“指针是否落在合法范围内”是两类约束：前者要求生命周期闭合，后者要求访问位置安全。把失败分支画成状态机比只盯着 happy path 更容易发现遗漏，特别是在增加多个条件过滤之后。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-ring-code]](#src-eb-ring-code)[[eb-verifier-code]](#src-eb-verifier-code)\n\n### 3.3 剪枝不是看到相同指令地址就停止\n\n路径分支会使状态数量增长。若某个程序点的既有状态已经被证明安全，新状态又被其安全条件覆盖，则无需重走后续路径。v6.12 的 `regsafe` 会考虑类型、范围、tnum、身份关联及存活性；`states_equal` 还比较调用帧、调用点、锁、RCU 和可睡眠状态。仅仅两个寄存器当前数值相等，不足以说明状态可互换；一个是 map 指针、另一个是普通整数，就不能以同样方式继续访问内存。[[eb-verifier-code]](#src-eb-verifier-code)\n\n存活性允许忽略将来不会再被读取的差异。设两条路径在一个无后续用途的临时寄存器中分别留下三和五，而用于数组索引的寄存器都满足同样的安全范围，前一个差异可能无需阻止剪枝。反之，两个值之间共享身份所表达的相关性若影响后续边界检查，就必须保留。状态收敛因此是一种保守抽象与证明复用，不能简单归结为哈希去重，也不能随意把所有相似路径折叠。[[eb-verifier-code]](#src-eb-verifier-code)\n\n### 3.4 循环与复杂度：要读当前源码，不能复制旧口号\n\nv6.12 的 `verifier.rst` 开头仍含“DAG 检查禁止循环”的旧文字，但同一版本源码有循环检查、回调状态和开放编码迭代器收敛逻辑。因此本章不把“eBPF 不支持循环”当作现行规则。有界循环并不等于验证器必然接受：边界能否证明、分支组合、状态精度和处理指令复杂度都可能成为限制。源码里的已处理指令计数反映探索成本，不等于最终字节码条数；一百条指令的多分支循环可能比更长的直线程序更难验证。[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-verifier-code]](#src-eb-verifier-code)\n\n遇到“无限循环”或“程序过复杂”应先读验证日志，明确是循环没有证明终止，还是状态探索达到限制。一个尚未完成证明的循环里重现相似状态，不可冒充“已验证安全的状态缓存命中”。常见改进是缩短可证明的循环上界、把过滤提前、减少循环体内分支，并让边界检查紧邻危险访问。验证通过仍不证明结果公式正确，也不证明并发聚合没有竞态；安全性、终止性、统计有效性与性能预算是分别需要回答的问题。[[eb-verifier-code]](#src-eb-verifier-code)","html":"<figure class=\"advanced-figure\" id=\"fig-bpf-verifier\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 380\" role=\"img\" aria-labelledby=\"bpf-verifier-title bpf-verifier-desc\"><title id=\"bpf-verifier-title\">验证器跟踪的是抽象状态<\/title><desc id=\"bpf-verifier-desc\">示例表达空指针检查如何收窄指针状态。实际 verifier 还追踪标量范围、已知位、栈初始化、引用及路径等；图不覆盖全部规则。<\/desc><defs><marker id=\"bpf-verifier-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"380\" fill=\"white\" rx=\"16\"/>\n<rect x=\"20\" y=\"105\" width=\"235\" height=\"110\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"137.5\" y=\"146.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">map_lookup_elem<\/text>\n<text x=\"137.5\" y=\"173.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">PTR_OR_NULL<\/text>\n<rect x=\"350\" y=\"20\" width=\"260\" height=\"105\" rx=\"13\" fill=\"#BD6500\" fill-opacity=\".075\" stroke=\"#BD6500\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"59.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">空指针分支<\/text>\n<text x=\"480.0\" y=\"86.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">结束 / 不解引用<\/text>\n<rect x=\"350\" y=\"220\" width=\"260\" height=\"105\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"259.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">非空分支<\/text>\n<text x=\"480.0\" y=\"286.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">有效 map value 指针<\/text>\n<line x1=\"260\" y1=\"150\" x2=\"345\" y2=\"75\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-verifier-arrow)\"/>\n<text x=\"302.5\" y=\"97.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"16\" text-anchor=\"middle\" dominant-baseline=\"middle\">== NULL<\/text>\n<line x1=\"260\" y1=\"170\" x2=\"345\" y2=\"265\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-verifier-arrow)\"/>\n<text x=\"302.5\" y=\"202.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"16\" text-anchor=\"middle\" dominant-baseline=\"middle\">!= NULL<\/text>\n<rect x=\"715\" y=\"220\" width=\"220\" height=\"105\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"825.0\" y=\"259.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">再检查偏移与边界<\/text>\n<text x=\"825.0\" y=\"286.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">允许受限访问<\/text>\n<line x1=\"615\" y1=\"273\" x2=\"710\" y2=\"273\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-verifier-arrow)\"/>\n<text x=\"785\" y=\"80\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"20\" text-anchor=\"middle\" dominant-baseline=\"middle\">证明模型内安全<\/text>\n<text x=\"785\" y=\"117\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">不证明业务语义正确<\/text>\n<\/svg><figcaption><strong>验证器跟踪的是抽象状态。<\/strong> 示例表达空指针检查如何收窄指针状态。实际 verifier 还追踪标量范围、已知位、栈初始化、引用及路径等；图不覆盖全部规则。 <a class=\"figure-open\" href=\"figures/bpf-verifier.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<h3>验证的对象不是源代码文本<\/h3>\n\n<p>验证器分析加载时的 BPF 指令及其环境。它维护寄存器、栈槽、指针来源、数值范围、调用帧以及资源引用等抽象状态。入口寄存器中含受限的上下文指针；未初始化寄存器不能直接读取。调用 helper 后，返回值进入 <code>R0<\/code>，<code>R1<\/code> 至 <code>R5<\/code> 按调用约定失效，<code>R6<\/code> 至 <code>R9<\/code> 可保存值。理解这一点才能解释：源代码中一个变量看似没变化，编译成指令后却因为 helper 调用跨越了寄存器生存期而不能直接沿用。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><\/p>\n\n<p>抽象状态不是每个输入各跑一次。对标量，它可同时记录有符号和无符号上下界，以及跟踪已知位与未知位的 tnum；对指针，它还记录对象类别、固定偏移、可变偏移和相关身份。例如一个读入的八位数起初范围为零到二百五十五；经过“小于八”的条件分支，某条路径可以缩小为零到七，从而证明以它访问八元素数组安全。若条件只约束了有符号比较，而后续计算按无符号解释，则不能仅凭源代码直觉认定范围足够。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<p>tnum 可写成 <code>(value, mask)<\/code>：<code>mask<\/code> 为一的位未知，为零的位由 <code>value<\/code> 指定。官方文档的字节例子从 <code>(0,0xff)<\/code> 出发，按位或 <code>0x40<\/code> 后为 <code>(0x40,0xbf)<\/code>。这不是统计概率，未知位之间也不承诺独立；加法的进位会扩大不确定性，因此按位信息与数值区间需要协同。对性能观测程序，位掩码、直方图索引和长度计算常直接影响是否能证明 map 访问有界。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><\/p>\n\n<h3>安全证明要求沿每条可达路径成立<\/h3>\n\n<p>map 查询返回的值可能为空。必须先排除空指针，再按 map 的 value 大小读写；指针的身份关系还能让验证器把同一来源的空值检查传播到相关副本。栈内存则必须在被读取或传给 helper 前完成初始化。只初始化事件结构中的几个可见字段而漏掉填充字节，可能导致拒绝或数据泄露风险；教学代码应显式初始化所有将输出的字节。helper 可用性和参数类型由程序类型与上下文约束，不能因为另一个示例能调用就直接复制。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<p>验证器还跟踪资源义务。ring buffer 的成功 reserve 获得一项待释放引用，每条后续可达退出路径都要 submit 或 discard；保留成功后提前 <code>return<\/code> 会违反这一义务。它与“指针是否落在合法范围内”是两类约束：前者要求生命周期闭合，后者要求访问位置安全。把失败分支画成状态机比只盯着 happy path 更容易发现遗漏，特别是在增加多个条件过滤之后。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<h3>剪枝不是看到相同指令地址就停止<\/h3>\n\n<p>路径分支会使状态数量增长。若某个程序点的既有状态已经被证明安全，新状态又被其安全条件覆盖，则无需重走后续路径。v6.12 的 <code>regsafe<\/code> 会考虑类型、范围、tnum、身份关联及存活性；<code>states_equal<\/code> 还比较调用帧、调用点、锁、RCU 和可睡眠状态。仅仅两个寄存器当前数值相等，不足以说明状态可互换；一个是 map 指针、另一个是普通整数，就不能以同样方式继续访问内存。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<p>存活性允许忽略将来不会再被读取的差异。设两条路径在一个无后续用途的临时寄存器中分别留下三和五，而用于数组索引的寄存器都满足同样的安全范围，前一个差异可能无需阻止剪枝。反之，两个值之间共享身份所表达的相关性若影响后续边界检查，就必须保留。状态收敛因此是一种保守抽象与证明复用，不能简单归结为哈希去重，也不能随意把所有相似路径折叠。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<h3>循环与复杂度：要读当前源码，不能复制旧口号<\/h3>\n\n<p>v6.12 的 <code>verifier.rst<\/code> 开头仍含“DAG 检查禁止循环”的旧文字，但同一版本源码有循环检查、回调状态和开放编码迭代器收敛逻辑。因此本章不把“eBPF 不支持循环”当作现行规则。有界循环并不等于验证器必然接受：边界能否证明、分支组合、状态精度和处理指令复杂度都可能成为限制。源码里的已处理指令计数反映探索成本，不等于最终字节码条数；一百条指令的多分支循环可能比更长的直线程序更难验证。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n<p>遇到“无限循环”或“程序过复杂”应先读验证日志，明确是循环没有证明终止，还是状态探索达到限制。一个尚未完成证明的循环里重现相似状态，不可冒充“已验证安全的状态缓存命中”。常见改进是缩短可证明的循环上界、把过滤提前、减少循环体内分支，并让边界检查紧邻危险访问。验证通过仍不证明结果公式正确，也不证明并发聚合没有竞态；安全性、终止性、统计有效性与性能预算是分别需要回答的问题。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><\/p>\n\n","advanced":true},{"title":"执行引擎与挂载入口决定观测语义","body":"### 4.1 JIT 与解释执行\n\n通过验证的程序由内核选择执行方式。通用代码有解释器分派表，也会调用架构 JIT，把 BPF 指令转换为本机指令。不能简单说 JIT 总是可选优化：`CONFIG_BPF_JIT_ALWAYS_ON`，以及涉及某些 kfunc 的程序，会要求 JIT；相关失败可能返回不支持，而非总能回退。常量混淆等准备步骤也可能改写指令，故原始 ELF 指令、加载后指令和最终机器码不是同一个观察层次。[[eb-runtime-select]](#src-eb-runtime-select)\n\nx86 的 JIT 会生成函数序言、算术与访存指令、跳转和调用，并用多轮计算稳定指令地址与生成长度。v6.12 中可见先估计每条指令位置，再反复 `do_jit`，待程序长度收敛后分配并生成最终镜像。不同分支编码长度影响跳转距离，这是多轮过程的原因之一。JIT 降低解释分派成本，但不能消除 helper 自身、用户内存访问、缓存竞争或事件触发机制的费用。[[eb-x86-jit]](#src-eb-x86-jit)[[eb-ring-code]](#src-eb-ring-code)\n\n### 4.2 四类常用入口\n\n| 入口 | 触发条件与数据含义 | 主要适用问题 | 需要核验的边界 |\n|---|---|---|---|\n| `perf_event` | 时间或硬件事件达到采样条件 | CPU 热点、事件加权热点 | 频率与周期、节流、复用、特权范围、栈质量 |\n| tracepoint | 内核显式埋点执行 | 调度、系统调用、块设备等状态变化 | 是否真的覆盖所需状态，字段与版本语义 |\n| fentry/fexit | 可挂载函数入口或退出，经 trampoline 调用 | 内核函数调用次数、时延与参数分析 | BTF、架构和内核支持、目标函数生命周期 |\n| uprobe/uretprobe | 用户程序中所选文件位置触发 | 用户态库或应用函数观测 | ELF 偏移、二进制身份、优化、ABI、返回路径 |\n\n该表描述入口机制，不给出跨环境统一开销排名。`perf_event` 连接 BPF 程序时，libbpf 可使用 BPF link，或走 `PERF_EVENT_IOC_SET_BPF` 等兼容路径，然后启用事件。tracepoint 的 libbpf 路径也会建立相应 perf event。相同的 `SEC` 写法隐藏了加载器兼容分支，所以研究代码时应跟踪到实际系统调用与内核路径，而不止看外层函数名。[[eb-libbpf-load]](#src-eb-libbpf-load)[[eb-perf-abi]](#src-eb-perf-abi)\n\nfentry/fexit 的核心不是把函数名当字符串反复查询，而是依据目标信息建立 trampoline：它按调用模型保存必要状态、组织附加程序，并在需要时调用原函数。固定版本源码可见架构生成 trampoline、保护代码镜像，再通过 ftrace direct 或架构 text poke 注册入口。只有入口程序与同时存在退出程序时，trampoline 的标志与调用组织也不同。因此“所有 BPF 观测都靠断点陷入”不成立，反过来“所有挂载都是直接调用”也不成立。[[eb-trampoline]](#src-eb-trampoline)\n\nuprobe 的标识关联可执行文件 inode 与文件偏移；进程虚拟地址还要结合映射的起点和文件页偏移换算。固定源码包含软件断点写入以及原始指令保存、异位执行相关结构，所以不能用 JIT 很快推导出每次 uprobe 触发没有陷入成本。libbpf 可以从符号名定位文件偏移，但符号存在不保证它代表所有逻辑调用：内联函数可能没有独立入口，二进制替换会改变身份，Go ABI 与寄存器参数布局也不能套用普通 C 约定。[[eb-uprobe]](#src-eb-uprobe)[[eb-libbpf-load]](#src-eb-libbpf-load)\n\n函数入口与退出配对需要区分递归和并发，还要处理缺失事件与任务退出。用线程 ID 保存一个开始时间，会在递归调用时覆盖外层时间；若观测目标是 goroutine，运行时迁移还会破坏跨入口、退出的线程关联。选择入口本身是一项建模工作：已有语义明确的 tracepoint 通常比私有函数名更容易解释，但其覆盖范围仍要从调用点与事件定义证明。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-sched-core]](#src-eb-sched-core)[[eb-sched-trace]](#src-eb-sched-trace)","html":"\n<h3>JIT 与解释执行<\/h3>\n\n<p>通过验证的程序由内核选择执行方式。通用代码有解释器分派表，也会调用架构 JIT，把 BPF 指令转换为本机指令。不能简单说 JIT 总是可选优化：<code>CONFIG_BPF_JIT_ALWAYS_ON<\/code>，以及涉及某些 kfunc 的程序，会要求 JIT；相关失败可能返回不支持，而非总能回退。常量混淆等准备步骤也可能改写指令，故原始 ELF 指令、加载后指令和最终机器码不是同一个观察层次。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: interpreter dispatch and JIT runtime selection\">[eb-runtime-select]<\/a><\/p>\n\n<p>x86 的 JIT 会生成函数序言、算术与访存指令、跳转和调用，并用多轮计算稳定指令地址与生成长度。v6.12 中可见先估计每条指令位置，再反复 <code>do_jit<\/code>，待程序长度收敛后分配并生成最终镜像。不同分支编码长度影响跳转距离，这是多轮过程的原因之一。JIT 降低解释分派成本，但不能消除 helper 自身、用户内存访问、缓存竞争或事件触发机制的费用。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/arch/x86/net/bpf_jit_comp.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux x86: iterative BPF JIT instruction layout\">[eb-x86-jit]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<h3>四类常用入口<\/h3>\n\n<div class=\"table-wrap\"><table><thead><tr><th>入口<\/th><th>触发条件与数据含义<\/th><th>主要适用问题<\/th><th>需要核验的边界<\/th><\/tr><\/thead><tbody><tr><td><code>perf_event<\/code><\/td><td>时间或硬件事件达到采样条件<\/td><td>CPU 热点、事件加权热点<\/td><td>频率与周期、节流、复用、特权范围、栈质量<\/td><\/tr><tr><td>tracepoint<\/td><td>内核显式埋点执行<\/td><td>调度、系统调用、块设备等状态变化<\/td><td>是否真的覆盖所需状态，字段与版本语义<\/td><\/tr><tr><td>fentry/fexit<\/td><td>可挂载函数入口或退出，经 trampoline 调用<\/td><td>内核函数调用次数、时延与参数分析<\/td><td>BTF、架构和内核支持、目标函数生命周期<\/td><\/tr><tr><td>uprobe/uretprobe<\/td><td>用户程序中所选文件位置触发<\/td><td>用户态库或应用函数观测<\/td><td>ELF 偏移、二进制身份、优化、ABI、返回路径<\/td><\/tr><\/tbody><\/table><\/div><p>该表描述入口机制，不给出跨环境统一开销排名。<code>perf_event<\/code> 连接 BPF 程序时，libbpf 可使用 BPF link，或走 <code>PERF_EVENT_IOC_SET_BPF<\/code> 等兼容路径，然后启用事件。tracepoint 的 libbpf 路径也会建立相应 perf event。相同的 <code>SEC<\/code> 写法隐藏了加载器兼容分支，所以研究代码时应跟踪到实际系统调用与内核路径，而不止看外层函数名。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: ELF collection, load ordering, section mapping and attach\">[eb-libbpf-load]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><\/p>\n\n<p>fentry/fexit 的核心不是把函数名当字符串反复查询，而是依据目标信息建立 trampoline：它按调用模型保存必要状态、组织附加程序，并在需要时调用原函数。固定版本源码可见架构生成 trampoline、保护代码镜像，再通过 ftrace direct 或架构 text poke 注册入口。只有入口程序与同时存在退出程序时，trampoline 的标志与调用组织也不同。因此“所有 BPF 观测都靠断点陷入”不成立，反过来“所有挂载都是直接调用”也不成立。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/trampoline.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF fentry/fexit trampoline construction and registration\">[eb-trampoline]<\/a><\/p>\n\n<p>uprobe 的标识关联可执行文件 inode 与文件偏移；进程虚拟地址还要结合映射的起点和文件页偏移换算。固定源码包含软件断点写入以及原始指令保存、异位执行相关结构，所以不能用 JIT 很快推导出每次 uprobe 触发没有陷入成本。libbpf 可以从符号名定位文件偏移，但符号存在不保证它代表所有逻辑调用：内联函数可能没有独立入口，二进制替换会改变身份，Go ABI 与寄存器参数布局也不能套用普通 C 约定。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/uprobes.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: uprobe inode/offset identity and software breakpoints\">[eb-uprobe]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: ELF collection, load ordering, section mapping and attach\">[eb-libbpf-load]<\/a><\/p>\n\n<p>函数入口与退出配对需要区分递归和并发，还要处理缺失事件与任务退出。用线程 ID 保存一个开始时间，会在递归调用时覆盖外层时间；若观测目标是 goroutine，运行时迁移还会破坏跨入口、退出的线程关联。选择入口本身是一项建模工作：已有语义明确的 tracepoint 通常比私有函数名更容易解释，但其覆盖范围仍要从调用点与事件定义证明。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><\/p>\n\n","advanced":true},{"title":"Maps 与 ring buffer：共享状态如何变为用户态证据","body":"### 5.1 聚合优先，但必须保留质量信息\n\nmap 是有类型、大小与具体实现的数据结构，而不是无限容量的字典。ARRAY 的元素预分配并初始化为零，键界定在固定范围内；数组 value 按八字节对齐。按 CPU 分片的 PERCPU_ARRAY 为每个可能 CPU 配置独立 value，BPF 端查询获得当前 CPU 分片，用户态查询需要为所有 possible CPU 的对齐值准备缓冲区。这里不能用容器配额 CPU 数或当前 online CPU 数替代内核期望的 possible CPU 数。[[eb-map-array-doc]](#src-eb-map-array-doc)[[eb-map-array-code]](#src-eb-map-array-code)[[eb-attach-api]](#src-eb-attach-api)\n\n按 CPU 分片减少跨 CPU 写同一缓存行的竞争，却不是普适的“无并发”。还需要考虑程序是否可能嵌套执行、用户态是否同时读取、多个字段是否要求联合一致。全局计数器的读改写可能需要原子操作或适用的同步机制；用户态依次读多个 CPU 也不是全机同一瞬间的原子快照。对于停止后对账，应先解除入口并让在途执行和消费达到稳定，再读取最终值；持续观测时要明确快照误差或使用版本化、分段窗口等协议。[[eb-map-array-doc]](#src-eb-map-array-doc)[[eb-map-array-code]](#src-eb-map-array-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\n内存预算必须包含分片倍数。假设一个直方图有六十四个元素，每个 value 八字节，possible CPU 为一百二十八，则纯 value 数据为 `64×8×128=65536` 字节，还没算指针、map 元数据和分配开销。全局 map 的较小内存与 per-CPU 的较少共享写之间存在权衡。把全部原始事件都输出也不是免费替代：它把压力转移到 ring、消费回调和后续存储。实际工具常用内核聚合，同时保留少量诊断事件和各阶段失败计数。[[eb-map-array-code]](#src-eb-map-array-code)[[eb-ring-doc]](#src-eb-ring-doc)\n\n### 5.2 reserve、submit 与 consume 是三个独立动作\n\nBPF ring buffer 是多生产者、单消费推进模型的环形记录通道，跨 CPU 共享容量。它的 map key/value 大小为零，不能像普通 map 那样 lookup/update 数据；容量须满足相应的幂次和页对齐约束。`bpf_ringbuf_output` 把已有数据复制进去；`bpf_ringbuf_reserve` 返回 ring 中可填写的区域，随后必须调用公开 helper `bpf_ringbuf_submit` 或 `bpf_ringbuf_discard`。文档中的“commit”描述发布动作，内核内部函数也叫 commit，但可复制的 BPF 示例应使用真实公开名称 submit。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-ring-code]](#src-eb-ring-code)\n\n普通 reserve helper 的大小需要验证器能确定，适合固定格式事件；不能据此断言 eBPF 所有 ring API 都不支持动态大小，因为还有 dynptr 等不同接口与约束。本章用固定事件避免引入另一套资源证明。reserve 失败立即返回，不会等消费者腾出空间；失败原因既可能是容量不足，也可能是特定执行上下文中锁不能取得。尤其 NMI 路径使用 trylock，即使有空间，也不承诺 reserve 一定成功。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-ring-code]](#src-eb-ring-code)\n\n每条记录前面有八字节头部，记录总长度再按八字节对齐。头部长度字段含 busy 和 discard 标志，另有供提交定位 ring 的信息。生产者串行确定保留位置，然后可以并行填充；提交清除 busy，消费者通过 acquire 语义看见已发布的数据，并通过 release 推进消费位置。双重虚拟映射把绕回的物理页在地址空间中连续呈现，简化跨尾记录访问；它不意味着物理数据容量翻倍。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\n跨 CPU 的输出顺序是保留位置的顺序，而不是谁先调用 submit。设 A 先 reserve 后被延迟，B 后 reserve 并立即 submit；消费者看到 A 仍 busy 时会停下，不能先跳过 A 消费 B。只有 A submit 或 discard 后才能向前推进。这样提供跨 CPU 的保留顺序一致性，也引入头部阻塞。事件在 reserve 之前取时间戳时，时间戳顺序还可能与保留顺序不同；二者均不能自动升级为业务因果顺序。[[eb-ring-doc]](#src-eb-ring-doc)[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\n容量计算要看实现边界。对容量 `R=4096`、payload 五十六字节的教学例子，每条占 `align8(56+8)=64` 字节。v6.12 判断新生产位置与消费位置、最早 pending 位置的距离不能超过 `mask=R−1`，所以完全等长、未消费情形最多保留 `floor(4095/64)=63` 条，而不是六十四条。这个推导只计算数据环可容纳的记录，不包含单独的元数据页，也不排除 NMI 锁竞争先使保留失败。[[eb-ring-code]](#src-eb-ring-code)\n\n### 5.3 用户态消费也影响观测质量\n\nlibbpf 的消费者先检查 busy/discard，再调用用户回调，随后才推进消费位置。每条记录都打印完整 JSON 会延迟空间回收，从而增加生产端的保留失败。即使回调返回负值，固定版本实现也会推进越过当前记录后返回错误，所以不能假设下一次 poll 自动重放该条。应为解码失败、回调失败和上传失败设置独立指标，不要让它们与内核 ring 丢失共用一个含糊的 `lost` 数。[[eb-ring-consume]](#src-eb-ring-consume)\n\n自适应唤醒、强制唤醒和禁止唤醒控制通知策略，不改变记录发布与消费的基本正确性要求。批处理可降低唤醒成本，但增加延迟与突发队列占用；共享 ring 节省 per-CPU 空闲容量，却也让所有生产者共同依赖消费者吞吐。扩容能吸收短突发，不能修复长期生产率大于消费率。若必须做低延迟告警，应同时约束最大回调时间、消费调度间隔和允许积压量，而不只调大 map 大小。[[eb-rin
