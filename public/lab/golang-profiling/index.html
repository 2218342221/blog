g-doc]](#src-eb-ring-doc)[[eb-ring-consume]](#src-eb-ring-consume)","html":"<figure class=\"advanced-figure\" id=\"fig-bpf-ring\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"bpf-ring-title bpf-ring-desc\"><title id=\"bpf-ring-title\">ring buffer 的保留顺序与可见性<\/title><desc id=\"bpf-ring-desc\">多生产者共享 ring buffer。较早记录仍 busy 时，消费者不能跳过它消费后面的已提交记录；reserve 失败必须计数。<\/desc><defs><marker id=\"bpf-ring-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"35\" y=\"90\" width=\"210\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"140.0\" y=\"130.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">A 已提交<\/text>\n<rect x=\"260\" y=\"90\" width=\"210\" height=\"80\" rx=\"13\" fill=\"#BD6500\" fill-opacity=\".075\" stroke=\"#BD6500\" stroke-width=\"2\"/>\n<text x=\"365.0\" y=\"130.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">B busy<\/text>\n<rect x=\"485\" y=\"90\" width=\"210\" height=\"80\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"590.0\" y=\"130.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">C 已提交<\/text>\n<rect x=\"710\" y=\"90\" width=\"210\" height=\"80\" rx=\"13\" fill=\"#637386\" fill-opacity=\".075\" stroke=\"#637386\" stroke-width=\"2\"/>\n<text x=\"815.0\" y=\"130.0\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">空闲容量<\/text>\n<line x1=\"140\" y1=\"240\" x2=\"140\" y2=\"175\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-ring-arrow)\"/>\n<text x=\"140\" y=\"275\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">消费者<\/text>\n<text x=\"490\" y=\"215\" fill=\"#BD6500\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">读完 A 后在 B 等待<\/text>\n<text x=\"490\" y=\"255\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">C 已提交也不能越过 B<\/text>\n<\/svg><figcaption><strong>ring buffer 的保留顺序与可见性。<\/strong> 多生产者共享 ring buffer。较早记录仍 busy 时，消费者不能跳过它消费后面的已提交记录；reserve 失败必须计数。 <a class=\"figure-open\" href=\"figures/bpf-ring.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<h3>聚合优先，但必须保留质量信息<\/h3>\n\n<p>map 是有类型、大小与具体实现的数据结构，而不是无限容量的字典。ARRAY 的元素预分配并初始化为零，键界定在固定范围内；数组 value 按八字节对齐。按 CPU 分片的 PERCPU_ARRAY 为每个可能 CPU 配置独立 value，BPF 端查询获得当前 CPU 分片，用户态查询需要为所有 possible CPU 的对齐值准备缓冲区。这里不能用容器配额 CPU 数或当前 online CPU 数替代内核期望的 possible CPU 数。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/map_array.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ARRAY/PERCPU_ARRAY layout and concurrency\">[eb-map-array-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/arraymap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: per-CPU array lookup, copy and memory accounting\">[eb-map-array-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf public API: object, tracepoint, ring and possible CPUs\">[eb-attach-api]<\/a><\/p>\n\n<p>按 CPU 分片减少跨 CPU 写同一缓存行的竞争，却不是普适的“无并发”。还需要考虑程序是否可能嵌套执行、用户态是否同时读取、多个字段是否要求联合一致。全局计数器的读改写可能需要原子操作或适用的同步机制；用户态依次读多个 CPU 也不是全机同一瞬间的原子快照。对于停止后对账，应先解除入口并让在途执行和消费达到稳定，再读取最终值；持续观测时要明确快照误差或使用版本化、分段窗口等协议。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/map_array.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ARRAY/PERCPU_ARRAY layout and concurrency\">[eb-map-array-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/arraymap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: per-CPU array lookup, copy and memory accounting\">[eb-map-array-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>内存预算必须包含分片倍数。假设一个直方图有六十四个元素，每个 value 八字节，possible CPU 为一百二十八，则纯 value 数据为 <code>64×8×128=65536<\/code> 字节，还没算指针、map 元数据和分配开销。全局 map 的较小内存与 per-CPU 的较少共享写之间存在权衡。把全部原始事件都输出也不是免费替代：它把压力转移到 ring、消费回调和后续存储。实际工具常用内核聚合，同时保留少量诊断事件和各阶段失败计数。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/arraymap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: per-CPU array lookup, copy and memory accounting\">[eb-map-array-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><\/p>\n\n<h3>reserve、submit 与 consume 是三个独立动作<\/h3>\n\n<p>BPF ring buffer 是多生产者、单消费推进模型的环形记录通道，跨 CPU 共享容量。它的 map key/value 大小为零，不能像普通 map 那样 lookup/update 数据；容量须满足相应的幂次和页对齐约束。<code>bpf_ringbuf_output<\/code> 把已有数据复制进去；<code>bpf_ringbuf_reserve<\/code> 返回 ring 中可填写的区域，随后必须调用公开 helper <code>bpf_ringbuf_submit<\/code> 或 <code>bpf_ringbuf_discard<\/code>。文档中的“commit”描述发布动作，内核内部函数也叫 commit，但可复制的 BPF 示例应使用真实公开名称 submit。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<p>普通 reserve helper 的大小需要验证器能确定，适合固定格式事件；不能据此断言 eBPF 所有 ring API 都不支持动态大小，因为还有 dynptr 等不同接口与约束。本章用固定事件避免引入另一套资源证明。reserve 失败立即返回，不会等消费者腾出空间；失败原因既可能是容量不足，也可能是特定执行上下文中锁不能取得。尤其 NMI 路径使用 trylock，即使有空间，也不承诺 reserve 一定成功。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<p>每条记录前面有八字节头部，记录总长度再按八字节对齐。头部长度字段含 busy 和 discard 标志，另有供提交定位 ring 的信息。生产者串行确定保留位置，然后可以并行填充；提交清除 busy，消费者通过 acquire 语义看见已发布的数据，并通过 release 推进消费位置。双重虚拟映射把绕回的物理页在地址空间中连续呈现，简化跨尾记录访问；它不意味着物理数据容量翻倍。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>跨 CPU 的输出顺序是保留位置的顺序，而不是谁先调用 submit。设 A 先 reserve 后被延迟，B 后 reserve 并立即 submit；消费者看到 A 仍 busy 时会停下，不能先跳过 A 消费 B。只有 A submit 或 discard 后才能向前推进。这样提供跨 CPU 的保留顺序一致性，也引入头部阻塞。事件在 reserve 之前取时间戳时，时间戳顺序还可能与保留顺序不同；二者均不能自动升级为业务因果顺序。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>容量计算要看实现边界。对容量 <code>R=4096<\/code>、payload 五十六字节的教学例子，每条占 <code>align8(56+8)=64<\/code> 字节。v6.12 判断新生产位置与消费位置、最早 pending 位置的距离不能超过 <code>mask=R−1<\/code>，所以完全等长、未消费情形最多保留 <code>floor(4095/64)=63<\/code> 条，而不是六十四条。这个推导只计算数据环可容纳的记录，不包含单独的元数据页，也不排除 NMI 锁竞争先使保留失败。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<h3>用户态消费也影响观测质量<\/h3>\n\n<p>libbpf 的消费者先检查 busy/discard，再调用用户回调，随后才推进消费位置。每条记录都打印完整 JSON 会延迟空间回收，从而增加生产端的保留失败。即使回调返回负值，固定版本实现也会推进越过当前记录后返回错误，所以不能假设下一次 poll 自动重放该条。应为解码失败、回调失败和上传失败设置独立指标，不要让它们与内核 ring 丢失共用一个含糊的 <code>lost<\/code> 数。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>自适应唤醒、强制唤醒和禁止唤醒控制通知策略，不改变记录发布与消费的基本正确性要求。批处理可降低唤醒成本，但增加延迟与突发队列占用；共享 ring 节省 per-CPU 空闲容量，却也让所有生产者共同依赖消费者吞吐。扩容能吸收短突发，不能修复长期生产率大于消费率。若必须做低延迟告警，应同时约束最大回调时间、消费调度间隔和允许积压量，而不只调大 map 大小。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<div class=\"advanced-interactives\"><div class=\"ml-labs\" id=\"ml-mechanism-labs\"><section class=\"ml-card ml-ring-card\" id=\"ml-ring-lab\" aria-labelledby=\"ml-ring-title\">\n      <div class=\"ml-card-heading\"><div><span class=\"ml-tool-label\">01 / eBPF ring buffer<\/span><h3 id=\"ml-ring-title\">B 先提交，为什么还要等 A？<\/h3><\/div><output id=\"ml-ring-step\" class=\"ml-step-badge\">0 / 6 步<\/output><\/div>\n      <p class=\"ml-description\">两个记录按 A → B 的顺序预留空间。消费者按预留顺序前进，遇到尚未提交的 busy 记录就停下。<\/p>\n      <ol class=\"ml-step-list\" id=\"ml-ring-steps\" aria-label=\"实验步骤\">\n        <li data-ml-step=\"1\">A reserve<\/li><li data-ml-step=\"2\">B reserve<\/li><li data-ml-step=\"3\">B submit<\/li><li data-ml-step=\"4\">consumer 读 A<\/li><li data-ml-step=\"5\">A submit<\/li><li data-ml-step=\"6\">consume A / B<\/li>\n      <\/ol>\n      <div class=\"ml-ring-layout\">\n        <div>\n          <div class=\"ml-ring-records\" aria-label=\"按预留顺序排列的记录\">\n            <div class=\"ml-ring-record ml-record-empty\" id=\"ml-ring-record-a\"><span class=\"ml-record-letter\">A<\/span><span class=\"ml-record-status\" id=\"ml-ring-status-a\">尚未预留<\/span><code id=\"ml-ring-flag-a\">—<\/code><\/div>\n            <span class=\"ml-record-arrow\" aria-hidden=\"true\">→<\/span>\n            <div class=\"ml-ring-record ml-record-empty\" id=\"ml-ring-record-b\"><span class=\"ml-record-letter\">B<\/span><span class=\"ml-record-status\" id=\"ml-ring-status-b\">尚未预留<\/span><code id=\"ml-ring-flag-b\">—<\/code><\/div>\n          <\/div>\n          <p class=\"ml-consumer-position\"><span aria-hidden=\"true\">↑<\/span> <span id=\"ml-ring-consumer\">consumer 位于 A 将要出现的位置<\/span><\/p>\n        <\/div>\n        <dl class=\"ml-ring-facts\"><div><dt>预留顺序<\/dt><dd id=\"ml-ring-reserved\">—<\/dd><\/div><div><dt>实际提交顺序<\/dt><dd id=\"ml-ring-submitted\">—<\/dd><\/div><div><dt>消费结果<\/dt><dd id=\"ml-ring-consumed\">—<\/dd><\/div><\/dl>\n      <\/div>\n      <div class=\"ml-state-note\" id=\"ml-ring-note\" aria-live=\"polite\"><strong>准备开始<\/strong><span>点击“前进一步”，让 A 先预留一条记录。<\/span><\/div>\n      <div class=\"ml-controls\"><button class=\"ml-button ml-button-primary\" type=\"button\" id=\"ml-ring-next\">前进一步 →<\/button><button class=\"ml-button ml-button-secondary\" type=\"button\" id=\"ml-ring-reset\">重置<\/button><\/div>\n      <p class=\"ml-boundary\">模型只展示预留与提交的可见性，省略容量、回卷和唤醒。A → B 是缓冲区预留顺序，不保证外部事件的实际发生顺序。<\/p>\n    <\/section><\/div><\/div>","advanced":true},{"title":"采样、栈展开与 Go 运行时边界","body":"### 6.1 频率参数不是样本数量保证\n\n`perf_event_attr` 以同一字段表达采样 period 或 frequency，由 `freq` 位区分。按事件周期采样时，一个样本可以代表该周期内的一组事件；频率模式则尝试调整周期接近目标频率。内核会依据中断开销和频率反馈调整、节流，因此设置九十九赫兹不保证十秒恰好九百九十个有效栈。被排除的内核或用户态、目标线程未运行的时间、事件复用与处理失败都会影响数据覆盖。[[eb-perf-abi]](#src-eb-perf-abi)[[eb-perf-core]](#src-eb-perf-core)\n\nPMU 事件发生与采样记录中的指令位置也可能存在 skid；`precise_ip` 表达相关要求和能力，不能把任意采样 IP 都当作触发硬件事件的精确指令。对复用计数器，`time_enabled` 与 `time_running` 有助于解释实际运行覆盖并缩放计数值；它们不能恢复在未运行期间从未采集的调用栈，也不能保证热路径在各阶段均匀出现。计数修正与分布修复必须分开。[[eb-perf-abi]](#src-eb-perf-abi)\n\n### 6.2 收集地址、展开栈、符号化是三件事\n\n栈展开从采样寄存器与可读内存恢复调用地址序列；符号化再把地址映射为函数、源文件、行号和内联层次。用户态 ASLR、映射变化和二进制版本会影响符号化，因此保存进程映射与 build ID 很重要。`bpf_get_stack` 的 build-ID 模式还规定了文件偏移的含义：它相对于文件起点，不是相对于对象装载基址；映射到 ELF 符号时需按节地址与文件偏移调整。把所有偏移一律加基址会产生看似合理的错误符号。[[eb-stack-helper]](#src-eb-stack-helper)\n\n`bpf_get_stackid` 把地址序列放入 STACK_TRACE map，并返回可作为聚合键的标识。它并不保证无限多不同栈都有唯一 ID。v6.12 实现对栈做哈希，映射到桶；默认会比较内容并在冲突等情况返回错误。`BPF_F_FAST_STACK_CMP` 允许仅按哈希比较，`BPF_F_REUSE_STACKID` 允许冲突时丢弃旧栈。若计数 map 仍按旧 ID 累积，而栈表已被覆盖，后续可能把旧计数解释到新栈，因此窗口轮转和栈表生命周期属于正确性条件。[[eb-stack-helper]](#src-eb-stack-helper)[[eb-stackmap]](#src-eb-stackmap)\n\n固定 Linux x86 路径中，helper 经 `get_perf_callchain` 到架构的 `perf_callchain_user`，后者从采样寄存器的 BP 出发，读取下一帧与返回地址，直到深度上限或读取失败。此路径依赖可用的 frame pointer 链，不是通用 DWARF 解释器。内核代码还针对函数入口处 BP 尚未建立、以及 uretprobe trampoline 返回地址等情况做修正，这些细节说明“有地址就能完整展开”过于乐观。栈深度限制、不可访问内存与体系结构差异均应作为质量信息报告。[[eb-stackmap]](#src-eb-stackmap)[[eb-callchain]](#src-eb-callchain)[[eb-x86-callchain]](#src-eb-x86-callchain)\n\n`perf record --call-graph dwarf` 走另一种策略：记录一定范围的用户栈字节，供后续依据展开信息处理，固定 v6.12 文档默认栈转储为八千一百九十二字节；内核栈使用其自身的展开机制。该版本 `perf record --off-cpu` 文档明确其 BPF off-CPU 路径只用 frame pointer，但这不能推广为“所有 eBPF profiler 不可能支持 DWARF”。其他工具可以在用户态预处理展开规则、向 BPF 提供受限表或实现专用 unwinder，其能力与开销必须逐项目、逐架构核验。[[eb-perf-record]](#src-eb-perf-record)[[eb-x86-callchain]](#src-eb-x86-callchain)\n\n### 6.3 Go 的物理执行栈不等于请求历史\n\nGo 的 G 表示 goroutine，M 是 OS 线程，P 提供执行用户 Go 代码所需的调度和分配资源。内核采样首先命中 M 当前所执行的代码；一个等待 channel 的 G 没有因此占据某个正在运行的用户栈。不同 G 可先后在同一个 M 上运行，同一个 G 也可在不同 M 上恢复，所以 `tid` 既不是稳定 goroutine ID，也不是请求 ID。看到一个进程 CPU 栈，不能推出该进程全部 goroutine 的等待分布。[[eb-go-runtime]](#src-eb-go-runtime)\n\nGo 用户栈动态增长或收缩；runtime 的 `copystack` 会分配新栈、复制数据，调整调度上下文、defer、panic 和栈内指针，再更新 G 的栈边界。M 还拥有系统栈和信号栈，runtime 会在需要时切换过去执行。只按照某一时刻线程寄存器读取普通 FP 链的工具，必须面对这些边界；更专门的 Go unwinder 可以利用 runtime 元数据，但其布局与读取时机不能假定跨所有 Go 版本稳定。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-go-stack]](#src-eb-go-stack)\n\n同样，普通物理栈不会自然包含“创建这个 goroutine 的另一个 goroutine 的整个调用链”，更不包含远端请求的上下游关系。cgo、汇编、优化与内联还会影响物理帧和显示帧的对应；对 Go 程序，应先用带已知调用结构的纯 Go、小型 cgo 和调度等待样本验证目标工具实际保留哪些帧，再评估它能否回答问题。若目标是 goroutine 调度和等待原因，runtime trace 与应用任务标记通常提供不同于 CPU 采样的证据维度；不能把一张火焰图解释为所有时间的总账。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-go-stack]](#src-eb-go-stack)[[eb-perf-record]](#src-eb-perf-record)","html":"<figure class=\"advanced-figure\" id=\"fig-bpf-unwind\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"bpf-unwind-title bpf-unwind-desc\"><title id=\"bpf-unwind-title\">取得用户栈并不是读取几个地址<\/title><desc id=\"bpf-unwind-desc\">PC、寄存器、映射和运行时元数据决定可展开范围。FP、DWARF 及语言运行时展开策略不同；失败应进入未知归因。<\/desc><defs><marker id=\"bpf-unwind-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">采样现场<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">PC / SP / 寄存器<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-unwind-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">展开与身份<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">FP / DWARF / runtime<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#bpf-unwind-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">符号化与归因<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">构建 ID / 内联 / 标签<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">CO-RE 不会自动修复 Go 的用户态栈展开<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">截断、缺失映射、原生代码和 G/M 切换都可能影响结果<\/text>\n<\/svg><figcaption><strong>取得用户栈并不是读取几个地址。<\/strong> PC、寄存器、映射和运行时元数据决定可展开范围。FP、DWARF 及语言运行时展开策略不同；失败应进入未知归因。 <a class=\"figure-open\" href=\"figures/bpf-unwind.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<h3>频率参数不是样本数量保证<\/h3>\n\n<p><code>perf_event_attr<\/code> 以同一字段表达采样 period 或 frequency，由 <code>freq<\/code> 位区分。按事件周期采样时，一个样本可以代表该周期内的一组事件；频率模式则尝试调整周期接近目标频率。内核会依据中断开销和频率反馈调整、节流，因此设置九十九赫兹不保证十秒恰好九百九十个有效栈。被排除的内核或用户态、目标线程未运行的时间、事件复用与处理失败都会影响数据覆盖。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf: interrupt throttling and sample frequency feedback\">[eb-perf-core]<\/a><\/p>\n\n<p>PMU 事件发生与采样记录中的指令位置也可能存在 skid；<code>precise_ip<\/code> 表达相关要求和能力，不能把任意采样 IP 都当作触发硬件事件的精确指令。对复用计数器，<code>time_enabled<\/code> 与 <code>time_running<\/code> 有助于解释实际运行覆盖并缩放计数值；它们不能恢复在未运行期间从未采集的调用栈，也不能保证热路径在各阶段均匀出现。计数修正与分布修复必须分开。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><\/p>\n\n<h3>收集地址、展开栈、符号化是三件事<\/h3>\n\n<p>栈展开从采样寄存器与可读内存恢复调用地址序列；符号化再把地址映射为函数、源文件、行号和内联层次。用户态 ASLR、映射变化和二进制版本会影响符号化，因此保存进程映射与 build ID 很重要。<code>bpf_get_stack<\/code> 的 build-ID 模式还规定了文件偏移的含义：它相对于文件起点，不是相对于对象装载基址；映射到 ELF 符号时需按节地址与文件偏移调整。把所有偏移一律加基址会产生看似合理的错误符号。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><\/p>\n\n<p><code>bpf_get_stackid<\/code> 把地址序列放入 STACK_TRACE map，并返回可作为聚合键的标识。它并不保证无限多不同栈都有唯一 ID。v6.12 实现对栈做哈希，映射到桶；默认会比较内容并在冲突等情况返回错误。<code>BPF_F_FAST_STACK_CMP<\/code> 允许仅按哈希比较，<code>BPF_F_REUSE_STACKID<\/code> 允许冲突时丢弃旧栈。若计数 map 仍按旧 ID 累积，而栈表已被覆盖，后续可能把旧计数解释到新栈，因此窗口轮转和栈表生命周期属于正确性条件。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/stackmap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: stack trace hashing, collision and helper call chain\">[eb-stackmap]<\/a><\/p>\n\n<p>固定 Linux x86 路径中，helper 经 <code>get_perf_callchain<\/code> 到架构的 <code>perf_callchain_user<\/code>，后者从采样寄存器的 BP 出发，读取下一帧与返回地址，直到深度上限或读取失败。此路径依赖可用的 frame pointer 链，不是通用 DWARF 解释器。内核代码还针对函数入口处 BP 尚未建立、以及 uretprobe trampoline 返回地址等情况做修正，这些细节说明“有地址就能完整展开”过于乐观。栈深度限制、不可访问内存与体系结构差异均应作为质量信息报告。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/stackmap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: stack trace hashing, collision and helper call chain\">[eb-stackmap]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/callchain.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf: callchain selection and uretprobe return repair\">[eb-callchain]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/arch/x86/events/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux x86: user frame-pointer walk\">[eb-x86-callchain]<\/a><\/p>\n\n<p><code>perf record --call-graph dwarf<\/code> 走另一种策略：记录一定范围的用户栈字节，供后续依据展开信息处理，固定 v6.12 文档默认栈转储为八千一百九十二字节；内核栈使用其自身的展开机制。该版本 <code>perf record --off-cpu<\/code> 文档明确其 BPF off-CPU 路径只用 frame pointer，但这不能推广为“所有 eBPF profiler 不可能支持 DWARF”。其他工具可以在用户态预处理展开规则、向 BPF 提供受限表或实现专用 unwinder，其能力与开销必须逐项目、逐架构核验。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/tools/perf/Documentation/perf-record.txt\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf record: call graph modes and BPF off-CPU scope\">[eb-perf-record]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/arch/x86/events/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux x86: user frame-pointer walk\">[eb-x86-callchain]<\/a><\/p>\n\n<h3>Go 的物理执行栈不等于请求历史<\/h3>\n\n<p>Go 的 G 表示 goroutine，M 是 OS 线程，P 提供执行用户 Go 代码所需的调度和分配资源。内核采样首先命中 M 当前所执行的代码；一个等待 channel 的 G 没有因此占据某个正在运行的用户栈。不同 G 可先后在同一个 M 上运行，同一个 G 也可在不同 M 上恢复，所以 <code>tid<\/code> 既不是稳定 goroutine ID，也不是请求 ID。看到一个进程 CPU 栈，不能推出该进程全部 goroutine 的等待分布。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><\/p>\n\n<p>Go 用户栈动态增长或收缩；runtime 的 <code>copystack<\/code> 会分配新栈、复制数据，调整调度上下文、defer、panic 和栈内指针，再更新 G 的栈边界。M 还拥有系统栈和信号栈，runtime 会在需要时切换过去执行。只按照某一时刻线程寄存器读取普通 FP 链的工具，必须面对这些边界；更专门的 Go unwinder 可以利用 runtime 元数据，但其布局与读取时机不能假定跨所有 Go 版本稳定。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/stack.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime: copying stacks and pointer adjustment\">[eb-go-stack]<\/a><\/p>\n\n<p>同样，普通物理栈不会自然包含“创建这个 goroutine 的另一个 goroutine 的整个调用链”，更不包含远端请求的上下游关系。cgo、汇编、优化与内联还会影响物理帧和显示帧的对应；对 Go 程序，应先用带已知调用结构的纯 Go、小型 cgo 和调度等待样本验证目标工具实际保留哪些帧，再评估它能否回答问题。若目标是 goroutine 调度和等待原因，runtime trace 与应用任务标记通常提供不同于 CPU 采样的证据维度；不能把一张火焰图解释为所有时间的总账。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/stack.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime: copying stacks and pointer adjustment\">[eb-go-stack]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/tools/perf/Documentation/perf-record.txt\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf record: call graph modes and BPF off-CPU scope\">[eb-perf-record]<\/a><\/p>\n\n","advanced":true},{"title":"端到端成本、丢数对账与因果边界","body":"### 7.1 可复算的开销模型\n\n令每秒入口事件数为 `λ`，每个入口的挂载及过滤成本为 `c₀`；命中比例为 `q`，命中后读状态和聚合成本为 `c₁`；命中事件中执行栈收集的比例为 `s`、栈成本为 `c₂`；输出记录平均内核成本为 `c₃`、用户态消费成本为 `c₄`。在没有丢失且未加入额外共享竞争的简化模型中，CPU 秒每秒为 `λc₀+λq(c₁+sc₂+c₃+c₄)`，成本以秒计。这个式子描述预算，不声称事件相互独立，也不包含非线性缓存竞争、调度与上传费用。[[eb-map-array-code]](#src-eb-map-array-code)[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\n教学取值：`λ=100000/s`，`q=0.2`，`s=0.25`；`c₀=80ns`，`c₁=120ns`，`c₂=2000ns`，`c₃=180ns`，`c₄=400ns`。入口成本为 `0.008` CPU 秒每秒，命中后为 `20000×1200ns=0.024`，合计 `0.032`，即一个核的百分之三点二。若在过滤前对全部事件展开栈，仅栈项就变成 `0.2` CPU 秒每秒，而原栈项为 `0.01`，增加零点一九个核。数字是虚构可复算示例，不能用于承诺特定机器上的开销。[[eb-stackmap]](#src-eb-stackmap)[[eb-ring-code]](#src-eb-ring-code)\n\n生产评估还应分离编译加载成本、稳定运行成本、突发期成本、消费与符号化成本，以及被观测服务自身延迟变化。重复实验要固定工作负载、机器拓扑、事件率与保留策略，报告观察器开启前后的吞吐和延迟分布。低平均 CPU 不代表尾延迟没有变化；一个在极热同步路径触发的探针可能以很少总 CPU 改变关键队列。为了测量观察器成本而加入的观测同样可能扰动系统，应明确仪表层级与误差来源。[[eb-uprobe]](#src-eb-uprobe)[[eb-ring-code]](#src-eb-ring-code)[[eb-perf-core]](#src-eb-perf-core)\n\n### 7.2 队列积压与容量推导\n\n设实际输出每秒两万条、每条占六十四字节，则生产速率为 `1280000 B/s`；消费者每秒处理一万五千条，回收速率为 `960000 B/s`，积压按 `320000 B/s` 增长。取 `R=1048576`，初始已占 `262144` 字节，可用记录边界预算近似为 `R−1−262144`，达到满环约需 `2.4576s`。离散记录按六十四字节对齐，精确首次失败还由初始位置和到达时序决定。把 ring 加倍会延后失败，不会消除持续的五千条每秒吞吐缺口。[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\nring reserve 失败、perf 的 `PERF_RECORD_LOST`、`PERF_RECORD_LOST_SAMPLES`、栈 helper 返回错误、用户态解码失败和上传重试耗尽是不同阶段的质量事件。不能依赖 perf 的丢失通知自动覆盖自建 ring 的 reserve 失败；必须在程序中显式计数。失败计数本身也有数据类型、并发更新和读取窗口问题，例如全局非原子加一会把“丢失计数器”也写丢。质量指标需要与主指标同样认真地设计。[[eb-perf-abi]](#src-eb-perf-abi)[[eb-ring-code]](#src-eb-ring-code)[[eb-map-array-doc]](#src-eb-map-array-doc)\n\n### 7.3 一份能够对齐的账本\n\n令 `M` 为通过目标过滤的事件；`F` 为 reserve 失败；`S` 为成功 submit；`D` 为 reserve 后主动 discard；`C` 为用户回调已接收记录；`Q` 为仍排队记录。若每个命中只尝试一次 reserve，且没有在途未决引用，生产端有 `M=F+S+D`；在无其他消费错误、窗口一致的条件下有 `S=C+Q`。例如 `M=100000,F=2000,D=0,S=98000,C=97900,Q=100` 自洽。停挂并排空后，才可期望 `Q=0` 并直接对齐提交与消费；运行中不可把尚未消费的一百条称为已经丢失。[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)\n\n假设已消费的九万七千九百条中有三千条栈未知，这三千条仍是收到的事件，应留在 `unknown_stack` 桶中，而不能再次加到 reserve 失败数。若为了画漂亮火焰图把未知栈删除，图中的分母会从全部事件变成可展开事件。报告至少给出事件覆盖率、栈成功率、输出失败率及明确的统计窗口；比较两个版本时还要比较这些质量指标，否则“热点占比下降”可能只是新版本更难展开。[[eb-stack-helper]](#src-eb-stack-helper)[[eb-stackmap]](#src-eb-stackmap)[[eb-ring-consume]](#src-eb-ring-consume)\n\n丢数还可能引入选择偏差。设正常阶段与高负载阶段各发生一万条事件；正常阶段全保留，高负载阶段只保留两成。真实两个阶段各占一半，收到的样本却显示高负载阶段仅占 `2000/12000≈16.7%`。把总数乘以统一补偿系数无法恢复两种阶段的正确比例。若丢失恰好发生在某个长栈、热锁或突发 I/O 路径，偏差会直接扭曲诊断。需要降低事件量、改进聚合或分阶段报告，不能只给火焰图增加“已归一化”的标签。[[eb-ring-code]](#src-eb-ring-code)[[eb-perf-core]](#src-eb-perf-core)\n\n### 7.4 相关性到因果结论仍有距离\n\n某次调度切出与某次磁盘完成时间接近，不足以证明这个线程正在等待那笔 I/O。证明需要可关联的任务或请求身份、正确的状态转换和配对规则，并处理线程复用、跨 CPU 迁移、事件漏失与重试。一次切出与再次切入之间的间隔含阻塞等待与可运行排队等不同组成；若只读两个时间戳，不能自动拆分。ring 的有序消费只维护自己的记录顺序，不生成缺失的关联边。[[eb-sched-trace]](#src-eb-sched-trace)[[eb-sched-core]](#src-eb-sched-core)[[eb-ring-doc]](#src-eb-ring-doc)\n\n可用的结论层级应从弱到强：看到了某事件；在给定窗口和覆盖率下统计到某分布；多源证据支持某条等待链；改变被怀疑因素后，受控复测确认预期变化。eBPF 擅长补充系统边界处的证据，但因果定位仍依赖测量设计和干预验证。本章后续实验因此只承诺它实际建立的第一层、第二层事实，不借助工具名称暗示更多能力。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-sched-core]](#src-eb-sched-core)[[eb-perf-abi]](#src-eb-perf-abi)","html":"\n<h3>可复算的开销模型<\/h3>\n\n<p>令每秒入口事件数为 <code>λ<\/code>，每个入口的挂载及过滤成本为 <code>c₀<\/code>；命中比例为 <code>q<\/code>，命中后读状态和聚合成本为 <code>c₁<\/code>；命中事件中执行栈收集的比例为 <code>s<\/code>、栈成本为 <code>c₂<\/code>；输出记录平均内核成本为 <code>c₃<\/code>、用户态消费成本为 <code>c₄<\/code>。在没有丢失且未加入额外共享竞争的简化模型中，CPU 秒每秒为 <code>λc₀+λq(c₁+sc₂+c₃+c₄)<\/code>，成本以秒计。这个式子描述预算，不声称事件相互独 blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/uprobes.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: uprobe inode/offset identity and software breakpoints\">[eb-uprobe]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf: interrupt throttling and sample frequency feedback\">[eb-perf-core]<\/a><\/p>\n\n<h3>队列积压与容量推导<\/h3>\n\n<p>设实际输出每秒两万条、每条占六十四字节，则生产速率为 <code>1280000 B/s<\/code>；消费者每秒处理一万五千条，回收速率为 <code>960000 B/s<\/code>，积压按 <code>320000 B/s<\/code> 增长。取 <code>R=1048576<\/code>，初始已占 <code>262144<\/code> 字节，可用记录边界预算近似为 <code>R−1−262144<\/code>，达到满环约需 <code>2.4576s<\/code>。离散记录按六十四字节对齐，精确首次失败还由初始位置和到达时序决定。把 ring 加倍会延后失败，不会消除持续的五千条每秒吞吐缺口。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>ring reserve 失败、perf 的 <code>PERF_RECORD_LOST<\/code>、<code>PERF_RECORD_LOST_SAMPLES<\/code>、栈 helper 返回错误、用户态解码失败和上传重试耗尽是不同阶段的质量事件。不能依赖 perf 的丢失通知自动覆盖自建 ring 的 reserve 失败；必须在程序中显式计数。失败计数本身也有数据类型、并发更新和读取窗口问题，例如全局非原子加一会把“丢失计数器”也写丢。质量指标需要与主指标同样认真地设计。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/map_array.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ARRAY/PERCPU_ARRAY layout and concurrency\">[eb-map-array-doc]<\/a><\/p>\n\n<h3>一份能够对齐的账本<\/h3>\n\n<p>令 <code>M<\/code> 为通过目标过滤的事件；<code>F<\/code> 为 reserve 失败；<code>S<\/code> 为成功 submit；<code>D<\/code> 为 reserve 后主动 discard；<code>C<\/code> 为用户回调已接收记录；<code>Q<\/code> 为仍排队记录。若每个命中只尝试一次 reserve，且没有在途未决引用，生产端有 <code>M=F+S+D<\/code>；在无其他消费错误、窗口一致的条件下有 <code>S=C+Q<\/code>。例如 <code>M=100000,F=2000,D=0,S=98000,C=97900,Q=100<\/code> 自洽。停挂并排空后，才可期望 <code>Q=0<\/code> 并直接对齐提交与消费；运行中不可把尚未消费的一百条称为已经丢失。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>假设已消费的九万七千九百条中有三千条栈未知，这三千条仍是收到的事件，应留在 <code>unknown_stack<\/code> 桶中，而不能再次加到 reserve 失败数。若为了画漂亮火焰图把未知栈删除，图中的分母会从全部事件变成可展开事件。报告至少给出事件覆盖率、栈成功率、输出失败率及明确的统计窗口；比较两个版本时还要比较这些质量指标，否则“热点占比下降”可能只是新版本更难展开。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/stackmap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: stack trace hashing, collision and helper call chain\">[eb-stackmap]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><\/p>\n\n<p>丢数还可能引入选择偏差。设正常阶段与高负载阶段各发生一万条事件；正常阶段全保留，高负载阶段只保留两成。真实两个阶段各占一半，收到的样本却显示高负载阶段仅占 <code>2000/12000≈16.7%<\/code>。把总数乘以统一补偿系数无法恢复两种阶段的正确比例。若丢失恰好发生在某个长栈、热锁或突发 I/O 路径，偏差会直接扭曲诊断。需要降低事件量、改进聚合或分阶段报告，不能只给火焰图增加“已归一化”的标签。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/events/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf: interrupt throttling and sample frequency feedback\">[eb-perf-core]<\/a><\/p>\n\n<h3>相关性到因果结论仍有距离<\/h3>\n\n<p>某次调度切出与某次磁盘完成时间接近，不足以证明这个线程正在等待那笔 I/O。证明需要可关联的任务或请求身份、正确的状态转换和配对规则，并处理线程复用、跨 CPU 迁移、事件漏失与重试。一次切出与再次切入之间的间隔含阻塞等待与可运行排队等不同组成；若只读两个时间戳，不能自动拆分。ring 的有序消费只维护自己的记录顺序，不生成缺失的关联边。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><\/p>\n\n<p>可用的结论层级应从弱到强：看到了某事件；在给定窗口和覆盖率下统计到某分布；多源证据支持某条等待链；改变被怀疑因素后，受控复测确认预期变化。eBPF 擅长补充系统边界处的证据，但因果定位仍依赖测量设计和干预验证。本章后续实验因此只承诺它实际建立的第一层、第二层事实，不借助工具名称暗示更多能力。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/perf_event.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux perf ABI: sampling configuration and loss records\">[eb-perf-abi]<\/a><\/p>\n\n","advanced":true},{"title":"完整实验与研究生练习","body":"### 8.1 最小 C/libbpf 实验的契约\n\n配套文件为 `research/ebpf/example/switches.bpf.c`、`switches.c`、共享头和 README。入口为 `sched:sched_switch`，通过当前 TGID 筛选目标进程，输出时间戳、TGID、TID 和 CPU，使用 per-CPU 计数器记录命中数与 reserve 失败数。Linux v6.12 的实际调用点位于 `context_switch` 之前，因此当前任务对应即将切出的任务。程序不读取 tracepoint 上下文字段，也不读取内核私有结构，因此这个最小实验不演示 CO-RE 字段重定位。输入应为主机视角 TGID，不能直接套用容器 PID namespace 内的号码。[[eb-sched-core]](#src-eb-sched-core)[[eb-sched-trace]](#src-eb-sched-trace)[[eb-stack-helper]](#src-eb-stack-helper)[[eb-attach-api]](#src-eb-attach-api)\n\n它测得的是挂载有效期间被命中的调度切出观察，不是 CPU 时间、完整 off-CPU 时长或 Go 请求延迟。没有读取 `prev_state`，不能区分主动阻塞与被抢占；没有配对切入，不能计算等待区间。用户态先打开并加载对象、设置目标 TGID、创建消费者，之后才挂载，避免在配置未完成时产生无意义输出。运行十秒后解除链接、排空消费者并汇总所有 possible CPU 的计数，示范完整的配置、运行和收尾链路。[[eb-sched-trace]](#src-eb-sched-trace)[[eb-sched-core]](#src-eb-sched-core)[[eb-attach-api]](#src-eb-attach-api)\n\n环境要求是 Linux、具备 BPF 后端的 Clang、与 v1.5.0 API 相容的 libbpf 开发文件、libelf/zlib，以及允许目标 tracepoint 和 BPF/perf 挂载的本地策略。具体权限由目标环境决定，实验不建议关闭安全策略。当前编写环境只有 C 编译器与 pkg-config，未发现 Clang 与 libbpf 开发包；没有安装依赖、加载 BPF、修改内核参数或进行特权执行。因此验证状态为源码/API 审查与离线算术校验，不能标注为已编译或已在内核运行。[[eb-load-syscall]](#src-eb-load-syscall)[[eb-attach-api]](#src-eb-attach-api)\n\n### 8.2 练习与评分要点\n\n**练习一：结构与语义。** 给出一个字段宽度不变、偏移改变、单位也改变的假想版本升级，说明 CO-RE 能解决哪一部分，再设计独立的语义兼容测试。评分看是否把“加载成功”“字段可读”“结果单位正确”分成三个条件，并给出已知输入与期望输出，而不是只检查内核版本字符串。[[eb-core-relo]](#src-eb-core-relo)\n\n**练习二：验证状态。** 为一个先查询 map、再 reserve 事件、最后按条件退出的函数画控制流。找出空指针访问与未释放引用两种独立错误，给出每个出口的状态。增加循环后解释为什么字节码数量不变也可能增加验证成本。评分看是否使用类型、范围和资源义务，而不是背诵“BPF 不允许循环”。[[eb-verifier-doc]](#src-eb-verifier-doc)[[eb-verifier-code]](#src-eb-verifier-code)[[eb-ring-doc]](#src-eb-ring-doc)\n\n**练习三：队列。** 将环容量改为八千一百九十二字节，payload 改为七十三字节，求单条占用与最大等长未消费记录数。应得 `align8(73+8)=88`，`floor(8191/88)=93`。再说明为什么真实运行可能在未达到九十三条时 reserve 失败：NMI 锁竞争、已有占用以及未决保留均须纳入条件。[[eb-ring-code]](#src-eb-ring-code)\n\n**练习四：Go 诊断。** 某请求延迟两秒，CPU 样本只显示十毫秒解析工作。列出至少三种 CPU 采样没有充分覆盖的解释，并提出分别需要的证据。合格答案可以涉及 goroutine 等待、可运行排队、跨进程依赖与 cgo 阻塞，但不能仅凭这组数字认定其中任何一种；应使用 runtime 状态或可关联事件缩小假设。[[eb-go-runtime]](#src-eb-go-runtime)[[eb-sched-trace]](#src-eb-sched-trace)\n\n**练习五：质量对账。** 给定命中、reserve 失败、submit、消费和未知栈计数，判断窗口是否已排空、图中分母是什么、是否重复计入损失。进一步构造“丢失集中在最慢阶段”的反例，证明统一补偿比例不能保证恢复热点分布。评分看是否写出账本恒等式的前提并保留未知类别。[[eb-ring-code]](#src-eb-ring-code)[[eb-ring-consume]](#src-eb-ring-consume)[[eb-stackmap]](#src-eb-stackmap)\n\n**研究任务。** 把最小实验扩展为线程 off-CPU 区间记录：显式处理切出状态、切入配对、任务退出、重复或缺失事件、TID 生命周期与容量限制；再解释它距离 goroutine 或请求等待分析还缺什么。提交物必须包含测量契约、状态图、失败账本、受控工作负载、版本矩阵与实际运行日志。仅给一张火焰图，不足以证明系统正确。[[eb-sched-trace]](#src-eb-sched-trace)[[eb-sched-core]](#src-eb-sched-core)[[eb-go-runtime]](#src-eb-go-runtime)","html":"\n<h3>最小 C/libbpf 实验的契约<\/h3>\n\n<p>配套文件为 <code>research/ebpf/example/switches.bpf.c<\/code>、<code>switches.c<\/code>、共享头和 README。入口为 <code>sched:sched_switch<\/code>，通过当前 TGID 筛选目标进程，输出时间戳、TGID、TID 和 CPU，使用 per-CPU 计数器记录命中数与 reserve 失败数。Linux v6.12 的实际调用点位于 <code>context_switch<\/code> 之前，因此当前任务对应即将切出的任务。程序不读取 tracepoint 上下文字段，也不读取内核私有结构，因此这个最小实验不演示 CO-RE 字段重定位。输入应为主机视角 TGID，不能直接套用容器 PID namespace 内的号码。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/uapi/linux/bpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux BPF helper contract: context IDs, clocks and stack collection\">[eb-stack-helper]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf public API: object, tracepoint, ring and possible CPUs\">[eb-attach-api]<\/a><\/p>\n\n<p>它测得的是挂载有效期间被命中的调度切出观察，不是 CPU 时间、完整 off-CPU 时长或 Go 请求延迟。没有读取 <code>prev_state<\/code>，不能区分主动阻塞与被抢占；没有配对切入，不能计算等待区间。用户态先打开并加载对象、设置目标 TGID、创建消费者，之后才挂载，避免在配置未完成时产生无意义输出。运行十秒后解除链接、排空消费者并汇总所有 possible CPU 的计数，示范完整的配置、运行和收尾链路。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf public API: object, tracepoint, ring and possible CPUs\">[eb-attach-api]<\/a><\/p>\n\n<p>环境要求是 Linux、具备 BPF 后端的 Clang、与 v1.5.0 API 相容的 libbpf 开发文件、libelf/zlib，以及允许目标 tracepoint 和 BPF/perf 挂载的本地策略。具体权限由目标环境决定，实验不建议关闭安全策略。当前编写环境只有 C 编译器与 pkg-config，未发现 Clang 与 libbpf 开发包；没有安装依赖、加载 BPF、修改内核参数或进行特权执行。因此验证状态为源码/API 审查与离线算术校验，不能标注为已编译或已在内核运行。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/syscall.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF program load permissions, verifier and runtime selection\">[eb-load-syscall]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/libbpf.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf public API: object, tracepoint, ring and possible CPUs\">[eb-attach-api]<\/a><\/p>\n\n<h3>练习与评分要点<\/h3>\n\n<p><strong>练习一：结构与语义。<\/strong> 给出一个字段宽度不变、偏移改变、单位也改变的假想版本升级，说明 CO-RE 能解决哪一部分，再设计独立的语义兼容测试。评分看是否把“加载成功”“字段可读”“结果单位正确”分成三个条件，并给出已知输入与期望输出，而不是只检查内核版本字符串。<a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/relo_core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: calculating and patching CO-RE relocations\">[eb-core-relo]<\/a><\/p>\n\n<p><strong>练习二：验证状态。<\/strong> 为一个先查询 map、再 reserve 事件、最后按条件退出的函数画控制流。找出空指针访问与未释放引用两种独立错误，给出每个出口的状态。增加循环后解释为什么字节码数量不变也可能增加验证成本。评分看是否使用类型、范围和资源义务，而不是背诵“BPF 不允许循环”。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/verifier.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier register state, range tracking and pruning\">[eb-verifier-doc]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/verifier.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: verifier state containment, liveness and loop exploration\">[eb-verifier-code]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/Documentation/bpf/ringbuf.rst\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: BPF ring buffer reservation, ordering and wakeups\">[eb-ring-doc]<\/a><\/p>\n\n<p><strong>练习三：队列。<\/strong> 将环容量改为八千一百九十二字节，payload 改为七十三字节，求单条占用与最大等长未消费记录数。应得 <code>align8(73+8)=88<\/code>，<code>floor(8191/88)=93<\/code>。再说明为什么真实运行可能在未达到九十三条时 reserve 失败：NMI 锁竞争、已有占用以及未决保留均须纳入条件。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><\/p>\n\n<p><strong>练习四：Go 诊断。<\/strong> 某请求延迟两秒，CPU 样本只显示十毫秒解析工作。列出至少三种 CPU 采样没有充分覆盖的解释，并提出分别需要的证据。合格答案可以涉及 goroutine 等待、可运行排队、跨进程依赖与 cgo 阻塞，但不能仅凭这组数字认定其中任何一种；应使用 runtime 状态或可关联事件缩小假设。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><\/p>\n\n<p><strong>练习五：质量对账。<\/strong> 给定命中、reserve 失败、submit、消费和未知栈计数，判断窗口是否已排空、图中分母是什么、是否重复计入损失。进一步构造“丢失集中在最慢阶段”的反例，证明统一补偿比例不能保证恢复热点分布。评分看是否写出账本恒等式的前提并保留未知类别。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: ring buffer capacity, pending position and publish protocol\">[eb-ring-code]<\/a><a class=\"cite\" href=\"https://github.com/libbpf/libbpf/blob/09b9e83102eb8ab9e540d36b4559c55f3bcdb95d/src/ringbuf.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"libbpf: acquire/consume/release ring consumer\">[eb-ring-consume]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/bpf/stackmap.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: stack trace hashing, collision and helper call chain\">[eb-stackmap]<\/a><\/p>\n\n<p><strong>研究任务。<\/strong> 把最小实验扩展为线程 off-CPU 区间记录：显式处理切出状态、切入配对、任务退出、重复或缺失事件、TID 生命周期与容量限制；再解释它距离 goroutine 或请求等待分析还缺什么。提交物必须包含测量契约、状态图、失败账本、受控工作负载、版本矩阵与实际运行日志。仅给一张火焰图，不足以证明系统正确。<a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/include/trace/events/sched.h\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux: sched_switch event schema\">[eb-sched-trace]<\/a><a class=\"cite\" href=\"https://github.com/torvalds/linux/blob/adc218676eef25575469234709c2d87185ca223a/kernel/sched/core.c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux scheduler: trace_sched_switch before context_switch\">[eb-sched-core]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/HACKING.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go runtime HACKING: G/M/P, user/system/signal stacks\">[eb-go-runtime]<\/a><\/p>\n","advanced":true}],"labs":[],"quiz":[{"question":"一个 eBPF 程序通过 verifier 后，可以直接得出哪个结论？","options":["采集到的指标一定完整、无偏。","程序理解了请求之间的因果关系。","在该内核与程序类型的规则下，它通过了相应的程序安全性检查。","用户态消费者不可能丢失事件。"],"answer":2,"explanation":"Verifier 检查程序在相应规则下能否安全执行，不证明测量模型正确、采样覆盖完整或事件传输零损失。观察点、关联键、缓冲和消费者仍需分别检查。"}],"exercises":[],"references":["eb-libbpf-overview","eb-libbpf-load","eb-btf","eb-llvm-reloc","eb-core-relo","eb-helpers","eb-verifier-doc","eb-verifier-code","eb-load-syscall","eb-runtime-select","eb-x86-jit","eb-trampoline","eb-uprobe","eb-map-array-doc","eb-map-array-code","eb-ring-doc","eb-ring-code","eb-ring-consume","eb-perf-abi","eb-perf-core","eb-perf-record","eb-stack-helper","eb-stackmap","eb-callchain","eb-x86-callchain","eb-go-runtime","eb-go-stack","eb-sched-trace","eb-sched-core","eb-attach-api","eb-isa","eb-design-qa","eb-kfuncs","eb-verifier-state"],"part":"advanced","source_path":"research/ebpf.md"},{"id":"19","title":"pprof 的工作原理：从 Go 运行时测量到聚合报告","subtitle":"从 producer 的权重语义追到合并、过滤与报告。","objectives":["比较 CPU、heap、block 与 mutex 的生产及归因机制","推导 flat、cum、条件分母与差分的计算口径","用固定版本和可手算样本复核过滤、内联与递归"],"prerequisites":"已学习原教材相关基础；建议先完成第1–4、8、10、15章，再按第17–22章顺序研读。","sections":[{"title":"先建立测量契约：pprof 分析的是带语义的权重","body":"本章围绕一个问题展开：屏幕上的“180 ms、37.5%”究竟怎样产生，它允许我们推出什么，又丢失了什么。源码基线为 Go 1.25.0，完整提交 `6e676ab2b809d46623acb5988248d95d1eb7939c`；分析器源码固定为 google/pprof 提交 `ebaad5f31b4d25e6f51abf4d91b9611cff92db7b`。本章的可执行教学验证使用本机 Go 1.22.12 内置 `go tool pprof`，两者明确区分。检索与验证日期为 2026-10-04；没有把合成样本冒充运行时实测。\n\npprof 并不是 Go 专属采集器。google/pprof 项目自述的职责是读取 profiling samples，解析 profile.proto，再生成文本、调用图和火焰图等报告。Go 的 runtime/pprof 是生产者之一；其他语言运行时、原生采样器或转换程序也可以生产这种格式。一个程序用 Go 编写，并不意味着它读入的数据来自 Go；一份文件扩展名是 `.pprof`，也不意味着其中记录的是 CPU 时间。[[pp-scope]](#src-pp-scope)[[pp-proto]](#src-pp-proto)\n\n应把链路分成四层。测量层决定在哪里安装观察点、何时观察以及抽样概率；编码层决定将观察到的栈、标签和估计值怎样表示；分析层进行身份归一、合并、筛选和粒度转换；展示层把指定数值维度映射成行、边与矩形宽度。这四层的边界很重要：把图形画得更精细不会恢复采集时漏掉的事件；支持某种标签字段也不表示生产者实际采集了标签。[[pp-proto]](#src-pp-proto)[[pp-cpu-builder]](#src-pp-cpu-builder)\n\n阅读任何 profile 前，至少写清七个要素：被观察的对象集合、数值代表的物理量、抽样规则、栈的归因位置、计时来源、时间窗口，以及已知覆盖缺口。例如 CPU 的对象是实际执行的线程栈，heap 的对象是被抽中的堆分配块，block 观察特定同步操作中的阻塞，mutex 把竞争成本归于结束临界区的释放路径。它们都能生成“热点函数”，但热点所回答的问题完全不同。[[pp-cpu-runtime]](#src-pp-cpu-runtime)[[pp-heap-scale]](#src-pp-heap-scale)[[pp-mprof]](#src-pp-mprof)[[pp-sema]](#src-pp-sema)\n\n在数学上，一份 profile 可写成记录集合 $P=\\{(L_i,V_i,K_i)\\}$。$L_i$ 是调用栈位置序列，$V_i$ 是定长有符号整数向量，$K_i$ 是标签。选定第 $j$ 个 sample type 后，分析器使用权重 $w_i=V_{i,j}$。两个可合并记录的值向量逐分量相加，而非先把各列换算成某个共同的“耗时”。对象数与字节数不能相加，CPU 时间与同步等待也不能相加。[[pp-proto]](#src-pp-proto)\n\n这里“样本”有两种容易混淆的用法：一次底层采样事件，以及一个 protobuf Sample 消息。后者可能代表一条事件、数千条已聚合事件，或经过逆概率校正的估计量。数值第一列叫 count，也不保证它就是实际读取了多少个原始事件。区分“消息条数、事件计数、校正后权重”，是理解随后所有报告的前提。[[pp-cpu-builder]](#src-pp-cpu-builder)[[pp-heap-scale]](#src-pp-heap-scale)[[pp-mprof]](#src-pp-mprof)\n\n普通 profile 也不是调用时间线。协议没有给每个 Sample 规定开始、结束和持续时间三个字段；Profile.time_nanos 和 duration_nanos 是文件级信息。尤其 Go 的 CPU 构建器在读取底层记录时，明确把事件时间戳标为 ignored，然后按栈与标签聚合。因此可以回答“这个窗口内哪些执行路径消耗较多”，不能回答“第几个请求先执行哪条路径”或“这一段 GC 是否先于那次超时”。这些问题需要另有时序证据。[[pp-proto]](#src-pp-proto)[[pp-cpu-builder]](#src-pp-cpu-builder)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-pipeline\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pp-pipeline-title pp-pipeline-desc\"><title id=\"pp-pipeline-title\">时间记录如何压缩为栈权重<\/title><desc id=\"pp-pipeline-desc\">Go CPU builder 忽略逐事件时间戳，按栈及标签聚合。编码字段只能保留被写入的信息。<\/desc><defs><marker id=\"pp-pipeline-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">底层观察<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">时间戳 / PCs / 标签<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-pipeline-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">profile.proto<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">同栈同标签累加权重<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-pipeline-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">分析报告<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">flat / cum / 火焰图<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">逐事件先后在聚合时丢失<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">重新排列已聚合的 Sample，不能恢复请求时间线<\/text>\n<\/svg><figcaption><strong>时间记录如何压缩为栈权重。<\/strong> Go CPU builder 忽略逐事件时间戳，按栈及标签聚合。编码字段只能保留被写入的信息。 <a class=\"figure-open\" href=\"figures/pp-pipeline.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>本章围绕一个问题展开：屏幕上的“180 ms、37.5%”究竟怎样产生，它允许我们推出什么，又丢失了什么。源码基线为 Go 1.25.0，完整提交 <code>6e676ab2b809d46623acb5988248d95d1eb7939c<\/code>；分析器源码固定为 google/pprof 提交 <code>ebaad5f31b4d25e6f51abf4d91b9611cff92db7b<\/code>。本章的可执行教学验证使用本机 Go 1.22.12 内置 <code>go tool pprof<\/code>，两者明确区分。检索与验证日期为 2026-10-04；没有把合成样本冒充运行时实测。<\/p>\n\n\n<p>pprof 并不是 Go 专属采集器。google/pprof 项目自述的职责是读取 profiling samples，解析 profile.proto，再生成文本、调用图和火焰图等报告。Go 的 runtime/pprof 是生产者之一；其他语言运行时、原生采样器或转换程序也可以生产这种格式。一个程序用 Go 编写，并不意味着它读入的数据来自 Go；一份文件扩展名是 <code>.pprof<\/code>，也不意味着其中记录的是 CPU 时间。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/README.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof 项目定位\">[pp-scope]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>应把链路分成四层。测量层决定在哪里安装观察点、何时观察以及抽样概率；编码层决定将观察到的栈、标签和估计值怎样表示；分析层进行身份归一、合并、筛选和粒度转换；展示层把指定数值维度映射成行、边与矩形宽度。这四层的边界很重要：把图形画得更精细不会恢复采集时漏掉的事件；支持某种标签字段也不表示生产者实际采集了标签。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>阅读任何 profile 前，至少写清七个要素：被观察的对象集合、数值代表的物理量、抽样规则、栈的归因位置、计时来源、时间窗口，以及已知覆盖缺口。例如 CPU 的对象是实际执行的线程栈，heap 的对象是被抽中的堆分配块，block 观察特定同步操作中的阻塞，mutex 把竞争成本归于结束临界区的释放路径。它们都能生成“热点函数”，但热点所回答的问题完全不同。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/sema.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"同步等待记录点与mutex近似收费\">[pp-sema]<\/a><\/p>\n\n<p>在数学上，一份 profile 可写成记录集合 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>L<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>V<\/mi><mi>i<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>K<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>L<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math> 是调用栈位置序列，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math> 是定长有符号整数向量，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math> 是标签。选定第 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>j<\/mi><\/mrow><\/math> 个 sample type 后，分析器使用权重 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>V<\/mi><mrow><mi>i<\/mi><mo>&#x0002C;<\/mo><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math>。两个可合并记录的值向量逐分量相加，而非先把各列换算成某个共同的“耗时”。对象数与字节数不能相加，CPU 时间与同步等待也不能相加。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><\/p>\n\n<p>这里“样本”有两种容易混淆的用法：一次底层采样事件，以及一个 protobuf Sample 消息。后者可能代表一条事件、数千条已聚合事件，或经过逆概率校正的估计量。数值第一列叫 count，也不保证它就是实际读取了多少个原始事件。区分“消息条数、事件计数、校正后权重”，是理解随后所有报告的前提。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>普通 profile 也不是调用时间线。协议没有给每个 Sample 规定开始、结束和持续时间三个字段；Profile.time_nanos 和 duration_nanos 是文件级信息。尤其 Go 的 CPU 构建器在读取底层记录时，明确把事件时间戳标为 ignored，然后按栈与标签聚合。因此可以回答“这个窗口内哪些执行路径消耗较多”，不能回答“第几个请求先执行哪条路径”或“这一段 GC 是否先于那次超时”。这些问题需要另有时序证据。<a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/proto/profile.proto\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"profile.proto 数据契约\">[pp-proto]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n","advanced":true},{"title":"CPU producer：信号、受限栈展开、环缓冲和信息损失","body":"Go 1.25 的 `runtime/pprof.StartCPUProfile` 固定使用名义 100 Hz。这个频率不是 HTTP `seconds` 参数决定的，也不是 `go tool pprof` 在读文件时选择的。`seconds` 改变采集窗口；读取端选择 `sample_index` 改变展示哪一列；两者都不重写运行时当时的采样规律。底层 `runtime.SetCPUProfileRate` 另有生命周期约束，活动采集期间不能直接改频率，不应和高层 API 随意混用。[[pp-cpu-api]](#src-pp-cpu-api)[[pp-cpu-runtime]](#src-pp-cpu-runtime)\n\n“100 Hz”必须结合 CPU 时钟理解。以 Go 1.25 的 Linux 路径为例，运行时为线程创建 `CLOCK_THREAD_CPUTIME_ID` 计时器，通过 `SIGEV_THREAD_ID` 把 SIGPROF 发到目标线程。线程累计执行约一个周期才产生相应采样机会，线程睡眠的十毫秒不会自动变成一个 CPU 样本。创建线程计时器失败时，可以退到进程级计时机制；`validSIGPROF` 根据来源和线程状态避免同一 CPU 消耗被两种机制重复记账。不能将这一 Linux 实现推广为所有操作系统的实现方式。[[pp-cpu-linux]](#src-pp-cpu-linux)\n\n线程计时器的首次到期还做了随机化：初始延迟取一个周期内的随机值，随后使用固定周期。若新线程只执行了十分之一个周期，理想期望应当是约 0.1 个样本，而不是永远零个。这尤其关系到短暂活跃的 GC 线程。这个设计减少特定偏差，并不使全部样本成为严格独立同分布；周期性工作、信号合并、调度和机器环境仍会影响观察。[[pp-cpu-linux]](#src-pp-cpu-linux)\n\n一次信号到达后，`sigprof` 取得被中断现场的 PC、SP 等信息，通过 runtime unwinder 恢复 Go 栈。该路径可能在 GC 或其他受限现场中执行，因此不能普通地分配内存，也不能任意获得被中断代码可能持有的锁。源码使用有界临时栈；本版本 CPU 栈上限为 64 个记录槽。cgo、VDSO、Windows libcall 等还有专门分支。展开失败时，样本可能落到 `_System`、`_ExternalCode` 或其他抽象位置，不能把未知部分随意分摊给相邻业务函数。[[pp-sigprof]](#src-pp-sigprof)[[pp-cpu-runtime]](#src-pp-cpu-runtime)\n\n采样端和编码端没有在信号处理器里同步完成全部 protobuf 工作。采样端把头部、栈及标签指针写入 profBuf，由普通 goroutine 异步读取。profBuf 的数据环和标签环并行推进：一个事件的头部包含长度与时间等信息，栈占可变数量的槽，标签另占一个槽。该缓冲组件按一个读者和一个写者设计无锁协议，但 CPU 入口还用 signalLock 序列化相关写入，因此“内部使用无锁环”不等于整条采样链路完全没有同步。[[pp-buffer]](#src-pp-buffer)[[pp-cpu-runtime]](#src-pp-cpu-runtime)\n\n有界缓冲会溢出。Go 1.25 的 CPU 数据环配置为 $2^{17}$ 个 64 位字，约 1 MiB；在最大栈长度下，源码估算约能容纳 1900 个样本。标签环的容量是另一道限制。如果编码端赶不上生产端，后续写入不会无限增加内存，而是被丢弃，并累计 overflow 数。溢出记录保留丢弃数量及首次丢弃时刻，已丢失的栈和标签则无法恢复；读者或写者都可以把 pending overflow 转成正式记录，序列位用于避免清除状态时的 ABA 问题。[[pp-cpu-runtime]](#src-pp-cpu-runtime)[[pp-buffer]](#src-pp-buffer)\n\n编码器遇到这种溢出记录，会构造 `runtime/pprof.lostProfileEvent` 对应的特殊栈，并把丢弃数量作为 count。因此部分已知丢样仍可能进入总权重，只是归因缺失。外部线程的暂存区满还有 `_LostExternalCode` 等路径。应把“总量可能得到部分保全”与“业务归因完整”分开判断；反过来，报告里没有特殊 lost 节点，也不能证明操作系统投递、原生栈展开等所有环节都零损失。[[pp-cpu-builder]](#src-pp-cpu-builder)[[pp-cpu-runtime]](#src-pp-cpu-runtime)\n\n真正写文件时，`addCPUData` 先从首条记录得到周期 $\\tau=10^9/hz$ 纳秒，再以栈和 tag 为查找条件累加 count。`build` 写出的 CPU 向量是 `[count,count×τ]`，类型分别为 samples/count 和 cpu/nanoseconds。默认 100 Hz 下，一份聚合记录 `[18,180000000]` 表示十八份名义十毫秒权重，而不是某个函数恰好被调用十八次，也不是一次调用精确持续 180 ms。[[pp-cpu-builder]](#src-pp-cpu-builder)\n\n多核下，总 CPU 权重可大于墙钟窗口。若原始采集窗口为 $T$，总权重估计为 $C$，则 $C/T$ 可近似表示平均占用的 CPU 核数。例如本章教学文件写有 400 ms 窗口、480 ms CPU 权重，读取端显示 120%；这表示约 1.2 个核的容量尺度，不表示单个请求用时超过自身的百分之百。此解释只适用于口径适当的原始 CPU 窗口；合并、差分后文件的 duration 可能只是头部运算结果，不能继续机械套用。[[pp-cpu-builder]](#src-pp-cpu-builder)[[pp-merge]](#src-pp-merge)[[pp-teaching]](#src-pp-teaching)\n\n对热点比例的误差分析，也应保持相同谨慎。在理想独立抽样下，由二项模型可推得 $\\hat p=k/n$ 的标准误差近似 $\\sqrt{p(1-p)/n}$；这是理想模型推导，runtime 采样并不承诺独立性。只观察一次“10% 降到 8%”，不能从这两个百分数直接推出优化成立。应同时检验样本量、窗口稳定性、未归因比例及单位业务工作量的 CPU，并用关闭诊断采集的重复实验评价实际收益。[[pp-cpu-linux]](#src-pp-cpu-linux)[[pp-cpu-runtime]](#src-pp-cpu-runtime)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-cpu\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 340\" role=\"img\" aria-labelledby=\"pp-cpu-title pp-cpu-desc\"><title id=\"pp-cpu-title\">Go CPU 采样的两种执行环境<\/title><desc id=\"pp-cpu-desc\">Go 1.25 Linux 路径的简化图：线程 CPU 时钟触发信号，受限信号处理器写有界日志，普通 goroutine 异步构建 profile。<\/desc><defs><marker id=\"pp-cpu-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"340\" fill=\"white\" rx=\"16\"/>\n<rect x=\"40.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#1976D2\" fill-opacity=\".075\" stroke=\"#1976D2\" stroke-width=\"2\"/>\n<text x=\"175.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">CPU 时钟 → SIGPROF<\/text>\n<text x=\"175.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">名义 100 Hz<\/text>\n<line x1=\"313.0\" y1=\"130\" x2=\"341.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-cpu-arrow)\"/>\n<rect x=\"345.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"480.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">受限现场展开栈<\/text>\n<text x=\"480.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">有界日志 / 溢出计数<\/text>\n<line x1=\"618.0\" y1=\"130\" x2=\"646.0\" y2=\"130\" stroke=\"#637386\" stroke-width=\"2.3\" marker-end=\"url(#pp-cpu-arrow)\"/>\n<rect x=\"650.0\" y=\"75\" width=\"270\" height=\"112\" rx=\"13\" fill=\"#58A700\" fill-opacity=\".075\" stroke=\"#58A700\" stroke-width=\"2\"/>\n<text x=\"785.0\" y=\"117.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">普通 goroutine<\/text>\n<text x=\"785.0\" y=\"144.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">count × period<\/text>\n<text x=\"480\" y=\"235\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">睡眠时间不会自动成为 CPU 样本<\/text>\n<text x=\"480\" y=\"264\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\">已知 lost 数量可保留部分总量，却无法恢复原业务栈<\/text>\n<\/svg><figcaption><strong>Go CPU 采样的两种执行环境。<\/strong> Go 1.25 Linux 路径的简化图：线程 CPU 时钟触发信号，受限信号处理器写有界日志，普通 goroutine 异步构建 profile。 <a class=\"figure-open\" href=\"figures/pp-cpu.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>Go 1.25 的 <code>runtime/pprof.StartCPUProfile<\/code> 固定使用名义 100 Hz。这个频率不是 HTTP <code>seconds<\/code> 参数决定的，也不是 <code>go tool pprof<\/code> 在读文件时选择的。<code>seconds<\/code> 改变采集窗口；读取端选择 <code>sample_index<\/code> 改变展示哪一列；两者都不重写运行时当时的采样规律。底层 <code>runtime.SetCPUProfileRate<\/code> 另有生命周期约束，活动采集期间不能直接改频率，不应和高层 API 随意混用。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/pprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU采集生命周期\">[pp-cpu-api]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><\/p>\n\n<p>“100 Hz”必须结合 CPU 时钟理解。以 Go 1.25 的 Linux 路径为例，运行时为线程创建 <code>CLOCK_THREAD_CPUTIME_ID<\/code> 计时器，通过 <code>SIGEV_THREAD_ID<\/code> 把 SIGPROF 发到目标线程。线程累计执行约一个周期才产生相应采样机会，线程睡眠的十毫秒不会自动变成一个 CPU 样本。创建线程计时器失败时，可以退到进程级计时机制；<code>validSIGPROF<\/code> 根据来源和线程状态避免同一 CPU 消耗被两种机制重复记账。不能将这一 Linux 实现推广为所有操作系统的实现方式。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/os_linux.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux线程CPU时钟与去重\">[pp-cpu-linux]<\/a><\/p>\n\n<p>线程计时器的首次到期还做了随机化：初始延迟取一个周期内的随机值，随后使用固定周期。若新线程只执行了十分之一个周期，理想期望应当是约 0.1 个样本，而不是永远零个。这尤其关系到短暂活跃的 GC 线程。这个设计减少特定偏差，并不使全部样本成为严格独立同分布；周期性工作、信号合并、调度和机器环境仍会影响观察。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/os_linux.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux线程CPU时钟与去重\">[pp-cpu-linux]<\/a><\/p>\n\n<p>一次信号到达后，<code>sigprof<\/code> 取得被中断现场的 PC、SP 等信息，通过 runtime unwinder 恢复 Go 栈。该路径可能在 GC 或其他受限现场中执行，因此不能普通地分配内存，也不能任意获得被中断代码可能持有的锁。源码使用有界临时栈；本版本 CPU 栈上限为 64 个记录槽。cgo、VDSO、Windows libcall 等还有专门分支。展开失败时，样本可能落到 <code>_System<\/code>、<code>_ExternalCode<\/code> 或其他抽象位置，不能把未知部分随意分摊给相邻业务函数。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/proc.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"异步栈展开与标签读取\">[pp-sigprof]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><\/p>\n\n<p>采样端和编码端没有在信号处理器里同步完成全部 protobuf 工作。采样端把头部、栈及标签指针写入 profBuf，由普通 goroutine 异步读取。profBuf 的数据环和标签环并行推进：一个事件的头部包含长度与时间等信息，栈占可变数量的槽，标签另占一个槽。该缓冲组件按一个读者和一个写者设计无锁协议，但 CPU 入口还用 signalLock 序列化相关写入，因此“内部使用无锁环”不等于整条采样链路完全没有同步。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/profbuf.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CPU日志双环缓冲与溢出\">[pp-buffer]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><\/p>\n\n<p>有界缓冲会溢出。Go 1.25 的 CPU 数据环配置为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mrow><mn>17<\/mn><\/mrow><\/msup><\/mrow><\/math> 个 64 位字，约 1 MiB；在最大栈长度下，源码估算约能容纳 1900 个样本。标签环的容量是另一道限制。如果编码端赶不上生产端，后续写入不会无限增加内存，而是被丢弃，并累计 overflow 数。溢出记录保留丢弃数量及首次丢弃时刻，已丢失的栈和标签则无法恢复；读者或写者都可以把 pending overflow 转成正式记录，序列位用于避免清除状态时的 ABA 问题。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/profbuf.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CPU日志双环缓冲与溢出\">[pp-buffer]<\/a><\/p>\n\n<p>编码器遇到这种溢出记录，会构造 <code>runtime/pprof.lostProfileEvent<\/code> 对应的特殊栈，并把丢弃数量作为 count。因此部分已知丢样仍可能进入总权重，只是归因缺失。外部线程的暂存区满还有 <code>_LostExternalCode<\/code> 等路径。应把“总量可能得到部分保全”与“业务归因完整”分开判断；反过来，报告里没有特殊 lost 节点，也不能证明操作系统投递、原生栈展开等所有环节都零损失。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><\/p>\n\n<p>真正写文件时，<code>addCPUData<\/code> 先从首条记录得到周期 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C4;<\/mi><mo>&#x0003D;<\/mo><msup><mn>10<\/mn><mn>9<\/mn><\/msup><mo>&#x0002F;<\/mo><mi>h<\/mi><mi>z<\/mi><\/mrow><\/math> 纳秒，再以栈和 tag 为查找条件累加 count。<code>build<\/code> 写出的 CPU 向量是 <code>[count,count×τ]<\/code>，类型分别为 samples/count 和 cpu/nanoseconds。默认 100 Hz 下，一份聚合记录 <code>[18,180000000]<\/code> 表示十八份名义十毫秒权重，而不是某个函数恰好被调用十八次，也不是一次调用精确持续 180 ms。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><\/p>\n\n<p>多核下，总 CPU 权重可大于墙钟窗口。若原始采集窗口为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><\/mrow><\/math>，总权重估计为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0002F;<\/mo><mi>T<\/mi><\/mrow><\/math> 可近似表示平均占用的 CPU 核数。例如本章教学文件写有 400 ms 窗口、480 ms CPU 权重，读取端显示 120%；这表示约 1.2 个核的容量尺度，不表示单个请求用时超过自身的百分之百。此解释只适用于口径适当的原始 CPU 窗口；合并、差分后文件的 duration 可能只是头部运算结果，不能继续机械套用。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/proto.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"原始CPU记录到聚合值向量\">[pp-cpu-builder]<\/a><a class=\"cite\" href=\"https://github.com/google/pprof/blob/ebaad5f31b4d25e6f51abf4d91b9611cff92db7b/profile/merge.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"pprof合并、局部ID与归一化\">[pp-merge]<\/a><a class=\"cite\" href=\"#resources\" title=\"48条教学CPU样本的实际查询验证\">[pp-teaching]<\/a><\/p>\n\n<p>对热点比例的误差分析，也应保持相同谨慎。在理想独立抽样下，由二项模型可推得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>p<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo>&#x0003D;<\/mo><mi>k<\/mi><mo>&#x0002F;<\/mo><mi>n<\/mi><\/mrow><\/math> 的标准误差近似 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mi>n<\/mi><\/mrow><\/msqrt><\/mrow><\/math>；这是理想模型推导，runtime 采样并不承诺独立性。只观察一次“10% 降到 8%”，不能从这两个百分数直接推出优化成立。应同时检验样本量、窗口稳定性、未归因比例及单位业务工作量的 CPU，并用关闭诊断采集的重复实验评价实际收益。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/os_linux.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Linux线程CPU时钟与去重\">[pp-cpu-linux]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/cpuprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go CPU信号入口与额外样本\">[pp-cpu-runtime]<\/a><\/p>\n\n","advanced":true},{"title":"Heap producer：为什么一个小对象会代表很多对象","body":"内存剖析观察的是分配，不是在固定时刻扫描整个堆并逐对象列账。Go 的默认 `MemProfileRate` 为 512 KiB；运行时在分配字节轴上安排随机采样点。`nextSample` 希望相邻采样点间距服从均值为 $R$ 的指数分布，这对应理想 Poisson 过程。实际 `fastexprand` 使用有限位随机数、快速对数和整数结果，不能把数学理想化描述当成实现没有近似。[[pp-heap-poisson]](#src-pp-heap-poisson)[[pp-mprof]](#src-pp-mprof)\n\n尺寸为 $s$ 的分配至少覆盖一个采样点的概率为 $q(s)=1-e^{-s/R}$。推导很直接：长度 $s$ 的区间没有 Poisson 点的概率为 $e^{-s/R}$，取补集就是至少一次命中。抽样是按分配字节轴进行，所以大块分配比小块分配更容易出现；“每五十二万个对象抽一个”是错误解释。一次大对象跨过多个理想采样点，也不要求向 profile 写出同一个对象的多份原始记录；校正关心其被纳入的概率。[[pp-heap-poisson]](#src-pp-heap-poisson)[[pp-heap-scale]](#src-pp-heap-scale)\n\n令第 $i$ 个分配是否命中为 $I_i$。理想模型中，对象数可用 $\\widehat N=\\sum_i I_i/q(s_i)$ 估计，分配字节可用 $\\widehat B=\\sum_i s_iI_i/q(s_i)$ 估计。逆概率权重解释了为什么文件中一个记录的 count 可以远大于实际采到的事件数。这些估计在模型条件下具有相应统计性质，单次观测仍会有方差，尤其稀少的小对象样本可能携带很大的权重。[[pp-heap-scale]](#src-pp-heap-scale)\n\n举例取 $R=512$ KiB。一个 64 KiB 分配的包含概率约为 0.1175，权重倍数约为 8.51；一个 512 KiB 分配的包含概率约为 0.6321，倍数约为 1.58。不能对两种尺寸都简单乘八，也不能拿 sample 消息数量比较它们的真实对象数量。如果一条很少出现的小对象路径在一次采集中碰巧被命中，外推值可能明显跳动；应通过重复观测和更合适的采样预算评估，而不是凭一张图宣布泄漏。[[pp-heap-scale]](#src-pp-heap-scale)\n\nGo 1.25 的具体实现是 `scaleHeapSample(count,size,rate)`。当 count 或 size 为零时返回零；rate 不大于一时不做外推；否则以 `avgSize=size/count` 计算 `1/(1-exp(-avgSize/rate))`，分别乘对象数和字节数，最后转换为 int64。运行时内存桶的身份包含栈和分配尺寸，不能将这里的平均尺寸规则理解为“任意混合大小的对象先聚合，再统一校正也完全等价”。将已经校正的 profile 再乘一次采样率，会重复放大数据。[[pp-heap-scale]](#src-pp-heap-scale)[[pp-mprof]](#src-pp-mprof)\n\n写出时的四维向量依次为 alloc_objects、alloc_space、inuse_objects、inuse_space。前两列描述累计分配，后两列描述采样可见的尚未释放部分。`heap` 和 `allocs` 主要改变默认选择的维度，底层并不是两套互不相干的分配记录。“累计已分配两吉字节”完全可能来自一直复用生命周期很短的临时对象，而“仍在使用两百兆字节”也不直接告诉我们哪个容器正在持有它们。栈是分配来源，不是完整引用保留图。[[pp-heap-scale]](#src-pp-heap-scale)[[pp-profile-kinds]](#src-pp-profile-kinds)\n\n内存账目还存在发布时间。分配发生在实时路径，释放则跟随 GC 的清扫；若立刻把新分配与尚未登记的释放比较，就会系统性偏向“仍然存活”。mprof 通过 active/future 周期桶协调分配与释放，mark termination 推进周期，后续 flush 和 post-sweep 发布可见状态。`runtime.MemProfile` 明确结果可能落后最多两个 GC 周期。因此 profile 的 inuse 既不是读取瞬间的精确活对象清单，也不是操作系统的 RSS。[[pp-mprof]](#src-pp-mprof)\n\n`MemProfileRate=1` 的含义是记录采集器覆盖的每个堆分配块，不是记录所有语言级对象：栈上对象不在此范围，tiny allocator 可把多个小对象装入一个块，分配槽还可能包含内部碎片。采样率也应在进程早期至多调整一次，分析工具假设整段记录具有恒定采样率。把一个进程先设成全量采样、再恢复默认后混出一份文件，无法靠读取端知道每个旧记录应当使用哪个历史参数。[[pp-mprof]](#src-pp-mprof)[[pp-heap-coverage]](#src-pp-heap-coverage)\n\n正确的泄漏分析因此需要一个更强的链条：相同稳态工作量下，GC 对齐后仍有持续增长；profile 找到增长的分配来源；代码或对象检查解释持有路径；切断该路径后，重复批次的存活集重新有界。仅有高 alloc_space 说明流量，单次高 inuse_space 说明当时可见保留，两者都没有独立完成因果证明。[[pp-profile-kinds]](#src-pp-profile-kinds)[[pp-mprof]](#src-pp-mprof)","html":"<figure class=\"advanced-figure\" id=\"fig-pp-heap\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 390\" role=\"img\" aria-labelledby=\"pp-heap-title pp-heap-desc\"><title id=\"pp-heap-title\">按字节采样的包含概率<\/title><desc id=\"pp-heap-desc\">理想 Poisson 模型 q(s)=1-exp(-s/R)，R=512KiB。小对象更难入样，命中后携带更大的逆概率权重；实际实现有近似。<\/desc><defs><marker id=\"pp-heap-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#637386\"/><\/marker><\/defs><rect width=\"960\" height=\"390\" fill=\"white\" rx=\"16\"/>\n<line x1=\"90\" y1=\"300\" x2=\"610\" y \"100\" rx=\"13\" fill=\"#8150B5\" fill-opacity=\".075\" stroke=\"#8150B5\" stroke-width=\"2\"/>\n<text x=\"792.5\" y=\"236.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"middle\">512 KiB：q ≈ 0.6321<\/text>\n<text x=\"792.5\" y=\"263.5\" fill=\"#233448\" font-family=\"Noto Sans CJK SC,Microsoft YaHei,sans-serif\" font-size=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\">权重倍数 ≈ 1.58<\/text>\n<\/svg><figcaption><strong>按字节采样的包含概率。<\/strong> 理想 Poisson 模型 q(s)=1-exp(-s/R)，R=512KiB。小对象更难入样，命中后携带更大的逆概率权重；实际实现有近似。 <a class=\"figure-open\" href=\"figures/pp-heap.svg\" target=\"_blank\" rel=\"noopener\">查看大图 ↗<\/a><\/figcaption><\/figure>\n<p>内存剖析观察的是分配，不是在固定时刻扫描整个堆并逐对象列账。Go 的默认 <code>MemProfileRate<\/code> 为 512 KiB；运行时在分配字节轴上安排随机采样点。<code>nextSample<\/code> 希望相邻采样点间距服从均值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><\/mrow><\/math> 的指数分布，这对应理想 Poisson 过程。实际 <code>fastexprand<\/code> 使用有限位随机数、快速对数和整数结果，不能把数学理想化描述当成实现没有近似。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/malloc.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆采样的指数步长\">[pp-heap-poisson]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/mprof.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆与同步统计桶和发布周期\">[pp-mprof]<\/a><\/p>\n\n<p>尺寸为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> 的分配至少覆盖一个采样点的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>s<\/mi><mo>&#x0002F;<\/mo><mi>R<\/mi><\/mrow><\/msup><\/mrow><\/math>。推导很直接：长度 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> 的区间没有 Poisson 点的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>s<\/mi><mo>&#x0002F;<\/mo><mi>R<\/mi><\/mrow><\/msup><\/mrow><\/math>，取补集就是至少一次命中。抽样是按分配字节轴进行，所以大块分配比小块分配更容易出现；“每五十二万个对象抽一个”是错误解释。一次大对象跨过多个理想采样点，也不要求向 profile 写出同一个对象的多份原始记录；校正关心其被纳入的概率。<a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/malloc.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆采样的指数步长\">[pp-heap-poisson]<\/a><a class=\"cite\" href=\"https://github.com/golang/go/blob/6e676ab2b809d46623acb5988248d95d1eb7939c/src/runtime/pprof/protomem.go\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"堆样本逆概率外推\">[pp-heap-scale]<\/a><\/p>\n\n<p>令第 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><\/mrow><\/math> 个分配是否命中为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math>。理想模型中，对象数可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>N<\/mi><mo>&#x0005E;<\/mo><\/mover><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>I<\/mi><mi>i<\/mi><\/msub><mo>&#x0002F;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>s<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 估计，分配字节可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>B<\/mi><mo>&#x0005E;<\/mo><\/mover><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>s<\/mi><mi>i<\/mi><\/msub><msub><mi>I<\/mi><mi>i<\/mi><\/msub><mo>&#x0002F;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>s<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 估计。逆概率权重解释了为什么文件中一个记录的 count 可以远大于实际采到的事件数。这些估计在模型条件下具有相应统计性质，单次观测仍会有方差，尤其稀少的小对象样本可能携带
