<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="request-timeline-title request-timeline-desc"><title id="request-timeline-title">同一请求的三种时间</title><desc id="request-timeline-desc">合成模型，非内核实测。主线程运行8ms、可运行2ms、睡眠10ms；worker运行15ms。两线程已由模型明确归属于该请求。</desc><defs><marker id="request-timeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#637386"/></marker></defs><rect width="960" height="380" fill="white" rx="16"/>
