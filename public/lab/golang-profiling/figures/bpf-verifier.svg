<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="bpf-verifier-title bpf-verifier-desc"><title id="bpf-verifier-title">验证器跟踪的是抽象状态</title><desc id="bpf-verifier-desc">示例表达空指针检查如何收窄指针状态。实际 verifier 还追踪标量范围、已知位、栈初始化、引用及路径等；图不覆盖全部规则。</desc><defs><marker id="bpf-verifier-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#637386"/></marker></defs><rect width="960" height="380" fill="white" rx="16"/>
