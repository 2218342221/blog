<rect x="730" y="45" width="190" height="85" rx="13" fill="#58A700" fill-opacity=".075" stroke="#58A700" stroke-width="2"/>
<text x="825.0" y="87.5" fill="#233448" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle">X</text>
<rect x="730" y="190" width="190" height="85" rx="13" fill="#58A700" fill-opacity=".075" stroke="#58A700" stroke-width="2"/>
