<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="evidence-title evidence-desc"><title id="evidence-title">观察到的热点怎样变成可检验的结论</title><desc id="evidence-desc">优化需要控制工作量并进行干预。源码解释、合成输入验证与真实负载实验支持不同层次的结论。</desc><defs><marker id="evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#637386"/></marker></defs><rect width="960" height="340" fill="white" rx="16"/>
