<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="pp-proto-title pp-proto-desc"><title id="pp-proto-title">profile.proto 的共享表与引用</title><desc id="pp-proto-desc">Sample 的栈叶在前；一个 Location 可以包含多条内联 Line。ID 是文件内引用，不是地址。</desc><defs><marker id="pp-proto-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#637386"/></marker></defs><rect width="960" height="380" fill="white" rx="16"/>
